.tbl-wrap{overflow-x:auto}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}

:root{--bg:#EDF2F8;--acc:#1766C2;--accSoft:#DCE8F8;--track:#CBD6E4;--border:#D3DCE8;--surface2:#F4F7FB;--ink:#101A2B;--muted:#526079}

const CMDN = { F: ["f", "⬆ Krok vpred"], L: ["l", "↶ Vľavo"], R: ["r", "↷ Vpravo"] };
function progHTML() {
  const P = S.rob.prog[S.rob.lv];
  return P.length ? P.map((c, i) => `<button class="pi ${CMDN[c][0]} ${CUR === i ? "cur" : ""}" data-rdel="${i}" ${RUN ? "disabled" : ""} title="Kliknutím príkaz odstrániš"><small>${i + 1}.</small>${CMDN[c][1]}</button>`).join("") : `<span class="muted" style="font-size:14.5px;align-self:center">Program je prázdny. Pridaj príkazy tlačidlami vyššie.</span>`;
}
function robotPanel() { const el = document.getElementById("robopanel"); if (el) el.innerHTML = robotInner(); }
let RMSG = null;
function robotInner() {
  const r = S.rob, L = LV[r.lv];
  return `<div class="lvls">${LV.map((_, i) => `<button class="ghost ${r.lv === i ? "on" : ""}" data-rlv="${i}" ${RUN ? "disabled" : ""}>${r.solved[i] ? "✅" : "⬜"} Úroveň ${i + 1}</button>`).join("")}</div>
  <p class="muted" style="font-size:15px;margin-bottom:6px">${L.tip}</p>
  <div class="cmds">${Object.keys(CMDN).map(k => `<button class="cmd ${CMDN[k][0]}" data-radd="${k}" ${RUN ? "disabled" : ""}>${CMDN[k][1]}</button>`).join("")}</div>

  ${RMSG ? `<div class="fb ${RMSG.k}">${RMSG.t}</div>` : ""}`;
}
function drawRobot() { const w = document.getElementById("robowrap"); if (w) w.innerHTML = robotSVG(); robotPanel(); }
function runRobot() {
  const r = S.rob, L = LV[r.lv], m = L.map, st = find(m, "S"), g = find(m, "G"), P = r.prog[r.lv].slice();
  POS = { x: st.x, y: st.y, d: L.d, trail: [] }; CUR = -1; CRASH = false; RMSG = null; RUN = true; drawRobot();
  let i = 0;
  const tick = () => {
    if (i >= P.length) {
      RUN = null; CUR = -1;
      if (POS.x === g.x && POS.y === g.y) { RMSG = { k: "ok", t: `🎉 Robot je v cieli! Program má ${P.length} príkazov.` }; r.solved[r.lv] = true; S.t.robot = { score: r.solved.filter(Boolean).length, max: 3 }; save(); renderTop(); }
      else RMSG = { k: "bad", t: "Program skončil, ale robot nie je v cieli. Robot urobil presne to, čo si mu povedal. Nájdi chybu a oprav program." };
      drawRobot(); return;
    }
    CUR = i; const c = P[i];
    if (c === "L") POS.d = (POS.d + 3) % 4;
    else if (c === "R") POS.d = (POS.d + 1) % 4;
    else {
      const nx = POS.x + DX[POS.d], ny = POS.y + DY[POS.d];

      POS.trail.push({ x: POS.x, y: POS.y }); POS.x = nx; POS.y = ny;
    }
    i++; drawRobot(); RUN = setTimeout(tick, 380);
  };
  RUN = setTimeout(tick, 300);
}

  /* farebné zvýraznenie Pythonu ako v IDLE */

/* ---------- hra: hádaj číslo (nebodovaná) ---------- */
let HG = null;
function hgNew() { HG = { n: 1 + Math.floor(Math.random() * 100), lo: 1, hi: 100, log: [], done: false, auto: false, msg: "" }; }
function hgTip(v) { if (!HG) hgNew(); if (HG.done) return; if (!Number.isInteger(v) || v < 1 || v > 100) { HG.msg = "Zadaj celé číslo od 1 do 100."; return; } HG.msg = "";
  const r = v === HG.n ? 0 : v < HG.n ? 1 : -1; HG.log.push([v, r]); if (r === 0) HG.done = true; else if (r > 0) HG.lo = Math.max(HG.lo, v + 1); else HG.hi = Math.min(HG.hi, v - 1); }
function hgAuto() { if (!HG) hgNew(); Object.assign(HG, { lo: 1, hi: 100, log: [], done: false, auto: true, msg: "" }); while (!HG.done) hgTip(Math.floor((HG.lo + HG.hi) / 2)); }
function hgHTML() { if (!HG) hgNew(); const H = HG, k = H.log.length;
  return `<div class="row" style="margin-top:0"><input class="in" id="hgin" type="number" min="1" max="100" inputmode="numeric" placeholder="1 – 100" aria-label="Tvoj tip" style="max-width:130px" ${H.done ? "disabled" : ""}><button class="primary" data-hg="tip" ${H.done ? "disabled" : ""}>Tipni</button><button class="ghost" data-hg="auto">🤖 Nech hrá algoritmus</button><button class="ghost" data-hg="new">Nová hra</button></div>
    <div class="hgbar" aria-hidden="true"><span style="left:${H.lo - 1}%;width:${H.hi - H.lo + 1}%"></span></div><div class="hgl"><span>1</span><span>Číslo je v intervale <b>${H.lo} – ${H.hi}</b></span><span>100</span></div>
    ${k ? `<div class="hglog">${H.log.map(([v, r], i) => `<span class="${r === 0 ? "ok" : ""}">${i + 1}. tip: <b>${v}</b> ${r > 0 ? "→ viac ⬆" : r < 0 ? "→ menej ⬇" : "✅"}</span>`).join("")}</div>` : ""}
    ${H.msg ? `<div class="fb bad">${H.msg}</div>` : ""}
    ${H.done ? `<div class="fb ${H.auto ? "info" : "ok"}">${H.auto ? `🤖 Algoritmus uhádol číslo ${H.n} na <b>${k}</b> ${k === 1 ? "pokus" : k < 5 ? "pokusy" : "pokusov"}. Vždy tipne stred intervalu, takže po každom tipe ostane iba polovica čísel. Tak uhádne <b>každé</b> číslo od 1 do 100 najviac na <b>7 pokusov</b>: je konečný, jednoznačný aj všeobecný.` : `🎉 Uhádol si číslo ${H.n} na <b>${k}</b> ${k === 1 ? "pokus" : k < 5 ? "pokusy" : "pokusov"}. Teraz klikni na „Nech hrá algoritmus“ a porovnaj sa s ním.`}</div>` : ""}`; }
function hgDraw() { const b = document.getElementById("hgbox"); if (b) { b.innerHTML = hgHTML(); typo(b); } }
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target && e.target.id === "hgin") { hgTip(parseInt(e.target.value, 10)); hgDraw(); const n = document.getElementById("hgin"); if (n && !n.disabled) n.focus(); } });

function CUSTOM_CLICK(e) {
  const el = e.target.closest("button"); if (!el) return false; const ds = el.dataset, r = S.rob;
  if (ds.radd) { if (RUN) return true; if (r.prog[r.lv].length < 30) r.prog[r.lv].push(ds.radd); POS = null; CRASH = false; RMSG = null; save(); drawRobot(); return true; }
  if (ds.rdel !== undefined) { if (RUN) return true; r.prog[r.lv].splice(+ds.rdel, 1); POS = null; CRASH = false; RMSG = null; save(); drawRobot(); return true; }
  if (ds.rback !== undefined) { r.prog[r.lv].pop(); POS = null; CRASH = false; RMSG = null; save(); drawRobot(); return true; }
  if (ds.rclr !== undefined) { r.prog[r.lv] = []; POS = null; CRASH = false; RMSG = null; save(); drawRobot(); return true; }
  if (ds.rlv !== undefined) { r.lv = +ds.rlv; POS = null; CRASH = false; RMSG = null; save(); drawRobot(); return true; }
  if (ds.rrun !== undefined) { const w = document.getElementById("robowrap"); if (w) w.classList.remove("shake"); runRobot(); return true; }
  if (ds.hg) { if (ds.hg === "tip") { const n = document.getElementById("hgin"); hgTip(n ? parseInt(n.value, 10) : NaN); } else if (ds.hg === "auto") hgAuto(); else hgNew(); hgDraw(); const n2 = document.getElementById("hgin"); if (ds.hg !== "auto" && n2 && !n2.disabled) n2.focus(); return true; }
  if (ds.go !== undefined && RUN) { clearTimeout(RUN); RUN = null; POS = null; }

if (!S.started) S.cur = 0;
render(true);

</script>
</body>
</html>
