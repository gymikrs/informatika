ems.length:t.type==='order'?a.length===t.items.length:Object.keys(a).length===t.pairs.length;return `<section class="task" id="${id}"><h3>Úloha ${n}: ${t.q} (2 ⭐)</h3><p class="ins">Kontrola je iba jedna. Možnosti sú premiešané.</p>${body}${d===undefined?`<div class="row"><button class="primary" data-check="${id}" ${ready?'':'disabled'}>Skontrolovať</button></div>`:`<div class="fb ${d===2?'ok':'bad'}"><b>${d===2?'Výborne, 2 z 2 ⭐':'Získal si '+d+' z 2 ⭐'}</b> · ${explain(id)}</div>`}</section>`}
function explain(id){return {t1:'Prehliadač je program, vyhľadávač služba a stránka obsah.',t2:'Safari, Opera a Firefox sú prehliadače.',t3:'Prehliadač interpretuje HTML a vykreslí stránku.',t4:'Každé tlačidlo má inú funkciu.',t5:'Obsah článku patrí do stránky, nie do ovládania prehliadača.',t6:'Ctrl + T otvorí novú kartu.',t7:'Adresy nemajú medzery, hľadané výrazy ich zvyčajne majú.',t8:'Najprv riadok, potom adresa, kontrola a Enter.',t9:'Záložka uchová adresu na neskôr.',t10:'Karta, história, záložka a Späť riešia odlišné situácie.',t11:'Najprv dopyt, potom výsledky, otvorenie a overenie.',t12:'Odborná inštitúcia s jasnou adresou je vhodnejšia než reklama či anonymná diskusia.',t13:'Overuj autora, dátum, adresu a ďalší zdroj.',t14:'Bezpečné je overiť adresu, zavrieť podvod a odhlásiť sa.',t15:'Aktualizácia a oficiálny zdroj sú bezpečné; falošné prihlásenie a ponechaný účet sú nebezpečné.'}[id]}
function view(){renderTop();let app=document.getElementById('app');if(S.cur===0){app.innerHTML=`<section class="hero"><div><p>Informatika · Prima · domáca úloha k hodine 1.3</p><h1>Prehliadače internetových stránok</h1><p>Ahoj! Som líška <b>Fifi</b>. Čaká ťa <b>6 misií, 15 úloh, 30 hviezd</b> a približne <b>20 minút</b>.</p><div class="task"><label><b>Meno a priezvisko</b></label><input id="name" value="${S.name}" placeholder="napr. Jana Nováková"><p><b>Trieda</b></p><div class="classes">${CLASSES.map(c=>`<button class="ghost ${S.cls===c?'sel':''}" data-cls="${c}">${c}</button>`).join('')}</div><div class="row"><button class="primary" data-start ${S.name.trim().length>2&&S.cls?'':'disabled'}>Začať</button></div></div></div>${fox()}</section>`;return}if(S.cur>=1&&S.cur<=6){let names=['','Fifi otvára okno do internetu','Tajomstvá okna prehliadača','Adresa alebo hľadanie?','Karty, záložky a história','Webový detektív','Fifi v bezpečnom režime'];let nums={t1:1,t2:2,t3:3,t4:4,t5:5,t6:6,t7:7,t8:8,t9:9,t10:10,t11:11,t12:12,t13:13,t14:14,t15:15};app.innerHTML=`<div class="banner" style="background:${M[S.cur][3]}"><div><small>Misia ${S.cur} zo 6 · asi ${M[S.cur][2]} min</small><h1>${names[S.cur]}</h1><p>Fifi: Pozri si teóriu a potom vyrieš úlohy.</p></div><div class="ic">${M[S.cur][1]}</div></div>${theoryHTML(S.cur)}${S.ord['m'+S.cur].map(id=>task(id,nums[id])).join('')}<section class="memo"><h3>📌 Zapamätaj si</h3><ul>${theory[S.cur].map(x=>`<li>${x}</li>`).join('')}</ul></section><div class="next"><button class="primary" data-go="${S.cur+1}">${S.cur===6?'Zobraziť výsledok':'Ďalšia misia'}</button></div>`;return}resultView()}
function resultView(){let app=document.getElementById('app'),missing=Object.keys(TASKS).filter(k=>!(k in S.done));if(!S.finished&&missing.length){app.innerHTML=`<section class="result"><h1>🏆 Výsledok</h1><p>Chýba ešte <b>${missing.length}</b> úloh.</p><div class="row">${[1,2,3,4,5,6].filter(i=>!missionDone(i)).map(i=>`<button class="ghost" data-go="${i}">${M[i][1]} ${M[i][0]} · ${byM(i).filter(k=>!(k in S.done)).length} úloh</button>`).join('')}</div>${S.confirm?`<div class="note"><b>Naozaj odoslať nedokončené?</b><div class="row"><button class="primary" data-earlyyes>Áno, odoslať</button><button class="ghost" data-earlyno>Späť</button></div></div>`:`<div class="row"><button class="primary" data-early>Ukončiť a odoslať výsledok</button></div>`}</section>`;return}if(!S.finished){S.finished=Date.now();save()}let p=Math.round(total()/30*100),g=grade(),dur=Math.max(0,Math.round((S.finished-S.started)/1000)),m=Math.floor(dur/60),sec=dur%60;try{localStorage.setItem(DONE,JSON.stringify({name:S.name,cls:S.cls,grade:g,attempt:S.attempt,score:total()}))}catch(e){}send();app.innerHTML=`<section class="result"><h1>🏆 Hotovo, ${S.name.split(' ')[0]}!</h1><div class="row"><span class="big">${total()}</span><span>z 30 ⭐ (${p} %)<br>čas ${m} min ${sec} s</span><span class="score">Známka <b>${g}</b></span></div><table><tr><th>Misia</th><th>Body</th></tr>${[1,2,3,4,5,6].map(i=>`<tr><td>${M[i][1]} ${M[i][0]}</td><td>${byM(i).reduce((n,k)=>n+(S.done[k]||0),0)} / ${byM(i).length*2}</td></tr>`).join('')}</table><p id="send">${S.sent?'✅ Výsledok bol odoslaný učiteľovi.':'⏳ Odosiela sa výsledok učiteľovi…'}</p>${S.early?'<p class="warn">Domácu úlohu si ukončil predčasne.</p>':''}${S.attempt===1&&g>=3?'<div class="note"><b>🔁 Máš jednu opravu.</b><div class="row"><button class="primary" data-retry>Začať opravu</button></div></div>':''}</section>`}
function check(id){let t=TASKS[id],a=S.ans[id],n=0;if(t.type==='mc')n=a===t.a?2:0;if(t.type==='multi'){let good=t.a.filter(i=>a.includes(i)).length,bad=a.filter(i=>!t.a.includes(i)).length;n=Math.max(0,Math.round(2*(good-bad)/t.a.length))}if(t.type==='sort')n=Math.round(2*t.items.filter((x,i)=>a[i]===x[1]).length/t.items.length);if(t.type==='order')n=Math.round(2*t.items.filter((x,i)=>a[i]===i).length/t.items.length);if(t.type==='match')n=Math.round(2*t.pairs.filter((x,i)=>a[i]===i).length/t.pairs.length);S.done[id]=n;save();view()}
function finishEarly(){for(let k of Object.keys(TASKS))if(!(k in S.done)){if(S.ans[k]!==undefined){try{check(k)}catch(e){S.done[k]=0}}else S.done[k]=0}S.early=true;S.finished=Date.now();save();S.cur=7;view()}
function send(){
  const pct=Math.round(total()/30*100),g=grade();
  const dur=Math.max(0,Math.round((S.finished-S.started)/1000)),mm=Math.floor(dur/60),ss=dur%60;
  const key=[S.name.trim(),S.cls,total(),S.finished,S.attempt,'send-v2'].join('|');
  if(S.sent===key||S.sending)return;
  S.sending=true;save();
  const st=(text,ok=false)=>{const e=document.getElementById('send');if(e){e.textContent=text;e.style.color=ok?'#12805A':'#C0392B'}};
  try{
    const frameName='resultFrame_'+Date.now();
    const frame=document.createElement('iframe');
    frame.name=frameName;frame.hidden=true;frame.setAttribute('aria-hidden','true');
    const form=document.createElement('form');
    form.method='POST';form.action=FORM.post;form.target=frameName;form.hidden=true;form.acceptCharset='UTF-8';
    const fields={
      [FORM.e.name]:S.name.trim(),
      [FORM.e.cls]:S.cls,
      [FORM.e.lesson]:LESSON+(S.early?' (nedokončené)':'')+(S.attempt===2?' (oprava)':''),
      [FORM.e.points]:`${total()}/30 (${pct} %) · ${mm} min ${ss} s`,
      [FORM.e.grade]:String(g)
    };
    for(const [name,value] of Object.entries(fields)){const input=document.createElement('input');input.type='hidden';input.name=name;input.value=value;form.appendChild(input)}
    document.body.append(frame,form);
    let submitted=false;
    frame.addEventListener('load',()=>{if(!submitted)return;S.sent=key;S.sending=false;save();st('✅ Výsledok bol odoslaný učiteľovi.',true);setTimeout(()=>{form.remove();frame.remove()},1000)},{once:true});
    submitted=true;form.submit();
    setTimeout(()=>{if(S.sending){S.sending=false;save();st('⚠️ Odoslanie sa nepodarilo potvrdiť. Pripoj sa k internetu a obnov stránku.')}},12000);
  }catch(err){S.sending=false;save();st('⚠️ Výsledok sa nepodarilo odoslať. Pripoj sa k internetu a obnov stránku.')}
}
let selected=null;document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset,y=scrollY;if(d.go!==undefined){S.cur=+d.go;save();view();scrollTo(0,0)}else if(d.cls){S.cls=d.cls;save();view()}else if(d.start!==undefined){S.started=S.started||Date.now();S.cur=1;save();view();scrollTo(0,0)}else if(d.opt){let[id,i]=d.opt.split('|');i=+i;let t=TASKS[id];if(t.type==='multi'){let a=S.ans[id];a.includes(i)?a.splice(a.indexOf(i),1):a.push(i)}else S.ans[id]=i;save();view();scrollTo(0,y)}else if(d.pick){let[id,i]=d.pick.split('|');selected={id,i:+i};document.querySelectorAll(`[data-pick^="${id}|"]`).forEach(x=>x.classList.toggle('sel',x.dataset.pick===d.pick))}else if(d.bin&&selected){let[id,bin]=d.bin.split('|');if(id===selected.id){S.ans[id][selected.i]=bin;selected=null;save();view();scrollTo(0,y)}}else if(d.add){let[id,i]=d.add.split('|');S.ans[id].push(+i);save();view();scrollTo(0,y)}else if(d.un){let[id,i]=d.un.split('|');S.ans[id]=S.ans[id].filter(x=>x!==+i);save();view();scrollTo(0,y)}else if(d.match){let[id,i,j]=d.match.split('|');S.ans[id][i]=+j;save();view();scrollTo(0,y)}else if(d.check)check(d.check);else if(d.early!==undefined){S.confirm=true;save();view()}else if(d.earlyno!==undefined){S.confirm=false;save();view()}else if(d.earlyyes!==undefined)finishEarly();else if(d.retry!==undefined){let n=S.name,c=S.cls;S=fresh();S.name=n;S.cls=c;S.attempt=2;save();view();scrollTo(0,0)}});document.addEventListener('input',e=>{if(e.target.id==='name'){S.name=e.target.value;save();let b=document.querySelector('[data-start]');if(b)b.disabled=!(S.name.trim().length>2&&S.cls)}});
try{let r=JSON.parse(localStorage.getItem(DONE));if(r&&!S.finished){if(r.grade<=2||r.attempt>=2){document.getElementById('top').innerHTML='';document.getElementById('app').innerHTML=`<section class="result"><h1>✅ Domáca úloha je už odoslaná</h1><p>${r.name} (${r.cls}) získal/a ${r.score} z 30 ⭐.</p></section>`}else{document.getElementById('top').innerHTML='';document.getElementById('app').innerHTML=`<section class="result"><h1>🔁 Oprava domácej úlohy</h1><p>${r.name} môže využiť posledný pokus.</p><button class="primary" data-retry>Začať opravu</button></section>`}}else view()}catch(e){view()}
</script></body></html>
