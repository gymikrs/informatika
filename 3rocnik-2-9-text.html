<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2.9 Písanie textu do grafickej plochy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0EEF6;--surface:#FFFFFF;--surface2:#F6F5FA;--ink:#1A1530;--muted:#5E5877;
  --acc:#6A3FD0;--accSoft:#E9E2FB;--amber:#F2A516;--amberSoft:#FDF1D6;--track:#D3CEE2;
  --ok:#12805A;--okSoft:#DDF3EA;--bad:#C0392B;--badSoft:#FBE3E0;--border:#DAD6E6;
  --head:"Rubik","Segoe UI",system-ui,sans-serif;--font:"Rubik","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#13101F;--surface:#1D1830;--surface2:#241E3A;--ink:#ECE8F7;--muted:#A69FC0;--acc:#A98BFF;--accSoft:#2E2550;--amber:#F7B84B;--amberSoft:#3A2F17;--track:#3A3355;--ok:#3CCB8E;--okSoft:#163A30;--bad:#FF7A6B;--badSoft:#46221F;--border:#342D4C}}
:root[data-theme="dark"]{--bg:#13101F;--surface:#1D1830;--surface2:#241E3A;--ink:#ECE8F7;--muted:#A69FC0;--acc:#A98BFF;--accSoft:#2E2550;--amber:#F7B84B;--amberSoft:#3A2F17;--track:#3A3355;--ok:#3CCB8E;--okSoft:#163A30;--bad:#FF7A6B;--badSoft:#46221F;--border:#342D4C}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17.5px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,.brand{font-family:var(--head)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px 4px;max-width:1140px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand .lg{width:18px;height:18px;border-radius:5px;background:var(--acc);position:relative}
.brand .lg::after{content:"";position:absolute;inset:5px 7px;border-radius:2px;background:var(--surface)}
.pts{background:var(--amberSoft);border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap}
.pts b{font-size:19px}
.reset{background:none;border:1.5px solid var(--border);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.reset.arm{border-color:var(--bad);color:var(--bad);background:var(--badSoft)}
.line{display:flex;overflow-x:auto;padding:10px 20px 14px;max-width:1140px;margin:0 auto;scrollbar-width:thin}
.stn{flex:1 0 100px;position:relative;text-align:center;background:none;border:0;padding:0 4px;cursor:pointer}
.stn:disabled{cursor:not-allowed;opacity:.5}
.stn::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:5px;border-radius:3px;background:var(--track);z-index:0}
.stn:first-child::before{display:none}
.stn.reached::before{background:var(--acc)}
.stn .c{position:relative;z-index:1;display:grid;place-items:center;width:31px;height:31px;margin:0 auto;border-radius:50%;background:var(--surface);border:4px solid var(--track);font-size:13px;font-weight:700;color:transparent;transition:transform .15s}
.stn.done .c{background:var(--acc);border-color:var(--acc);color:#fff}
.stn.cur .c{border-color:var(--acc);transform:scale(1.22);box-shadow:0 0 0 5px var(--accSoft)}
.stn .l{display:block;font-size:13.5px;font-weight:600;margin-top:6px;line-height:1.2}
.stn .m{display:block;font-size:12px;color:var(--muted)}
.stn.cur .l{color:var(--acc)}
main{max-width:900px;margin:0 auto;padding:28px 20px 60px}
main.wide{max-width:1060px}
.kicker{color:var(--muted);font-size:15px;margin:0 0 4px}
h1{font-size:clamp(32px,5vw,48px);line-height:1.08;margin:0 0 12px;letter-spacing:-.02em}
h2{font-size:clamp(27px,4vw,36px);line-height:1.12;margin:0 0 12px;letter-spacing:-.015em}
h3{font-size:21px;margin:36px 0 8px}
p{margin:0 0 14px;max-width:70ch}
.lead{font-size:19px}
.task{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin:12px 0 8px}
.ins{color:var(--muted);font-size:15.5px;margin-bottom:12px}
.box{border-left:5px solid var(--amber);background:var(--amberSoft);border-radius:0 12px 12px 0;padding:12px 16px;margin:16px 0}
.box.v{border-color:var(--acc);background:var(--accSoft)}
.box.g{border-color:var(--ok);background:var(--okSoft)}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.fig{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin:16px 0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption,.cap{font-size:14.5px;color:var(--muted);margin-top:8px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.primary{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:600;cursor:pointer;font-size:17px}
.primary:disabled{background:var(--track);color:var(--muted);cursor:not-allowed}
.ghost{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
.ghost:hover:not(:disabled){border-color:var(--acc)}
.ghost.on{border-color:var(--acc);background:var(--accSoft)}
.ghost:disabled{opacity:.45;cursor:not-allowed}
.checkbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.checkbar .hint{color:var(--muted);font-size:14.5px}
.score{font-weight:600;padding:8px 14px;border-radius:10px;background:var(--okSoft);color:var(--ok)}
.score.part{background:var(--amberSoft);color:var(--ink)}
.next{margin-top:36px;padding-top:22px;border-top:1px dashed var(--border);display:flex;justify-content:flex-end;gap:12px;align-items:center}
label.f{display:block;font-weight:600;margin:12px 0 4px}
.in{font:inherit;width:100%;max-width:420px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--ink)}
.in.good{border-color:var(--ok);background:var(--okSoft)}
.in.badin{border-color:var(--bad);background:var(--badSoft)}
.muted{color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border-radius:12px;background:var(--surface2);min-height:60px}
.pool .empty{color:var(--muted);font-size:14.5px;align-self:center}
.chipb{background:var(--surface);border:1.5px solid var(--border);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500}
.chipb:hover:not(:disabled){border-color:var(--acc)}
.chipb.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.chipb.ok{background:var(--okSoft);border-color:var(--ok);color:var(--ok)}
.chipb.bad{background:var(--badSoft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.chipb:disabled{cursor:default}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.bucket{border:2px dashed var(--acc);border-radius:12px;padding:12px;min-height:120px;cursor:pointer;background:var(--surface)}
.bucket.over{background:var(--accSoft)}
.bh{font-weight:700;margin-bottom:2px}
.bs{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.bc{display:flex;flex-wrap:wrap;gap:8px}
.seq{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:12px}
.slot .n{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accSoft);color:var(--acc)}
.slot.empty span:last-child{color:var(--muted);flex:1;border:1.5px dashed var(--border);border-radius:10px;padding:9px 14px}
.slotbtn{flex:1;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:9px 14px;cursor:pointer}
.slot.ok .slotbtn{border-color:var(--ok);background:var(--okSoft)}
.slot.bad .slotbtn{border-color:var(--bad);background:var(--badSoft)}
.slotbtn:disabled{cursor:default;color:var(--ink)}
.q{border:0;padding:0;margin:0 0 20px}
.q legend{font-weight:600;padding:0;margin-bottom:10px;display:flex;gap:10px}
.qn{flex:0 0 27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--accSoft);color:var(--acc);font-size:14px;font-weight:700;margin-top:1px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.opt{text-align:left;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--accSoft)}
.opt.ok{border-color:var(--ok);background:var(--okSoft)}
.opt.bad{border-color:var(--bad);background:var(--badSoft)}
.opt:disabled{cursor:default;color:var(--ink)}
.why{font-size:15px;margin:8px 0 0;padding:8px 12px;border-radius:8px;max-width:none}
.why.good{background:var(--okSoft)}
.why.miss{background:var(--badSoft)}
.iq{margin-bottom:18px}
.iqq{display:flex;gap:10px;font-weight:600;margin-bottom:8px}
.iqa{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-left:37px}
.iqa .in{max-width:220px;font-family:var(--mono)}
.unit{font-weight:600;color:var(--muted)}
.okm{color:var(--ok);font-weight:600}.badm{color:var(--bad);font-weight:600}
.guesses{display:grid;gap:8px;max-width:600px}
.result{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px}
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 16px}
.big .n{font-family:var(--head);font-size:56px;font-weight:700;line-height:1;color:var(--acc)}
.big .of{font-size:20px;color:var(--muted)}
.grade{margin-left:auto;text-align:center;border:2px solid var(--acc);border-radius:12px;padding:6px 14px}
.grade b{display:block;font-size:30px;line-height:1.1}
.grade span{font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15.5px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
.result td:last-child,.result th:last-child{text-align:right;white-space:nowrap}
textarea{width:100%;font-family:var(--mono);font-size:13.5px;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);color:var(--ink);resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:15.5px}
.fb.ok{background:var(--okSoft)}.fb.bad{background:var(--badSoft)}.fb.info{background:var(--accSoft)}
.goals{list-style:none;padding:0;margin:10px 0 0}
.goals li{padding:3px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.memo{margin:26px 0 8px;background:var(--surface);border:2px solid var(--acc);border-radius:14px;padding:14px 18px 10px}
.memo h3{margin:0 0 6px;font-family:var(--head);font-size:18px;color:var(--acc)}
.memo ul{margin:0;padding-left:20px}.memo li{margin:5px 0;font-size:16px;line-height:1.5}
:root{--bg:#ECF3F0;--acc:#0E7A5C;--accSoft:#D5EEE5;--track:#C6D8D1;--border:#D0DED8;--surface2:#F3F8F6;--ink:#0F1F1A;--muted:#4E645C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0D1614;--surface:#15221E;--surface2:#1B2B26;--acc:#4CC9A0;--accSoft:#173A31;--track:#2C403A;--border:#284039;--ink:#E4F1EC;--muted:#98B3AA}}
:root[data-theme="dark"]{--bg:#0D1614;--surface:#15221E;--surface2:#1B2B26;--acc:#4CC9A0;--accSoft:#173A31;--track:#2C403A;--border:#284039;--ink:#E4F1EC;--muted:#98B3AA}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}
.pc{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px}
.pc svg{width:54px;height:54px;display:block}
.pc h4{margin:8px 0 4px;font-family:var(--head);font-size:17px}
.pc p{font-size:14.5px;margin:0;color:var(--muted)}
.code{font-family:var(--mono);font-size:15px;line-height:1.7;background:#0F1F1A;color:#DDF3EA;border-radius:12px;padding:12px 16px;overflow-x:auto;white-space:pre;margin:10px 0}
.code .k{color:#FFB86B;font-weight:700}.code .s{color:#9BE39B}
.code .ln{display:block;border-radius:4px;padding:0 6px;margin:0 -6px}
.code .ln.hl{background:#1F7A5C}
.wide-svg svg{width:100%;height:auto;display:block}
.game{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(250px,1fr);gap:18px;align-items:start}
@media (max-width:800px){.game{grid-template-columns:1fr}}
.game svg{width:100%;height:auto;display:block;border-radius:14px}
.hist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hist span{font-family:var(--mono);font-size:14px;border-radius:6px;padding:2px 8px;background:var(--surface2);border:1px solid var(--border)}
.coinbtn{border:0;background:none;cursor:pointer;padding:0}
.coinbtn svg{width:64px;height:64px}
.coins{display:flex;gap:6px;flex-wrap:wrap}
.picked{display:flex;gap:4px;flex-wrap:wrap;min-height:48px;background:var(--surface2);border:1.5px dashed var(--border);border-radius:12px;padding:6px;margin-top:8px}
.picked button svg{width:40px;height:40px}
.fcwrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(250px,1fr);gap:18px;align-items:start}
@media (max-width:800px){.fcwrap{grid-template-columns:1fr}}
.fc svg{width:100%;height:auto;display:block}
.fs{cursor:pointer}.fs:hover .sh{stroke:#F2A516;stroke-width:4}
.tray{display:grid;gap:8px}
.card2{text-align:left;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;cursor:pointer;font-family:var(--mono);font-size:15px}
.card2.sel{border-color:var(--amber);background:var(--amberSoft)}
.console{font-family:var(--mono);font-size:14px;background:#0F1F1A;color:#9BE39B;border-radius:10px;padding:10px 14px;min-height:70px;white-space:pre-wrap;margin-top:10px}
.vars{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.var{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:6px 14px;font-family:var(--mono);font-size:16px;min-width:80px;text-align:center}
.var b{display:block;font-size:12px;color:var(--muted);font-family:var(--font)}
.var.ch{border-color:var(--amber);background:var(--amberSoft)}
.mono .chipb,.mono .slotbtn{font-family:var(--mono);white-space:pre;font-size:15px}
.qimg{display:block;margin:8px 0;max-width:420px}
.qimg svg{width:100%;height:auto;display:block;border-radius:10px}
.rv g[data-rv]{cursor:pointer}
.rv g[data-rv]:hover rect{stroke:#F2A516;stroke-width:4}
code{font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:0 5px;font-size:.92em}
.theory{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin:14px 0}
.theory p{margin:8px 0}.theory h4{margin:12px 0 4px;font-family:var(--head)}
.pcode{font-family:var(--mono);background:#0F1A2E;color:#DCE7FF;border-radius:12px;padding:12px 16px;font-size:15px;white-space:pre;overflow-x:auto;margin:10px 0;line-height:1.55}
.pcode .k{color:#FF9E64}.pcode .s{color:#9ECE6A}.pcode .c{color:#6B7B99}.pcode .n{color:#E0AF68}
.ide{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:900px){.ide{grid-template-columns:1fr}}
.win{background:#fff;color:#1B1B1F;border:1px solid #BCC6D3;border-radius:10px;overflow:hidden;box-shadow:0 12px 30px -14px rgba(10,20,60,.45);font-family:"Segoe UI",var(--font);font-size:14px}
.win .wt{background:#E9EDF3;padding:6px 12px;display:flex;align-items:center;gap:8px;font-size:13px;border-bottom:1px solid #D5DCE6}
.win .wt .dots{margin-left:auto;color:#666;letter-spacing:6px}
.win .tb{display:flex;gap:6px;padding:6px 8px;background:#F6F7F9;border-bottom:1px solid #E0E4EA}
.win .tb button{border:1px solid #BFC7D5;background:#fff;border-radius:5px;padding:4px 10px;cursor:pointer;font-size:13px}
.win .tb .run{background:#2E7D4F;border-color:#2E7D4F;color:#fff;font-weight:700}
.win textarea{width:100%;min-height:230px;border:0;outline:none;resize:vertical;font-family:"Courier New",var(--mono);font-size:15px;line-height:1.5;padding:10px 12px;color:#000;background:#fff}
.shell{background:#fff;font-family:"Courier New",var(--mono);font-size:13.5px;padding:8px 10px;min-height:54px;max-height:170px;overflow:auto;white-space:pre-wrap;border-top:1px solid #E0E4EA;color:#000}
.shell .e{color:#D10000}.shell .o{color:#0033CC}
.tkwin .body{padding:8px;background:#F0F0F0;display:flex;justify-content:center;align-items:flex-start;min-height:200px;overflow:auto}
.tkempty{padding:30px 16px;text-align:center;color:#666;font-size:14px;line-height:1.7}
.chal{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chal button{border:1.5px solid var(--border);background:var(--surface);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:600}
.chal button.on{border-color:var(--acc);background:var(--accSoft)}
.coord{position:relative;display:inline-block;max-width:100%}
.coord svg{display:block;max-width:100%;height:auto;cursor:crosshair;background:#fff;border:1px solid #BCC6D3}
.coord .tip{position:absolute;pointer-events:none;background:#1B1B1F;color:#fff;font-family:var(--mono);font-size:12px;padding:2px 6px;border-radius:5px;transform:translate(10px,-24px);white-space:nowrap}
.lines{display:grid;gap:6px;margin:10px 0}
.lines label{display:flex;gap:10px;align-items:center;font-family:var(--mono);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer}
.lines label small{font-family:var(--font);color:var(--muted);margin-left:auto}
.qimg{display:block;margin:8px 0;max-width:260px}
.cmdt td,.cmdt th{padding:6px 8px;font-size:14.5px;vertical-align:top}
.goals{list-style:none;padding:0;margin:8px 0 0}.goals li{padding:3px 0}
.tgt{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:start;margin:8px 0}
@media (max-width:700px){.tgt{grid-template-columns:1fr}}
.tgt .pv svg{border:1px solid var(--border);border-radius:8px}
.drawbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.drawbox{grid-template-columns:1fr}}
#drawsvg{cursor:crosshair;background:#fff;border:1px solid #BCC6D3;display:block;max-width:100%;height:auto}
.gen{font-family:var(--mono);background:#0F1A2E;color:#DCE7FF;border-radius:12px;padding:10px 14px;font-size:14px;white-space:pre-wrap;word-break:break-all;min-height:60px}
.fp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:8px 0}
.fp label{font-weight:600;font-size:14px}

/* ===== LENKA: spoločné pravidlá vzhľadu ===== */
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#D9EAFB}}
:root[data-theme="light"]{--bg:#D9EAFB}
.theory p{max-width:none}
.tsplit{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:22px;align-items:start}
.tsplit>div>.tfig,.tsplit>div>figure{margin:0}
@media (max-width:860px){.tsplit{grid-template-columns:1fr}}
.rtab{border-collapse:collapse;margin:10px 0;font-size:15.5px;width:100%}
.rtab th,.rtab td{border:1px solid var(--border);padding:5px 10px;text-align:left;vertical-align:top}
.rtab th{background:var(--surface2);font-size:14px}

function axState() { return S.ax || (S.ax = { anchor: "center", size: 24, st: "bold", fill: "navy" }); }
function axCode() { const X = axState(); let a = `canvas.create_text(200, 90, text='Python', font=('Arial', ${X.size}${X.st ? `, '${X.st}'` : ""})`; if (X.fill !== "black") a += `, fill='${X.fill}'`; if (X.anchor !== "center") a += `, anchor='${X.anchor}'`; return "canvas.create_oval(196, 86, 204, 94, fill='red', outline='')\n" + a + ")"; }
function axInner() { const env = tkRun("import tkinter\ncanvas = tkinter.Canvas(width=400, height=180, bg='white')\ncanvas.pack()\ncanvas.create_line(0, 90, 400, 90, fill='lightgray', dash=(4, 4))\ncanvas.create_line(200, 0, 200, 180, fill='lightgray', dash=(4, 4))\n" + axCode()); return `<div class="pv" style="border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff">${tkSVG(env)}</div><div class="pcode" style="white-space:pre-wrap;word-break:break-word">${hl(axCode())}</div>`; }
function axHTML() { const X = axState(); const sel = (id, lab, opts, v) => `<label>${lab} <select id="${id}">${opts.map(([val, t]) => `<option value="${val}" ${String(v) === String(val) ? "selected" : ""}>${t}</option>`).join("")}</select></label>`;
  return `<h3>Vyskúšaj si: skúšačka ukotvenia</h3><p>Červený bod (200, 90) sa nehýbe. Meň <code>anchor</code> a písmo a sleduj, kam sa text posunie. Táto časť sa neboduje.</p>
    <div class="task"><div class="fp">${sel("axa", "anchor", ["center", "n", "s", "w", "e", "nw", "ne", "sw", "se"].map(a => [a, "'" + a + "'"]), X.anchor)}${sel("axs", "veľkosť", [12, 18, 24, 36].map(w => [w, w]), X.size)}${sel("axt", "rez", [["", "bez rezu"], ["bold", "'bold'"], ["italic", "'italic'"], ["bold italic", "'bold italic'"], ["underline", "'underline'"]], X.st)}${sel("axf", "fill", [["black", "black"], ["navy", "navy"], ["red", "red"], ["green", "green"]], X.fill)}</div>
    <div id="axbox">${axInner()}</div></div>`; }
function axInput(t) { const m = { axa: "anchor", axs: "size", axt: "st", axf: "fill" }[t.id]; if (!m) return false; const X = axState(); X[m] = m === "size" ? +t.value : t.value; save(); const b = document.getElementById("axbox"); if (b) b.innerHTML = axInner(); return true; }

function selBlock(key, items, opts) { const D = S[key + "d"], V = S[key] || (S[key] = {}); return items.map(([t, ok, why], i) => `<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin:6px 0"><span style="flex:1 1 260px;min-width:0">${i + 1}. ${t}${D ? `<br><small>${V[i] === ok ? "✔️ správne" : "❌ správne: " + opts.find(o => o[0] === ok)[1]}${why ? " – " + why : ""}</small>` : ""}</span><select data-sel="${key}|${i}" ${D ? "disabled" : ""} style="flex:0 1 250px;width:250px;min-width:0;max-width:100%;border:1.5px solid var(--border);border-radius:8px;padding:4px;background:var(--surface2);color:var(--ink)">${opts.map(([v, l]) => `<option value="${v}" ${V[i] === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>`).join("") + (D ? `<div class="row"><button class="ghost" data-selr="${key}">↺ Skúsiť znova</button></div>` : `<div class="row"><button class="primary" data-selok="${key}">✔ Vyhodnotiť</button></div>`); }
function selClick(e, defs) { const el0 = e.target.closest && e.target.closest("button"); if (!el0) return false; const k = el0.dataset.selok || el0.dataset.selr; if (!k || !defs[k]) return false; const [items, gid] = defs[k]; S[k] = S[k] || {};
  if (el0.dataset.selok) { if (items.some((_, i) => !S[k][i])) { { el0.textContent = "⚠️ Najprv vyber odpoveď pri všetkých položkách"; setTimeout(() => render(false), 2200); return true; } } S[k + "d"] = true; const n = items.filter((x, i) => S[k][i] === x[1]).length; if (n && (!S.t[gid] || S.t[gid].score < n)) award(gid, n); } else { S[k + "d"] = false; S[k] = {}; } save(); render(false); return true; }
function selInput(e) { const t = e.target; if (t.dataset && t.dataset.sel) { const [k, i] = t.dataset.sel.split("|"); S[k] = S[k] || {}; S[k][i] = t.value; save(); return true; } return false; }

/* ===== HODINY 3. ročník tkinter: náhodné čísla pre každého žiaka, obrázky k otázkam ===== */
const hesc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nf = (n, d) => Number(n).toLocaleString("sk-SK", { maximumFractionDigits: d || 0, minimumFractionDigits: 0 });
function mkRN(v, gen) { const k = KEY + ":rn", r = (a, b) => a + Math.floor(Math.random() * (b - a + 1)), pick = a => a[Math.floor(Math.random() * a.length)]; let o = null;
  try { o = JSON.parse(localStorage.getItem(k)); } catch (e) {}
  if (!o || o.v !== v) { o = Object.assign({ v }, gen(r, pick)); try { localStorage.setItem(k, JSON.stringify(o)); } catch (e) {} } return o; }
/* otázka s výberom: prvá možnosť je správna (poradie možností sa žiakom mieša) */
function NQ(id, q, c, ds, f, why) { f = f || (v => nf(v)); const seen = new Set([f(c)]), opts = [f(c)];
  ds.forEach(v => { let x = v, n = 0; while (seen.has(f(x)) && n < 40) { x = typeof x === "number" ? x + 10 : x + "'"; n++; } seen.add(f(x)); opts.push(f(x)); });
  return { id, q, opts, a: 0, why }; }
const QO = (id, q, opts, why) => ({ id, q, opts, a: 0, why });
const pair = (x, y) => `(${x}, ${y})`;

/* obrázky k otázkam: editor s kódom, okno tk, mriežka súradníc */
const HQ = (() => { const { SV, TX, EM, QM, QS, XS, blink, bob } = HK;
  const MONO = `font-family="Consolas,JetBrains Mono,monospace"`;
  const wrap = (l, n) => { if (l.length <= n) return [l]; const out = []; let cur = ""; l.split(/(?<=, )/).forEach(p => { if ((cur + p).length > n && cur) { out.push(cur); cur = "    " + p; } else cur += p; }); if (cur) out.push(cur); return out; };
  const colr = l => /^\s*(import|from)\b/.test(l) ? "#FFB86B" : /Error/.test(l) ? "#FF8A80" : "#DCE7FF";
  /* tmavý editor s riadkami kódu */
  const ED = (x, y, w, h, lines, o = {}) => { const fs = o.fs || 11.5, lh = o.lh || 17, n = Math.floor((w - 18) / (fs * 0.6)); const L = lines.flatMap(l => wrap(l, n));
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="#0F1A2E"/>` + L.map((l, i) => `<text x="${x + 9}" y="${y + 18 + i * lh}" font-size="${fs}" ${MONO} fill="${o.c || colr(l)}" xml:space="preserve">${hesc(l)}</text>`).join("") +
      (o.cur === false ? "" : blink(x + 11 + Math.min(n, (L[L.length - 1] || "").length) * fs * 0.6, y + 6 + (L.length - 1) * lh, 14, "#9BE39B")); };
  /* malé okno tk s plochou */
  const WIN = (x, y, w, h, inner, bg) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#fff" stroke="#9FB0C8"/><rect x="${x}" y="${y}" width="${w}" height="16" rx="6" fill="#E9EDF3"/><rect x="${x}" y="${y + 10}" width="${w}" height="6" fill="#E9EDF3"/>${TX(x + 7, y + 12, "tk", { fs: 9.5, c: "#5E5877" })}<rect x="${x + 4}" y="${y + 19}" width="${w - 8}" height="${h - 23}" fill="${bg || "#fff"}" stroke="#E0E4EA"/>${inner || ""}`;
  /* kód v editore + otáznik */
  const code = (lines, label, extra) => QS(ED(10, 12, 220, 126, lines) + (extra || "") + QM(214, 128, 12), label || "Kód");
  /* kód hore, prázdne okno dole: „čo sa nakreslí?“ */
  const codeWin = (lines, label) => QS(ED(8, 8, 224, 60, lines, { fs: 10.5, lh: 15, cur: false }) + WIN(60, 74, 120, 70, `${QM(120, 115, 13)}`), label || "Čo sa nakreslí?");
  /* mriežka plochy W×H vo výreze (x, y, w, h) a prepočet súradníc */
  const grid = (x, y, w, h, W, H, st) => { const sx = w / W, sy = h / H; let g = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff" stroke="#9FB0C8"/>`;
    for (let i = st; i < W; i += st) g += `<line x1="${x + i * sx}" y1="${y}" x2="${x + i * sx}" y2="${y + h}" stroke="#EEF1F5"/>`;
    for (let j = st; j < H; j += st) g += `<line x1="${x}" y1="${y + j * sy}" x2="${x + w}" y2="${y + j * sy}" stroke="#EEF1F5"/>`;
    return { svg: g, X: v => x + v * sx, Y: v => y + v * sy, sx, sy }; };
  /* malá ikonka pri situáciách v úlohách s výberom */
  const sico = (e, c) => `<span class="sico" aria-hidden="true"><svg viewBox="0 0 46 34"><rect width="46" height="34" rx="8" fill="${c || "#E3ECFD"}"/><text x="23" y="24" text-anchor="middle" font-size="19">${e}</text></svg></span>`;
  return { MONO, wrap, ED, WIN, code, codeWin, grid, sico };
})();

const REVEAL = () => true;                           /* po skontrolovaní sa hneď ukážu správne odpovede (kontrola iba raz) */
const RO = () => !!S.testLocked && !["test", "vysledok"].includes(STEPS[S.cur].id); /* zastávky už len na prezeranie */
const QIMG0 = () => (typeof QIMG !== "undefined" ? QIMG : {});
const pic = (k, cl) => k && QIMG0()[k] ? `<figure class="${cl || "hq"}">${QIMG0()[k]}</figure>` : "";
const qpic = (T, q) => q.img || (QIMG0()[T.id + ":" + q.id] ? T.id + ":" + q.id : "");
const withPic = (k, inner) => k && QIMG0()[k] ? `<div class="qrow"><div>${inner}</div>${pic(k)}</div>` : inner;
function retryBtn(id) { return ""; }                 /* úlohy sa kontrolujú iba raz */
function checkBar(T, ready, hint) {
  const r = S.t[T.id];
  if (r) return `<div class="checkbar"><span class="score ${r.score < r.max ? "part" : ""}">${r.skip ? "Úlohu si pred testom nevyriešil: 0 bodov" : (r.score === r.max ? "Výborne! " : "") + `Získal si ${r.score} z ${r.max} ${r.max === 1 ? "bodu" : "bodov"}`}</span>${retryBtn(T.id)}</div>`;
  return `<div class="checkbar"><button class="primary" data-check="${T.id}" ${ready ? "" : "disabled"}>Skontrolovať</button><span class="hint" data-hint="${T.id}">${ready ? "" : hint}</span></div>`;
}
function mcHTML(T) {
  const done = S.t[T.id], d = S.d[T.id] || {}, rv = REVEAL();
  return qOrder(T).map((q, qi) => {
    const o = ord(T.id + ":" + q.id, q.opts.map((_, i) => i), T.keep), good = d[q.id] === q.a;
    const opts = `<div class="opts">` + o.map(i => {
      let c = "opt"; if (d[q.id] === i) c += " sel";
      if (done) { if (rv && i === q.a) c += " ok"; else if (d[q.id] === i) c += i === q.a ? " ok" : " bad"; }
      return `<button class="${c}" data-mc="${T.id}|${q.id}|${i}" aria-pressed="${d[q.id] === i}" ${done ? "disabled" : ""}>${q.opts[i]}</button>`;
    }).join("") + `</div>${done && q.why && (good || rv) ? `<p class="why ${good ? "good" : "miss"}">${q.why}</p>` : done && !good ? `<p class="why miss">Správna odpoveď: ${q.opts[q.a]}</p>` : ""}`;
    return `<fieldset class="q"><legend><span class="qn">${qi + 1}</span><span>${q.q}</span></legend>${withPic(qpic(T, q), opts)}</fieldset>`;
  }).join("") + checkBar(T, T.qs.every(q => d[q.id] !== undefined), "Odpovedz na všetky otázky.");
}
function sortHTML(T) {
  const done = S.t[T.id], d = S.d[T.id] || {};
  const ids = ord(T.id, T.items.map(x => x.id));
  const by = Object.fromEntries(T.items.map(x => [x.id, x]));
  const chip = id => { let c = "chipb" + (T.mono ? " mono" : ""); if (SEL && SEL.t === T.id && SEL.i === id) c += " sel"; if (done) c += d[id] === by[id].b ? " ok" : " bad";
    const fix = done && d[id] !== by[id].b ? `<span class="fixb">→ patrí do: ${(T.buckets.find(b => b.id === by[id].b) || {}).label || ""}</span>` : "";
    return `<span class="chipw"><button class="${c}" data-pick="${T.id}|${id}" draggable="${done ? "false" : "true"}" ${done ? "disabled" : ""}>${by[id].t}</button>${fix}</span>`; };
  const pool = ids.filter(id => !d[id]);
  return pic(T.img || T.id, "tpic") + (done ? "" : `<div class="pool" data-bucket="${T.id}|">${pool.length ? pool.map(chip).join("") : '<span class="empty">Všetko je roztriedené. Kartičku presunieš kliknutím na ňu a potom na iný kôš.</span>'}</div>`) +
    `<div class="buckets">${T.buckets.map(b => `<div class="bucket" data-bucket="${T.id}|${b.id}"><div class="bh">${b.label}</div><div class="bs">${b.sub || ""}</div><div class="bc">${ids.filter(id => d[id] === b.id).map(chip).join("")}</div></div>`).join("")}</div>` +
    (done && ids.some(id => !d[id]) ? `<div class="box v" style="margin-top:12px"><p><b>Správne roztriedenie:</b></p><ul>${T.buckets.map(b => `<li><b>${b.label}:</b> ${T.items.filter(x => x.b === b.id).map(x => x.t).join(", ")}</li>`).join("")}</ul></div>` : "") +
    (done && T.after && (done.score === done.max || REVEAL()) ? `<p class="why good" style="margin-top:12px">${T.after}</p>` : "") + checkBar(T, ids.every(id => d[id]), "Roztrieď všetky kartičky.");
}
function orderHTML(T) {
  const done = S.t[T.id], seq = S.d[T.id] || [];
  const ids = ord(T.id, T.items.map(x => x.id));
  const by = Object.fromEntries(T.items.map(x => [x.id, x]));
  const pool = ids.filter(id => !seq.includes(id));
  let h = pic(T.img || T.id, "tpic") + `<ol class="seq">` + T.items.map((_, i) => {
    const id = seq[i];

    let c = "slot"; if (done) c += id === T.items[i].id ? " ok" : " bad";
    return `<li class="${c}"><span class="n">${i + 1}</span><button class="slotbtn" data-unplace="${T.id}|${id}" ${done ? "disabled" : 'title="Kliknutím vrátiš kartičku späť"'}>${by[id].t}</button></li>`;
  }).join("") + `</ol>`;
  if (!done) h += `<div class="pool">${pool.length ? pool.map(id => `<button class="chipb" data-place="${T.id}|${id}">${by[id].t}</button>`).join("") : '<span class="empty">Všetko je poukladané. Kliknutím na kartičku hore ju vrátiš späť.</span>'}</div>`;
  if (done && S.t[T.id].score < T.items.length && REVEAL()) h += `<div class="box v"><p><b>Správne poradie:</b></p><ol>${T.items.map(x => `<li>${x.t}</li>`).join("")}</ol></div>`;
  return h + checkBar(T, seq.length === T.items.length, "Poukladaj všetky kartičky.");
}
function inputHTML(T) {
  const done = S.t[T.id], d = S.d[T.id] || {}, rv = REVEAL();
  return qOrder(T).map((q, qi) => {
    const v = d[q.id] || "", ok = done ? q.ok(v) : null;
    const field = `<div class="iqa">${q.pre ? `<span class="unit">${q.pre}</span>` : ""}<input type="text" class="in ${done ? (ok ? "good" : "badin") : ""}" data-inp="${T.id}|${q.id}" value="${esc(v)}" ${done ? "disabled" : ""} placeholder="${q.ph || ""}" autocomplete="off" aria-label="Odpoveď ${qi + 1}">${q.unit ? `<span class="unit">${q.unit}</span>` : ""}${done ? `<span class="${ok ? "okm" : "badm"}">${ok ? "✓ správne" : rv ? "✗ správne je " + q.show : "✗ nesprávne, oprav"}</span>` : ""}</div>${done && q.why && (ok || rv) ? `<p class="why ${ok ? "good" : "miss"}">${q.why}</p>` : ""}`;
    const k = qpic(T, q);
    return `<div class="iq"><div class="iqq"><span class="qn">${qi + 1}</span><span>${q.q}</span></div>${k ? withPic(k, field) : field}</div>`;
  }).join("") + checkBar(T, T.qs.every(q => String(d[q.id] || "").trim()), "Vyplň všetky odpovede.");
}
function inputReady(T) { const d = S.d[T.id] || {}; return T.qs.every(q => String(d[q.id] || "").trim()); }
function taskHTML(id) { const T = TASKS[id]; return T.type === "itest" ? testHTML(T) : T.type === "mc" ? mcHTML(T) : T.type === "sort" ? sortHTML(T) : T.type === "order" ? orderHTML(T) : inputHTML(T); }
function check(id) {
  const T = TASKS[id], d = S.d[id] || (T.type === "order" ? [] : {});
  if (S.testLocked && id !== "test") return;
  let s = 0;
  if (T.type === "itest") s = T.qs.filter(q => tOk(q)).length;
  if (T.type === "mc") s = T.qs.filter(q => d[q.id] === q.a).length;
  if (T.type === "sort") s = T.items.filter(x => d[x.id] === x.b).length;
  if (T.type === "order") s = T.items.filter((x, i) => d[i] === x.id).length;
  if (T.type === "input") s = T.qs.filter(q => q.ok(d[q.id] || "")).length;
  award(id, s);
  if (id === "test") S.finished = Date.now();
  save(); render(false);
}

/* ---------- záverečný test: interaktívne otázky (zoraď, priraď, klikni do obrázka, roztrieď, poskladaj) ---------- */
const TA = () => (S.d.test = S.d.test || {});
function tAnswered(q) { const a = TA()[q.id];
  if (q.kind === "order") return Array.isArray(a) && a.length === q.items.length;
  if (q.kind === "match") return !!a && q.rows.every((_, i) => a[i] !== undefined && a[i] !== "");
  if (q.kind === "hot") return !!a;
  if (q.kind === "sort") return !!a && q.items.every((_, i) => a[i] !== undefined);
  if (q.kind === "build") return Array.isArray(a) && a.length === q.a.length;
  return false; }
function tOk(q) { const a = TA()[q.id]; if (!tAnswered(q)) return false;
  if (q.kind === "order") return a.every((x, i) => x === i);
  if (q.kind === "match") return q.rows.every((r, i) => +a[i] === i);
  if (q.kind === "hot") return a === q.a;
  if (q.kind === "sort") return q.items.every((it, i) => a[i] === it[1]);
  if (q.kind === "build") return a.every((x, i) => q.pieces[x] === q.a[i]);
  return false; }
function tBody(q, done) {
  const a = TA()[q.id];
  if (q.kind === "order") {
    const seq = a || [], P = ord("test:" + q.id, q.items.map((_, i) => i));
    let h = `<ol class="seq">` + q.items.map((_, i) => { const k = seq[i];
      if (k === undefined) return `<li class="slot empty"><span class="n">${i + 1}</span><span>${i === seq.length ? "Klikni na kartičku nižšie" : "…"}</span></li>`;
      return `<li class="slot ${done ? (k === i ? "ok" : "bad") : ""}"><span class="n">${i + 1}</span><button class="slotbtn" data-tun="${q.id}|${k}" ${done ? "disabled" : 'title="Kliknutím vrátiš kartičku späť"'}><span>${q.items[k]}</span></button></li>`; }).join("") + `</ol>`;
    if (!done) { const rest = P.filter(k => !seq.includes(k)); h += `<div class="pool">${rest.length ? rest.map(k => `<button class="chipb" data-tord="${q.id}|${k}">${q.items[k]}</button>`).join("") : '<span class="empty">Všetko je poukladané. Kartičku vrátiš kliknutím na ňu hore.</span>'}</div>`; }
    return h + (done && !tOk(q) ? `<p class="fb miss">Správne poradie: ${q.items.join(" → ")}</p>` : ""); }
  if (q.kind === "match") {
    const R = ord("test:" + q.id + ":r", q.rows.map((_, i) => i)), O = ord("test:" + q.id + ":o", q.rows.map((_, i) => i)), v = a || {};
    return `<table class="mtt"><tbody>${R.map(i => { const ok = done && +v[i] === i;
      return `<tr><td>${q.rows[i][0]}</td><td><select data-tm="${q.id}|${i}" class="${done ? (ok ? "good" : "badsel") : ""}" ${done ? "disabled" : ""} aria-label="Priradenie k: ${q.rows[i][0].replace(/<[^>]+>/g, "")}"><option value="">vyber…</option>${O.map(k => `<option value="${k}" ${String(v[i]) === String(k) ? "selected" : ""}>${q.rows[k][1]}</option>`).join("")}</select>${done && !ok ? `<div style="font-size:14.5px;margin-top:3px;color:var(--bad)">správne: ${q.rows[i][1]}</div>` : ""}</td></tr>`; }).join("")}</tbody></table>`; }
  if (q.kind === "hot") return `<p class="muted" style="margin:0;font-size:15px">${a ? `Vybral si: <b>${q.names[a]}</b>` : "Zatiaľ si nič nevybral. Klikni na miesto v obrázku."}</p>${done && !tOk(q) ? `<p class="fb miss">Správne: ${q.names[q.a]}</p>` : ""}`;
  if (q.kind === "sort") {
    const P = ord("test:" + q.id, q.items.map((_, i) => i)), v = a || {};
    let h = `<div class="buckets">${q.groups.map((g, gi) => `<div class="bucket" data-tg="${q.id}|${gi}"><div class="bh">${g}</div><div class="bc">${P.filter(i => v[i] === gi).map(i => done
      ? `<span class="chipb ${q.items[i][1] === gi ? "ok" : "bad"}">${q.items[i][0]}</span>` : `<button class="chipb" data-tus="${q.id}|${i}" title="Kliknutím vrátiš kartičku späť">${q.items[i][0]}</button>`).join("")}</div></div>`).join("")}</div>`;
    if (!done) { const rest = P.filter(i => v[i] === undefined); h = `<div class="pool">${rest.length ? rest.map(i => `<button class="chipb ${TSEL && TSEL.q === q.id && TSEL.i === i ? "sel" : ""}" data-tpk="${q.id}|${i}">${q.items[i][0]}</button>`).join("") : '<span class="empty">Všetko je roztriedené. Kartičku vrátiš kliknutím na ňu v skupine.</span>'}</div>` + h; }
    return h + (done && !tOk(q) ? `<p class="fb miss">Správne: ${q.groups.map((g, gi) => `${g}: ${q.items.filter(x => x[1] === gi).map(x => x[0]).join(", ")}`).join(" · ")}</p>` : ""); }
  if (q.kind === "build") {
    const seq = a || [], P = ord("test:" + q.id, q.pieces.map((_, i) => i)), m = q.mono ? " mono" : "";
    let h = `<div class="bslots${m}">${q.a.map((_, i) => { const k = seq[i]; return k === undefined ? `<span class="bsl">${(q.slots && q.slots[i]) || "…"}</span>`
      : `<button class="bsl ${done ? (q.pieces[k] === q.a[i] ? "ok" : "bad") : ""}" data-tbu="${q.id}|${i}" ${done ? "disabled" : ""}>${q.pieces[k]}</button>`; }).join(q.join || "")}</div>`;
    if (!done) h += `<div class="pool">${P.filter(k => !seq.includes(k)).map(k => `<button class="chipb${m}" data-tb="${q.id}|${k}" ${seq.length >= q.a.length ? "disabled" : ""}>${q.pieces[k]}</button>`).join("")}</div>`;
    return h + (done && !tOk(q) ? `<p class="fb miss">Správne: ${q.a.join(q.mono ? "" : " ")}</p>` : ""); }
  return ""; }
function testHTML(T) {
  const done = S.t.test;
  return qOrder(T).map((q, qi) => {
    const img = q.kind === "hot" ? HOT[q.img](q, done) : QIMG0()[q.img];
    return `<section class="tq"><div class="qh"><span class="qn">${qi + 1}</span><span>${q.q}</span><span class="pt">${done ? (tOk(q) ? "✅ 1 / 1" : "❌ 0 / 1") : "1 bod"}</span></div>
      ${img ? `<figure class="tqfig ${done ? "done" : ""}" ${q.kind === "hot" ? `data-hq="${q.id}"` : ""}>${img}</figure>` : ""}${tBody(q, done)}</section>`;
  }).join("") + (done ? `<div class="checkbar"><span class="score ${done.score < done.max ? "part" : ""}">Test: ${done.score} zo ${done.max} bodov</span></div>`
    : `<div class="checkbar"><button class="primary" data-check="test" ${T.qs.every(tAnswered) ? "" : "disabled"}>Skontrolovať test</button><span class="hint">${T.qs.every(tAnswered) ? "Pozor, test sa dá skontrolovať iba raz." : `Odpovedz na všetky otázky (hotovo ${T.qs.filter(tAnswered).length} zo ${T.qs.length}).`}</span></div>`);
}
const HZ = (q, done) => id => { const a = TA()[q.id]; let c = "hz"; if (done) c += id === q.a ? (a === id ? " hok" : " hmiss") : a === id ? " hbad" : ""; else if (a === id) c += " hsel"; return c; };

function guessBox() {
  if (S.guess === null) return "";

if (!VIEWS.vysledok) VIEWS.vysledok = function () {

    : `<p style="margin:0 0 10px">Chceš si hodinu prejsť ešte raz? Začneš od Štartu s novými úlohami a nový výsledok sa tiež odošle učiteľovi.</p><button class="ghost" data-rreset>↺ Začať odznova</button>`}</div>`;

const main = document.getElementById("main");

  main.className = ((typeof WIDE !== "undefined" && WIDE[id]) ? "wide" : "") + (ro ? " ro" : "");
  main.innerHTML = (ro ? `<div class="lockban">🔒 Záverečný test ${S.t.test ? "je hotový" : "už beží"}. Zastávku si môžeš iba prezrieť, nič v nej nezmeníš.</div>` : "") + VIEWS[id]();
  if (typeof AFTER_RENDER === "function") AFTER_RENDER(id); if (typeof typo === "function") typo(main); if (typeof balanceSplits === "function") balanceSplits(main);
  if (ro) main.querySelectorAll("input,textarea,select,button:not([data-go])").forEach(x => { x.disabled = true; });
  if (toTop) { window.scrollTo(0, 0); const c = document.querySelector(".stn.cur"); if (c) c.scrollIntoView({ block: "nearest", inline: "center" }); }
  else window.scrollTo(0, y);
}
function go(i) {
  if (!S.started && i > 0) return;
  const testI = STEPS.findIndex(x => x.id === "test");
  if (S.testLocked && !S.t.test && i < testI) return;
  if (STEPS[i].id === "vysledok" && !S.t.test) return;
  S.cur = i; SEL = null; TSEL = null; S.tconfirm = false; save(); render(true);
}
function placeSel(t, b) { if (!SEL || SEL.t !== t || S.t[t] || RO()) return; const d = S.d[t] = S.d[t] || {}; if (b) d[SEL.i] = b; else delete d[SEL.i]; SEL = null; save(); render(false); }

/* po spustení testu: v zastávkach sa nedá nič meniť (zachytí aj vlastné úlohy hodiny) */
["click", "keydown", "input", "change", "dragstart"].forEach(ev => window.addEventListener(ev, e => {
  if (!RO() || !e.target || !e.target.closest) return;
  if (!main.contains(e.target) || e.target.closest("[data-go]")) return;
  if (ev === "keydown" && !["Enter", " "].includes(e.key) && !e.target.matches("input,textarea")) return;
  e.stopPropagation(); if (ev !== "keydown" || e.target.matches("input,textarea")) e.preventDefault();
}, true));

let resetArmed = null;
document.addEventListener("click", e => {
  const hz = e.target.closest && e.target.closest(".hz");
  if (hz) { const f = hz.closest("[data-hq]"); if (f && STEPS[S.cur].id === "test" && S.testLocked && !S.t.test) { TA()[f.dataset.hq] = hz.dataset.z; save(); render(false); } return; }
  if (typeof CUSTOM_CLICK === "function" && !S.testLocked && CUSTOM_CLICK(e) === true) return;
  const el = e.target.closest("button,[data-bucket],[data-tg]"); if (!el) return;
  const ds = el.dataset;
  if (ds.go !== undefined) return go(+ds.go);
  if (ds.rreset !== undefined) { S.rconfirm = true; save(); return render(false); }
  if (ds.rno !== undefined) { S.rconfirm = false; save(); return render(false); }
  if (ds.ryes !== undefined) { const keep = { cls: S.cls }; try { localStorage.removeItem(KEY); } catch (e) {} S = fresh(); S.cls = keep.cls; SEL = null; if (typeof TSEL !== "undefined") TSEL = null; save(); window.scrollTo(0, 0); return render(true); }
  if (ds.reset !== undefined) {
    if (S.testLocked) return;
    if (!resetArmed) { el.classList.add("arm"); el.textContent = "Naozaj? Klikni znova"; resetArmed = setTimeout(() => { resetArmed = null; renderTop(); }, 3000); return; }
    clearTimeout(resetArmed); resetArmed = null; const keep = { name: S.name, cls: S.cls }; S = fresh(); S.name = keep.name; S.cls = keep.cls; SEL = null; save(); return render(true);
  }
  if (ds.start !== undefined) { if (!S.started) S.started = Date.now(); return go(1); }
  if (ds.guess !== undefined) { if (S.testLocked) return; S.guess = +ds.guess; save(); return render(false); }
  if (ds.tstart !== undefined) { S.tconfirm = true; save(); return render(false); }
  if (ds.tno !== undefined) { S.tconfirm = false; save(); return render(false); }
  if (ds.tyes !== undefined) {
    S.testLocked = true; S.tconfirm = false; S.testStarted = Date.now();
    Object.keys(STEP_TASKS).filter(k => k !== "test").forEach(k => STEP_TASKS[k].forEach(t => { if (!S.t[t]) S.t[t] = { score: 0, max: maxOf(TASKS[t]), skip: true }; }));
    save(); return render(true);
  }
  if (STEPS[S.cur].id === "test") {
    if (!S.testLocked || S.t.test) { if (ds.check !== "test") return; }
    else {
      const A = TA(), Q = id => TASKS.test.qs.find(x => x.id === id);
      if (ds.tord) { const [q, k] = ds.tord.split("|"); const s = A[q] = A[q] || []; if (!s.includes(+k)) s.push(+k); save(); return render(false); }
      if (ds.tun) { const [q, k] = ds.tun.split("|"); A[q] = (A[q] || []).filter(x => x !== +k); save(); return render(false); }
      if (ds.tpk) { const [q, i] = ds.tpk.split("|"); TSEL = TSEL && TSEL.q === q && TSEL.i === +i ? null : { q, i: +i }; return render(false); }
      if (ds.tus) { const [q, i] = ds.tus.split("|");
        if (TSEL && TSEL.q === q && A[q]) { A[q][TSEL.i] = A[q][i]; TSEL = null; save(); return render(false); }
        if (A[q]) delete A[q][i]; save(); return render(false); }
      if (ds.tg) { const [q, g] = ds.tg.split("|"); if (!TSEL || TSEL.q !== q) return; (A[q] = A[q] || {})[TSEL.i] = +g; TSEL = null; save(); return render(false); }
      if (ds.tb) { const [q, k] = ds.tb.split("|"); const s = A[q] = A[q] || []; if (s.length < Q(q).a.length && !s.includes(+k)) s.push(+k); save(); return render(false); }
      if (ds.tbu) { const [q, i] = ds.tbu.split("|"); A[q] = (A[q] || []).filter((_, j) => j !== +i); save(); return render(false); }
    }
  }
  if (ds.check) { if (ds.check === "test" && (!S.testLocked || S.t.test || !TASKS.test.qs.every(tAnswered))) return; return check(ds.check); }
  if (S.testLocked) return;
  if (ds.mc) { const [t, q, i] = ds.mc.split("|"); if (S.t[t]) return; (S.d[t] = S.d[t] || {})[q] = +i; save(); return render(false); }
  if (ds.place) { const [t, id] = ds.place.split("|"); if (S.t[t]) return; const s = S.d[t] = S.d[t] || []; if (!s.includes(id)) s.push(id); save(); return render(false); }
  if (ds.unplace) { const [t, id] = ds.unplace.split("|"); if (S.t[t]) return; S.d[t] = (S.d[t] || []).filter(x => x !== id); save(); return render(false); }
  if (ds.pick) { const [t, id] = ds.pick.split("|"); if (S.t[t]) return; SEL = SEL && SEL.t === t && SEL.i === id ? null : { t, i: id }; return render(false); }
  if (ds.bucket !== undefined) { const [t, b] = ds.bucket.split("|"); return placeSel(t, b); }
});
document.addEventListener("change", e => {
  const m = e.target.dataset && e.target.dataset.tm; if (!m || S.t.test || !S.testLocked) return;
  const [q, i] = m.split("|"); (TA()[q] = TA()[q] || {})[i] = e.target.value; save(); render(false);
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("hz")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });
document.addEventListener("input", e => {
  if (typeof CUSTOM_INPUT === "function" && !S.testLocked && CUSTOM_INPUT(e) === true) return;
  const t = e.target;
  if (t.dataset.inp) {
    if (S.testLocked) return;
    const [tid, qid] = t.dataset.inp.split("|"); (S.d[tid] = S.d[tid] || {})[qid] = t.value; save();
    const b = document.querySelector(`[data-check="${tid}"]`), h = document.querySelector(`[data-hint="${tid}"]`), r = inputReady(TASKS[tid]);
    if (b) b.disabled = !r; if (h) h.textContent = r ? "" : "Vyplň všetky odpovede."; return;
  }
  const f = t.dataset.field; if (!f) return;
  S[f] = t.value; save();
  if (STEPS[S.cur].id === "start") {
    const btn = document.querySelector("[data-start]"), h = document.getElementById("starthint"), ok = S.name.trim().length >= 3;
    if (btn) btn.disabled = !ok || S.guess === null;
    if (h) h.textContent = ok ? (S.guess === null ? "Vyber svoj tip." : "") : "Napíš svoje meno a vyber tip.";
  }
});
document.addEventListener("dragstart", e => { const p = e.target.closest && e.target.closest("[data-pick]"); if (!p) return; const [t, id] = p.dataset.pick.split("|"); if (S.t[t] || S.testLocked) return e.preventDefault(); SEL = { t, i: id }; try { e.dataTransfer.setData("text/plain", id); } catch (err) {} });
document.addEventListener("dragover", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (b && SEL) { e.preventDefault(); b.classList.add("over"); } });
document.addEventListener("dragleave", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (b && !b.contains(e.relatedTarget)) b.classList.remove("over"); });
document.addEventListener("drop", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (!b) return; e.preventDefault(); const [t, bk] = b.dataset.bucket.split("|"); placeSel(t, bk); });
document.addEventListener("dragend", () => document.querySelectorAll(".over").forEach(x => x.classList.remove("over")));
if (!S.started) S.cur = 0;
if (S.testLocked && !S.t.test) S.cur = STEPS.findIndex(x => x.id === "test");
render(true);

</script>
