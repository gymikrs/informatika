<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2.1 Komprimácia údajov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0EEF6;--surface:#FFFFFF;--surface2:#F6F5FA;--ink:#1A1530;--muted:#5E5877;
  --acc:#6A3FD0;--accSoft:#E9E2FB;--amber:#F2A516;--amberSoft:#FDF1D6;--track:#D3CEE2;
  --ok:#12805A;--okSoft:#DDF3EA;--bad:#C0392B;--badSoft:#FBE3E0;--border:#DAD6E6;
  --head:"Rubik","Segoe UI",system-ui,sans-serif;--font:"Rubik","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#13101F;--surface:#1D1830;--surface2:#241E3A;--ink:#ECE8F7;--muted:#A69FC0;--acc:#A98BFF;--accSoft:#2E2550;--amber:#F7B84B;--amberSoft:#3A2F17;--track:#3A3355;--ok:#3CCB8E;--okSoft:#163A30;--bad:#FF7A6B;--badSoft:#46221F;--border:#342D4C}}
:root[data-theme="dark"]{--bg:#13101F;--surface:#1D1830;--surface2:#241E3A;--ink:#ECE8F7;--muted:#A69FC0;--acc:#A98BFF;--accSoft:#2E2550;--amber:#F7B84B;--amberSoft:#3A2F17;--track:#3A3355;--ok:#3CCB8E;--okSoft:#163A30;--bad:#FF7A6B;--badSoft:#46221F;--border:#342D4C}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17.5px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,.brand{font-family:var(--head)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px 4px;max-width:1140px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand .lg{width:18px;height:18px;border-radius:5px;background:var(--acc);position:relative}
.brand .lg::after{content:"";position:absolute;inset:5px 7px;border-radius:2px;background:var(--surface)}
.pts{background:var(--amberSoft);border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap}
.pts b{font-size:19px}
.reset{background:none;border:1.5px solid var(--border);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.reset.arm{border-color:var(--bad);color:var(--bad);background:var(--badSoft)}
.line{display:flex;overflow-x:auto;padding:10px 20px 14px;max-width:1140px;margin:0 auto;scrollbar-width:thin}
.stn{flex:1 0 100px;position:relative;text-align:center;background:none;border:0;padding:0 4px;cursor:pointer}
.stn:disabled{cursor:not-allowed;opacity:.5}
.stn::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:5px;border-radius:3px;background:var(--track);z-index:0}
.stn:first-child::before{display:none}
.stn.reached::before{background:var(--acc)}
.stn .c{position:relative;z-index:1;display:grid;place-items:center;width:31px;height:31px;margin:0 auto;border-radius:50%;background:var(--surface);border:4px solid var(--track);font-size:13px;font-weight:700;color:transparent;transition:transform .15s}
.stn.done .c{background:var(--acc);border-color:var(--acc);color:#fff}
.stn.cur .c{border-color:var(--acc);transform:scale(1.22);box-shadow:0 0 0 5px var(--accSoft)}
.stn .l{display:block;font-size:13.5px;font-weight:600;margin-top:6px;line-height:1.2}
.stn .m{display:block;font-size:12px;color:var(--muted)}
.stn.cur .l{color:var(--acc)}
main{max-width:900px;margin:0 auto;padding:28px 20px 60px}
main.wide{max-width:1060px}
.kicker{color:var(--muted);font-size:15px;margin:0 0 4px}
h1{font-size:clamp(32px,5vw,48px);line-height:1.08;margin:0 0 12px;letter-spacing:-.02em}
h2{font-size:clamp(27px,4vw,36px);line-height:1.12;margin:0 0 12px;letter-spacing:-.015em}
h3{font-size:21px;margin:36px 0 8px}
p{margin:0 0 14px;max-width:70ch}
.lead{font-size:19px}
.task{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin:12px 0 8px}
.ins{color:var(--muted);font-size:15.5px;margin-bottom:12px}
.box{border-left:5px solid var(--amber);background:var(--amberSoft);border-radius:0 12px 12px 0;padding:12px 16px;margin:16px 0}
.box.v{border-color:var(--acc);background:var(--accSoft)}
.box.g{border-color:var(--ok);background:var(--okSoft)}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.fig{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin:16px 0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption,.cap{font-size:14.5px;color:var(--muted);margin-top:8px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.primary{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:600;cursor:pointer;font-size:17px}
.primary:disabled{background:var(--track);color:var(--muted);cursor:not-allowed}
.ghost{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
.ghost:hover:not(:disabled){border-color:var(--acc)}
.ghost.on{border-color:var(--acc);background:var(--accSoft)}
.ghost:disabled{opacity:.45;cursor:not-allowed}
.checkbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.checkbar .hint{color:var(--muted);font-size:14.5px}
.score{font-weight:600;padding:8px 14px;border-radius:10px;background:var(--okSoft);color:var(--ok)}
.score.part{background:var(--amberSoft);color:var(--ink)}
.next{margin-top:36px;padding-top:22px;border-top:1px dashed var(--border);display:flex;justify-content:flex-end;gap:12px;align-items:center}
label.f{display:block;font-weight:600;margin:12px 0 4px}
.in{font:inherit;width:100%;max-width:420px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--ink)}
.in.good{border-color:var(--ok);background:var(--okSoft)}
.in.badin{border-color:var(--bad);background:var(--badSoft)}
.muted{color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border-radius:12px;background:var(--surface2);min-height:60px}
.pool .empty{color:var(--muted);font-size:14.5px;align-self:center}
.chipb{background:var(--surface);border:1.5px solid var(--border);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500}
.chipb:hover:not(:disabled){border-color:var(--acc)}
.chipb.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.chipb.ok{background:var(--okSoft);border-color:var(--ok);color:var(--ok)}
.chipb.bad{background:var(--badSoft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.chipb:disabled{cursor:default}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.bucket{border:2px dashed var(--acc);border-radius:12px;padding:12px;min-height:120px;cursor:pointer;background:var(--surface)}
.bucket.over{background:var(--accSoft)}
.bh{font-weight:700;margin-bottom:2px}
.bs{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.bc{display:flex;flex-wrap:wrap;gap:8px}
.seq{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:12px}
.slot .n{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accSoft);color:var(--acc)}
.slot.empty span:last-child{color:var(--muted);flex:1;border:1.5px dashed var(--border);border-radius:10px;padding:9px 14px}
.slotbtn{flex:1;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:9px 14px;cursor:pointer}
.slot.ok .slotbtn{border-color:var(--ok);background:var(--okSoft)}
.slot.bad .slotbtn{border-color:var(--bad);background:var(--badSoft)}
.slotbtn:disabled{cursor:default;color:var(--ink)}
.q{border:0;padding:0;margin:0 0 20px}
.q legend{font-weight:600;padding:0;margin-bottom:10px;display:flex;gap:10px}
.qn{flex:0 0 27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--accSoft);color:var(--acc);font-size:14px;font-weight:700;margin-top:1px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.opt{text-align:left;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--accSoft)}
.opt.ok{border-color:var(--ok);background:var(--okSoft)}
.opt.bad{border-color:var(--bad);background:var(--badSoft)}
.opt:disabled{cursor:default;color:var(--ink)}
.why{font-size:15px;margin:8px 0 0;padding:8px 12px;border-radius:8px;max-width:none}
.why.good{background:var(--okSoft)}
.why.miss{background:var(--badSoft)}
.iq{margin-bottom:18px}
.iqq{display:flex;gap:10px;font-weight:600;margin-bottom:8px}
.iqa{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-left:37px}
.iqa .in{max-width:220px;font-family:var(--mono)}
.unit{font-weight:600;color:var(--muted)}
.okm{color:var(--ok);font-weight:600}.badm{color:var(--bad);font-weight:600}
.guesses{display:grid;gap:8px;max-width:600px}
.result{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px}
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 16px}
.big .n{font-family:var(--head);font-size:56px;font-weight:700;line-height:1;color:var(--acc)}
.big .of{font-size:20px;color:var(--muted)}
.grade{margin-left:auto;text-align:center;border:2px solid var(--acc);border-radius:12px;padding:6px 14px}
.grade b{display:block;font-size:30px;line-height:1.1}
.grade span{font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15.5px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
.result td:last-child,.result th:last-child{text-align:right;white-space:nowrap}
textarea{width:100%;font-family:var(--mono);font-size:13.5px;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);color:var(--ink);resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:15.5px}
.fb.ok{background:var(--okSoft)}.fb.bad{background:var(--badSoft)}.fb.info{background:var(--accSoft)}
.goals{list-style:none;padding:0;margin:10px 0 0}
.goals li{padding:3px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.memo{margin:26px 0 8px;background:var(--surface);border:2px solid var(--acc);border-radius:14px;padding:14px 18px 10px}
.memo h3{margin:0 0 6px;font-family:var(--head);font-size:18px;color:var(--acc)}
.memo ul{margin:0;padding-left:20px}.memo li{margin:5px 0;font-size:16px;line-height:1.5}
.pix{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;background:#C9C4DA;padding:2px;border-radius:8px;max-width:420px;user-select:none;touch-action:none}
.px{aspect-ratio:1;border:0;padding:0;cursor:crosshair;border-radius:2px}
.palette{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.sw{display:flex;align-items:center;gap:6px;border:2px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 12px 4px 6px;cursor:pointer;font-weight:600}
.sw i{width:20px;height:20px;border-radius:50%;border:1px solid #9990B4;display:inline-block}
.sw.on{border-color:var(--acc);background:var(--accSoft)}
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,1fr);gap:18px;align-items:start}
@media (max-width:780px){.lab{grid-template-columns:1fr}}
.stat{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:15.5px}
.stat .code{font-family:var(--mono);font-size:13.5px;line-height:1.5;white-space:pre;overflow-x:auto;margin:8px 0;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.bars{display:grid;gap:8px;margin-top:8px}
.bar{display:grid;grid-template-columns:120px 1fr 90px;gap:10px;align-items:center;font-size:15px}
.bar .tr{height:18px;border-radius:9px;background:var(--surface);overflow:hidden;border:1px solid var(--border)}
.bar .tr i{display:block;height:100%;border-radius:9px;background:var(--acc)}
.bar .tr i.o{background:#9A93B5}
.bar b{text-align:right;font-family:var(--mono);font-size:14px}
.lyr{font-family:var(--mono);font-size:16px;line-height:2;background:var(--surface2);border-radius:12px;padding:12px 16px;white-space:pre-wrap}
.mk{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;margin:0 1px;vertical-align:middle}
.cands{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.dict{width:100%;max-width:420px;font-size:15px}
.dict td{padding:4px 8px}
.meter{height:14px;border-radius:7px;background:var(--surface2);overflow:hidden;border:1px solid var(--border);margin:6px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--ok))}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.jlab{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:780px){.jlab{grid-template-columns:1fr}}
.jlab img,.jlab canvas{width:100%;height:auto;border-radius:10px;display:block;border:1px solid var(--border)}
#zoom{image-rendering:pixelated}
.slider{width:100%;accent-color:var(--acc)}
.qval{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--acc)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15.5px;margin-top:10px}
.kv b{font-family:var(--mono)}
.formula{font-family:var(--mono);font-size:16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:inline-block;margin:4px 0}
.calc{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.calc .in{max-width:140px}

.theory{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin:14px 0}
.theory p{margin:8px 0}
/* ===== LENKA: spoločné pravidlá vzhľadu ===== */
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#D9EAFB}}
:root[data-theme="light"]{--bg:#D9EAFB}
.theory p{max-width:none}
.tsplit{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:22px;align-items:start}
.tsplit>div>.tfig,.tsplit>div>figure{margin:0}
@media (max-width:860px){.tsplit{grid-template-columns:1fr}}
.rtab{border-collapse:collapse;margin:10px 0;font-size:15.5px;width:100%}
.rtab th,.rtab td{border:1px solid var(--border);padding:5px 10px;text-align:left;vertical-align:top}
.rtab th{background:var(--surface2);font-size:14px}
.rtab.num td:first-child{white-space:nowrap;font-family:var(--mono);font-size:14.5px}
.vedel{background:#FFF8E1;color:#3A2E00;border:1px solid #F2D27A;border-left:5px solid #E0A800;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:15.5px;line-height:1.55}
.goals.g2{columns:2;column-gap:24px}.goals.g2 li{break-inside:avoid}
@media (max-width:640px){.goals.g2{columns:1}}
.tfigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.tfigs.one{grid-template-columns:minmax(0,560px);justify-content:center}
@media (max-width:760px){.tfigs{grid-template-columns:1fr}}
.tfig{margin:0;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 10px 8px;display:flex;flex-direction:column;gap:6px}
.tfig svg{width:100%;height:auto;display:block}
.tfig figcaption{font-size:14px;line-height:1.45;color:#3E3858;text-align:center;padding:0 4px}
.tsplit>div{min-width:0}
.rtab td{overflow-wrap:anywhere}
/* ===== HODINY: obrázky pri otázkach, opravovanie úloh, záverečný test so zámkom ===== */
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:16px;align-items:start}
.qpic{margin:0;background:#fff;border:1px solid var(--border);border-radius:12px;padding:6px}
.qpic svg{width:100%;height:auto;display:block}
@media (max-width:640px){.qrow{grid-template-columns:1fr}.qpic{max-width:260px}}
.tpic{margin:0 0 14px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px;max-width:520px}
.tpic svg{width:100%;height:auto;display:block}
.iq .qrow{padding-left:37px}.iq .qrow .iqa{padding-left:0}
@media (max-width:640px){.iq .qrow{padding-left:0}}
.checkbar .retry{margin-left:auto}
.lockban{background:#FFF8E1;border:1px solid #F2D27A;border-radius:12px;padding:10px 14px;margin:0 0 16px;font-weight:600;font-size:15.5px;color:#3A2E00}
.tstart{background:var(--surface);border:2px solid var(--acc);border-radius:16px;padding:20px 22px;margin:14px 0}
.tstart .warn{background:var(--badSoft);border-left:5px solid var(--bad);border-radius:0 10px 10px 0;padding:10px 14px;margin:12px 0;font-weight:600}
.confirm{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px}
.tq{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin:0 0 16px}
.tq .qh{display:flex;gap:10px;font-weight:600;margin-bottom:10px}
.tq .qh .pt{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.tq .tqfig{margin:0 auto 12px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px;max-width:560px}
.tq .tqfig svg{width:100%;height:auto;display:block}
.tq .fb{font-size:15px;margin:10px 0 0;padding:8px 12px;border-radius:8px}
.tq .fb.miss{background:var(--badSoft)}
.tq .buckets{margin-top:10px}
.hz{fill:rgba(47,91,234,.001);stroke:transparent;stroke-width:3;cursor:pointer;transition:fill .12s}
.hz:hover,.hz:focus{fill:rgba(47,91,234,.16);stroke:#2F5BEA;outline:none}
.hz.hsel{fill:rgba(47,91,234,.30);stroke:#2F5BEA;stroke-width:4}
.hz.hok{fill:rgba(18,128,90,.28);stroke:#12805A;stroke-width:4}
.hz.hbad{fill:rgba(192,57,43,.28);stroke:#C0392B;stroke-width:4}
.hz.hmiss{fill:rgba(18,128,90,.10);stroke:#12805A;stroke-width:3;stroke-dasharray:7 5}
.done .hz{cursor:default}
.mtt{border-collapse:collapse;width:100%;font-size:15.5px}
.mtt td{padding:7px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.mtt td:first-child{font-weight:700;width:34%}
.mtt select{font:inherit;width:100%;max-width:420px;padding:8px 10px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--ink)}
.mtt select.good{border-color:var(--ok);background:var(--okSoft)}.mtt select.badsel{border-color:var(--bad);background:var(--badSoft)}
@media (max-width:560px){.mtt td{display:block;width:100%!important;border:0;padding:3px 0}.mtt tr{display:block;padding:8px 0;border-bottom:1px solid var(--border)}}
.bslots{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface2);border:1.5px solid var(--border);border-radius:14px;padding:8px 14px;min-height:48px;margin-bottom:10px}
.bslots.mono{font-family:var(--mono)}
.bslots .bsl{border:1.5px dashed var(--border);border-radius:8px;padding:5px 10px;color:var(--muted);min-width:70px;text-align:center;font-size:14.5px}
.bslots button.bsl{border-style:solid;color:var(--ink);background:var(--surface);cursor:pointer;font:inherit;font-size:15.5px}

function pixelSVG(rows, hl) {

function rleStats() {

}

let SCENE = null, PNGSIZE = null, JURL = null;
function drawScene() {
  const c = document.createElement("canvas"); c.width = 320; c.height = 200; const x = c.getContext("2d");
  const g = x.createLinearGradient(0, 0, 0, 120); g.addColorStop(0, "#5DB4EE"); g.addColorStop(1, "#DDF1FB"); x.fillStyle = g; x.fillRect(0, 0, 320, 200);
  x.fillStyle = "#FFD23F"; x.beginPath(); x.arc(262, 42, 22, 0, 7); x.fill();

  x.fillStyle = "#3E8E3A"; x.beginPath(); x.moveTo(0, 170); x.quadraticCurveTo(120, 150, 320, 180); x.lineTo(320, 200); x.lineTo(0, 200); x.fill();
  x.fillStyle = "#F4E3C3"; x.fillRect(140, 112, 70, 52); x.fillStyle = "#C8452F"; x.beginPath(); x.moveTo(132, 114); x.lineTo(175, 82); x.lineTo(218, 114); x.fill();
  x.fillStyle = "#6B4226"; x.fillRect(150, 134, 16, 30); x.fillStyle = "#2B6CB0"; x.fillRect(180, 124, 22, 20);
  x.strokeStyle = "#FFFFFF"; x.lineWidth = 2; x.beginPath(); x.moveTo(191, 124); x.lineTo(191, 144); x.moveTo(180, 134); x.lineTo(202, 134); x.stroke();
  x.strokeStyle = "#FFFFFF"; x.lineWidth = 1; for (let i = 0; i < 16; i++) { x.beginPath(); x.moveTo(20 + i * 6, 170); x.lineTo(20 + i * 6, 186); x.stroke(); } x.beginPath(); x.moveTo(18, 174); x.lineTo(114, 174); x.stroke();
  x.fillStyle = "#1A1530"; x.font = "bold 13px Rubik, sans-serif"; x.fillText("Ahoj, Tercia!", 222, 188);

}
function updateJpeg() {
  const q = +S.q; const qv = document.getElementById("qv"); if (qv) qv.textContent = q;
  if (!SCENE) SCENE = drawScene();
  if (PNGSIZE === null) SCENE.toBlob(b => { PNGSIZE = b ? b.size : 0; updateJpeg(); }, "image/png");
  SCENE.toBlob(b => {
    if (!b) return; const img = document.getElementById("jimg"); if (!img) return;
    if (JURL) URL.revokeObjectURL(JURL); JURL = URL.createObjectURL(b); img.src = JURL;
    img.onload = () => { const z = document.getElementById("zoom"); if (!z) return; const zx = z.getContext("2d"); zx.imageSmoothingEnabled = false; zx.drawImage(img, 130, 78, 80, 54, 0, 0, 320, 216); };
    const kb = n => (n / 1024).toFixed(1).replace(".", ",") + " kB";
    document.getElementById("jsize").textContent = kb(b.size);
    if (PNGSIZE) { document.getElementById("psize").textContent = kb(PNGSIZE); document.getElementById("jsave").textContent = Math.max(0, Math.round((1 - b.size / PNGSIZE) * 100)) + " %"; }

}

function calcText(a, b, ok) {
  if (!ok) return `<span class="muted">Zadaj dve kladné čísla.</span>`;
  const r = a / b, s = (1 - b / a) * 100, f = n => (Math.round(n * 10) / 10).toString().replace(".", ",");
  return `Pomer: <b>${f(r)} : 1</b> · Úspora: <b>${f(s)} %</b>${b > a ? ` <span style="color:var(--bad)">(archív je väčší ako originál!)</span>` : ""}`;
}

/* ---------- hooks ---------- */
let PAINTING = false;
function paintCell(el) {
  const [y, x] = el.dataset.px.split(",").map(Number);
  const r = S.paint[y]; if (r[x] === S.brush) return;
  S.paint[y] = r.slice(0, x) + S.brush + r.slice(x + 1); el.style.background = COL[S.brush];
  document.getElementById("rlestats").innerHTML = rleStats(); save();
}
document.addEventListener("mousedown", e => { const c = e.target.closest && e.target.closest("[data-px]"); if (c) { PAINTING = true; paintCell(c); e.preventDefault(); } });
document.addEventListener("mouseover", e => { if (!PAINTING) return; const c = e.target.closest && e.target.closest("[data-px]"); if (c) paintCell(c); });
document.addEventListener("mouseup", () => { PAINTING = false; });

const LABT = { rep: Array(200).fill("ha ").join(""), sk: "Komprimácia zmenšuje veľkosť súboru tak, že nahradí opakujúce sa časti kratším zápisom. Texty v slovenčine obsahujú veľa opakujúcich sa slov a slabík, preto sa dajú dobre skomprimovať. Fotky a hudba sa komprimujú so stratou, texty a programy bez straty." };
function rndText(n) { const c = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!#%&*+-?@"; let s = ""; for (let i = 0; i < n; i++) s += c[Math.floor(Math.random() * c.length)]; return s; }
function labOut() { const r = S.lab.r; if (!r) return `<p class="muted">Výsledok sa zobrazí po stlačení Komprimovať.</p>`; return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;text-align:center">${[["Pôvodne", r.a + " B"], ["Po komprimácii", r.b + " B"], ["Pomer", r.p + " %"]].map(([a, b]) => `<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px">${a}<b style="display:block;font-size:20px;font-family:var(--mono)">${b}</b></div>`).join("")}</div>`; }
function labGoals() { const g = S.lab.g || {}; return [[g.low, "skomprimuj text aspoň na 20 % (dlhý text s opakovaním)"], [g.high, "nájdi text, ktorý zostane nad 80 % (aspoň 50 znakov)"], [g.mid, "skomprimuj slovenský text aspoň 100 znakov dlhý"]]; }
function labGoalsHTML() { return labGoals().map(([o, t]) => `<li>${o ? "✅" : "⬜"} ${t}</li>`).join(""); }
async function gzSize(t) { const bytes = new TextEncoder().encode(t); if (typeof CompressionStream === "undefined") return null; const st = new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip")); const buf = await new Response(st).arrayBuffer(); return [bytes.length, buf.byteLength]; }
async function labRun() { const t = S.lab.t; if (!t) return; const r = await gzSize(t); if (!r) { document.getElementById("labout").innerHTML = `<div class="fb bad">Tento prehliadač nepodporuje kompresiu. Skús Chrome, Edge alebo Firefox.</div>`; return; } const p = Math.round(r[1] / r[0] * 1000) / 10; S.lab.r = { a: r[0], b: r[1], p: String(p).replace(".", ",") }; S.lab.g = S.lab.g || {};
  if (r[0] >= 50 && p <= 20) S.lab.g.low = true; if (r[0] >= 50 && p >= 80) S.lab.g.high = true; if (t.length >= 100 && /[áäčďéíĺľňóôŕšťúýž]/i.test(t) && p < 100) S.lab.g.mid = true;
  const n = Object.values(S.lab.g).filter(Boolean).length; if (n && (!S.t.g_lab || S.t.g_lab.score < n)) award("g_lab", n); save(); document.getElementById("labout").innerHTML = labOut(); document.getElementById("labgl").innerHTML = labGoalsHTML(); }

function CUSTOM_CLICK(e) {
  { const el0 = e.target.closest && e.target.closest("[data-lab]"); if (el0) { const k = el0.dataset.lab; if (k === "go") { labRun(); return true; } S.lab.t = k === "rnd" ? rndText(200) : LABT[k]; save(); const ta = document.getElementById("labt"); if (ta) ta.value = S.lab.t; labRun(); return true; } }
  const el = e.target.closest("button"); if (!el) return false; const ds = el.dataset;
  if (ds.px) return true;
  if (ds.brush) { S.brush = ds.brush; save(); render(false); return true; }
  if (ds.paint) {
    const k = ds.paint, L = Object.keys(COL);
    if (k === "boat") S.paint = BOAT.slice();
    if (k === "one") S.paint = Array(9).fill("M".repeat(12));
    if (k === "stripes") S.paint = Array.from({ length: 9 }, (_, y) => (y % 2 ? "Z" : "M").repeat(12));
    if (k === "noise") S.paint = Array.from({ length: 9 }, () => Array.from({ length: 12 }, () => L[Math.floor(Math.random() * L.length)]).join(""));
    save(); render(false); return true;
  }
  if (ds.dw !== undefined) { if (S.t.dict) return true; const w = ds.dw, i = S.dict.indexOf(w); if (i >= 0) S.dict.splice(i, 1); else if (S.dict.length < 3) S.dict.push(w); save(); render(false); return true; }
  if (ds.dictdone !== undefined) { const r = dictCalc(S.dict); S.dictSave = Math.max(0, r.save); award("dict", r.save >= 35 ? 2 : r.save >= 20 ? 1 : 0); save(); render(false); return true; }
  if (ds.gz) { S.gzKey = ds.gz; if (ds.gz === "nahodne") { S.gzRand = randomText(bytes(GZ.text.t)); S.gzText = S.gzRand; } else S.gzText = GZ[ds.gz].t; save(); render(false); return true; }
  return false;
}
function CUSTOM_INPUT(e) {
  if (e.target.id === "labt") { S.lab.t = e.target.value; save(); return true; }
  const t = e.target;
  if (t.id === "q") { S.q = t.value; save(); updateJpeg(); return true; }
  if (t.id === "gztext") { S.gzText = t.value; save(); updateGz(); return true; }
  if (t.dataset.calc) { S.calc[t.dataset.calc] = t.value; save(); const sv = document.getElementById("c" + t.dataset.calc + "v"); if (sv) sv.textContent = t.value; const a = parseNum(S.calc.a), b = parseNum(S.calc.b); document.getElementById("cres").innerHTML = calcText(a, b, a > 0 && b > 0); return true; }
  return false;
}
function AFTER_RENDER(id) { if (id === "strata") updateJpeg(); if (id === "slovnik") updateGz(); }
GZ.nahodne.t = "";

/* ===== HODINY: kreslenie obrázkov k otázkam (neprezrádzajú odpoveď) ===== */
const HK = (() => {
  const FF = `font-family="Rubik,Segoe UI,Arial,sans-serif"`, MONO = `font-family="Consolas,JetBrains Mono,monospace"`;
  const SV = (w, h, body, label) => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}" ${FF}>${body}</svg>`;
  const TX = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.fs || 12}" ${o.a ? `text-anchor="${o.a}"` : ""} fill="${o.c || "#16213A"}" font-weight="${o.b ? 700 : 400}"${o.mono ? ` ${MONO}` : ""}>${s}</text>`;
  const EM = (x, y, e, fs) => `<text x="${x}" y="${y}" text-anchor="middle" font-size="${fs || 26}">${e}</text>`;
  const QM = (x, y, r) => { r = r || 14; return `<circle cx="${x}" cy="${y}" r="${r}" fill="#F0B429"><animate attributeName="r" values="${r};${r + 2};${r}" dur="1.6s" repeatCount="indefinite"/></circle>${TX(x, y + r * 0.42, "?", { a: "middle", b: 1, fs: r * 1.2, c: "#fff" })}`; };
  const QS = (body, label) => SV(240, 150, `<rect width="240" height="150" rx="10" fill="#F5F7FA"/>` + body, label);
  const BAN = (body, label) => SV(480, 120, `<rect width="480" height="120" rx="10" fill="#F5F7FA"/>` + body, label);
  const XS = (body, label, h) => SV(520, h || 120, `<rect width="520" height="${h || 120}" rx="10" fill="#F5F7FA"/>` + body, label);
  const bob = (inner, i, d) => `<g>${inner}<animateTransform attributeName="transform" type="translate" values="0 0;0 ${-(d || 4)};0 0" dur="2s" begin="${(i || 0) * 0.4}s" repeatCount="indefinite"/></g>`;
  const blink = (x, y, h, c) => `<rect x="${x}" y="${y}" width="2" height="${h || 16}" fill="${c || "#16213A"}"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>`;
  const dot = (path, c, dur, begin) => `<circle r="5" fill="${c || "#2F5BEA"}"><animateMotion dur="${dur || 2.4}s" ${begin ? `begin="-${begin}s"` : ""} repeatCount="indefinite" path="${path}"/></circle>`;
  const fly = (path, e, dur, fs, begin) => `<text font-size="${fs || 20}" text-anchor="middle">${e}<animateMotion dur="${dur || 2.4}s" ${begin ? `begin="-${begin}s"` : ""} repeatCount="indefinite" path="${path}"/></text>`;
  const dash = (x1, y1, x2, y2, c, rev) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c || "#9AA7C4"}" stroke-width="3" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" values="${rev ? "0;22" : "22;0"}" dur="1s" repeatCount="indefinite"/></line>`;
  const pulse = (inner, cx, cy) => `<g>${inner}<animateTransform attributeName="transform" type="scale" additive="sum" values="1;1.06;1" dur="1.8s" repeatCount="indefinite"/></g>`;
  const pc = (x, y, sc = 1, scr) => `<g transform="translate(${x} ${y}) scale(${sc})"><rect x="0" y="0" width="64" height="42" rx="4" fill="#16213A"/><rect x="4" y="4" width="56" height="34" rx="2" fill="${scr || "#D5DFFB"}"/><rect x="26" y="42" width="12" height="8" fill="#566381"/><rect x="16" y="50" width="32" height="5" rx="2" fill="#566381"/></g>`;

  const phone = (x, y, sc = 1, inner, scr) => `<g transform="translate(${x} ${y}) scale(${sc})"><rect x="0" y="0" width="46" height="84" rx="8" fill="#16213A"/><rect x="4" y="9" width="38" height="64" rx="2" fill="${scr || "#fff"}"/><circle cx="23" cy="78" r="2.5" fill="#566381"/>${inner || ""}</g>`;
  const server = (x, y, sc = 1) => `<g transform="translate(${x} ${y}) scale(${sc})"><rect x="0" y="0" width="50" height="66" rx="5" fill="#16213A"/>${[0, 1, 2].map(i => `<rect x="6" y="${7 + i * 19}" width="38" height="13" rx="2" fill="#34425F"/><circle cx="38" cy="${13.5 + i * 19}" r="2.5" fill="#3CCB8E"/>`).join("")}</g>`;
  const env = (x, y, sc = 1, c) => `<g transform="translate(${x} ${y}) scale(${sc})"><rect x="0" y="0" width="48" height="32" rx="4" fill="#fff" stroke="${c || "#2F5BEA"}" stroke-width="2"/><path d="M2 3 L24 19 L46 3" fill="none" stroke="${c || "#2F5BEA"}" stroke-width="2"/></g>`;
  const win = (x, y, w, h, url, lock) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="#fff" stroke="#C9D1DF"/><rect x="${x}" y="${y}" width="${w}" height="26" rx="8" fill="#E9EDF3"/><rect x="${x}" y="${y + 18}" width="${w}" height="8" fill="#E9EDF3"/><rect x="${x + 8}" y="${y + 5}" width="${w - 16}" height="16" rx="8" fill="#fff"/>${lock ? TX(x + 14, y + 17, "🔒", { fs: 9 }) : ""}${url ? TX(x + (lock ? 27 : 15), y + 17, url, { fs: 10.5 }) : ""}`;

  const shield = (x, y, sc = 1, c) => `<g transform="translate(${x} ${y}) scale(${sc})"><path d="M20 0 L40 8 V24 C40 38 30 46 20 50 C10 46 0 38 0 24 V8z" fill="${c || "#12805A"}"/><path d="M11 25 L18 32 L30 18" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g>`;
  return { FF, MONO, SV, TX, EM, QM, QS, BAN, XS, bob, blink, dot, fly, dash, pulse, pc, laptop, phone, server, env, win, lines, bubble, key, field, mailwin, avatar, shield };
})();

  if (q.kind === "match") {
    const R = ord("test:" + q.id + ":r", q.rows.map((_, i) => i)), O = ord("test:" + q.id + ":o", q.rows.map((_, i) => i)), v = a || {};
    return `<table class="mtt"><tbody>${R.map(i => { const ok = done && +v[i] === i;
      return `<tr><td>${q.rows[i][0]}</td><td><select data-tm="${q.id}|${i}" class="${done ? (ok ? "good" : "badsel") : ""}" ${done ? "disabled" : ""} aria-label="Priradenie k: ${q.rows[i][0].replace(/<[^>]+>/g, "")}"><option value="">vyber…</option>${O.map(k => `<option value="${k}" ${String(v[i]) === String(k) ? "selected" : ""}>${q.rows[k][1]}</option>`).join("")}</select>${done && !ok ? `<div style="font-size:14.5px;margin-top:3px;color:var(--bad)">správne: ${q.rows[i][1]}</div>` : ""}</td></tr>`; }).join("")}</tbody></table>`; }
  if (q.kind === "hot") return `<p class="muted" style="margin:0;font-size:15px">${a ? `Vybral si: <b>${q.names[a]}</b>` : "Zatiaľ si nič nevybral. Klikni na miesto v obrázku."}</p>${done && !tOk(q) ? `<p class="fb miss">Správne: ${q.names[q.a]}</p>` : ""}`;
  if (q.kind === "sort") {
    const P = ord("test:" + q.id, q.items.map((_, i) => i)), v = a || {};
    let h = `<div class="buckets">${q.groups.map((g, gi) => `<div class="bucket" data-tg="${q.id}|${gi}"><div class="bh">${g}</div><div class="bc">${P.filter(i => v[i] === gi).map(i => done
      ? `<span class="chipb ${q.items[i][1] === gi ? "ok" : "bad"}">${q.items[i][0]}</span>` : `<button class="chipb" data-tus="${q.id}|${i}" title="Kliknutím vrátiš kartičku späť">${q.items[i][0]}</button>`).join("")}</div></div>`).join("")}</div>`;
    if (!done) { const rest = P.filter(i => v[i] === undefined); h = `<div class="pool">${rest.length ? rest.map(i => `<button class="chipb ${TSEL && TSEL.q === q.id && TSEL.i === i ? "sel" : ""}" data-tpk="${q.id}|${i}">${q.items[i][0]}</button>`).join("") : '<span class="empty">Všetko je roztriedené. Kartičku vrátiš kliknutím na ňu v skupine.</span>'}</div>` + h; }
    return h + (done && !tOk(q) ? `<p class="fb miss">Správne: ${q.groups.map((g, gi) => `${g}: ${q.items.filter(x => x[1] === gi).map(x => x[0]).join(", ")}`).join(" · ")}</p>` : ""); }
  if (q.kind === "build") {
    const seq = a || [], P = ord("test:" + q.id, q.pieces.map((_, i) => i)), m = q.mono ? " mono" : "";
    let h = `<div class="bslots${m}">${q.a.map((_, i) => { const k = seq[i]; return k === undefined ? `<span class="bsl">${(q.slots && q.slots[i]) || "…"}</span>`
      : `<button class="bsl ${done ? (q.pieces[k] === q.a[i] ? "ok" : "bad") : ""}" data-tbu="${q.id}|${i}" ${done ? "disabled" : ""}>${q.pieces[k]}</button>`; }).join(q.join || "")}</div>`;
    if (!done) h += `<div class="pool">${P.filter(k => !seq.includes(k)).map(k => `<button class="chipb${m}" data-tb="${q.id}|${k}" ${seq.length >= q.a.length ? "disabled" : ""}>${q.pieces[k]}</button>`).join("")}</div>`;
    return h + (done && !tOk(q) ? `<p class="fb miss">Správne: ${q.a.join(q.mono ? "" : " ")}</p>` : ""); }
  return ""; }
function testHTML(T) {
  const done = S.t.test;
  return qOrder(T).map((q, qi) => {
    const img = q.kind === "hot" ? HOT[q.img](q, done) : QIMG0()[q.img];
    return `<section class="tq"><div class="qh"><span class="qn">${qi + 1}</span><span>${q.q}</span><span class="pt">${done ? (tOk(q) ? "✅ 1 / 1" : "❌ 0 / 1") : "1 bod"}</span></div>
      ${img ? `<figure class="tqfig ${done ? "done" : ""}" ${q.kind === "hot" ? `data-hq="${q.id}"` : ""}>${img}</figure>` : ""}${tBody(q, done)}</section>`;
  }).join("") + (done ? `<div class="checkbar"><span class="score ${done.score < done.max ? "part" : ""}">Test: ${done.score} zo ${done.max} bodov</span></div>`
    : `<div class="checkbar"><button class="primary" data-check="test" ${T.qs.every(tAnswered) ? "" : "disabled"}>Skontrolovať test</button><span class="hint">${T.qs.every(tAnswered) ? "Pozor, test sa dá skontrolovať iba raz." : `Odpovedz na všetky otázky (hotovo ${T.qs.filter(tAnswered).length} zo ${T.qs.length}).`}</span></div>`);
}
const HZ = (q, done) => id => { const a = TA()[q.id]; let c = "hz"; if (done) c += id === q.a ? (a === id ? " hok" : " hmiss") : a === id ? " hbad" : ""; else if (a === id) c += " hsel"; return c; };

function guessBox() {
  if (S.guess === null) return "";
  const ok = S.guess === START.ok;
  return `<div class="box ${ok ? "g" : ""}"><p>Na začiatku si tipoval: <b>„${START.guesses[S.guess]}“</b>. ${ok ? START.yes : START.no}</p></div>`;
}
if (!VIEWS.start) VIEWS.start = function () {
  return `<p class="kicker">${START.kicker}</p><h1>${LESSON}</h1>${START.hero || ""}<p class="lead">${START.lead}</p>
  <div class="task"><label class="f" for="nm">Meno a priezvisko</label><input class="in" type="text" id="nm" data-field="name" value="${esc(S.name)}" autocomplete="name" placeholder="napr. Jana Nováková">
  <label class="f" for="cl">Trieda</label><input class="in" type="text" id="cl" data-field="cls" value="${esc(S.cls)}"></div>
  <h3>Než začneš: tvoj tip</h3><p>${START.guessQ} ${START.guessNote}</p>
  <div class="guesses">${START.guesses.map((g, i) => `<button class="opt ${S.guess === i ? "sel" : ""}" data-guess="${i}" aria-pressed="${S.guess === i}">${g}</button>`).join("")}</div>
  <div class="next"><span class="muted" id="starthint" style="margin-right:auto">${S.name.trim().length < 3 ? "Napíš svoje meno a vyber tip." : S.guess === null ? "Vyber svoj tip." : ""}</span>
  <button class="primary" data-start ${S.name.trim().length < 3 || S.guess === null ? "disabled" : ""}>${S.started ? "Pokračovať" : "Začať hodinu"}</button></div>`;
};
VIEWS.test = function () {
  if (!S.testLocked) return head() + `<h2>Záverečný test</h2>
    <div class="tstart">
      <p style="margin-top:0">Test má <b>${TASKS.test.qs.length} otázok</b>, za každú dostaneš <b>1 bod</b>. ${typeof TEST_INTRO !== "undefined" ? TEST_INTRO : "Budeš zoraďovať, priraďovať, klikať do obrázka a triediť."} Test skontroluješ iba raz.</p>
      <div class="warn">⚠️ Po spustení sa už nevrátiš do zastávok. Úlohy, ktoré v zastávkach nemáš vyriešené, budú za 0 bodov.</div>
      ${S.tconfirm ? `<p style="margin:0"><b>Naozaj chceš spustiť záverečný test?</b></p><div class="confirm"><button class="primary" data-tyes>Áno, spustiť test</button><button class="ghost" data-tno>Späť</button></div>`
        : `<button class="primary" data-tstart>▶ Spustiť záverečný test</button>`}
    </div>`;
  return head() + `<h2>Záverečný test</h2>
    <p>${S.t.test ? "Test je skontrolovaný. Pozri si, kde si urobil chybu, a potom si zobraz výsledok." : "Odpovedz na všetky otázky a potom test skontroluj. Skontrolovať sa dá iba raz."}</p>
    ${taskHTML("test")}` + (S.t.test ? `<div class="next"><button class="primary" data-go="${STEPS.length - 1}">Zobraziť výsledok</button></div>` : "");
};
if (!VIEWS.vysledok) VIEWS.vysledok = function () {
  if (!S.t.test) return `<h2>Výsledok</h2><p>Výsledok sa zobrazí, keď dokončíš záverečný test.</p><button class="primary" data-go="${STEPS.length - 2}">Prejsť na záverečný test</button>`;
  const pct = Math.round(total() / MAX * 100);
  const grade = pct >= 90 ? 1 : pct >= 75 ? 2 : pct >= 50 ? 3 : pct >= 30 ? 4 : 5;
  const when = new Date(S.finished || Date.now()).toLocaleString("sk-SK", { day: "numeric", month: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" });
  const rows = STEPS.filter(s => STEP_TASKS[s.id] && STEP_TASKS[s.id].length).map(s => { const ts = STEP_TASKS[s.id]; return { title: s.title, sc: ts.reduce((a, t) => a + (S.t[t] ? S.t[t].score : 0), 0), mx: ts.reduce((a, t) => a + maxOf(TASKS[t]), 0), done: ts.every(t => S.t[t]) }; });
  const detail = rows.map(r => `${r.title} ${r.done ? r.sc + "/" + r.mx : "nedokončené"}`).join("; ");
  const formBtn = RESULTS_FORM.url ? sendResults(detail) : "";
  return `<p class="kicker">Cieľ</p><h2>Tvoj výsledok</h2>
  <div class="result"><p style="margin:0"><b>${esc(S.name.trim())}</b>, ${esc(S.cls.trim())} <span class="muted">· ${when}</span></p>
    <div class="big"><span class="n">${total()}</span><span class="of">z ${MAX} bodov (${pct} %)</span><div class="grade"><b>${grade}</b><span>orientačná známka</span></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Zastávka</th><th>Body</th></tr></thead><tbody>${rows.map(r => `<tr><td>${r.title}</td><td>${r.done ? `${r.sc} / ${r.mx}` : '<span class="muted">nedokončené</span>'}</td></tr>`).join("")}</tbody></table></div></div>
  <p class="muted" style="font-size:15px">Zastávky si teraz môžeš znova prezrieť (iba na čítanie). Uvidíš v nich aj správne odpovede.</p>
  <div class="row" aria-live="polite">${formBtn}</div>
  <div class="box" style="margin-top:16px">${S.rconfirm ? `<p style="margin:0"><b>Naozaj začať odznova?</b> Body aj odpovede sa vymažú.</p><div class="confirm"><button class="primary" data-ryes>Áno, začať odznova</button><button class="ghost" data-rno>Späť</button></div>`
    : `<p style="margin:0 0 10px">Chceš si hodinu prejsť ešte raz? Začneš od Štartu s novými úlohami a nový výsledok sa tiež odošle učiteľovi.</p><button class="ghost" data-rreset>↺ Začať odznova</button>`}</div>`;
};

const main = document.getElementById("main");
function render(toTop) {
  const y = window.scrollY;
  renderTop();
  const id = STEPS[S.cur].id, ro = RO();
  main.className = ((typeof WIDE !== "undefined" && WIDE[id]) ? "wide" : "") + (ro ? " ro" : "");
  main.innerHTML = (ro ? `<div class="lockban">🔒 Záverečný test ${S.t.test ? "je hotový" : "už beží"}. Zastávku si môžeš iba prezrieť, nič v nej nezmeníš.</div>` : "") + VIEWS[id]();
  if (typeof AFTER_RENDER === "function") AFTER_RENDER(id); if (typeof typo === "function") typo(main);
  if (ro) main.querySelectorAll("input,textarea,select,button:not([data-go])").forEach(x => { x.disabled = true; });
  if (toTop) { window.scrollTo(0, 0); const c = document.querySelector(".stn.cur"); if (c) c.scrollIntoView({ block: "nearest", inline: "center" }); }
  else window.scrollTo(0, y);
}
function go(i) {
  if (!S.started && i > 0) return;
  const testI = STEPS.findIndex(x => x.id === "test");
  if (S.testLocked && !S.t.test && i < testI) return;
  if (STEPS[i].id === "vysledok" && !S.t.test) return;
  S.cur = i; SEL = null; TSEL = null; S.tconfirm = false; save(); render(true);
}
function placeSel(t, b) { if (!SEL || SEL.t !== t || S.t[t] || RO()) return; const d = S.d[t] = S.d[t] || {}; if (b) d[SEL.i] = b; else delete d[SEL.i]; SEL = null; save(); render(false); }

/* po spustení testu: v zastávkach sa nedá nič meniť (zachytí aj vlastné úlohy hodiny) */
["click", "keydown", "input", "change", "dragstart"].forEach(ev => window.addEventListener(ev, e => {
  if (!RO() || !e.target || !e.target.closest) return;
  if (!main.contains(e.target) || e.target.closest("[data-go]")) return;
  if (ev === "keydown" && !["Enter", " "].includes(e.key) && !e.target.matches("input,textarea")) return;
  e.stopPropagation(); if (ev !== "keydown" || e.target.matches("input,textarea")) e.preventDefault();
}, true));

let resetArmed = null;
document.addEventListener("click", e => {
  const hz = e.target.closest && e.target.closest(".hz");
  if (hz) { const f = hz.closest("[data-hq]"); if (f && STEPS[S.cur].id === "test" && S.testLocked && !S.t.test) { TA()[f.dataset.hq] = hz.dataset.z; save(); render(false); } return; }
  if (typeof CUSTOM_CLICK === "function" && !S.testLocked && CUSTOM_CLICK(e) === true) return;
  const el = e.target.closest("button,[data-bucket],[data-tg]"); if (!el) return;
  const ds = el.dataset;
  if (ds.go !== undefined) return go(+ds.go);
  if (ds.rreset !== undefined) { S.rconfirm = true; save(); return render(false); }
  if (ds.rno !== undefined) { S.rconfirm = false; save(); return render(false); }
  if (ds.ryes !== undefined) { const keep = { cls: S.cls }; try { localStorage.removeItem(KEY); } catch (e) {} S = fresh(); S.cls = keep.cls; SEL = null; if (typeof TSEL !== "undefined") TSEL = null; save(); window.scrollTo(0, 0); return render(true); }
  if (ds.reset !== undefined) {
    if (S.testLocked) return;
    if (!resetArmed) { el.classList.add("arm"); el.textContent = "Naozaj? Klikni znova"; resetArmed = setTimeout(() => { resetArmed = null; renderTop(); }, 3000); return; }
    clearTimeout(resetArmed); resetArmed = null; const keep = { name: S.name, cls: S.cls }; S = fresh(); S.name = keep.name; S.cls = keep.cls; SEL = null; save(); return render(true);
  }
  if (ds.start !== undefined) { if (!S.started) S.started = Date.now(); return go(1); }
  if (ds.guess !== undefined) { if (S.testLocked) return; S.guess = +ds.guess; save(); return render(false); }
  if (ds.tstart !== undefined) { S.tconfirm = true; save(); return render(false); }
  if (ds.tno !== undefined) { S.tconfirm = false; save(); return render(false); }
  if (ds.tyes !== undefined) {
    S.testLocked = true; S.tconfirm = false; S.testStarted = Date.now();
    Object.keys(STEP_TASKS).filter(k => k !== "test").forEach(k => STEP_TASKS[k].forEach(t => { if (!S.t[t]) S.t[t] = { score: 0, max: maxOf(TASKS[t]), skip: true }; }));
    save(); return render(true);
  }
  if (STEPS[S.cur].id === "test") {
    if (!S.testLocked || S.t.test) { if (ds.check !== "test") return; }
    else {
      const A = TA(), Q = id => TASKS.test.qs.find(x => x.id === id);
      if (ds.tord) { const [q, k] = ds.tord.split("|"); const s = A[q] = A[q] || []; if (!s.includes(+k)) s.push(+k); save(); return render(false); }
      if (ds.tun) { const [q, k] = ds.tun.split("|"); A[q] = (A[q] || []).filter(x => x !== +k); save(); return render(false); }
      if (ds.tpk) { const [q, i] = ds.tpk.split("|"); TSEL = TSEL && TSEL.q === q && TSEL.i === +i ? null : { q, i: +i }; return render(false); }
      if (ds.tus) { const [q, i] = ds.tus.split("|");
        if (TSEL && TSEL.q === q && A[q]) { A[q][TSEL.i] = A[q][i]; TSEL = null; save(); return render(false); }
        if (A[q]) delete A[q][i]; save(); return render(false); }
      if (ds.tg) { const [q, g] = ds.tg.split("|"); if (!TSEL || TSEL.q !== q) return; (A[q] = A[q] || {})[TSEL.i] = +g; TSEL = null; save(); return render(false); }
      if (ds.tb) { const [q, k] = ds.tb.split("|"); const s = A[q] = A[q] || []; if (s.length < Q(q).a.length && !s.includes(+k)) s.push(+k); save(); return render(false); }
      if (ds.tbu) { const [q, i] = ds.tbu.split("|"); A[q] = (A[q] || []).filter((_, j) => j !== +i); save(); return render(false); }
    }
  }
  if (ds.check) { if (ds.check === "test" && (!S.testLocked || S.t.test || !TASKS.test.qs.every(tAnswered))) return; return check(ds.check); }
  if (S.testLocked) return;
  if (ds.mc) { const [t, q, i] = ds.mc.split("|"); if (S.t[t]) return; (S.d[t] = S.d[t] || {})[q] = +i; save(); return render(false); }
  if (ds.place) { const [t, id] = ds.place.split("|"); if (S.t[t]) return; const s = S.d[t] = S.d[t] || []; if (!s.includes(id)) s.push(id); save(); return render(false); }
  if (ds.unplace) { const [t, id] = ds.unplace.split("|"); if (S.t[t]) return; S.d[t] = (S.d[t] || []).filter(x => x !== id); save(); return render(false); }
  if (ds.pick) { const [t, id] = ds.pick.split("|"); if (S.t[t]) return; SEL = SEL && SEL.t === t && SEL.i === id ? null : { t, i: id }; return render(false); }
  if (ds.bucket !== undefined) { const [t, b] = ds.bucket.split("|"); return placeSel(t, b); }
});
document.addEventListener("change", e => {
  const m = e.target.dataset && e.target.dataset.tm; if (!m || S.t.test || !S.testLocked) return;
  const [q, i] = m.split("|"); (TA()[q] = TA()[q] || {})[i] = e.target.value; save(); render(false);
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("hz")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });
document.addEventListener("input", e => {
  if (typeof CUSTOM_INPUT === "function" && !S.testLocked && CUSTOM_INPUT(e) === true) return;
  const t = e.target;
  if (t.dataset.inp) {
    if (S.testLocked) return;
    const [tid, qid] = t.dataset.inp.split("|"); (S.d[tid] = S.d[tid] || {})[qid] = t.value; save();
    const b = document.querySelector(`[data-check="${tid}"]`), h = document.querySelector(`[data-hint="${tid}"]`), r = inputReady(TASKS[tid]);
    if (b) b.disabled = !r; if (h) h.textContent = r ? "" : "Vyplň všetky odpovede."; return;
  }
  const f = t.dataset.field; if (!f) return;
  S[f] = t.value; save();
  if (STEPS[S.cur].id === "start") {
    const btn = document.querySelector("[data-start]"), h = document.getElementById("starthint"), ok = S.name.trim().length >= 3;
    if (btn) btn.disabled = !ok || S.guess === null;
    if (h) h.textContent = ok ? (S.guess === null ? "Vyber svoj tip." : "") : "Napíš svoje meno a vyber tip.";
  }
});
document.addEventListener("dragstart", e => { const p = e.target.closest && e.target.closest("[data-pick]"); if (!p) return; const [t, id] = p.dataset.pick.split("|"); if (S.t[t] || S.testLocked) return e.preventDefault(); SEL = { t, i: id }; try { e.dataTransfer.setData("text/plain", id); } catch (err) {} });
document.addEventListener("dragover", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (b && SEL) { e.preventDefault(); b.classList.add("over"); } });
document.addEventListener("dragleave", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (b && !b.contains(e.relatedTarget)) b.classList.remove("over"); });
document.addEventListener("drop", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (!b) return; e.preventDefault(); const [t, bk] = b.dataset.bucket.split("|"); placeSel(t, bk); });
document.addEventListener("dragend", () => document.querySelectorAll(".over").forEach(x => x.classList.remove("over")));
if (!S.started) S.cur = 0;
if (S.testLocked && !S.t.test) S.cur = STEPS.findIndex(x => x.id === "test");
render(true);

</script>
</body>
</html>
