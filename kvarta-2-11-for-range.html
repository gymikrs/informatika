.dlgbox input{width:100%;border:1px solid #A9B4C4;border-radius:4px;padding:6px 8px;font-family:var(--mono);font-size:14px;color:#1B1B1F;background:#fff}
.filelist button{display:block;width:100%;text-align:left;border:0;background:#F4F6F9;border-radius:6px;padding:6px 10px;margin:4px 0;cursor:pointer;font-family:var(--mono);color:#1B1B1F}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
@media (max-width:700px){.modes{grid-template-columns:1fr}}
.modes .code{margin:6px 0 0}
.tgtbar{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start;margin-bottom:14px}
@media (max-width:700px){.tgtbar{grid-template-columns:1fr}}
.theory{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin:14px 0}
.theory p{margin:8px 0}.theory h4{margin:12px 0 4px;font-family:var(--head)}
.pcode{font-family:var(--mono);background:#0F1A2E;color:#DCE7FF;border-radius:12px;padding:10px 14px;font-size:14.5px;white-space:pre;overflow-x:auto;margin:8px 0;line-height:1.55}
.chal{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chal button{border:1.5px solid var(--border);background:var(--surface);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:600}
.chal button.on{border-color:var(--acc);background:var(--accSoft)}
.tgt{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start;margin-bottom:12px}
@media (max-width:700px){.tgt{grid-template-columns:1fr}}
.tgt .pv svg{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--border);border-radius:10px}
.swatches{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.swatches span{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:3px 8px}
.swatches i{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.2)}
.boxes{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;min-height:110px;padding:10px;background:var(--surface2);border-radius:12px;margin:10px 0}
.vbox{text-align:center;font-family:var(--mono)}
.vbox .nm{font-weight:800;color:var(--acc);font-size:16px;margin-bottom:4px}
.vbox .bx{min-width:74px;height:58px;border:3px solid #8A5A00;border-top-width:8px;background:#FDF1D6;border-radius:4px 4px 10px 10px;display:grid;place-items:center;font-size:22px;font-weight:800;color:#3A2A00;padding:0 8px;transition:transform .2s}
.vbox.new .bx{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.trace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.trace{grid-template-columns:1fr}}
.trace .src{font-family:var(--mono);background:#0F1A2E;color:#DCE7FF;border-radius:12px;padding:10px 0;font-size:15px}
.trace .src div{padding:2px 14px;white-space:pre}
.trace .src div.cur{background:#2F5BEA;color:#fff}
.trace .src div.done{color:#8FA3C8}
.scr2{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px;align-items:start}
@media (max-width:760px){.scr2{grid-template-columns:1fr}}
.sl{display:grid;grid-template-columns:60px 1fr 60px;gap:8px;align-items:center}.sl input{accent-color:var(--acc)}.sl b{font-family:var(--mono);font-size:20px;text-align:right}

.rtab code{white-space:nowrap}
@media (max-width:640px){.rtab{font-size:14.5px}.rtab th,.rtab td{padding:4px 6px}}
@media (max-width:640px){.tool>div[style*="1fr 250px"]{grid-template-columns:minmax(0,1fr)!important}.tool select{max-width:100%}}
.rtab.nb td{overflow-wrap:normal}
.theory p code{white-space:nowrap}
.rgseq{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}.rgseq span{font-family:var(--mono);font-weight:700;font-size:18px;background:var(--accSoft);color:var(--acc);border-radius:8px;padding:6px 12px}
/* ===== LENKA: spoločné pravidlá vzhľadu ===== */
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#D9EAFB}}
:root[data-theme="light"]{--bg:#D9EAFB}
.theory p{max-width:none}
.tsplit{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:22px;align-items:start}
.tsplit>div>.tfig,.tsplit>div>figure{margin:0}
@media (max-width:860px){.tsplit{grid-template-columns:1fr}}
.rtab{border-collapse:collapse;margin:10px 0;font-size:15.5px;width:100%}
.rtab th,.rtab td{border:1px solid var(--border);padding:5px 10px;text-align:left;vertical-align:top}
.rtab th{background:var(--surface2);font-size:14px}
.rtab.num td:first-child{white-space:nowrap;font-family:var(--mono);font-size:14.5px}
.vedel{background:#FFF8E1;color:#3A2E00;border:1px solid #F2D27A;border-left:5px solid #E0A800;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:15.5px;line-height:1.55}
.goals.g2{columns:2;column-gap:24px}.goals.g2 li{break-inside:avoid}
@media (max-width:640px){.goals.g2{columns:1}}
.tfigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.tfigs.one{grid-template-columns:minmax(0,560px);justify-content:center}
@media (max-width:760px){.tfigs{grid-template-columns:1fr}}

.tsplit>div{min-width:0}
.rtab td{overflow-wrap:anywhere}

});
document.addEventListener("dragstart", e => { const p = e.target.closest && e.target.closest("[data-pick]"); if (!p) return; const [t, id] = p.dataset.pick.split("|"); if (S.t[t]) return e.preventDefault(); SEL = { t, i: id }; try { e.dataTransfer.setData("text/plain", id); } catch (err) {} });
document.addEventListener("dragover", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (b && SEL) { e.preventDefault(); b.classList.add("over"); } });
document.addEventListener("dragleave", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (b && !b.contains(e.relatedTarget)) b.classList.remove("over"); });
document.addEventListener("drop", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (!b) return; e.preventDefault(); const [t, bk] = b.dataset.bucket.split("|"); placeSel(t, bk); });
document.addEventListener("dragend", () => document.querySelectorAll(".over").forEach(x => x.classList.remove("over")));
if (!S.started) S.cur = 0;
render(true);

</script>
</body>
</html>
