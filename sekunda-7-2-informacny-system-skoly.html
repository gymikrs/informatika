<script>
const THEORY = {"precvic": ["Spoločné (rozvrh, suplovanie, úlohy) vs. osobné (známky, dochádzka) po prihlásení.", "Učiteľ zapisuje známky a triednu knihu, rodič ospravedlnenky a odhlásenie obeda."], "system": ["Informačný systém školy (EduPage): známky, dochádzka, rozvrh, suplovanie, triedna kniha, úlohy, jedáleň, komunikácia; osobné údaje s obmedzeným prístupom."], "aplikacia": ["Ikony aplikácie: rozvrh, suplovanie, známky, dochádzka, ospravedlnenky, úlohy, správy, jedáleň, udalosti."], "rozvrh": ["Suplovanie na daný deň mení bežný rozvrh: zastupovanie, presun, odpadnutá hodina."], "znamky": ["Vážený priemer = Σ(známka × váha) ÷ Σ váh; % dochádzky = zameškané ÷ odučené × 100."], "bezpecnost": ["Heslo nikomu, odhlásiť sa, prihlasovať len oficiálne, pozor na phishing."]};
/* ===== generic explore + find on clickable SVG screens ===== */
function XS(k) { S.x = S.x || {}; if (!S.x[k]) S.x[k] = { exp: null, seen: [], fi: 0, res: [], last: null }; return S.x[k]; }
function efSVG(k, ctx) {

document.addEventListener("dragend", () => document.querySelectorAll(".over").forEach(x => x.classList.remove("over")));
if (!S.started) S.cur = 0;
render(true);

</script>
</body>
</html>
