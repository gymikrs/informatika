<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test 1 – 1. ročník</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D9EAFB;--surface:#FFFFFF;--surface2:#F4F7FB;--ink:#16213A;--muted:#566381;
  --acc:#2F5BEA;--accSoft:#E2E9FD;--amber:#F0B429;--amberSoft:#FDF1D3;--track:#C9D3E6;
  --ok:#12805A;--okSoft:#DDF3EA;--bad:#C0392B;--badSoft:#FBE3E0;--border:#D3DCEA;
  --font:"Rubik","Segoe UI",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10172A;--surface:#18223A;--surface2:#1E2A46;--ink:#E8EDF7;--muted:#9AA7C4;--acc:#6E91FF;--accSoft:#26386A;--amber:#F5C451;--amberSoft:#3D3219;--track:#33415F;--ok:#3CCB8E;--okSoft:#163A30;--bad:#FF7A6B;--badSoft:#46221F;--border:#2E3B58}}
:root[data-theme="dark"]{--bg:#10172A;--surface:#18223A;--surface2:#1E2A46;--ink:#E8EDF7;--muted:#9AA7C4;--acc:#6E91FF;--accSoft:#26386A;--amber:#F5C451;--amberSoft:#3D3219;--track:#33415F;--ok:#3CCB8E;--okSoft:#163A30;--bad:#FF7A6B;--badSoft:#46221F;--border:#2E3B58}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:900px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand .lg{width:18px;height:18px;border-radius:5px;background:var(--acc)}
.pts{background:var(--amberSoft);border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap}
.prog{height:5px;background:var(--track)}.prog i{display:block;height:100%;background:var(--acc);transition:width .2s}
main{max-width:900px;margin:0 auto;padding:24px 16px 70px}
.kicker{color:var(--muted);font-size:15px;margin:0 0 4px}
h1{font-size:clamp(28px,5vw,42px);line-height:1.1;margin:0 0 12px;letter-spacing:-.02em}
h2{font-size:clamp(24px,4vw,30px);margin:30px 0 10px}
p{margin:0 0 12px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin:14px 0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.fact{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.fact b{display:block;font-size:24px;color:var(--acc)}
.fact span{font-size:14px;color:var(--muted)}
label.f{display:block;font-weight:600;margin:12px 0 4px}
.in{width:100%;max-width:420px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface2)}
.in.mono{font-family:var(--mono)}
.in.good{border-color:var(--ok);background:var(--okSoft)}
.in.badin{border-color:var(--bad);background:var(--badSoft)}
.primary{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:600;cursor:pointer;font-size:17px}
.primary:disabled{background:var(--track);color:var(--muted);cursor:not-allowed}
.primary.warn{background:var(--bad)}
.ghost{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}
.muted{color:var(--muted)}
.qc{background:var(--surface);border:1px solid var(--border);border-left:6px solid var(--acc);border-radius:14px;padding:16px 18px;margin:16px 0}
.qc.full{border-left-color:var(--ok)}.qc.part{border-left-color:var(--amber)}.qc.zero{border-left-color:var(--bad)}
.qh{display:flex;gap:12px;align-items:flex-start}
.qn{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accSoft);color:var(--acc);font-weight:700;font-size:14px}
.qt{flex:1;font-weight:600;padding-top:2px}
.pt{flex:0 0 auto;font-size:13.5px;font-weight:600;background:var(--amberSoft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.ins{color:var(--muted);font-size:14.5px;margin:6px 0 10px 42px}
.qb{margin-left:42px}
@media (max-width:560px){.qb,.ins{margin-left:0}}
.fig{margin:8px 0 12px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;max-width:520px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:14px;color:#3E4A63;text-align:center;margin-top:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.opt{text-align:left;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--accSoft)}
.opt.ok{border-color:var(--ok);background:var(--okSoft)}
.opt.bad{border-color:var(--bad);background:var(--badSoft)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default;color:var(--ink)}
.mt{border-collapse:collapse;width:100%;font-size:15.5px}
.mt td{padding:7px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.mt td:first-child{font-weight:500;width:45%}
.mt select{width:100%;max-width:280px;padding:8px 10px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface2)}
.mt select.good{border-color:var(--ok);background:var(--okSoft)}
.mt select.badsel{border-color:var(--bad);background:var(--badSoft)}
.okm{color:var(--ok);font-weight:600}.badm{color:var(--bad);font-weight:600}
@media (max-width:560px){.mt td{display:block;width:100%!important;border:0;padding:3px 0}.mt tr{display:block;padding:8px 0;border-bottom:1px solid var(--border)}}
.seq{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:12px}
.slot .n{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accSoft);color:var(--acc);font-size:14px}
.slot.empty .e{color:var(--muted);flex:1;border:1.5px dashed var(--border);border-radius:10px;padding:8px 14px}
.slotbtn{flex:1;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:8px 14px;cursor:pointer}
.slot.ok .slotbtn{border-color:var(--ok);background:var(--okSoft)}
.slot.bad .slotbtn{border-color:var(--bad);background:var(--badSoft)}
.slotbtn:disabled{cursor:default;color:var(--ink)}
.ends{font-size:13.5px;color:var(--muted);font-weight:600;margin:0 0 6px}
.pool{display:flex;flex-wrap:wrap;gap:10px;padding:12px;border-radius:12px;background:var(--surface2);min-height:56px}
.pool .empty{color:var(--muted);font-size:14.5px;align-self:center}
.chipb{background:var(--surface);border:1.5px solid var(--border);border-radius:999px;padding:7px 15px;cursor:pointer;font-weight:500}
.chipb:hover{border-color:var(--acc)}
.iq{margin-bottom:12px}
.iq .lbl{font-weight:500;margin-bottom:6px}
.iqa{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.iqa .in{max-width:260px}.iqa .in.wide{max-width:560px}
.unit{font-weight:600;color:var(--muted)}
.right{background:var(--okSoft);border-radius:10px;padding:8px 12px;margin-top:10px;font-size:15px}
.result{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px}
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 10px}
.big .n{font-size:56px;font-weight:700;line-height:1;color:var(--acc)}
.big .of{font-size:19px;color:var(--muted)}
.grade{margin-left:auto;text-align:center;border:2px solid var(--acc);border-radius:12px;padding:6px 16px}
.grade b{display:block;font-size:32px;line-height:1.1}.grade span{font-size:12.5px;color:var(--muted)}
.warnbox{background:var(--amberSoft);border-left:5px solid var(--amber);border-radius:0 12px 12px 0;padding:10px 14px;margin:12px 0}
.submitbar{margin-top:26px;padding-top:20px;border-top:1px dashed var(--border);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
/* klikanie do obrázka */
.fig.hot{max-width:560px}
.hz{fill:rgba(47,91,234,.001);stroke:transparent;stroke-width:3;cursor:pointer;transition:fill .12s}
.hz:hover,.hz:focus{fill:rgba(47,91,234,.16);stroke:#2F5BEA;outline:none}
.hz.hsel{fill:rgba(47,91,234,.30);stroke:#2F5BEA;stroke-width:4}
.hz.hok{fill:rgba(18,128,90,.30);stroke:#12805A;stroke-width:4}
.hz.hbad{fill:rgba(192,57,43,.30);stroke:#C0392B;stroke-width:4}
.hz.hmiss{fill:rgba(18,128,90,.12);stroke:#12805A;stroke-width:3;stroke-dasharray:7 5}
.fig.done .hz{cursor:default}
.hst{font-size:15px;margin:2px 0 0}
/* triedenie do skupín */
.sgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.sg{border:2px dashed var(--border);border-radius:12px;padding:8px 10px;min-height:92px;background:var(--surface2)}
.sg.armed{border-color:var(--acc);background:var(--accSoft);cursor:pointer}
.sgh{font-weight:700;font-size:14.5px;margin-bottom:6px}
.sgb{display:flex;flex-wrap:wrap;gap:6px}
.sge{color:var(--muted);font-size:14px}
.sg .chipb{padding:5px 11px;font-size:15px}
.chipb.picked{background:var(--acc);color:#fff;border-color:var(--acc)}
.chipb.cok{border-color:var(--ok);background:var(--okSoft);cursor:default}
.chipb.cbad{border-color:var(--bad);background:var(--badSoft);cursor:default}
.chipb small{font-weight:600;color:var(--bad)}
/* doplňovanie do textu */
.gtext{line-height:2.35}
.gsel{padding:3px 8px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface2);max-width:100%;font-size:16px}
.gsel.good{border-color:var(--ok);background:var(--okSoft)}
.gsel.badsel{border-color:var(--bad);background:var(--badSoft)}
.gfix{font-size:14.5px;margin:0 4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.fig.wide{max-width:none}
.mono{font-family:var(--mono)}
/* žiarovky na klikanie */
.bb{cursor:pointer}
.bb .gl{opacity:0;transition:opacity .25s}
.bb.on .gl{opacity:1;animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{opacity:.55}}
.bb .gb{fill:#fff;stroke:#9AA3B5;stroke-width:2.5;transition:fill .2s,stroke .2s}
.bb.on .gb{fill:#F5C451;stroke:#B98500}
.bb:hover .gb,.bb:focus .gb{stroke:#2F5BEA;stroke-width:3.5}
.bb:focus{outline:none}
.bb .bx{fill:rgba(0,0,0,.001);stroke:transparent}
.bb.wrong .bx{stroke:#C0392B;stroke-width:3;stroke-dasharray:6 4}
.bb.right .bx{stroke:#12805A;stroke-width:2.5}
.bdone .bb{cursor:default}
/* delenie bitov na skupiny */
.bits{display:flex;align-items:stretch;justify-content:safe center;margin:4px 0 14px;padding:10px 4px;background:#fff;border:1px solid var(--border);border-radius:12px;overflow-x:auto}
.bt{flex:0 0 auto;width:clamp(24px,5vw,44px);height:54px;display:grid;place-items:center;font:700 clamp(18px,3.4vw,27px)/1 var(--mono);border:2px solid #2F5BEA;border-radius:8px;background:#fff;color:#16213A;transition:background .25s,border-color .25s}
.bt.g1{background:#E2E9FD}.bt.g0{background:#FDF1D3;border-color:#B98500}
.cut{flex:0 0 18px;width:18px;border:0;background:transparent;cursor:pointer;position:relative;padding:0}
.cut::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;width:2px;background:transparent;transition:background .15s}
.cut:hover::before,.cut:focus-visible::before{background:#9AA3B5}
.cut::after{content:"";position:absolute;left:6px;top:0;bottom:0;width:6px;border-radius:3px;background:#2F5BEA;transform:scaleY(0);transition:transform .22s}
.cut.on::after{transform:scaleY(1)}
.cut.cok::after{background:#12805A}.cut.cbad::after{background:#C0392B}
.cut.cmiss::after{transform:scaleY(1);background:transparent;border-left:3px dashed #12805A;width:0;left:7px}
.cut:disabled{cursor:default}
@media (max-width:560px){.bits{padding:8px 2px}.bt{width:18px;height:42px;font-size:16px;border-radius:6px;border-width:1.5px}.cut{flex-basis:9px;width:9px}.cut::after{left:2.5px;width:4px}.cut::before{left:3.5px}.cut.cmiss::after{left:3px}}
.spr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600}
.spr select{padding:8px 10px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface2);font-family:var(--mono);font-size:17px}
.spr select.good{border-color:var(--ok);background:var(--okSoft)}.spr select.badsel{border-color:var(--bad);background:var(--badSoft)}
/* animácie v obrázkoch */
@keyframes flick{0%,82%,100%{opacity:1}85%,91%{opacity:.1}88%{opacity:1}}
.anim-flick{animation:flick 2.6s infinite}
@keyframes wave{0%,100%{opacity:.2}50%{opacity:1}}
.anim-wave{animation:wave 1.6s infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<script>
/* ===== nastavenia ===== */
const KEY = "1rocnik-test1-v5";
const LESSON = "1. ročník – Test 1 (1.2 – 1.6)";
const TITLE = "Test 1: Informácia, kódovanie, číselné sústavy a znaky";
const CLASSES = ["I.A", "I.B", "KVINTA_1", "KVINTA_2"];
const RESULTS_FORM = { url: "https://docs.google.com/forms/d/e/1FAIpQLSfZYJMbWx16Rwk0I-baKi8fAWzEKxdRr5_QtiEXUxn_PcnnQg/viewform", post: "https://docs.google.com/forms/d/e/1FAIpQLSfZYJMbWx16Rwk0I-baKi8fAWzEKxdRr5_QtiEXUxn_PcnnQg/formResponse", entries: { meno: "entry.1474825380", trieda: "entry.1595709580", hodina: "entry.2116247609", body: "entry.635405102", detail: "entry.348187999" } };

/* ===== pomôcky ===== */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function shuffled(n) { const ids = [...Array(n).keys()]; let o; let k = 0; do { o = shuffle(ids.slice()); k++; } while (k < 12 && n > 1 && o.every((x, i) => x === i)); return o; }
function parseNum(v) { const s = String(v).replace(/\s/g, "").replace(",", "."); return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : NaN; }
const bw = n => n === 1 ? "bod" : n >= 2 && n <= 4 ? "body" : "bodov";
function typo(root) { if (!root) return; const W = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement && n.parentElement.closest("code,script,style,textarea,svg,select,option") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const L = []; while (W.nextNode()) L.push(W.currentNode);
  L.forEach(n => { let t = n.nodeValue, o = t; t = t.replace(/(\d) (?=[\p{L}%°])/gu, "$1\u00A0");
    for (let i = 0; i < 2; i++) t = t.replace(/(^|[\s(„])([vkszaiouVKSZAIOU]) /g, "$1$2\u00A0");
    if (t !== o) n.nodeValue = t; }); }

/* ===== náhodné čísla pre každého žiaka ===== */
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const SUB = { 2: "₂", 8: "₈", 10: "₁₀", 16: "₁₆" };
const inBase = (n, b) => n.toString(b).toUpperCase() + SUB[b];
const clean = v => String(v).replace(/\s/g, "");
function isBase(v, base, val) { let s = clean(v).toUpperCase().replace(/[₀-₉]+$/, "");
  if (base === 16) s = s.replace(/^0X/, "").replace(/^#/, "").replace(/H$/, "");
  const re = { 2: /^[01]+$/, 8: /^[0-7]+$/, 16: /^[0-9A-F]+$/ }[base];
  return re.test(s) && parseInt(s, base) === val; }
function toRoman(n) { const T = [[1000, "M"], [900, "CM"], [500, "D"], [400, "CD"], [100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]]; let s = ""; for (const [v, r] of T) while (n >= v) { s += r; n -= v; } return s; }
const caesar = (w, k) => w.replace(/[A-Z]/g, c => String.fromCharCode((c.charCodeAt(0) - 65 + k) % 26 + 65));
const bin8 = n => n.toString(2).padStart(8, "0");


function genR() {
  const W = ["KOD", "BIT", "SIFRA", "DATA", "HESLO", "KANAL", "ZDROJ", "SIGNAL", "BAJT", "TEXT", "KLUC", "SPRAVA", "PRENOS", "SUSTAVA"];
  const w1 = pick(W); let w2; do w2 = pick(W); while (w2 === w1);
  const n = pick([3, 4, 5, 6, 7, 9, 10]); let m; do m = pick([4, 5, 6, 7, 9, 10, 11, 12]); while (m === n);
  let ord; do ord = Array.from({ length: 5 }, () => rint(12, 63)); while (new Set(ord).size < 5);
  const AL = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const u = pick(AL.slice(1)); let l, c;
  do l = pick(AL).toLowerCase(); while (l.toUpperCase() === u);
  do c = pick(AL).toLowerCase(); while (c === l || c.toUpperCase() === u);
  let r1, r2; do { r1 = rint(40, 1999); r2 = rint(40, 1999); } while (r1 === r2);
  const two = (a, b) => { const x = rint(a, b); let y; do y = rint(a, b); while (y === x); return [x, y]; };
  return { k: rint(3, 9), w1, w2, r1, r2, bn: 4 * rint(2, 7) + 3, hx: 16 * rint(1, 15) + 15, n, m,
    bulb: rint(20, 250), oc: rint(20, 200), hd: rint(40, 250), db: rint(20, 120), dh: rint(100, 250),
    b8: rint(64, 511), b16: rint(256, 4095), h2: rint(32, 255), ord, bases: shuffle([2, 8, 10, 16, 2]), u, l, c,
    hb: rint(60, 250), wt: rint(0, 7), dg: two(48, 57), up: two(65, 90), lo: two(97, 122),
    lt: pick("BCDEFGHJKLMNPRSTVZ".split("")), wd: pick(["KOD", "BIT", "BAJT", "SIFRA", "KLUC", "ZDROJ", "HESLO", "PRENOS", "SIGNAL"]),
    dw: pick(["Hej", "Ahoj", "Kod", "Bit", "Byt", "Tim", "Sova", "Les"]), fit: [rint(0, 99), rint(100, 254), rint(257, 999), rint(1000, 5000)],
    tg: rint(37, 230), sp: rint(520, 2040), hxs: [...shuffle("ABCDEF".split("")).slice(0, 4), ...shuffle("6789".split("")).slice(0, 2)], kp: shuffle(["k1", "k2", "k3", "k4"]) };
}

/* ===== obrázky ===== */
const FONT = `font-family="Rubik,Segoe UI,Arial,sans-serif"`;
const zone = (id, x, y, w, h, rx = 6) => `<rect class="hz" data-z="${id}" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/>`;

const MODEL = (() => { let s = ""; for (let i = 0; i < 5; i++) { const x = 8 + i * 98;
    s += `<rect x="${x}" y="22" width="80" height="44" rx="10" fill="#E2E9FD" stroke="#2F5BEA" stroke-width="2"/><text x="${x + 40}" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#2F5BEA">?</text><text x="${x + 40}" y="86" text-anchor="middle" font-size="13" fill="#566381">${i + 1}.</text>`;
    if (i < 4) s += `<line x1="${x + 82}" y1="44" x2="${x + 94}" y2="44" stroke="#566381" stroke-width="2"/><path d="M${x + 90} 39 L${x + 97} 44 L${x + 90} 49 Z" fill="#566381"/>`; }

function hotBody(q, done) { const a = S.ans[q.id], ok = done && q.a.includes(a), name = a ? q.names[a] || a : "";
  if (!done) return `<p class="hst muted">${a ? `Vybral si: <b>${esc(name)}</b>` : "Zatiaľ si nič nevybral."}</p>`;
  return `<p class="hst">${ok ? `<span class="okm">✓ správne: ${esc(name)}</span>` : `<span class="badm">✗ ${a ? `vybral si ${esc(name)}, ` : "nič si nevybral, "}správne: ${esc(q.one || q.names[q.a[0]])}</span>`}</p>`; }
function sortBody(q, done) { const a = S.ans[q.id] || {}, P = S.perm[q.id], armed = !done && PICK && PICK.q === q.id;
  let h = `<div class="sgs">${q.groups.map((g, gi) => `<div class="sg ${armed ? "armed" : ""}" data-grp="${q.id}|${gi}"><div class="sgh">${esc(g)}</div><div class="sgb">${P.filter(i => a[i] === gi).map(i => done
      ? `<span class="chipb ${q.items[i][1] === gi ? "cok" : "cbad"}">${esc(q.items[i][0])}${q.items[i][1] === gi ? " ✓" : ` <small>→ ${esc(q.groups[q.items[i][1]])}</small>`}</span>`
      : `<button class="chipb" data-unsort="${q.id}|${i}">${esc(q.items[i][0])}</button>`).join("") || `<span class="sge">${armed ? "Klikni sem" : "…"}</span>`}</div></div>`).join("")}</div>`;
  const rest = P.filter(i => a[i] == null);
  if (!done) h += `<div class="pool">${rest.length ? rest.map(i => `<button class="chipb ${PICK && PICK.q === q.id && PICK.i === i ? "picked" : ""}" data-pick="${q.id}|${i}" aria-pressed="${!!(PICK && PICK.q === q.id && PICK.i === i)}">${esc(q.items[i][0])}</button>`).join("") : '<span class="empty">Všetko je roztriedené.</span>'}</div>`;
  else if (rest.length) h += `<div class="right"><b>Neroztriedené:</b> ${rest.map(i => `${esc(q.items[i][0])} → ${esc(q.groups[q.items[i][1]])}`).join(" · ")}</div>`;
  return h; }
function gapBody(q, done) { const a = S.ans[q.id] || {}, P = S.perm[q.id];
  return `<p class="gtext">${q.text.replace(/\{(\d+)\}/g, (m, k) => { k = +k; const g = q.gaps[k], v = a[k], ok = v === 0;
    return `<select class="gsel ${done ? (ok ? "good" : "badsel") : ""}" data-gp="${q.id}|${k}" ${done ? "disabled" : ""} aria-label="Prázdne miesto ${k + 1}"><option value="">— vyber —</option>${P[k].map(j => `<option value="${j}" ${v === j ? "selected" : ""}>${esc(g[j])}</option>`).join("")}</select>${done ? (ok ? ` <span class="okm">✓</span>` : `<span class="badm gfix">(správne: ${esc(g[0])})</span>`) : ""}`; })}</p>`; }
function bulbBody(q, done) { const a = S.ans[q.id] || [], t = bin8(q.val); let g = "";
  for (let i = 0; i < 8; i++) { const x = 52 + i * 102, on = !!a[i], cls = done ? (on === (t[i] === "1") ? "right" : "wrong") : "";
    g += `<g class="bb ${on ? "on" : ""} ${cls}" data-bulb="${q.id}|${i}" role="button" tabindex="${done ? -1 : 0}" aria-pressed="${on}" aria-label="${i + 1}. žiarovka zľava, ${on ? "svieti" : "nesvieti"}">
      <rect class="bx" x="${x - 46}" y="4" width="92" height="128" rx="12"/>
      <g class="gl"><circle cx="${x}" cy="52" r="40" fill="#FFE9A8" opacity=".8"/>${[0, 1, 2, 3, 4, 5, 6, 7].map(k => { const an = k * Math.PI / 4; return `<line x1="${x + Math.cos(an) * 31}" y1="${52 + Math.sin(an) * 31}" x2="${x + Math.cos(an) * 39}" y2="${52 + Math.sin(an) * 39}" stroke="#E0A800" stroke-width="3" stroke-linecap="round"/>`; }).join("")}</g>
      <circle class="gb" cx="${x}" cy="52" r="23"/><rect x="${x - 10}" y="74" width="20" height="16" rx="2" fill="#8C93A3"/><rect x="${x - 7}" y="91" width="14" height="6" rx="2" fill="#5F6675"/>
      <text x="${x}" y="122" text-anchor="middle" font-size="20" font-weight="700" font-family="Consolas,monospace" fill="${on ? "#B98500" : "#9AA3B5"}">${on ? 1 : 0}</text></g>`; }
  const fig = `<figure class="fig wide ${done ? "bdone" : ""}"><svg viewBox="0 0 820 136" role="group" aria-label="Osem žiaroviek na klikanie" ${FONT}>${g}</svg></figure>`;
  if (!done) return fig;
  const ok = gradeQ(q).u === 2; return fig + `<p class="hst">${ok ? `<span class="okm">✓ správne: ${t}</span>` : `<span class="badm">✗ správne: ${t} (zelený rámček = správne, červený = chyba)</span>`}</p>`; }
function splitBody(q, done) { const a = S.ans[q.id] || {}, cut = a.cut || [], L = q.bits.length, good = spCuts(L, q.size), P = S.perm[q.id];
  let h = `<div class="bits" aria-label="Bity čísla, medzi nimi medzery na delenie">`, grp = 0;
  for (let i = 0; i < L; i++) { h += `<span class="bt ${cut.length ? "g" + (grp % 2) : ""}">${q.bits[i]}</span>`;
    if (i < L - 1) { const u = cut.includes(i), s = good.includes(i); let c = u ? "on" : "";
      if (done) c = u && s ? "on cok" : u ? "on cbad" : s ? "cmiss" : "";
      h += `<button class="cut ${c}" data-cut="${q.id}|${i}" aria-pressed="${u}" aria-label="Medzera za ${i + 1}. bitom" ${done ? "disabled" : ""}></button>`; if (u) grp++; } }
  h += `</div><div class="spr"><span>Výsledok:</span><select data-spr="${q.id}" class="${done ? (a.r === 0 ? "good" : "badsel") : ""}" ${done ? "disabled" : ""} aria-label="Výsledok prevodu"><option value="">— vyber —</option>${P.map(j => `<option value="${j}" ${a.r === j ? "selected" : ""}>${esc(q.opts[j])}</option>`).join("")}</select>${done ? (a.r === 0 ? ` <span class="okm">✓</span>` : ` <span class="badm">✗ správne: ${esc(q.opts[0])}</span>`) : ""}</div>`;
  if (done && !cutsOk(q)) { let r = ""; for (let i = 0; i < L; i++) r += q.bits[i] + (good.includes(i) ? " | " : ""); h += `<div class="right"><b>Správne rozdelenie (skupiny po ${q.size} sprava):</b> <span class="mono">${r}</span></div>`; }
  return h; }
function card(q, n, done) { const r = done ? S.result.per[q.id] : null;
  const body = q.type === "bulb" ? bulbBody(q, done) : q.type === "split" ? splitBody(q, done) : q.type === "hot" ? hotBody(q, done) : q.type === "sort" ? sortBody(q, done) : q.type === "gap" ? gapBody(q, done) : q.type === "mc" || q.type === "multi" ? mcBody(q, done) : q.type === "match" ? matchBody(q, done) : q.type === "order" ? orderBody(q, done) : inputBody(q, done);
  return `<section class="qc ${done ? (r.sc === q.pts ? "full" : r.sc > 0 ? "part" : "zero") : ""}" id="c-${q.id}">
    <div class="qh"><span class="qn">${n}</span><div class="qt">${q.q}</div><span class="pt">${done ? `${r.sc} / ${q.pts} b` : `${q.pts} ${bw(q.pts)}`}</span></div>
    ${done ? "" : `<div class="ins">${HINT[q.type]}</div>`}
    <div class="qb">${q.img ? `<figure class="fig${q.type === "hot" ? " hot" + (done ? " done" : "") : ""}${q.wide ? " wide" : ""}"${q.type === "hot" ? ` data-hq="${q.id}"` : ""}${q.figw ? ` style="max-width:${q.figw}px"` : ""}>${q.img}${q.cap ? `<figcaption>${q.cap}</figcaption>` : ""}</figure>` : ""}${body}</div></section>`; }

/* ===== obrazovky ===== */
function renderTop() { const n = S.order.filter(id => answered(BY[id])).length, PH = GATE ? "start" : S.phase;
  let right = "";
  if (PH === "test") right = `<div class="pts" id="cnt">📝 Zodpovedané <b>${n}</b> z ${Q.length}</div>`;
  if (PH === "done") right = `<div class="pts">⭐ <b>${S.result.tot}</b> z ${MAX}</div>`;
  document.getElementById("top").innerHTML = `<div class="topbar"><div class="brand"><span class="lg" aria-hidden="true"></span>Test 1 · 1. ročník</div>${PH !== "start" ? asciiBtn() : ""}${right}</div>${PH === "test" ? `<div class="prog"><i id="bar" style="width:${Math.round(n / Q.length * 100)}%"></i></div>` : ""}`; }
function viewStart() { const ok = canStart();
  return `<p class="kicker">Informatika, 1. ročník</p><h1>${TITLE}</h1>
  <p>Test z učiva 1.2 až 1.6: informatika a informácia, model prenosu, kódovanie a šifrovanie, číselné sústavy, dvojková a šestnástková sústava, prevody medzi sústavami a kód ASCII.</p>
  <div class="facts"><div class="fact"><b>${Q.length}</b><span>úloh</span></div><div class="fact"><b>${MAX}</b><span>bodov</span></div><div class="fact"><b>45</b><span>minút</span></div></div>
  <div class="warnbox">Úlohy aj odpovede má každý v inom poradí. Za ťažšie úlohy je viac bodov a pri niektorých dostaneš aj časť bodov. Keď test odovzdáš, výsledok sa automaticky pošle učiteľovi a uvidíš správne odpovede.</div>
  ${S.phase === "test" ? `<div class="warnbox">V tomto prehliadači je rozpracovaný test: <b>${esc(S.name.trim())}</b>, ${esc(S.cls.trim())}. Ak je tvoj, môžeš v ňom pokračovať.<div class="row" style="margin-top:8px"><button class="ghost" data-resume>Pokračovať v rozpracovanom teste</button></div></div>` : ""}
  <div class="panel"><label class="f" for="nm">Meno a priezvisko</label><input class="in" id="nm" data-field="name" value="${esc(D.name)}" autocomplete="off" placeholder="napr. Jana Nováková">
  <label class="f" for="cl">Trieda</label><select class="in" id="cl" data-field="cls"><option value="">— vyber triedu —</option>${CLASSES.map(c => `<option ${D.cls === c ? "selected" : ""}>${c}</option>`).join("")}</select>
  <div class="row"><button class="primary" data-start ${ok ? "" : "disabled"}>Začať test</button><span class="muted" id="sthint">${startHint()}</span></div></div>`; }
let ARM = false;
function viewTest() { const left = S.order.filter(id => !answered(BY[id])).length;
  return `<p class="kicker">${esc(S.name.trim())}, ${esc(S.cls)}${S.attempt > 1 ? ` · ${S.attempt}. pokus` : ""}</p><h1>Test 1</h1>
  ${S.order.map((id, i) => card(BY[id], i + 1, false)).join("")}
  <div class="submitbar"><button class="primary ${ARM ? "warn" : ""}" data-submit>${ARM ? "Naozaj odovzdať?" : "Odovzdať test"}</button><span class="muted" id="subhint">${ARM && left ? `Nezodpovedal si ${left} ${left === 1 ? "úlohu" : left <= 4 ? "úlohy" : "úloh"}. Klikni znova, ak chceš test aj tak odovzdať.` : ARM ? "Odovzdaný test sa už nedá meniť." : "Pred odovzdaním si skontroluj všetky odpovede."}</span></div>`; }
function sendResults() {
  const E = RESULTS_FORM.entries, tot = S.result.tot, pct = Math.round(tot / MAX * 100), p = new URLSearchParams();
  p.set(E.meno, S.name.trim()); p.set(E.trieda, S.cls); p.set(E.hodina, LESSON); p.set(E.body, `${tot}/${MAX} (${pct} %)`); p.set(E.detail, String(gradeOf(pct)));
  const key = [S.name.trim(), S.cls, tot, S.finished].join("|");
  const st = (t, c) => { const el = document.getElementById("sendst"); if (el) { el.textContent = t; el.style.color = c || ""; } };
  if (S.sentKey !== key && !S.sending) { S.sending = true;
    fetch(RESULTS_FORM.post, { method: "POST", mode: "no-cors", body: p }).then(() => { S.sentKey = key; S.sending = false; save(); st("✅ Výsledok bol odoslaný učiteľovi.", "#1E7B34"); })
      .catch(() => { S.sending = false; st("⚠️ Výsledok sa nepodarilo odoslať (asi nie je internet). Pripoj sa na internet a obnov stránku, výsledok sa odošle znova.", "#B3261E"); }); }
  return `<span id="sendst" style="font-weight:600;${S.sentKey === key ? "color:#1E7B34" : ""}">${S.sentKey === key ? "✅ Výsledok bol odoslaný učiteľovi." : "⏳ Odosiela sa výsledok učiteľovi…"}</span>`; }
function viewDone() { const tot = S.result.tot, pct = Math.round(tot / MAX * 100), when = new Date(S.finished).toLocaleString("sk-SK", { day: "numeric", month: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" });
  return `<p class="kicker">Výsledok testu</p><h1>Test 1</h1>
  <div class="result"><p style="margin:0"><b>${esc(S.name.trim())}</b>, ${esc(S.cls)} <span class="muted">· ${when}${S.attempt > 1 ? ` · ${S.attempt}. pokus` : ""}</span></p>
    <div class="big"><span class="n">${tot}</span><span class="of">z ${MAX} bodov (${pct} %)</span><div class="grade"><b>${gradeOf(pct)}</b><span>známka</span></div></div>
    <div class="row" style="margin-top:4px">${sendResults()}</div></div>
  <h2>Prehľad odpovedí</h2><p class="muted">Zelená = správne, červená = nesprávne. Pri nesprávnych odpovediach vidíš aj správne riešenie.</p>
  ${S.order.map((id, i) => card(BY[id], i + 1, true)).join("")}
  <div class="submitbar"><button class="primary ${ARM ? "warn" : ""}" data-again>${ARM ? "Naozaj začať nový pokus?" : "Nový pokus"}</button><span class="muted">${ARM ? "Napíšeš meno, vyberieš triedu, úlohy sa znova premiešajú a začneš od začiatku." : "Test môžeš skúsiť znova, každý pokus sa pošle učiteľovi."}</span></div>`; }

/* ===== kontrola uloženého stavu (po úprave testu sa starý rozpracovaný pokus zahodí) ===== */
function stateOk() {
  if (S.phase === "start") return true;
  if (!Array.isArray(S.order) || S.order.length !== Q.length || !S.perm) return false;
  const ok = S.order.every(id => { const q = BY[id], p = S.perm[id]; if (!q) return false;
    if (q.type === "mc" || q.type === "multi") return Array.isArray(p) && p.length === q.opts.length;
    if (q.type === "match") return !!p && Array.isArray(p.rows) && p.rows.length === q.rows.length && Array.isArray(p.pool) && p.pool.length === poolOf(q).length;
    if (q.type === "order" || q.type === "sort") return Array.isArray(p) && p.length === q.items.length;
    if (q.type === "gap") return Array.isArray(p) && p.length === q.gaps.length && p.every((x, k) => Array.isArray(x) && x.length === q.gaps[k].length);
    if (q.type === "split") return Array.isArray(p) && p.length === q.opts.length;
    return true; });
  return ok && (S.phase !== "done" || (!!S.result && !!S.result.per && S.order.every(id => S.result.per[id])));
}
function resetState() { S = Object.assign(fresh(), { name: S.name || "", cls: S.cls || fresh().cls }); save(); }
try { if (!stateOk()) resetState(); } catch (e) { resetState(); }

const main = document.getElementById("main");
function render(toTop) { try { render0(toTop); } catch (e) { console.error(e); resetState(); ARM = false; render0(true); } }
function render0(toTop) { const y = window.scrollY; renderTop();
  main.innerHTML = GATE || S.phase === "start" ? viewStart() : S.phase === "test" ? viewTest() : viewDone();
  typo(main); paintHot(); window.scrollTo(0, toTop ? 0 : y); }
function paintHot() { const done = !GATE && S.phase === "done";
  document.querySelectorAll("[data-hq]").forEach(f => { const q = BY[f.dataset.hq], a = S.ans[q.id], hit = q.a.includes(a);
    f.querySelectorAll("[data-z]").forEach(z => { const id = z.dataset.z; z.setAttribute("role", "button"); z.setAttribute("tabindex", done ? "-1" : "0"); z.setAttribute("aria-label", q.names[id] || id);
      if (!done) { z.classList.toggle("hsel", id === a); return; }
      if (id === a) z.classList.add(hit ? "hok" : "hbad"); else if (!hit && q.a.includes(id)) z.classList.add("hmiss"); }); }); }
function pickZone(z) { const f = z.closest("[data-hq]"); if (!f || GATE || S.phase !== "test") return; S.ans[f.dataset.hq] = z.dataset.z; ARM = false; save(); render(false); }
function toggleBulb(g) { if (GATE || S.phase !== "test") return; const [q, i] = g.dataset.bulb.split("|"), a = S.ans[q] = Array.isArray(S.ans[q]) ? S.ans[q] : [0, 0, 0, 0, 0, 0, 0, 0];
  a[+i] = a[+i] ? 0 : 1; ARM = false; save(); render(false); const f = document.querySelector(`[data-bulb="${q}|${i}"]`); if (f && document.activeElement !== f && g === document.activeElement) f.focus(); }
function updateCount() { const n = S.order.filter(id => answered(BY[id])).length, c = document.getElementById("cnt"), b = document.getElementById("bar");
  if (c) c.innerHTML = `📝 Zodpovedané <b>${n}</b> z ${Q.length}`; if (b) b.style.width = Math.round(n / Q.length * 100) + "%"; }
function onField(t) { D[t.dataset.field] = t.value; const b = document.querySelector("[data-start]"), h = document.getElementById("sthint"); if (b) b.disabled = !canStart(); if (h) h.textContent = startHint(); }

/* ===== udalosti ===== */
document.addEventListener("click", e => {
  const z = e.target.closest("[data-z]"); if (z) return pickZone(z);
  const bb = e.target.closest("[data-bulb]"); if (bb) return toggleBulb(bb);
  const el = e.target.closest("button");
  if (!el) { const g = e.target.closest("[data-grp]"); if (g && PICK && S.phase === "test" && !GATE) { const [q, gi] = g.dataset.grp.split("|"); if (q === PICK.q) { (S.ans[q] = S.ans[q] || {})[PICK.i] = +gi; PICK = null; ARM = false; save(); render(false); } } return; }
  const ds = el.dataset;
  if (ds.resume !== undefined) { GATE = false; ARM = false; return render(true); }
  if (ds.start !== undefined) { if (!canStart()) return; S.name = D.name.trim().replace(/\s+/g, " "); S.cls = D.cls; D.name = ""; D.cls = ""; GATE = false; newAttempt(); ARM = false; return render(true); }
  if (S.phase === "test" && !GATE) {
    if (ds.pick) { const [q, i] = ds.pick.split("|"); PICK = PICK && PICK.q === q && PICK.i === +i ? null : { q, i: +i }; return render(false); }
    if (ds.unsort) { const [q, i] = ds.unsort.split("|"); if (S.ans[q]) delete S.ans[q][i]; PICK = null; ARM = false; save(); return render(false); }
    if (ds.cut) { const [q, i] = ds.cut.split("|"), a = S.ans[q] = S.ans[q] || {}, c = a.cut = a.cut || [], k = c.indexOf(+i); if (k >= 0) c.splice(k, 1); else c.push(+i); ARM = false; save(); return render(false); }
    if (ds.mc) { const [q, i] = ds.mc.split("|"); S.ans[q] = +i; ARM = false; save(); return render(false); }
    if (ds.mu) { const [q, i] = ds.mu.split("|"), a = S.ans[q] = S.ans[q] || [], k = a.indexOf(+i); if (k >= 0) a.splice(k, 1); else a.push(+i); ARM = false; save(); return render(false); }
    if (ds.place) { const [q, i] = ds.place.split("|"), a = S.ans[q] = S.ans[q] || []; if (!a.includes(+i)) a.push(+i); ARM = false; save(); return render(false); }
    if (ds.unplace) { const [q, i] = ds.unplace.split("|"); S.ans[q] = (S.ans[q] || []).filter(x => x !== +i); ARM = false; save(); return render(false); }
    if (ds.submit !== undefined) {
      if (!ARM) { ARM = true; return render(false); }
      ARM = false; const per = {}; let tot = 0; Q.forEach(q => { per[q.id] = gradeQ(q); tot += per[q.id].sc; });
      S.result = { tot, per }; S.finished = Date.now(); S.phase = "done"; save(); return render(true); }
  }
  if (ds.again !== undefined) { if (!ARM) { ARM = true; return render(false); } ARM = false; GATE = true; return render(true); }
});
document.addEventListener("change", e => { const t = e.target;
  if (t.dataset.gp && S.phase === "test" && !GATE) { const [q, k] = t.dataset.gp.split("|"), a = S.ans[q] = S.ans[q] || {}; if (t.value === "") delete a[k]; else a[k] = +t.value; save(); updateCount(); return; }
  if (t.dataset.spr && S.phase === "test" && !GATE) { const q = t.dataset.spr, a = S.ans[q] = S.ans[q] || {}; if (t.value === "") delete a.r; else a.r = +t.value; save(); updateCount(); return; }
  if (t.dataset.mt && S.phase === "test" && !GATE) { const [q, i] = t.dataset.mt.split("|"); (S.ans[q] = S.ans[q] || {})[i] = t.value; save(); updateCount(); return; }
  if (t.dataset.field) onField(t); });
document.addEventListener("input", e => { const t = e.target;
  if (t.dataset.in && S.phase === "test" && !GATE) { const [q, i] = t.dataset.in.split("|"); (S.ans[q] = S.ans[q] || {})[i] = t.value; save(); updateCount(); return; }
  if (t.dataset.field) onField(t); });
render(true);
document.addEventListener("keydown", e => { const z = e.target.closest && e.target.closest("[data-z]"); if (z && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pickZone(z); }
  const bb = e.target.closest && e.target.closest("[data-bulb]"); if (bb && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); const id = bb.dataset.bulb; toggleBulb(bb); const f = document.querySelector(`[data-bulb="${id}"]`); if (f) f.focus(); } });
</script>
</body>
</html>
