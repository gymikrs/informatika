<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1.2 Vznik a história internetu. Základné pojmy - ISP, URL, HTTP, FTP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#16213A; --muted:#566381;
  --line:#2F5BEA; --lineSoft:#D5DFFB; --track:#C9D1DF;
  --ok:#12805A; --okSoft:#DDF3EA; --bad:#C0392B; --badSoft:#FBE3E0; --sun:#F0B429; --sunSoft:#FDF1D3;
  --border:#D6DCE6;
  --font:"Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10172A; --surface:#18223A; --surface2:#1E2A46; --ink:#E8EDF7; --muted:#9AA7C4;
    --line:#6E91FF; --lineSoft:#26386A; --track:#34425F;
    --ok:#3CCB8E; --okSoft:#163A30; --bad:#FF7A6B; --badSoft:#46221F; --sun:#F5C451; --sunSoft:#3D3219;
    --border:#2E3B58;
  }
}
:root[data-theme="dark"]{
  --bg:#10172A; --surface:#18223A; --surface2:#1E2A46; --ink:#E8EDF7; --muted:#9AA7C4;
  --line:#6E91FF; --lineSoft:#26386A; --track:#34425F;
  --ok:#3CCB8E; --okSoft:#163A30; --bad:#FF7A6B; --badSoft:#46221F; --sun:#F5C451; --sunSoft:#3D3219;
  --border:#2E3B58;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--line);outline-offset:2px}
img{max-width:100%}

/* Top: metro line */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px 4px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:700;font-size:19px;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand .dot{width:14px;height:14px;border-radius:50%;background:var(--line);box-shadow:0 0 0 4px var(--lineSoft)}
.pts{background:var(--sunSoft);border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap}
.pts b{font-size:19px}
.reset{background:none;border:1.5px solid var(--border);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.reset.arm{border-color:var(--bad);color:var(--bad);background:var(--badSoft)}
.line{display:flex;overflow-x:auto;padding:10px 20px 14px;max-width:1100px;margin:0 auto;scrollbar-width:thin}
.stn{flex:1 0 92px;position:relative;text-align:center;background:none;border:0;padding:0 4px;cursor:pointer}
.stn:disabled{cursor:not-allowed;opacity:.5}
.stn::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:6px;background:var(--track);z-index:0}
.stn:first-child::before{display:none}
.stn.reached::before{background:var(--line)}
.stn .c{position:relative;z-index:1;display:grid;place-items:center;width:32px;height:32px;margin:0 auto;border-radius:50%;background:var(--surface);border:5px solid var(--track);font-size:13px;font-weight:700;color:transparent;transition:transform .15s}
.stn.done .c{background:var(--line);border-color:var(--line);color:#fff}
.stn.cur .c{border-color:var(--line);transform:scale(1.25);box-shadow:0 0 0 5px var(--lineSoft)}
.stn.cur.done .c{color:#fff}
.stn .l{display:block;font-size:13.5px;font-weight:600;margin-top:6px;line-height:1.2}
.stn .m{display:block;font-size:12px;color:var(--muted)}
.stn.cur .l{color:var(--line)}

/* Main */
main{max-width:960px;margin:0 auto;padding:28px 20px 60px}
.kicker{color:var(--muted);font-size:15px;margin:0 0 4px}
h1{font-size:clamp(30px,5vw,44px);line-height:1.1;margin:0 0 14px;letter-spacing:-.01em}
h2{font-size:clamp(26px,4vw,34px);line-height:1.15;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:20px;margin:34px 0 6px}
p{margin:0 0 14px;max-width:68ch}
.lead{font-size:18.5px}
.task{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin:12px 0 8px}
.task .ins{color:var(--muted);font-size:15.5px;margin-bottom:12px}
.box{border-left:5px solid var(--sun);background:var(--sunSoft);border-radius:0 10px 10px 0;padding:12px 16px;margin:16px 0}
.box.blue{border-color:var(--line);background:var(--lineSoft)}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.clues{margin:0;padding-left:22px}
.clues li{margin-bottom:6px}

/* Buttons */
.primary{background:var(--line);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:600;cursor:pointer;font-size:17px}
.primary:disabled{background:var(--track);color:var(--muted);cursor:not-allowed}
.ghost{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer}
.ghost:disabled{opacity:.45;cursor:not-allowed}
.checkbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.checkbar .hint{color:var(--muted);font-size:14.5px}
.score{font-weight:600;padding:8px 14px;border-radius:10px;background:var(--okSoft);color:var(--ok)}
.score.part{background:var(--sunSoft);color:var(--ink)}
.next{margin-top:34px;padding-top:22px;border-top:1px dashed var(--border);display:flex;justify-content:flex-end}

/* Inputs */
label.f{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=password]{font:inherit;width:100%;max-width:420px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--ink)}

/* Chips & sorting */
.pool{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border-radius:12px;background:var(--surface2);min-height:60px}
.pool .empty{color:var(--muted);font-size:14.5px;align-self:center}
.chip{background:var(--surface);border:1.5px solid var(--border);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500;touch-action:manipulation}
.chip.mono{font-family:var(--mono);border-radius:8px;font-size:15.5px}
.chip:hover:not(:disabled){border-color:var(--line)}
.chip.sel{background:var(--line);border-color:var(--line);color:#fff}
.chip.ok{background:var(--okSoft);border-color:var(--ok);color:var(--ok)}
.chip.bad{background:var(--badSoft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.chip:disabled{cursor:default}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.bucket{border:2px dashed var(--line);border-radius:12px;padding:12px;min-height:110px;cursor:pointer;background:var(--surface)}
.bucket.over{background:var(--lineSoft)}
.bh{font-weight:700;margin-bottom:8px}
.bc{display:flex;flex-wrap:wrap;gap:8px}
.urlpool{font-family:var(--mono)}

/* Ordering */
.seq{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:12px}
.slot .n{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--lineSoft);color:var(--line)}
.slot.empty span:last-child{color:var(--muted);flex:1;border:1.5px dashed var(--border);border-radius:10px;padding:9px 14px}
.slotbtn{flex:1;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:9px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.slot.ok .slotbtn{border-color:var(--ok);background:var(--okSoft)}
.slot.bad .slotbtn{border-color:var(--bad);background:var(--badSoft)}
.slotbtn:disabled{cursor:default;color:var(--ink)}
.extra{font-family:var(--mono);color:var(--line)}

/* MC */
.q{border:0;padding:0;margin:0 0 20px}
.q legend{font-weight:600;padding:0;margin-bottom:10px;display:flex;gap:10px}
.qn{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--lineSoft);color:var(--line);font-size:14px;font-weight:700;margin-top:1px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.opt{text-align:left;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--line)}
.opt.sel{border-color:var(--line);background:var(--lineSoft)}
.opt.ok{border-color:var(--ok);background:var(--okSoft)}
.opt.bad{border-color:var(--bad);background:var(--badSoft)}
.opt:disabled{cursor:default;color:var(--ink)}
.why{font-size:15px;margin:8px 0 0;padding:8px 12px;border-radius:8px;max-width:none}
.why.good{background:var(--okSoft)}
.why.miss{background:var(--badSoft)}

/* URL anatomy */
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}
.part{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.part b{display:block}
.part span{font-size:14.5px;color:var(--muted)}
.urlbar{font-family:var(--mono);background:var(--surface2);border:1.5px solid var(--border);border-radius:999px;padding:8px 16px;overflow-x:auto;white-space:nowrap;margin:6px 0}
.p1{color:#B4570B}.p2{color:var(--line)}.p3{color:var(--ok)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .p1{color:#F5A35C}}
:root[data-theme="dark"] .p1{color:#F5A35C}

/* HTTP demo */
.wire{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;align-items:start;margin-top:16px}
.node{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;font-weight:600}
.node .ico{font-size:30px;display:block}
.bubble{margin-top:8px;font-family:var(--mono);font-size:14px;font-weight:500;padding:8px;border-radius:8px;background:var(--surface);border:1.5px solid var(--border);word-break:break-all;min-height:40px}
.bubble.leak{border-color:var(--bad);background:var(--badSoft)}
.bubble.safe{border-color:var(--ok);background:var(--okSoft)}
.proto-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.tried{font-size:14.5px;color:var(--muted);margin-top:10px}
@media (max-width:560px){.wire{grid-template-columns:1fr}}

/* FTP */
.ftp{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.panel{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;min-height:180px}
.panel h4{margin:0 0 8px;font-size:15.5px}
.file{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;margin-bottom:6px;cursor:pointer;font-family:var(--mono);font-size:14.5px}
.file.sel{border-color:var(--line);background:var(--lineSoft)}
.file.new{border-style:dashed}
.mid{display:flex;flex-direction:column;justify-content:center;gap:10px}
.log{font-family:var(--mono);font-size:13.5px;background:#0F1729;color:#CFE0FF;border-radius:10px;padding:10px 14px;margin-top:12px;max-height:150px;overflow:auto;white-space:pre-wrap}
.goals{list-style:none;padding:0;margin:12px 0 0}
.goals li{padding:4px 0}
.goals .g{display:inline-block;width:22px}
@media (max-width:620px){.ftp{grid-template-columns:1fr}.mid{flex-direction:row;flex-wrap:wrap}}

/* Result */
.result{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px}
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 16px}
.big .n{font-size:56px;font-weight:700;line-height:1;color:var(--line)}
.big .of{font-size:20px;color:var(--muted)}
.grade{margin-left:auto;text-align:center;border:2px solid var(--line);border-radius:12px;padding:6px 14px}
.grade b{display:block;font-size:30px;line-height:1.1}
.grade span{font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15.5px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
td:last-child,th:last-child{text-align:right;white-space:nowrap}
textarea{width:100%;font-family:var(--mono);font-size:13.5px;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);color:var(--ink);resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.muted{color:var(--muted)}
.guesses{display:grid;gap:8px;max-width:520px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.memo{margin:26px 0 8px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 18px 10px}
.memo h3{margin:0 0 6px;font-family:var(--font);font-size:18px;color:var(--line)}
.memo ul{margin:0;padding-left:20px}.memo li{margin:5px 0;font-size:16px;line-height:1.5}
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.figs.one{grid-template-columns:minmax(0,560px);justify-content:center}
@media (max-width:760px){.figs{grid-template-columns:1fr}}
.fig{margin:0;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 10px 8px;display:flex;flex-direction:column;gap:6px}
.fig svg{width:100%;height:auto;display:block}
.fig figcaption{font-size:14px;line-height:1.45;color:#3B4660;text-align:center;padding:0 4px}
/* Poskladaj adresu (URL) */
.ubrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.ubrow>span{font-weight:600;min-width:84px;font-size:15px}
.ubrow .ghost{padding:6px 12px;font-family:var(--mono);font-size:14.5px;font-weight:500}
.ubrow .ghost.on{border-color:var(--line);background:var(--lineSoft)}
.ubbar{font-family:var(--mono);font-size:16px;background:var(--surface2);border:1.5px solid var(--border);border-radius:999px;padding:9px 16px;margin:12px 0 8px;overflow-wrap:anywhere}
.ubexp{margin:0;padding-left:20px;font-size:15.5px}.ubexp li{margin:3px 0}
.rtab td:last-child,.rtab th:last-child{text-align:left;white-space:normal}
.q legend>span{min-width:0;overflow-wrap:anywhere}
/* ===== LENKA: spoločné pravidlá vzhľadu ===== */
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#D9EAFB}}
:root[data-theme="light"]{--bg:#D9EAFB}
.theory p{max-width:none}
.tsplit{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:22px;align-items:start}
.tsplit>div>.tfig,.tsplit>div>figure{margin:0}
@media (max-width:860px){.tsplit{grid-template-columns:1fr}}
.rtab{border-collapse:collapse;margin:10px 0;font-size:15.5px;width:100%}
.rtab th,.rtab td{border:1px solid var(--border);padding:5px 10px;text-align:left;vertical-align:top}
.rtab th{background:var(--surface2);font-size:14px}
.rtab.num td:first-child{white-space:nowrap;font-family:var(--mono);font-size:14.5px}
.vedel{background:#FFF8E1;color:#3A2E00;border:1px solid #F2D27A;border-left:5px solid #E0A800;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:15.5px;line-height:1.55}
.goals.g2{columns:2;column-gap:24px}.goals.g2 li{break-inside:avoid}
@media (max-width:640px){.goals.g2{columns:1}}
.tfigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.tfigs.one{grid-template-columns:minmax(0,560px);justify-content:center}
@media (max-width:760px){.tfigs{grid-template-columns:1fr}}
.tfig{margin:0;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 10px 8px;display:flex;flex-direction:column;gap:6px}
.tfig svg{width:100%;height:auto;display:block}
.tfig figcaption{font-size:14px;line-height:1.45;color:#3E3858;text-align:center;padding:0 4px}
/* ===== HODINY: obrázky v otázkach, opakovaná kontrola, záverečný test so zámkom ===== */
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:16px;align-items:start}
.qpic{margin:0;background:#fff;border:1px solid var(--border);border-radius:12px;padding:6px}
.qpic svg{width:100%;height:auto;display:block}
@media (max-width:640px){.qrow{grid-template-columns:1fr}.qpic{max-width:260px}}
.tpic{margin:0 0 14px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px;max-width:520px}
.tpic svg{width:100%;height:auto;display:block}
.retry{margin-left:auto}
.lockban{background:#FFF8E1;border:1px solid #F2D27A;border-radius:12px;padding:10px 14px;margin:0 0 16px;font-weight:600;font-size:15.5px;color:#3A2E00}
.ro .task button:not([data-go]),.ro #ubbox button{pointer-events:none}
.tstart{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:20px 22px;margin:14px 0}
.tstart .warn{background:var(--badSoft);border-left:5px solid var(--bad);border-radius:0 10px 10px 0;padding:10px 14px;margin:12px 0;font-weight:600}
.confirm{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px}
.tq{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin:0 0 16px}
.tq .qh{display:flex;gap:10px;font-weight:600;margin-bottom:10px}
.tq .qh .pt{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.tq .tqfig{margin:0 auto 12px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px;max-width:560px}
.tq .tqfig svg{width:100%;height:auto;display:block}
.tq .fb{font-size:15px;margin:10px 0 0;padding:8px 12px;border-radius:8px}
.tq .fb.good{background:var(--okSoft)}.tq .fb.miss{background:var(--badSoft)}
.hz{fill:rgba(47,91,234,.001);stroke:transparent;stroke-width:3;cursor:pointer;transition:fill .12s}
.hz:hover,.hz:focus{fill:rgba(47,91,234,.16);stroke:#2F5BEA;outline:none}
.hz.hsel{fill:rgba(47,91,234,.30);stroke:#2F5BEA;stroke-width:4}
.hz.hok{fill:rgba(18,128,90,.28);stroke:#12805A;stroke-width:4}
.hz.hbad{fill:rgba(192,57,43,.28);stroke:#C0392B;stroke-width:4}
.hz.hmiss{fill:rgba(18,128,90,.10);stroke:#12805A;stroke-width:3;stroke-dasharray:7 5}
.done .hz{cursor:default}
.mtt{border-collapse:collapse;width:100%;font-size:15.5px}
.mtt td{padding:7px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.mtt td:first-child{font-weight:700;width:30%;font-family:var(--mono)}
.mtt select{font:inherit;width:100%;max-width:420px;padding:8px 10px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--ink)}
.mtt select.good{border-color:var(--ok);background:var(--okSoft)}.mtt select.badsel{border-color:var(--bad);background:var(--badSoft)}
@media (max-width:560px){.mtt td{display:block;width:100%!important;border:0;padding:3px 0}.mtt tr{display:block;padding:8px 0;border-bottom:1px solid var(--border)}}
.bslots{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--mono);background:var(--surface2);border:1.5px solid var(--border);border-radius:14px;padding:8px 14px;min-height:48px;margin-bottom:10px}
.bslots .bs{border:1.5px dashed var(--border);border-radius:8px;padding:5px 10px;color:var(--muted);min-width:70px;text-align:center}
.bslots button.bs{border-style:solid;color:var(--ink);background:var(--surface);cursor:pointer;font:inherit;font-family:var(--mono)}
.bslots .bs.ok{border-color:var(--ok);background:var(--okSoft)}.bslots .bs.bad{border-color:var(--bad);background:var(--badSoft)}
.pwpieces{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.pwbar{font-family:var(--mono);font-size:17px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:8px 14px;min-height:44px;max-width:420px;margin:4px 0 8px;overflow-wrap:anywhere}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main" tabindex="-1"></main>

<script>

const VEDEL = t => `<div class="vedel"><b>💡 Vedel si?</b> ${t}</div>`;
const ltfigs = (...a) => `<div class="tfigs${a.length === 1 ? " one" : ""}">${a.join("")}</div>`;
function typo(root) { if (!root) return; const W = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement && n.parentElement.closest("code,pre,script,style,textarea,.bits,.asc,svg,.cm,.code,.editor") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const L = []; while (W.nextNode()) L.push(W.currentNode);
  L.forEach(n => { let t = n.nodeValue, o = t;
    t = t.replace(/([A-Za-z])-(?=\d)/g, "$1‑").replace(/(\d) (?=[\p{L}%°€])/gu, "$1 ").replace(/(\d) ([–-]) (?=\d)/g, "$1 $2 ");
    for (let i = 0; i < 2; i++) t = t.replace(/(^|[\s („])([vkszaiouVKSZAIOU]) /g, "$1$2 ");
    if (t !== o) n.nodeValue = t; }); }

/* Ak chcete výsledky automaticky zbierať do Google Formulára, vyplňte URL formulára
   (…/viewform) a identifikátory polí entry.XXXX z predvyplneného odkazu. */
const RESULTS_FORM = { url: "https://docs.google.com/forms/d/e/1FAIpQLSfZYJMbWx16Rwk0I-baKi8fAWzEKxdRr5_QtiEXUxn_PcnnQg/viewform", post: "https://docs.google.com/forms/d/e/1FAIpQLSfZYJMbWx16Rwk0I-baKi8fAWzEKxdRr5_QtiEXUxn_PcnnQg/formResponse", entries: { meno: "entry.1474825380", trieda: "entry.1595709580", hodina: "entry.2116247609", body: "entry.635405102", detail: "entry.348187999" } };
function qOrder(T) { /* premiešané poradie otázok pre každého žiaka; nadväzujúce otázky (QGLUE) ostávajú za predchádzajúcou */
  const G = (typeof QGLUE !== "undefined" && QGLUE[T.id]) || [], groups = [];
  T.qs.forEach((q, i) => { if (G.includes(i + 1) && groups.length) groups[groups.length - 1].push(q); else groups.push([q]); });
  if (groups.length < 2) return T.qs;
  const key = T.id + ":qo", ids = groups.map(g => g[0].id); let o = S.ord[key];
  if (!o || o.length !== ids.length || !ids.every(x => o.includes(x))) { o = ids.slice(); let n = 0; do { shuffle(o); n++; } while (n < 10 && o.every((x, i) => x === ids[i])); S.ord[key] = o; save(); }
  return o.flatMap(id => groups.find(g => g[0].id === id)); }
function sendResults(detail) { /* automatické odoslanie výsledku do Google Formulára */
  const E = RESULTS_FORM.entries, pct = Math.round(total() / MAX * 100), when = new Date(S.finished || Date.now()).toLocaleString("sk-SK");
  const p = new URLSearchParams(); p.set(E.meno, S.name.trim()); p.set(E.trieda, S.cls.trim()); p.set(E.hodina, typeof LESSON !== "undefined" ? LESSON : document.title); p.set(E.body, `${total()}/${MAX} (${pct} %)`); p.set(E.detail, String(pct >= 90 ? 1 : pct >= 75 ? 2 : pct >= 50 ? 3 : pct >= 30 ? 4 : 5));
  const key = [S.name.trim(), S.cls.trim(), total(), S.finished].join("|");
  const st = (t, c) => { const el = document.getElementById("sendst"); if (el) { el.textContent = t; el.style.color = c || ""; } };
  if (S.sentKey !== key && !S.sending) { S.sending = true;
    fetch(RESULTS_FORM.post, { method: "POST", mode: "no-cors", body: p }).then(() => { S.sentKey = key; S.sending = false; save(); st("✅ Výsledok bol odoslaný učiteľovi.", "#1E7B34"); })
      .catch(() => { S.sending = false; st("⚠️ Výsledok sa nepodarilo odoslať (asi nie je internet). Pripoj sa na internet a obnov stránku, výsledok sa odošle znova.", "#B3261E"); }); }
  return `<span id="sendst" style="font-weight:600;${S.sentKey === key ? "color:#1E7B34" : ""}">${S.sentKey === key ? "✅ Výsledok bol odoslaný učiteľovi." : "⏳ Odosiela sa výsledok učiteľovi…"}</span>`; }

function maxOf(T) { return T.type === "itest" ? T.qs.length : T.type === "mc" ? T.qs.length : T.type === "custom" ? T.max : T.items.length; }
const MAX = Object.values(TASKS).reduce((a, T) => a + maxOf(T), 0);

function fresh() { return { v: 1, name: "", cls: "Prima", guess: null, cur: 0, started: null, finished: null, testLocked: false, tconfirm: false, t: {}, d: {}, ord: {}, ftp: null, http: [], httpLast: null, pw: "" }; }
function load() { try { const r = localStorage.getItem(KEY); if (r) { const o = JSON.parse(r); if (o && o.v === 1) return o; } } catch (e) {} return null; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = load() || fresh();
let SEL = null;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function ord(key, ids, keep) {
  if (!S.ord[key]) {
    let o = ids.slice();
    if (!keep) { let n = 0; do { shuffle(o); n++; } while (n < 10 && o.length > 1 && o.every((x, i) => x === ids[i])); }
    S.ord[key] = o; save();
  }
  return S.ord[key];
}
const total = () => Object.values(S.t).reduce((a, x) => a + x.score, 0);
function stepDone(i) {
  const id = STEPS[i].id;
  if (id === "start") return !!S.started;
  if (id === "vysledok") return !!S.t.test;
  return STEP_TASKS[id].every(t => S.t[t]);
}

/* ---------- Header ---------- */
function renderTop() {
  const reached = i => i <= S.cur || stepDone(i);
  document.getElementById("top").innerHTML = `
    <div class="topbar">
      <div class="brand"><span class="dot" aria-hidden="true"></span>1.2 Vznik a história internetu</div>
      <div class="pts" aria-live="polite">⭐ <b>${total()}</b> z ${MAX}</div>
      ${S.testLocked ? "" : `<button class="reset" data-reset>↺ Začať odznova</button>`}
    </div>
    <nav class="line" aria-label="Zastávky hodiny">
      ${STEPS.map((s, i) => { const testI = STEPS.findIndex(x => x.id === "test"), lockedBack = S.testLocked && !S.t.test && i < testI; return `<button class="stn ${i === S.cur ? "cur" : ""} ${stepDone(i) ? "done" : ""} ${reached(i) ? "reached" : ""}" data-go="${i}" ${(!S.started && i > 0) || lockedBack ? "disabled" : ""} ${lockedBack ? 'title="Po spustení záverečného testu sú zastávky uzamknuté."' : ""} ${i === S.cur ? 'aria-current="step"' : ""}>
        <span class="c">${stepDone(i) ? "✓" : ""}</span><span class="l">${s.title}</span><span class="m">${s.min ? s.min + " min" : "cieľ"}</span></button>`; }).join("")}
    </nav>`;
}

/* ---------- Generic tasks ---------- */
const REVEAL = () => !!S.testLocked;                 /* po spustení testu sa v zastávkach ukážu správne odpovede */
const RO = () => !!S.testLocked && !["test", "vysledok"].includes(STEPS[S.cur].id); /* zastávky len na prezeranie */
const pic = (k, cl) => k && QIMG[k] ? `<figure class="${cl || "qpic"}">${QIMG[k]}</figure>` : "";
function checkBar(T, ready, hint) {
  const r = S.t[T.id];
  if (r) return `<div class="checkbar"><span class="score ${r.score < r.max ? "part" : ""}">${r.skip ? "Úlohu si pred testom nevyriešil: 0 bodov" : (r.score === r.max ? "Výborne! " : "") + `Získal si ${r.score} z ${r.max} ${r.max === 1 ? "bodu" : "bodov"}`}</span>${!S.testLocked && r.score < r.max ? `<button class="ghost retry" data-retry="${T.id}">↺ Opraviť a skontrolovať znova</button>` : ""}</div>`;
  return `<div class="checkbar"><button class="primary" data-check="${T.id}" ${ready ? "" : "disabled"}>Skontrolovať</button>${ready ? "" : `<span class="hint">${hint || "Najprv vyrieš všetko, potom skontroluj."}</span>`}</div>`;
}

function mcHTML(T) {
  const done = S.t[T.id], d = S.d[T.id] || {}, rv = REVEAL();
  return qOrder(T).map((q, qi) => {
    const o = ord(T.id + ":" + q.id, q.opts.map((_, i) => i), T.keep), good = d[q.id] === q.a;
    const opts = `<div class="opts">` + o.map(i => {
        let c = "opt";
        if (d[q.id] === i) c += " sel";
        if (done) { if (rv && i === q.a) c += " ok"; else if (d[q.id] === i) c += i === q.a ? " ok" : " bad"; }
        return `<button class="${c}" data-mc="${T.id}|${q.id}|${i}" aria-pressed="${d[q.id] === i}" ${done ? "disabled" : ""}>${q.opts[i]}</button>`;
      }).join("") + `</div>${done && q.why && (good || rv) ? `<p class="why ${good ? "good" : "miss"}">${q.why}</p>` : done && !good ? `<p class="why miss">Toto nie je správne. Oprav odpoveď a skontroluj znova.</p>` : ""}`;
    return `<fieldset class="q"><legend><span class="qn">${qi + 1}</span><span>${q.q}</span></legend>${q.img ? `<div class="qrow"><div>${opts}</div>${pic(q.img)}</div>` : opts}</fieldset>`;
  }).join("") + checkBar(T, T.qs.every(q => d[q.id] !== undefined), "Odpovedz na všetky otázky.");
}

function sortHTML(T) {
  const done = S.t[T.id], d = S.d[T.id] || {};
  const ids = ord(T.id, T.items.map(x => x.id), T.keep);
  const by = Object.fromEntries(T.items.map(x => [x.id, x]));
  const chip = id => {
    let c = "chip" + (T.mono ? " mono" : "");
    if (SEL && SEL.t === T.id && SEL.i === id) c += " sel";
    if (done) c += d[id] === by[id].b ? " ok" : " bad";
    return `<button class="${c}" data-pick="${T.id}|${id}" draggable="${done ? "false" : "true"}" ${done ? "disabled" : ""}>${by[id].text}</button>`;
  };
  const pool = ids.filter(id => !d[id]);
  return pic(T.img, "tpic") + (done ? "" : `<div class="pool ${T.mono ? "urlpool" : ""}" data-bucket="${T.id}|">${pool.length ? pool.map(chip).join("") : '<span class="empty">Všetky kartičky sú roztriedené. Kartičku presunieš tak, že na ňu klikneš a potom klikneš na iný kôš.</span>'}</div>`) +
    `<div class="buckets">${T.buckets.map(b => `<div class="bucket" data-bucket="${T.id}|${b.id}"><div class="bh">${b.label}</div><div class="bc">${ids.filter(id => d[id] === b.id).map(chip).join("")}</div></div>`).join("")}</div>` +
    (done && T.after && (done.score === done.max || REVEAL()) ? `<p class="why good" style="margin-top:12px">${T.after}</p>` : "") +
    checkBar(T, ids.every(id => d[id]), "Roztrieď všetky kartičky.");
}

function orderHTML(T) {
  const done = S.t[T.id], seq = S.d[T.id] || [];
  const ids = ord(T.id, T.items.map(x => x.id));
  const by = Object.fromEntries(T.items.map(x => [x.id, x]));
  const pool = ids.filter(id => !seq.includes(id));
  let h = pic(T.img, "tpic") + `<ol class="seq">` + T.items.map((_, i) => {
    const id = seq[i];

function taskHTML(id) { const T = TASKS[id]; return T.type === "itest" ? testHTML(T) : T.type === "mc" ? mcHTML(T) : T.type === "sort" ? sortHTML(T) : orderHTML(T); }

let TSEL = null;
const TA = () => (S.d.test = S.d.test || {});
function tAnswered(q) { const a = TA()[q.id];
  if (q.kind === "order") return Array.isArray(a) && a.length === q.items.length;
  if (q.kind === "match") return !!a && q.rows.every((_, i) => a[i] !== undefined && a[i] !== "");
  if (q.kind === "hot") return !!a;
  if (q.kind === "sort") return !!a && q.items.every((_, i) => a[i] !== undefined);
  if (q.kind === "build") return Array.isArray(a) && a.length === q.a.length;
  return false; }
function tOk(q) { const a = TA()[q.id]; if (!tAnswered(q)) return false;
  if (q.kind === "order") return a.every((x, i) => x === i);
  if (q.kind === "match") return q.rows.every((r, i) => +a[i] === i);
  if (q.kind === "hot") return a === q.a;
  if (q.kind === "sort") return q.items.every((it, i) => a[i] === it[1]);

      return `<li class="slot ${done ? (k === i ? "ok" : "bad") : ""}"><span class="n">${i + 1}</span><button class="slotbtn" data-tun="${q.id}|${k}" ${done ? "disabled" : ""}><span>${q.items[k][0]}</span>${done ? `<b class="extra">${q.items[k][1]}</b>` : ""}</button></li>`; }).join("") + `</ol>`;
    if (!done) { const rest = P.filter(k => !seq.includes(k)); h += `<div class="pool">${rest.length ? rest.map(k => `<button class="chip" data-tord="${q.id}|${k}">${q.items[k][0]}</button>`).join("") : '<span class="empty">Všetko je poukladané. Kartičku vrátiš kliknutím na ňu hore.</span>'}</div>`; }
    return h + (done && !tOk(q) ? `<p class="fb miss">Správne poradie: ${q.items.map(x => `${x[0]} (${x[1]})`).join(" → ")}</p>` : ""); }
  if (q.kind === "match") {

  if (q.kind === "hot") return `<p class="muted" style="margin:0;font-size:15px">${a ? `Vybral si: <b>${q.names[a]}</b>` : "Zatiaľ si nič nevybral. Klikni na miesto v obrázku."}</p>${done && !tOk(q) ? `<p class="fb miss">Správne: ${q.names[q.a]}</p>` : ""}`;
  if (q.kind === "sort") {
    const P = ord("test:" + q.id, q.items.map((_, i) => i)), v = a || {};
    let h = `<div class="buckets">${q.groups.map((g, gi) => `<div class="bucket" data-tg="${q.id}|${gi}"><div class="bh">${g}</div><div class="bc">${P.filter(i => v[i] === gi).map(i => done
      ? `<span class="chip ${q.items[i][1] === gi ? "ok" : "bad"}">${q.items[i][0]}</span>` : `<button class="chip" data-tus="${q.id}|${i}" title="Kliknutím vrátiš kartičku späť">${q.items[i][0]}</button>`).join("")}</div></div>`).join("")}</div>`;
    if (!done) { const rest = P.filter(i => v[i] === undefined); h = `<div class="pool">${rest.length ? rest.map(i => `<button class="chip ${TSEL && TSEL.q === q.id && TSEL.i === i ? "sel" : ""}" data-tpk="${q.id}|${i}">${q.items[i][0]}</button>`).join("") : '<span class="empty">Všetko je roztriedené. Kartičku vrátiš kliknutím na ňu v skupine.</span>'}</div>` + h; }

}

/* ---------- Render ---------- */
const main = document.getElementById("main");
function render(toTop) {
  renderTop();
  const ro = RO();
  main.classList.toggle("ro", ro);
  main.innerHTML = (ro ? `<div class="lockban">🔒 Záverečný test ${S.t.test ? "je hotový" : "už beží"}. Zastávku si môžeš iba prezrieť, nič v nej nezmeníš.</div>` : "") + VIEWS[STEPS[S.cur].id](); typo(main);
  if (toTop) { window.scrollTo(0, 0); const c = document.querySelector(".stn.cur"); if (c) c.scrollIntoView({ block: "nearest", inline: "center" }); }
}
function go(i) {
  if (!S.started && i > 0) return;
  const testI = STEPS.findIndex(x => x.id === "test");
  if (S.testLocked && !S.t.test && i < testI) return;
  S.cur = i; SEL = null; TSEL = null; S.tconfirm = false; save(); render(true);
}

function scramble() { const h = "0123456789abcdef"; let s = ""; for (let i = 0; i < 40; i++) s += h[Math.floor(Math.random() * 16)]; return s.replace(/(.{8})/g, "$1 ").trim(); }

let resetArmed = null;
document.addEventListener("click", e => {
  const hz = e.target.closest && e.target.closest(".hz");
  if (hz) { const f = hz.closest("[data-hq]"); if (f && STEPS[S.cur].id === "test" && S.testLocked && !S.t.test) { TA()[f.dataset.hq] = hz.dataset.z; save(); render(false); } return; }
  const el = e.target.closest("button,[data-bucket],[data-tg]");
  if (!el) return;
  const ds = el.dataset;
  if (ds.go !== undefined) return go(+ds.go);
  if (ds.reset !== undefined) { if (S.testLocked) return;
    if (!resetArmed) { el.classList.add("arm"); el.textContent = "Naozaj? Klikni znova"; resetArmed = setTimeout(() => { resetArmed = null; renderTop(); }, 3000); return; }
    clearTimeout(resetArmed); resetArmed = null;
    const keep = { name: S.name, cls: S.cls };
    S = fresh(); S.name = keep.name; S.cls = keep.cls; SEL = null; save(); return render(true);
  }
  if (ds.start !== undefined) { if (!S.started) S.started = Date.now(); return go(1); }
  if (RO()) return;                                   /* zastávky po spustení testu: len prezeranie */
  if (ds.tstart !== undefined) { S.tconfirm = true; save(); return render(false); }
  if (ds.tno !== undefined) { S.tconfirm = false; save(); return render(false); }
  if (ds.tyes !== undefined) {
    S.testLocked = true; S.tconfirm = false; S.testStarted = Date.now();
    Object.keys(STEP_TASKS).filter(k => k !== "test").forEach(k => STEP_TASKS[k].forEach(t => { if (!S.t[t]) S.t[t] = { score: 0, max: maxOf(TASKS[t]), skip: true }; }));
    save(); return render(true);
  }
  if (ds.retry) { if (S.testLocked) return; delete S.t[ds.retry]; save(); return render(false); }
  if (ds.pwp !== undefined) { if (S.pw.length < 24) S.pw += PWP[+ds.pwp]; save(); return render(false); }
  if (ds.pwclr !== undefined) { S.pw = ""; save(); return render(false); }
  if (STEPS[S.cur].id === "test" && S.testLocked && !S.t.test) {
    const A = TA(), Q = id => TASKS.test.qs.find(x => x.id === id);
    if (ds.tord) { const [q, k] = ds.tord.split("|"); const s = A[q] = A[q] || []; if (!s.includes(+k)) s.push(+k); save(); return render(false); }
    if (ds.tun) { const [q, k] = ds.tun.split("|"); A[q] = (A[q] || []).filter(x => x !== +k); save(); return render(false); }
    if (ds.tpk) { const [q, i] = ds.tpk.split("|"); TSEL = TSEL && TSEL.q === q && TSEL.i === +i ? null : { q, i: +i }; return render(false); }
    if (ds.tus) { const [q, i] = ds.tus.split("|");
      if (TSEL && TSEL.q === q && A[q]) { A[q][TSEL.i] = A[q][i]; TSEL = null; save(); return render(false); } /* vybraná kartička ide do skupiny, na ktorú som klikol */
      if (A[q]) delete A[q][i]; save(); return render(false); }
    if (ds.tg) { const [q, g] = ds.tg.split("|"); if (!TSEL || TSEL.q !== q) return; (A[q] = A[q] || {})[TSEL.i] = +g; TSEL = null; save(); return render(false); }
    if (ds.tb) { const [q, k] = ds.tb.split("|"); const s = A[q] = A[q] || []; if (s.length < Q(q).a.length && !s.includes(+k)) s.push(+k); save(); return render(false); }
    if (ds.tbu) { const [q, i] = ds.tbu.split("|"); A[q] = (A[q] || []).filter((_, j) => j !== +i); save(); return render(false); }
  }
  if (ds.guess !== undefined) { S.guess = +ds.guess; save(); return render(false); }
  if (ds.check) return check(ds.check);
  if (ds.mc) { const [t, q, i] = ds.mc.split("|"); if (S.t[t]) return; (S.d[t] = S.d[t] || {})[q] = +i; save(); return render(false); }
  if (ds.place) { const [t, id] = ds.place.split("|"); if (S.t[t]) return; const s = S.d[t] = S.d[t] || []; if (!s.includes(id)) s.push(id); save(); return render(false); }
  if (ds.unplace) { const [t, id] = ds.unplace.split("|"); if (S.t[t]) return; S.d[t] = (S.d[t] || []).filter(x => x !== id); save(); return render(false); }
  if (ds.pick) { const [t, id] = ds.pick.split("|"); if (S.t[t]) return; SEL = SEL && SEL.t === t && SEL.i === id ? null : { t, i: id }; return render(false); }
  if (ds.bucket !== undefined) { const [t, b] = ds.bucket.split("|"); return placeSel(t, b); }
  if (ds.http) {
    const pw = (S.pw || "").trim(); if (pw.length < 4) return;
    S.httpLast = { p: ds.http, pw, x: scramble() };
    if (!S.http.includes(ds.http)) S.http.push(ds.http);
    if (S.http.length === 2 && !S.t.httpdemo) S.t.httpdemo = { score: 1, max: 1 };
    save(); return render(false);
  }
  if (ds.fsel) { const [s, n] = ds.fsel.split("|"); S.ftp.sel = S.ftp.sel && S.ftp.sel.s === s && S.ftp.sel.n === n ? null : { s, n }; save(); return render(false); }
  if (ds.ftp) {
    const F = S.ftp, n = F.sel && F.sel.n; if (!n) return;
    if (ds.ftp === "up") {
      F.log.push("> STOR " + n);
      if (F.remote.includes(n)) F.log.push("550 Súbor " + n + " už na serveri je");
      else { F.remote.push(n); F.log.push("226 Súbor nahraný na server"); F.goals["up:" + n] = true; }
    } else {
      F.log.push("> RETR " + n);
      if (F.local.includes(n)) F.log.push("550 Súbor " + n + " už v počítači máš");
      else { F.local.push(n); F.log.push("226 Súbor stiahnutý do počítača"); F.goals["down:" + n] = true; }
    }
    F.log = F.log.slice(-12); F.sel = null;
    if (F.goals["up:index.html"] && F.goals["up:obrazok.png"] && F.goals["down:rozvrh.pdf"] && !S.t.ftpsim) S.t.ftpsim = { score: 3, max: 3 };
    save(); render(false);
    const lg = document.querySelector(".log"); if (lg) lg.scrollTop = lg.scrollHeight;
    return;
  }
  if (ds.copy !== undefined) {
    const ta = document.getElementById("restxt"), out = document.getElementById("copied");
    const ok = () => { out.textContent = "Skopírované ✓"; };
    const fallback = () => { ta.focus(); ta.select(); try { document.execCommand("copy") ? ok() : (out.textContent = "Označ text a stlač Ctrl+C."); } catch (err) { out.textContent = "Označ text a stlač Ctrl+C."; } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok, fallback); else fallback();
  }
});

function placeSel(t, b) {
  if (!SEL || SEL.t !== t || S.t[t]) return;
  const d = S.d[t] = S.d[t] || {};
  if (b) d[SEL.i] = b; else delete d[SEL.i];
  SEL = null; save(); render(false);
}

document.addEventListener("change", e => {
  const m = e.target.dataset && e.target.dataset.tm; if (!m || S.t.test || !S.testLocked) return;
  const [q, i] = m.split("|"); (TA()[q] = TA()[q] || {})[i] = e.target.value; save(); render(false);
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("hz")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });
document.addEventListener("input", e => {
  const f = e.target.dataset.field; if (!f) return;
  S[f] = e.target.value; save();
  if (STEPS[S.cur].id === "start") {
    const btn = document.querySelector("[data-start]"), h = document.getElementById("starthint");
    const ok = S.name.trim().length >= 3;
    if (btn) btn.disabled = !ok || S.guess === null;
    if (h) h.textContent = ok ? (S.guess === null ? "Vyber svoj tip." : "") : "Napíš svoje meno a vyber tip.";
  }
});

/* drag & drop for sorting */
document.addEventListener("dragstart", e => {
  const p = e.target.closest && e.target.closest("[data-pick]"); if (!p) return;
  const [t, id] = p.dataset.pick.split("|"); if (S.t[t] || RO()) return e.preventDefault();
  SEL = { t, i: id }; try { e.dataTransfer.setData("text/plain", id); e.dataTransfer.effectAllowed = "move"; } catch (err) {}
});
document.addEventListener("dragover", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (b && SEL) { e.preventDefault(); b.classList.add("over"); } });
document.addEventListener("dragleave", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (b && !b.contains(e.relatedTarget)) b.classList.remove("over"); });
document.addEventListener("drop", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (!b) return; e.preventDefault(); const [t, bk] = b.dataset.bucket.split("|"); placeSel(t, bk); });
document.addEventListener("dragend", () => { document.querySelectorAll(".over").forEach(x => x.classList.remove("over")); });

if (!S.started) S.cur = 0;
render(true);
</script>
</body>
</html>
