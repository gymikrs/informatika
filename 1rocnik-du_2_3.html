.bins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.panel{background:#FFFDF5;border:3px solid #16213A;border-radius:6px;padding:10px;display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:start;color:#16213A;box-shadow:4px 4px 0 #16213A;min-width:0}

  const L = []; while (W.nextNode()) L.push(W.currentNode);
  L.forEach(n => { let t = n.nodeValue, o = t;
    t = t.replace(/([A-Za-z])-(?=\d)/g, "$1‑").replace(/(\d) (?=[\p{L}%°€⭐×])/gu, "$1 ").replace(/(\d) ([–-]) (?=\d)/g, "$1 $2 ").replace(/(\d) (?=\d{3}\b)/g, "$1 ").replace(/(×) (?=\d)/g, "$1 ");

/* čas vypracovania (DOMACA): pripíše sa k bodom */
function durTxt() { if (!S.started || !S.finished) return ""; let t = Math.max(0, Math.round((S.finished - S.started) / 1000)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;

      .catch(() => { S.sending = false; st("⚠️ Výsledok sa nepodarilo odoslať (asi nie je internet). Pripoj sa na internet a obnov stránku, výsledok sa odošle znova.", "#B3261E"); }); }

}
/* záznam o odovzdaní */
function doneRec() { try { let r = localStorage.getItem(DONE_KEY); if (r) return JSON.parse(r);
    for (const k of OLD_DONE_KEYS) { r = localStorage.getItem(k); if (r) { const o = JSON.parse(r); o.grade = o.grade || gradeOf(o.score, o.max || MAX); o.attempts = Math.min(o.attempts || 1, 1); o.old = true; return o; } } } catch (e) {} return null; }

    document.getElementById("main").innerHTML = can ? `<div class="result"><h2>🔁 Oprava domácej úlohy</h2>${say(`${esc(L.name)} (${esc(L.cls)}), v prvom pokuse si získal/a <b>${L.score} z ${L.max || MAX} ⭐</b> (známka ${L.grade}). Máš ešte <b>jednu opravu</b>. Je to posledný pokus.`)}<div class="row"><button class="primary" data-retry>🔁 Začať opravu</button></div></div>`

  const y = window.scrollY; renderTop(); const m = document.getElementById("main"); m.innerHTML = VIEWS[STEPS[S.cur].id](); typo(m); typo(document.getElementById("top"));
  window.scrollTo({ top: scroll ? 0 : y }); }
function scoreOf(id) {
  const TK = TASKS[id], d = S.d[id] || {}; let sc = 0;
  if (TK.type === "mc") sc = TK.qs.filter(q => d[q.id] === q.a).length;
  if (TK.type === "sort") sc = Math.floor(TK.items.filter(x => d[x.id] === x.a).length / 2);
  if (TK.type === "zoom") sc = Math.floor(ZI.filter(o => d[o.id] === o.k).length / 2);

  if (TK.type === "lab") sc = labScore();

function check(id) { if (id === "conv") { S.cvd = null; S.cvf = null; } award(id, scoreOf(id)); save(); render(false); }

function finishEarly() { Object.keys(TASKS).forEach(id => { if (!S.t[id]) award(id, scoreOf(id)); }); S.cvd = null; S.early = true; S.confirmEarly = false; S.finished = Date.now(); }

const upd = () => { save(); render(false); };
document.addEventListener("click", e => {
