<script>
const THEORY = {"media": ["Krútená dvojlinka (UTP, FTP, STP), koaxiálny kábel, optický kábel (singlemode, multimode), bezdrôtový prenos."], "utp": ["UTP: 8 žíl, 4 krútené páry, najviac 100 m. Cat5e a Cat6 = 1 Gb/s, Cat6a = 10 Gb/s na 100 m."], "zapojenie": ["T568B: bielo-oranžová, oranžová, bielo-zelená, modrá, bielo-modrá, zelená, bielo-hnedá, hnedá.", "Priamy kábel = oba konce rovnako, krížený = T568A + T568B (1↔3, 2↔6). Auto-MDI/X rieši prehodenie samo."], "krimpovanie": ["Odizolovať → rozpliesť → zoradiť → zastrihnúť → zasunúť → skontrolovať → zalisovať → otestovať."], "precvic": ["Do 100 m UTP, rušenie = tienený, veľká vzdialenosť = optika, 10 Gb/s = Cat6a."]};
/* spoločné pomocné funkcie pre 1. ročník (n34+) */
const Q = (q, opts, a, why) => ({ q, opts, a, why });
const inq = (id, q, ans, tol, why, unit) => ({ id, q, ok: v => Math.abs(parseNum(String(v).replace(/\s/g, "")) - ans) <= tol, show: String(ans).replace(".", ","), ph: "?", why, unit });
const txq = (id, q, re, show, why) => ({ id, q, ok: v => re.test(String(v).trim()), show, ph: "?", why });
function selBlock(key, items, opts) { const D = S[key + "d"], V = S[key] || (S[key] = {}); return items.map(([t, ok, why], i) => `<div class="selr"><span>${i + 1}. ${t}${D ? `<br><small>${V[i] === ok ? "✔️ správne" : "❌ správne: " + opts.find(o => o[0] === ok)[1]}${why ? " – " + why : ""}</small>` : ""}</span><select data-sel="${key}|${i}" ${D ? "disabled" : ""}><option value="">— vyber —</option>${opts.map(([v, l]) => `<option value="${v}" ${V[i] === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>`).join("") + (D ? `<div class="row"><button class="ghost" data-selr="${key}">↺ Skúsiť znova</button></div>` : `<div class="row"><button class="primary" data-selok="${key}">✔ Vyhodnotiť</button></div>`); }
function selClick(e, defs) { const el0 = e.target.closest && e.target.closest("button"); if (!el0) return false; const k = el0.dataset.selok || el0.dataset.selr; if (!k || !defs[k]) return false; const [items, gid] = defs[k]; S[k] = S[k] || {};
  if (el0.dataset.selok) { if (items.some((_, i) => !S[k][i])) { alert("Vyber odpoveď pri všetkých položkách."); return true; } S[k + "d"] = true; const n = items.filter((x, i) => S[k][i] === x[1]).length; if (!S.t[gid] || S.t[gid].score < n) award(gid, n); } else { S[k + "d"] = false; S[k] = {}; } save(); render(false); return true; }
function selInput(e) { const t = e.target; if (t.dataset && t.dataset.sel) { const [k, i] = t.dataset.sel.split("|"); S[k] = S[k] || {}; S[k][i] = t.value; save(); return true; } return false; }
function goalsHTML(list, gid) { const n = list.filter(g => g[0]).length, T = TASKS[gid]; return `<ul class="goals">${list.map(([ok, t]) => `<li>${ok ? "✅" : "⬜"} ${t}</li>`).join("")}</ul>${S.t[gid] ? `<div class="checkbar"><span class="score ${S.t[gid].score < T.max ? "part" : ""}">Splnené: ${S.t[gid].score} z ${T.max}</span></div>` : ""}`; }
function goalAward(gid, list) { const n = list.filter(g => g[0]).length; if (n && (!S.t[gid] || S.t[gid].score < n)) { award(gid, n); save(); return true; } return false; }

const KEY = "kable-m52-v1";

const START = {
  kicker: "Informatika, 2. ročník",

  guessQ: "Koľko žíl (vodičov) má sieťový kábel UTP?",
  guessNote: "Tip sa neboduje. Na zastávke Kábel UTP a kategórie zistíš, či si mal pravdu.",
  guesses: ["2", "8 (4 krútené páry)", "4", "16"],
  ok: 1, yes: "Presne tak! 8 žíl v 4 krútených pároch: oranžový, zelený, modrý a hnedý.", no: "8 žíl v 4 krútených pároch: oranžový, zelený, modrý a hnedý. Každý pár má plnú a bielo-farebnú žilu."
};
const WC = { wo: ["bielo-oranžová", "#FB8C00", 1], o: ["oranžová", "#FB8C00", 0], wg: ["bielo-zelená", "#43A047", 1], g: ["zelená", "#43A047", 0], wb: ["bielo-modrá", "#1E88E5", 1], b: ["modrá", "#1E88E5", 0], wn: ["bielo-hnedá", "#795548", 1], n: ["hnedá", "#795548", 0] };
const T568B = ["wo", "o", "wg", "b", "wb", "g", "wn", "n"], T568A = ["wg", "g", "wo", "b", "wb", "o", "wn", "n"];
function EXTRA_STATE() { return { ca: [], cb: [], tst: null, cg: {} }; }
const sw = k => { const [, c, w] = WC[k]; return w ? `background:repeating-linear-gradient(90deg,#fff 0 6px,${c} 6px 12px)` : `background:${c}`; };
function conHTML(side) { const arr = S["c" + side]; return `<div class="con"><b>Koniec ${side.toUpperCase()}</b><div class="pins">${Array.from({ length: 8 }, (_, i) => `<div class="pin" data-pin="${side}|${i}" title="${arr[i] ? WC[arr[i]][0] : "prázdny"}"><span class="pn">${i + 1}</span><span class="wire" style="${arr[i] ? sw(arr[i]) : "background:#EEE"}"></span></div>`).join("")}</div><div class="pal">${Object.keys(WC).map(k => `<button class="wcol" data-wc="${side}|${k}" style="${sw(k)}" title="${WC[k][0]}" ${arr.includes(k) ? "disabled" : ""}></button>`).join("")}</div><button class="ghost" data-wclr="${side}" style="margin-top:4px">Vymazať</button></div>`; }
function testCable() { const A = S.ca, B = S.cb; if (A.length < 8 || B.length < 8) return { err: "Oba konce musia mať zapojených všetkých 8 žíl." }; const map = A.map(c => B.indexOf(c)); const straight = map.every((j, i) => j === i), cross = [2, 5, 0, 3, 4, 1, 6, 7].every((j, i) => map[i] === j);
  const stdA = s => JSON.stringify(s) === JSON.stringify(T568A), stdB = s => JSON.stringify(s) === JSON.stringify(T568B);
  return { map, straight, cross, std: (stdA(A) || stdB(A)) && (stdA(B) || stdB(B)), bothB: stdB(A) && stdB(B), ab: (stdB(A) && stdA(B)) || (stdA(A) && stdB(B)) }; }
function testerHTML() { const T = S.tst; if (!T) return ""; if (T.err) return `<p class="why miss">${T.err}</p>`;
  return `<div class="tester"><div>${T.map.map((j, i) => `<div class="led on">${i + 1}</div>`).join("")}</div><div class="tarr">→</div><div>${Array.from({ length: 8 }, (_, k) => `<div class="led ${T.map.includes(k) ? "on" : ""}">${k + 1}</div>`).join("")}</div><div class="tres">${T.map.map((j, i) => `${i + 1}→${j + 1}`).join(" · ")}</div></div>
  <p class="why ${T.std && (T.straight || T.cross) ? "good" : "miss"}">${T.straight ? (T.bothB ? "✅ Priamy kábel podľa T568B." : T.std ? "✅ Priamy kábel (oba konce T568A)." : "⚠️ Spoje sedia 1→1 … 8→8, ale farby nezodpovedajú norme: páry nebudú krútené správne a kábel bude rušený.") : T.cross ? (T.ab ? "✅ Krížený kábel (jeden koniec T568A, druhý T568B)." : "⚠️ Krížené zapojenie, ale nie podľa normy.") : "❌ Chybný kábel: niektoré žily sú prehodené."}</p>`; }
function crGoals() { const g = S.cg; return [[JSON.stringify(S.ca) === JSON.stringify(T568B), "koniec A zapoj podľa T568B"], [!!g.st, "vyrob priamy kábel (oba konce T568B) a otestuj ho"], [!!g.cr, "prerob koniec B na T568A (krížený kábel) a otestuj ho"]]; }

const PX = [["Počítač v učebni do zásuvky v stene, 15 m", "utp", ""], ["Prepojenie dvoch budov školy vzdialených 400 m", "opt", "UTP má limit 100 m."], ["Kábel vedie popri silnom elektromotore v dielni", "stp", "Tienenie chráni pred elektromagnetickým rušením."], ["10 Gb/s medzi servermi na vzdialenosť 90 m", "c6a", ""], ["Mobil v triede", "wifi", ""], ["Dva staré počítače priamo bez switcha, sieťové karty nevedia Auto-MDI/X", "cross", ""]];

  catq: { id: "catq", type: "mc", qs: [
    { id: "1", ...Q("Čo znamená UTP?", ["nevytienená krútená dvojlinka (Unshielded Twisted Pair)", "univerzálny telefónny port", "optické vlákno", "tienený koaxiál"], 0) },
    { id: "2", ...Q("Prečo sú žily v kábli skrútené do párov?", ["krútenie znižuje rušenie a presluchy medzi pármi", "aby bol kábel pevnejší", "kvôli farbám", "aby bol lacnejší"], 0) },
    { id: "3", ...Q("Aká je najväčšia dĺžka jedného úseku kábla UTP v Ethernete?", ["100 m", "10 m", "1 km", "neobmedzená"], 0) },

const VIEWS = {
  media: () => head() + `<h2>Prenosové médiá</h2>
    <div class="theory"><p>Údaje v sieti putujú cez <b>prenosové médium</b>:</p><ul><li><b>krútená dvojlinka</b> (twisted pair): medené žily skrútené do párov. <b>UTP</b> bez tienenia (najbežnejšia), <b>FTP</b> s fóliou, <b>STP</b> s tienením párov. Konektor <b>RJ-45</b>.</li><li><b>koaxiálny kábel</b>: stredový vodič a tienenie. Dnes pri televízii a starých sieťach.</li><li><b>optický kábel</b>: svetlo v sklenenom vlákne. Necitlivý na elektrické rušenie, veľmi rýchly, na veľké vzdialenosti. <b>Jednovidový</b> (singlemode) na desiatky km, <b>mnohovidový</b> (multimode) na stovky metrov.</li><li><b>bezdrôtový prenos</b>: rádiové vlny (Wi-Fi, Bluetooth, mobilné siete).</li></ul></div>
    <h3>Úloha: aké médium?</h3><div class="task"><div class="ins">Klikni na kartičku a potom na kôš.</div>${taskHTML("msort")}</div>` + nextBar(),

    <div class="theory"><p>Kábel UTP má <b>8 žíl v 4 krútených pároch</b>: oranžový, zelený, modrý a hnedý pár, každý z plnej a bielo-farebnej žily. Krútenie znižuje rušenie. Najväčšia dĺžka úseku je <b>100 m</b>.</p><table class="ctab"><tr><th>Kategória</th><th>Rýchlosť</th><th>Poznámka</th></tr><tr><td>Cat5e</td><td>1 Gb/s</td><td>najlacnejšia bežne používaná</td></tr><tr><td>Cat6</td><td>1 Gb/s (10 Gb/s do 55 m)</td><td>bežná v nových budovách</td></tr><tr><td>Cat6a</td><td>10 Gb/s na 100 m</td><td>dátové centrá, servery</td></tr><tr><td>Cat7, Cat8</td><td>10 až 40 Gb/s</td><td>tienené, Cat8 iba na krátke vzdialenosti</td></tr></table></div>
    <h3>Úloha 1: otázky</h3><div class="task">${taskHTML("catq")}</div>
    <h3>Úloha 2: počítaj</h3><div class="task">${taskHTML("cin")}</div>` + nextBar(),
  zapojenie: () => head() + `<h2>RJ-45 a zapojenie T568A/B</h2>
    <div class="theory"><p>Konektor <b>RJ-45</b> (8P8C) má 8 pinov. Poradie žíl určujú normy <b>T568A</b> a <b>T568B</b>. Piny počítame zľava, keď konektor držíš kontaktmi k sebe a západkou dole.</p>
    <table class="ctab"><tr><th>Pin</th>${[1, 2, 3, 4, 5, 6, 7, 8].map(i => `<th>${i}</th>`).join("")}</tr><tr><td><b>T568B</b></td>${T568B.map(k => `<td><span class="wsw" style="${sw(k)}"></span><br><small>${WC[k][0]}</small></td>`).join("")}</tr><tr><td><b>T568A</b></td>${T568A.map(k => `<td><span class="wsw" style="${sw(k)}"></span><br><small>${WC[k][0]}</small></td>`).join("")}</tr></table>
    <ul><li><b>priamy kábel</b>: oba konce rovnako (zvyčajne T568B – T568B). Počítač ↔ switch, router ↔ switch.</li><li><b>krížený kábel</b>: jeden koniec T568A, druhý T568B. Páry 1-2 a 3-6 sa prehodia. Kedysi na prepojenie dvoch rovnakých zariadení (PC ↔ PC). Dnes to väčšinou rieši <b>Auto-MDI/X</b>.</li></ul></div>
    <h3>Úloha: piny a farby</h3><div class="task">${taskHTML("pinq")}</div>` + nextBar(),
  krimpovanie: () => head() + `<h2>Krimpovanie a tester</h2>

document.addEventListener("dragover", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (b && SEL) { e.preventDefault(); b.classList.add("over"); } });
document.addEventListener("dragleave", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (b && !b.contains(e.relatedTarget)) b.classList.remove("over"); });
document.addEventListener("drop", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (!b) return; e.preventDefault(); const [t, bk] = b.dataset.bucket.split("|"); placeSel(t, bk); });
document.addEventListener("dragend", () => document.querySelectorAll(".over").forEach(x => x.classList.remove("over")));
if (!S.started) S.cur = 0;
render(true);

</script>
</body>
</html>
