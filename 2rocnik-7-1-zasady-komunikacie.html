.qpan{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}.qpan select,.qpan input[type=text]{border:1.5px solid var(--border);border-radius:7px;padding:4px 6px;background:var(--surface);color:var(--ink);font:inherit}.qpan input[type=text]{width:90px}.qpan b{margin-right:4px}

<script>
const THEORY = {"netiketa": ["Netiketa: slušne, bez kriku veľkými písmenami, rešpektuj súkromie, over si informácie, nešír hoaxy.", "Kyberšikana: ulož dôkazy, nereaguj, zablokuj, nahlás, povedz dospelému."], "email": ["Formálny e-mail: predmet, oslovenie, zdvorilý text, rozlúčenie, podpis s menom a triedou. Bez emoji a skratiek."], "video": ["Online hodina: vopred sa pripoj, stlm mikrofón, zdvihni ruku, chat na krátke veci, kamera podľa pokynov, nenahrávaj bez súhlasu."], "stopa": ["Digitálna stopa zostáva. Na verejný profil nepatrí adresa, telefón, celý dátum narodenia, doklady, heslá ani to, že si sám doma."], "precvic": ["Formálne = e-mail, ospravedlnenky = EduPage, rýchla otázka = chat v Teams, citlivé veci = osobne."]};
/* spoločné pomocné funkcie pre 1. ročník (n34+) */
const Q = (q, opts, a, why) => ({ q, opts, a, why });
const inq = (id, q, ans, tol, why, unit) => ({ id, q, ok: v => Math.abs(parseNum(String(v).replace(/\s/g, "")) - ans) <= tol, show: String(ans).replace(".", ","), ph: "?", why, unit });
const txq = (id, q, re, show, why) => ({ id, q, ok: v => re.test(String(v).trim()), show, ph: "?", why });
function selBlock(key, items, opts) { const D = S[key + "d"], V = S[key] || (S[key] = {}); return items.map(([t, ok, why], i) => `<div class="selr"><span>${i + 1}. ${t}${D ? `<br><small>${V[i] === ok ? "✔️ správne" : "❌ správne: " + opts.find(o => o[0] === ok)[1]}${why ? " – " + why : ""}</small>` : ""}</span><select data-sel="${key}|${i}" ${D ? "disabled" : ""}><option value="">— vyber —</option>${opts.map(([v, l]) => `<option value="${v}" ${V[i] === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>`).join("") + (D ? `<div class="row"><button class="ghost" data-selr="${key}">↺ Skúsiť znova</button></div>` : `<div class="row"><button class="primary" data-selok="${key}">✔ Vyhodnotiť</button></div>`); }
function selClick(e, defs) { const el0 = e.target.closest && e.target.closest("button"); if (!el0) return false; const k = el0.dataset.selok || el0.dataset.selr; if (!k || !defs[k]) return false; const [items, gid] = defs[k]; S[k] = S[k] || {};
  if (el0.dataset.selok) { if (items.some((_, i) => !S[k][i])) { alert("Vyber odpoveď pri všetkých položkách."); return true; } S[k + "d"] = true; const n = items.filter((x, i) => S[k][i] === x[1]).length; if (!S.t[gid] || S.t[gid].score < n) award(gid, n); } else { S[k + "d"] = false; S[k] = {}; } save(); render(false); return true; }
function selInput(e) { const t = e.target; if (t.dataset && t.dataset.sel) { const [k, i] = t.dataset.sel.split("|"); S[k] = S[k] || {}; S[k][i] = t.value; save(); return true; } return false; }
function goalsHTML(list, gid) { const n = list.filter(g => g[0]).length, T = TASKS[gid]; return `<ul class="goals">${list.map(([ok, t]) => `<li>${ok ? "✅" : "⬜"} ${t}</li>`).join("")}</ul>${S.t[gid] ? `<div class="checkbar"><span class="score ${S.t[gid].score < T.max ? "part" : ""}">Splnené: ${S.t[gid].score} z ${T.max}</span></div>` : ""}`; }
function goalAward(gid, list) { const n = list.filter(g => g[0]).length; if (n && (!S.t[gid] || S.t[gid].score < n)) { award(gid, n); save(); return true; } return false; }

const KEY = "netiketa-m71-v1";
const LESSON = "7.1 Zásady komunikácie na internete";
const BRAND = "7.1 Komunikácia na internete";
const CLASS_DEFAULT = "II.A";
const WIDE = { email: 1, stopa: 1 };

];
const STEP_TASKS = { netiketa: ["csort", "cq"], email: ["g_mail"], video: ["vs"], stopa: ["g_fp"], precvic: ["px"], test: ["test"] };
const START = {
  kicker: "Informatika, 2. ročník",
  lead: "Na internete píšeš učiteľom, spolužiakom aj úplne cudzím ľuďom. Naučíš sa pravidlá slušnej komunikácie (netiketu), napíšeš formálny e-mail učiteľke, ktorý prejde kontrolou, zopakuješ si správanie na online hodine v Teams a v simulovanom profile nájdeš údaje, ktoré na internet nepatria. 5 zastávok, body a na konci výsledok.",
  guessQ: "Spolužiak ti napíše celú správu VEĽKÝMI PÍSMENAMI. Ako to na internete zvyčajne vyznie?",
  guessNote: "Tip sa neboduje. Na zastávke Netiketa zistíš, či si mal pravdu.",

  ok: 1, yes: "Presne tak! Text veľkými písmenami pôsobí ako krik. Zdôrazni radšej jedno slovo tučným písmom.", no: "Pôsobí ako kričanie. Na zdôraznenie stačí jedno slovo tučným písmom."
};
function EXTRA_STATE() { return { em: { to: "", subj: "", body: "" }, mg: {}, mmsg: "", fp: {}, fmsg: "" }; }
const MCHK = [
  ["to", "adresát: eva.kovacova@skola-priklad.sk", e => e.to.trim().toLowerCase() === "eva.kovacova@skola-priklad.sk"],
  ["subj", "výstižný predmet (aspoň 2 slová, nie veľkými písmenami)", e => { const s = e.subj.trim(); return s.split(/\s+/).length >= 2 && s.length >= 8 && s !== s.toUpperCase(); }],
  ["hi", "oslovenie na začiatku (Dobrý deň, … / Vážená pani …)", e => /^\s*(dobrý deň|dobry den|vážená|vazena|vážený|vazeny)/i.test(e.body)],
  ["polite", "zdvorilá prosba alebo poďakovanie (prosím, ďakujem)", e => /(prosím|prosim|ďakujem|dakujem)/i.test(e.body)],
  ["clean", "bez emoji, skratiek (čau, thx, pls, nwm) a kriku VEĽKÝMI písmenami", e => e.body.trim().length >= 40 && !/\p{Extended_Pictographic}/u.test(e.body + e.subj) && !/(?<!\p{L})(čau|cau|ahoj|thx|pls|plz|nwm|nvm|jj|hej|xd|lol)(?!\p{L})/iu.test(e.body) && !/\p{Lu}{4,}/u.test(e.body)],
  ["sig", "rozlúčenie (S pozdravom) a podpis s menom a triedou (napr. II.A)", e => { const l = e.body.trim().split(/\n/).filter(x => x.trim()); return /(s pozdravom|s úctou|s uctou)/i.test(e.body) && l.length >= 2 && /\b(I{1,4}|[1-4])\.\s?[A-Da-d]\b/.test(l[l.length - 1] + " " + (l[l.length - 2] || "")); }]
];
function mGoals() { return MCHK.map(c => [!!S.mg[c[0]], c[1]]); }
function mHTML() { const e = S.em;
  return `<div class="mw"><div class="mcard"><b>📌 Zadanie</b><br>Chýbal(a) si 2 dni v škole. Napíš triednej učiteľke <b>Mgr. Eve Kováčovej</b> (eva.kovacova@skola-priklad.sk), že si bol(a) chorý(á), a slušne sa opýtaj, dokedy a ako môžeš odovzdať zameškanú prácu z informatiky.</div>
  <div class="mcomp"><div class="mh">✉️ Nová správa · Outlook</div><div class="mrow"><label>Komu</label><input type="text" data-em="to" value="${esc(e.to)}" placeholder="adresa"></div><div class="mrow"><label>Predmet</label><input type="text" data-em="subj" value="${esc(e.subj)}" placeholder="predmet"></div>
  <textarea data-em="body" rows="9" placeholder="Text správy…">${esc(e.body)}</textarea><div class="row" style="padding:8px"><button class="primary" data-msend>Odoslať (kontrola)</button></div>${S.mmsg ? `<p class="why ${S.mmsg[0]}" style="margin:0 8px 8px">${S.mmsg[1]}</p>` : ""}</div></div>`; }

const FP = [
  ["adr", 1, "📍 Bývam na Hlavnej 12, Rimavská Sobota, 3. poschodie", "adresa bydliska"],
  ["tel", 1, "📞 Píšte mi: 0905 123 456", "telefónne číslo"],

function fGoals() { const f = FP.filter(x => x[1]); return f.map((x, i) => [!!S.fp[x[0]], S.fp[x[0]] ? x[3] : `nájdi citlivý údaj č. ${i + 1}`]); }
function fHTML() { return `<div class="fpw"><div class="fph"><span class="fpav">LN</span><div><b>Lucia N.</b><br><small>🌍 Verejný profil · 1 248 sledovateľov</small></div></div>${FPORD.map(k => { const x = FP.find(y => y[0] === k), st = S.fp[k]; return `<div class="fpp ${st ? (x[1] ? "bad" : "okk") : ""}" data-fp="${k}">${x[2]}${st && !x[1] ? `<small> · toto je v poriadku</small>` : ""}${st && x[1] ? `<small> · ⚠️ ${x[3]}</small>` : ""}</div>`; }).join("")}${S.fmsg ? `<p class="why ${S.fmsg[0]}">${S.fmsg[1]}</p>` : ""}</div>`; }

const VS = [["Na hodine v Teams ti doma beží práčka a breše pes", "mute", ""], ["Chceš sa opýtať, ale učiteľ práve vysvetľuje", "hand", ""], ["Učiteľ chce odkaz alebo krátky výsledok, ktorý netreba hovoriť nahlas", "chat", ""], ["Prezentuješ projekt a učiteľ ťa chce pri tom vidieť", "cam", ""], ["Za tebou je neupratané a prechádza súrodenec", "blur", ""], ["Hodina je o 8:00 a odkaz na schôdzu ešte nikdy neskúšal", "early", ""]];
const VSO = [["mute", "stlm mikrofón"], ["hand", "zdvihni ruku"], ["chat", "napíš do chatu"], ["cam", "zapni kameru"], ["blur", "rozmaž pozadie"], ["early", "pripoj sa vopred"]];
const PX = [["Formálna žiadosť riaditeľovi o uvoľnenie na súťaž", "mail", ""], ["Rodič ospravedlňuje tvoju absenciu triednej učiteľke", "edu", ""], ["Rýchla otázka spolužiakom k projektu počas online hodiny", "teams", ""], ["Chceš sa ospravedlniť kamarátovi po veľkej hádke", "face", ""], ["Máš trápnu fotku spolužiaka, ktorú by ostatní chceli vidieť", "no", ""], ["Niekto ti opakovane posiela urážlivé správy", "rep", ""]];
const PXO = [["mail", "e-mail"], ["edu", "EduPage"], ["teams", "chat v Teams"], ["face", "osobne alebo telefonicky"], ["no", "nezdieľať vôbec"], ["rep", "uložiť dôkazy, zablokovať, nahlásiť, povedať dospelému"]];
const TASKS = {
  csort: { id: "csort", type: "sort",
    buckets: [{ id: "y", label: "✅ Vhodné" }, { id: "n", label: "❌ Nevhodné" }],
    items: [{ id: "1", t: "písať celé vety VEĽKÝMI PÍSMENAMI", b: "n" }, { id: "2", t: "posielať ďalej reťazové správy „pošli 10 ľuďom“", b: "n" }, { id: "3", t: "zverejniť fotku spolužiaka bez jeho súhlasu", b: "n" }, { id: "4", t: "napísať urážlivý komentár pod anonymnou prezývkou", b: "n" }, { id: "5", t: "odpovedať na správu v primeranom čase", b: "y" }, { id: "6", t: "overiť si informáciu skôr, ako ju zdieľaš", b: "y" }, { id: "7", t: "vyplniť predmet e-mailu", b: "y" }, { id: "8", t: "v skupinovom chate triedy písať k téme", b: "y" }] },
  cq: { id: "cq", type: "mc", qs: [
    { id: "1", ...Q("Netiketa je:", ["súbor pravidiel slušného správania na internete", "program na chatovanie", "zákon o internete", "druh sociálnej siete"], 0) },
    { id: "2", ...Q("Čo urobíš, keď ťa niekto na internete šikanuje?", ["uložím dôkazy (snímky obrazovky), nereagujem, zablokujem, nahlásim a poviem dospelému", "odpoviem ešte horšie", "vymažem všetko a nikomu nepoviem", "zverejním jeho adresu"], 0) },
    { id: "3", ...Q("Digitálna stopa je:", ["všetko, čo o sebe zanecháš na internete (príspevky, fotky, komentáre, lajky)", "odtlačok prsta na displeji", "heslo k účtu", "história nabíjania mobilu"], 0) },
    { id: "4", ...Q("Do formálneho e-mailu učiteľovi emoji:", ["nepatria", "patria na koniec každej vety", "patria do predmetu", "sú povinné"], 0) },
    { id: "5", ...Q("Kedy použiješ „Odpovedať všetkým“?", ["keď odpoveď naozaj potrebujú všetci adresáti", "vždy", "pri osobnej odpovedi jednému človeku", "nikdy"], 0) }
  ]},
  g_mail: { id: "g_mail", type: "custom", max: 6 },
  vs: { id: "vs", type: "custom", max: 6 },
  g_fp: { id: "g_fp", type: "custom", max: 6 },

    { id: "1", ...Q("Ako začneš e-mail učiteľke?", ["Dobrý deň, pani učiteľka,", "Čau,", "Hej,", "bez oslovenia"], 0) },

    { id: "5", ...Q("Ako zdôrazníš dôležité slovo v správe?", ["tučným písmom", "celou vetou veľkými písmenami", "desiatimi výkričníkmi", "červeným emoji"], 0) },
    { id: "6", ...Q("Trolling je:", ["zámerné provokovanie a vyvolávanie hádok v diskusii", "slušná diskusia", "nahlásenie spamu", "vymazanie účtu"], 0) },
    { id: "7", ...Q("Ospravedlnenie absencie v škole najčastejšie posiela rodič cez:", ["EduPage", "Instagram", "TikTok", "SMS cudziemu číslu"], 0) },
    { id: "8", ...Q("Ktorý údaj môžeš bez obáv zverejniť?", ["obľúbenú knihu", "adresu bydliska", "heslo", "číslo občianskeho preukazu"], 0) }
  ]}
};

const VIEWS = {
  netiketa: () => head() + `<h2>Netiketa</h2>${guessBox()}
    <div class="theory"><p><b>Netiketa</b> (net + etiketa) sú pravidlá slušnej komunikácie na internete. Na druhej strane je vždy človek, ktorý nevidí tvoju tvár ani nepočuje tón hlasu.</p><ul><li>Píš slušne a zrozumiteľne, nekrič VEĽKÝMI PÍSMENAMI.</li><li>Rešpektuj súkromie: nezdieľaj fotky a správy iných bez súhlasu.</li><li>Neposielaj ďalej reťazové správy a <b>hoaxy</b>; informácie si over.</li><li>Nereaguj na <b>trollov</b> a pri <b>kyberšikane</b>: ulož dôkazy, zablokuj, nahlás a povedz dospelému.</li><li>Vyber vhodný kanál: formálne veci e-mailom, školské oznamy v EduPage, rýchle otázky v chate Teams, citlivé veci osobne.</li></ul></div>
    <h3>Úloha 1: vhodné, alebo nevhodné?</h3><div class="task"><div class="ins">Klikni na kartičku a potom na kôš.</div>${taskHTML("csort")}</div>

  email: () => head() + `<h2>Formálny e-mail</h2>
    <div class="theory"><p>Formálny e-mail má: <b>výstižný predmet</b>, <b>oslovenie</b> (Dobrý deň, pani učiteľka / Vážená pani …), stručný a zdvorilý <b>text</b> (prosím, ďakujem), <b>rozlúčenie</b> (S pozdravom) a <b>podpis</b> s menom a triedou. Bez emoji, skratiek a slangu. Pred odoslaním si ho prečítaj.</p></div>
    <div class="task" id="mgoals">${goalsHTML(mGoals(), "g_mail")}</div><div class="tool" id="mbox">${mHTML()}</div>` + nextBar(),
  video: () => head() + `<h2>Online hodina a videohovor</h2>
    <div class="theory"><ul><li>Pripoj sa pár minút <b>vopred</b> a vyskúšaj zvuk a obraz.</li><li>Keď nehovoríš, <b>stlm mikrofón</b>. Keď chceš hovoriť, <b>zdvihni ruku</b>.</li><li><b>Kamera</b>: zapni ju, keď to učiteľ žiada; pozadie môžeš <b>rozmazať</b>.</li><li><b>Chat</b> na krátke otázky a odkazy, bez spamovania.</li><li>Hodinu bez súhlasu <b>nenahrávaj</b> a nefoť spolužiakov.</li></ul></div>
    <h3>Úloha: čo urobíš?</h3><div class="task">${selBlock("vss", VS, VSO)}${S.t.vs ? `<div class="checkbar"><span class="score ${S.t.vs.score < 6 ? "part" : ""}">Správne: ${S.t.vs.score} zo 6</span></div>` : ""}</div>` + nextBar(),

document.addEventListener("dragstart", e => { const p = e.target.closest && e.target.closest("[data-pick]"); if (!p) return; const [t, id] = p.dataset.pick.split("|"); if (S.t[t]) return e.preventDefault(); SEL = { t, i: id }; try { e.dataTransfer.setData("text/plain", id); } catch (err) {} });
document.addEventListener("dragover", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (b && SEL) { e.preventDefault(); b.classList.add("over"); } });
document.addEventListener("dragleave", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (b && !b.contains(e.relatedTarget)) b.classList.remove("over"); });
document.addEventListener("drop", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (!b) return; e.preventDefault(); const [t, bk] = b.dataset.bucket.split("|"); placeSel(t, bk); });
document.addEventListener("dragend", () => document.querySelectorAll(".over").forEach(x => x.classList.remove("over")));
if (!S.started) S.cur = 0;
render(true);

</script>
</body>
</html>
