:root{

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55}

.wrap{max-width:1100px;margin:0 auto;padding:0 20px}

.card h3{margin:4px 0 0;font-size:20px;line-height:1.2}

.card .desc{font-size:15px;margin:2px 0 0;flex:1}

.card .open{color:var(--c,var(--line));font-weight:600}
.badge{position:absolute;top:12px;right:14px;background:var(--sunSoft);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600}
.empty{background:var(--surface);border:1.5px dashed var(--border);border-radius:14px;padding:26px;text-align:center;color:var(--muted);margin-top:26px}
footer{color:var(--muted);font-size:14px;padding:20px 0 40px;border-top:1px solid var(--border)}

.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--line);color:#fff}

.btn.warn{background:var(--badSoft);color:var(--bad)}

.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}

@media (max-width:620px){.fg{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

    <span class="ico" aria-hidden="true">${esc(l.icon || "📘")}</span>
    <h3>${esc(l.title)}</h3>
    ${l.topic ? `<span class="topic">${esc(l.topic)}</span>` : ""}
    ${l.desc ? `<p class="desc">${esc(l.desc)}</p>` : '<p class="desc"></p>'}
    <div class="foot"><span>${esc(l.subj || "Informatika")}${l.min ? ", " + esc(l.min) + " min" : ""}</span>${EDIT ? "" : '<span class="open">Otvoriť hodinu</span>'}</div>
    ${EDIT ? `<div class="cardtools"><button class="btn sm sec" data-edit="${l.id}">Upraviť</button><button class="btn sm warn" data-del="${l.id}">Odstrániť</button></div>` : ""}`;
  return EDIT ? `<div class="card" style="--c:${c}">${inner}</div>` : `<a class="card" style="--c:${c}" href="${esc(l.url)}" target="_blank" rel="noopener">${inner}</a>`;
}

function listHTML() {
  const d = cur();
  const shown = d.classes.filter(c => (FILTER === "all" || FILTER === c.id) && (EDIT || countFor(c.id) > 0));
  let out = "", any = false;
  for (const c of shown) {
    const ls = d.lessons.filter(l => l.cls.includes(c.id) && matches(l));
    if (!ls.length && (Q || !EDIT)) continue;
    any = true;
    out += `<section class="cls"><div class="clsh"><span class="bar" style="background:${colorOf(c.id)}"></span><h2>${esc(c.name)}</h2><span class="cnt">${ls.length} ${ls.length === 1 ? "hodina" : ls.length >= 2 && ls.length <= 4 ? "hodiny" : "hodín"}</span></div>
      ${ls.length ? `<div class="grid">${ls.map(l => card(l, c.id)).join("")}</div>` : '<p class="cnt" style="color:var(--muted)">Zatiaľ bez hodín.</p>'}</section>`;
  }
  if (!any) out = Q ? `<div class="empty">Pre „${esc(Q)}“ sme nič nenašli. Skús iné slovo alebo vyber Všetko.</div>` : `<div class="empty">${EDIT ? "Katalóg je prázdny. Pridaj prvú hodinu." : "Pre túto triedu zatiaľ nie sú žiadne hodiny."}</div>`;
  return out;
}

function formHTML() {
  if (!FORM) return "";
  const d = DRAFT, f = FORM;
  return `<div class="panel" id="form"><h2>${f.id ? "Upraviť hodinu" : "Nová hodina"}</h2>
    <div class="fg">
      <div><label class="f" for="f-title">Názov hodiny *</label><input class="in" id="f-title" value="${esc(f.title)}" placeholder="napr. Binárna sústava"></div>
      <div><label class="f" for="f-topic">Téma / tematický celok</label><input class="in" id="f-topic" value="${esc(f.topic)}" placeholder="napr. Číselné sústavy"></div>
      <div class="full"><label class="f" for="f-url">Odkaz na hodinu *</label><input class="in" id="f-url" value="${esc(f.url)}" placeholder="https://claude.ai/artifact/..."></div>
      <div><label class="f" for="f-icon">Ikona (emoji)</label><input class="in" id="f-icon" value="${esc(f.icon)}" placeholder="📘" maxlength="8"></div>
      <div><label class="f" for="f-subj">Predmet</label><input class="in" id="f-subj" value="${esc(f.subj || "Informatika")}"></div>
      <div><label class="f" for="f-min">Trvanie (minúty)</label><input class="in" id="f-min" type="number" min="0" max="300" value="${esc(f.min || "")}" placeholder="45"></div>
      <div class="full"><label class="f" for="f-desc">Krátky popis</label><textarea class="in" id="f-desc" maxlength="220" placeholder="Čo sa žiaci naučia, 1 až 2 vety">${esc(f.desc)}</textarea></div>
      <div class="full"><span class="f" style="display:block;font-weight:600;font-size:14.5px;margin-bottom:6px">Triedy *</span><div class="checks">${d.classes.map(c => `<label><input type="checkbox" class="f-cls" value="${c.id}" ${f.cls && f.cls.includes(c.id) ? "checked" : ""}>${esc(c.name)}</label>`).join("")}</div></div>
    </div>
    ${FORMERR ? `<p class="err">${esc(FORMERR)}</p>` : ""}
    <div class="row"><button class="btn" data-formsave>${f.id ? "Uložiť úpravy" : "Pridať do katalógu"}</button><button class="btn sec" data-formcancel>Zrušiť</button></div>
  </div>`;
}

function classesHTML() {
  const d = DRAFT;
  return `<div class="panel"><h2>Triedy</h2>
    <div class="clist">${d.classes.map((c, i) => `<div class="citem"><span class="sw" style="background:${COLORS[i % COLORS.length]}"></span>
      <input class="in" data-cname="${c.id}" value="${esc(c.name)}" aria-label="Názov triedy">
      <button class="btn sm sec" data-cmove="${c.id}|-1" ${i === 0 ? "disabled" : ""} aria-label="Posunúť vyššie">▲</button>
      <button class="btn sm sec" data-cmove="${c.id}|1" ${i === d.classes.length - 1 ? "disabled" : ""} aria-label="Posunúť nižšie">▼</button>
      <button class="btn sm warn" data-cdel="${c.id}" ${countFor(c.id) ? 'disabled title="Trieda má hodiny, najprv ich presuň alebo odstráň"' : ""}>Odstrániť</button>
      <span style="color:var(--muted);font-size:14px">${countFor(c.id)} hod.</span></div>`).join("")}</div>
    <div class="row"><input class="in" id="newcls" placeholder="Nová trieda, napr. III.A" style="max-width:260px"><button class="btn sec" data-cadd>Pridať triedu</button></div>
    <h2 style="margin-top:22px">Nadpis katalógu</h2>
    <div class="fg"><div class="full"><label class="f" for="t-title">Nadpis</label><input class="in" id="t-title" data-meta="title" value="${esc(d.title)}"></div>
    <div class="full"><label class="f" for="t-sub">Úvodný text</label><textarea class="in" id="t-sub" data-meta="subtitle">${esc(d.subtitle)}</textarea></div></div>
  </div>`;
}

function render() {
  const d = cur();
  const visible = d.classes.filter(c => EDIT || countFor(c.id) > 0);
  if (FILTER !== "all" && !visible.some(c => c.id === FILTER)) FILTER = "all";
  document.getElementById("root").innerHTML = `
  <div class="wrap">
    <header class="hero">
      <div class="brand"><span class="dot" aria-hidden="true"></span>Informatika</div>
      <h1>${esc(d.title)}</h1>
      <p class="sub">${esc(d.subtitle)}</p>
      ${EDIT ? `<div class="editbar"><b>Režim úprav${DIRTY ? ": máš neuložené zmeny" : ""}</b>
        <button class="btn sec" data-new>+ Pridať hodinu</button>
        <button class="btn sec" data-cancel>Zahodiť zmeny</button>
        <button class="btn" data-publish ${!DIRTY || BUSY ? "disabled" : ""}>${BUSY ? "Ukladám…" : "Uložiť a zverejniť"}</button></div>`
      : CAN_EDIT ? `<div class="row" style="margin-top:14px"><button class="btn sec" data-startedit>Upraviť katalóg</button></div>` : ""}
      ${MSG ? `<div class="msg" role="status">${esc(MSG)}</div>` : ""}
      ${EDIT ? formHTML() : ""}
    </header>
  </div>
  <div class="toolbar"><div class="wrap">
    <div class="pills" role="group" aria-label="Trieda">
      <button class="pill" data-filter="all" aria-pressed="${FILTER === "all"}">Všetko <span class="n">${d.lessons.length}</span></button>
      ${visible.map(c => `<button class="pill" data-filter="${c.id}" aria-pressed="${FILTER === c.id}"><span class="sw" style="background:${colorOf(c.id)}"></span>${esc(c.name)} <span class="n">${countFor(c.id)}</span></button>`).join("")}
    </div>
    <input class="search" id="q" type="search" placeholder="Hľadaj hodinu vo všetkých triedach…" value="${esc(Q)}" aria-label="Hľadať hodinu">
  </div></div>
  <div class="wrap"><main id="list">${listHTML()}</main>
    ${EDIT ? classesHTML() : ""}
    <footer>${EDIT ? "Zmeny uvidia žiaci až po kliknutí na Uložiť a zverejniť." : "Hodina sa otvorí v novom okne, katalóg ti zostane otvorený."}</footer>
  </div>`;
}
function renderList() { document.getElementById("list").innerHTML = listHTML(); }
function touch() { DIRTY = true; }

function readForm() {
  const v = id => document.getElementById(id).value.trim();
  const f = { id: FORM.id, title: v("f-title"), topic: v("f-topic"), url: v("f-url"), icon: v("f-icon") || "📘", subj: v("f-subj") || "Informatika", desc: v("f-desc"), min: v("f-min") ? Math.max(0, parseInt(v("f-min"), 10) || 0) : "", cls: [...document.querySelectorAll(".f-cls:checked")].map(x => x.value), added: FORM.added };
  return f;
}

document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  const ds = b.dataset;
  if (ds.filter) { FILTER = ds.filter; try { localStorage.setItem("katalog-trieda", FILTER); } catch (err) {} return render(); }
  if (ds.startedit !== undefined) { DRAFT = clone(D); EDIT = true; DIRTY = false; MSG = ""; FORM = null; return render(); }
  if (ds.cancel !== undefined) { if (DIRTY && !b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Naozaj zahodiť?"; return; } EDIT = false; DRAFT = null; FORM = null; DIRTY = false; MSG = ""; return render(); }
  if (ds.new !== undefined) { FORM = { title: "", topic: "", url: "", icon: "", subj: "Informatika", desc: "", min: 45, cls: FILTER !== "all" ? [FILTER] : [] }; FORMERR = ""; render(); document.getElementById("f-title").focus(); return; }
  if (ds.edit) { FORM = clone(DRAFT.lessons.find(l => l.id === ds.edit)); FORMERR = ""; render(); document.getElementById("form").scrollIntoView({ block: "start" }); document.getElementById("f-title").focus(); return; }
  if (ds.del) { if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Naozaj?"; return; } DRAFT.lessons = DRAFT.lessons.filter(l => l.id !== ds.del); touch(); return render(); }
  if (ds.formcancel !== undefined) { FORM = null; FORMERR = ""; return render(); }
  if (ds.formsave !== undefined) {
    const f = readForm();
    if (!f.title) FORMERR = "Doplň názov hodiny.";
    else if (!/^https?:\/\/\S+\.\S+/.test(f.url)) FORMERR = "Odkaz musí začínať https:// (napr. https://claude.ai/artifact/…).";
    else if (!f.cls.length) FORMERR = "Vyber aspoň jednu triedu.";
    else FORMERR = "";
    if (FORMERR) { FORM = f; return render(); }
    if (f.id) { const i = DRAFT.lessons.findIndex(l => l.id === f.id); DRAFT.lessons[i] = f; }
    else { f.id = uid("l"); f.added = new Date().toISOString().slice(0, 10); DRAFT.lessons.push(f); }
    FORM = null; touch(); MSG = "Hodina je v návrhu. Keď skončíš s úpravami, klikni na Uložiť a zverejniť."; return render();
  }
  if (ds.cadd !== undefined) { const n = document.getElementById("newcls").value.trim(); if (!n) return; DRAFT.classes.push({ id: uid("c"), name: n }); touch(); return render(); }
  if (ds.cdel) { DRAFT.classes = DRAFT.classes.filter(c => c.id !== ds.cdel); touch(); return render(); }
  if (ds.cmove) { const [id, dir] = ds.cmove.split("|"); const a = DRAFT.classes, i = a.findIndex(c => c.id === id), j = i + (+dir); if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; touch(); return render(); }
  if (ds.publish !== undefined) {
    if (!API) { MSG = "Uloženie tu nie je dostupné. Otvor katalóg v claude.ai ako jeho vlastník."; return render(); }
    BUSY = true; MSG = ""; render();
    try { await API.publish(buildDoc(DRAFT)); MSG = "Uložené. Stránka sa obnoví."; }
    catch (err) {
      const c = err && err.code;
      if (c === "conflict") MSG = "Medzitým sa uložila iná verzia katalógu, stránka sa obnoví na ňu.";
      else if (["not_writer", "not_granted", "consent_required", "not_declared", "capability_disabled", "capability_removed"].includes(c)) { MSG = "Tento pohľad je len na čítanie. Katalóg môže upravovať iba jeho vlastník."; CAN_EDIT = false; EDIT = false; }
      else if (c === "rate_limited") MSG = "Ukladáš príliš často. Počkaj chvíľu a skús znova.";
      else if (c === "too_large") MSG = "Katalóg je príliš veľký na uloženie. Skráť popisy hodín.";
      else MSG = "Uloženie sa nepodarilo. Skús to znova o chvíľu.";
    }
    BUSY = false; return render();
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { Q = t.value; return renderList(); }
  if (t.dataset.cname) { const c = DRAFT.classes.find(x => x.id === t.dataset.cname); if (c) { c.name = t.value; touch(); } return; }
  if (t.dataset.meta) { DRAFT[t.dataset.meta] = t.value; touch(); }
});
document.addEventListener("change", e => { if (EDIT && (e.target.dataset.cname || e.target.dataset.meta)) render(); });

function buildDoc(data) {
  const css = document.getElementById("css").textContent;
  const app = document.getElementById("app").textContent;
  const json = JSON.stringify(data).replace(/</g, "\\u003c");
  const title = esc(data.title) + " – Informatika";
  return "<!DOCTYPE html>\n<html lang=\"sk\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>" + title + "</title>\n" +
    "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n" +
    "<link href=\"https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n" +
    "<style id=\"css\">" + css + "</style>\n</head>\n<body>\n<div id=\"root\"></div>\n" +
    "<script id=\"data\" type=\"application/json\">" + json + "<\/script>\n" +
    "<script id=\"app\">" + app + "<\/script>\n</body>\n</html>\n";
}

render();
(async () => {
  if (!window.claude || !window.claude.use) return;
  const [a, u] = await Promise.all([window.claude.use("artifact"), window.claude.use("user")]);
  API = a;
  if (u && a) { try { CAN_EDIT = (await u.isOwner()) || (await u.canEdit()); } catch (err) { CAN_EDIT = false; } }
  if (CAN_EDIT && !EDIT) render();
})();
</script>
</body>
</html>
