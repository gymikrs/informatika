<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DU_2.1 Popis prostredia MS Word 365</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D9EAFB;--surface:#FFFFFF;--surface2:#F5F7FA;--ink:#16213A;--muted:#566381;
  --acc:#2F5BEA;--accSoft:#D5DFFB;--amber:#F2A516;--amberSoft:#FDF1D6;--track:#C9D1DF;
  --ok:#12805A;--okSoft:#DDF3EA;--bad:#C0392B;--badSoft:#FBE3E0;--border:#D6DCE6;
  --font:"Rubik","Segoe UI",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  box-sizing:border-box
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10172A;--surface:#18223A;--surface2:#1E2A46;--ink:#E8EDF7;--muted:#9AA7C4;--acc:#6E91FF;--accSoft:#26386A;--amberSoft:#3A2F17;--track:#34425F;--okSoft:#163A30;--ok:#3CCB8E;--badSoft:#46221F;--bad:#FF7A6B;--border:#2E3B58}}
:root[data-theme="dark"]{--bg:#10172A;--surface:#18223A;--surface2:#1E2A46;--ink:#E8EDF7;--muted:#9AA7C4;--acc:#6E91FF;--accSoft:#26386A;--amberSoft:#3A2F17;--track:#34425F;--okSoft:#163A30;--ok:#3CCB8E;--badSoft:#46221F;--bad:#FF7A6B;--border:#2E3B58}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17.5px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px 4px;max-width:1140px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand .du{background:#F2A516;color:#3A2600;border-radius:7px;padding:1px 8px;font-size:14px;font-weight:800}
.pts{background:var(--amberSoft);border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap}
.pts b{font-size:19px}
.line{display:flex;overflow-x:auto;padding:10px 20px 14px;max-width:1140px;margin:0 auto;scrollbar-width:thin}
.stn{flex:1 0 96px;position:relative;text-align:center;background:none;border:0;padding:0 4px;cursor:pointer}
.stn:disabled{cursor:not-allowed;opacity:.5}
.stn::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:5px;border-radius:3px;background:var(--track);z-index:0}
.stn:first-child::before{display:none}
.stn.reached::before{background:var(--acc)}
.stn .c{position:relative;z-index:1;display:grid;place-items:center;width:35px;height:35px;margin:0 auto;border-radius:50%;background:var(--surface);border:4px solid var(--track);font-size:16px;transition:transform .15s}
.stn.done .c{background:var(--acc);border-color:var(--acc);color:#fff;font-size:14px;font-weight:700}
.stn.cur .c{border-color:var(--acc);transform:scale(1.18);box-shadow:0 0 0 5px var(--accSoft)}
.stn .l{display:block;font-size:13px;font-weight:600;margin-top:6px;line-height:1.2}
.stn .m{display:block;font-size:12px;color:var(--muted)}
.stn.cur .l{color:var(--acc)}
main{max-width:1060px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:clamp(30px,5vw,46px);line-height:1.08;margin:0 0 12px;letter-spacing:-.02em}
h2{font-size:clamp(26px,4vw,34px);line-height:1.12;margin:0 0 6px;letter-spacing:-.015em}
h3{font-size:21px;margin:30px 0 8px}
p{margin:0 0 14px}
.kicker{color:var(--muted);font-size:15px;margin:0 0 4px}
.ban{position:relative;overflow:hidden;border-radius:22px;padding:20px 22px 18px;color:#fff;margin:0 0 18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;box-shadow:0 14px 30px -18px rgba(10,20,60,.6)}
.ban .pill{display:inline-block;background:rgba(255,255,255,.25);border-radius:999px;padding:3px 12px;font-size:13.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.ban h2{color:#fff;margin:8px 0 4px}
.ban p{margin:0;font-size:16px;opacity:.95}
.ban .big{font-size:64px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.ban::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
@media (max-width:560px){.ban .big{font-size:44px}}
.say{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:end;margin:6px 0 18px}
.say svg{width:92px;height:92px}
.bubble{position:relative;background:var(--surface);border:2px solid var(--acc);border-radius:18px 18px 18px 4px;padding:12px 16px;font-size:16.5px}
.task{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px 20px;margin:12px 0 8px}
.ins{color:var(--muted);font-size:15.5px;margin-bottom:12px}
.theory p{max-width:none}
.tsplit{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:22px;align-items:start;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px 20px;margin:0 0 12px}
.tsplit>div{min-width:0}
@media (max-width:860px){.tsplit{grid-template-columns:1fr}}
.tfigs{display:grid;gap:12px}
.tfig{margin:0;background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px 10px 8px;display:flex;flex-direction:column;gap:6px}
.tfig svg{width:100%;height:auto;display:block}
.tfig figcaption{font-size:14px;line-height:1.45;color:#3E4A66;text-align:center;padding:0 4px}
.rtab{border-collapse:collapse;margin:10px 0;font-size:15.5px;width:100%}
.rtab th,.rtab td{border:1px solid var(--border);padding:6px 10px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.rtab th{background:var(--surface2);font-size:14px}
.vedel{background:#FFF8E1;color:#3A2E00;border:1px solid #F2D27A;border-left:5px solid #E0A800;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:15.5px;line-height:1.55}
.memo{margin:26px 0 8px;background:var(--surface);border:2px solid var(--acc);border-radius:16px;padding:14px 18px 10px}
.memo h3{margin:0 0 6px;font-size:18px;color:var(--acc)}
.memo ul{margin:0;padding-left:20px}.memo li{margin:5px 0;font-size:16px;line-height:1.5}
code{font-family:var(--mono);font-size:.93em;background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:0 5px}
kbd{font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);border-bottom-width:3px;border-radius:6px;padding:0 6px;font-size:.88em}
.primary{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:600;cursor:pointer;font-size:17px}
.primary:disabled{background:var(--track);color:var(--muted);cursor:not-allowed}
.ghost{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:9px 16px;font-weight:600;cursor:pointer}
.ghost:hover:not(:disabled){border-color:var(--acc)}
.ghost.on{border-color:var(--acc);background:var(--accSoft)}
.ghost:disabled{opacity:.45;cursor:not-allowed}
.checkbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.checkbar .hint{color:var(--muted);font-size:14.5px}
.score{font-weight:600;padding:8px 14px;border-radius:10px;background:var(--okSoft);color:var(--ok)}
.score.part{background:var(--amberSoft);color:var(--ink)}
.next{margin-top:30px;padding-top:20px;border-top:1px dashed var(--track);display:flex;justify-content:flex-end}
.q{border:0;padding:0;margin:0 0 22px}
.q legend{font-weight:600;padding:0;margin-bottom:10px;display:flex;gap:10px}
.qn{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accSoft);color:var(--acc);font-size:14px;font-weight:700;margin-top:1px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.opt{text-align:left;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--accSoft)}
.opt.ok{border-color:var(--ok);background:var(--okSoft)}
.opt.bad{border-color:var(--bad);background:var(--badSoft)}
.opt:disabled{cursor:default;color:var(--ink)}
.why{font-size:15px;margin:8px 0 0;padding:8px 12px;border-radius:8px}
.why.good{background:var(--okSoft)}.why.miss{background:var(--badSoft)}
.lock{display:flex;gap:10px;align-items:center;background:var(--surface2);border:1.5px dashed var(--track);border-radius:12px;padding:12px 16px;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15.5px}
.fb.ok{background:var(--okSoft)}.fb.bad{background:var(--badSoft)}.fb.info{background:var(--accSoft)}
.fb ul{margin:4px 0 0;padding-left:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .opt{padding:6px 12px;font-size:14.5px;border-radius:999px}
.fc{background:var(--surface2);border:2px solid var(--border);border-radius:16px;padding:12px 14px;position:relative}
.fc.okc{border-color:var(--ok);background:var(--okSoft)}.fc.badc{border-color:var(--bad);background:var(--badSoft)}
.fc .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:6px}
/* štart a výsledok */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:20px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:22px}
@media (max-width:800px){.hero{grid-template-columns:1fr}}
.hero svg{width:100%;height:auto;display:block}
.mlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0}
.mcard{border-radius:14px;padding:10px 12px;color:#fff;font-weight:600;font-size:15px}
.mcard small{display:block;font-weight:400;opacity:.9}
label.f{display:block;font-weight:600;margin:12px 0 4px}
.in{width:100%;max-width:380px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--ink)}
.result{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px}
.bign{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 16px}
.bign .n{font-size:56px;font-weight:700;line-height:1;color:var(--acc)}
.bign .of{font-size:20px;color:var(--muted)}
.grade{margin-left:auto;text-align:center;border:2px solid var(--acc);border-radius:12px;padding:6px 14px}
.grade b{display:block;font-size:30px;line-height:1.1}.grade span{font-size:12.5px;color:var(--muted)}
table.res{border-collapse:collapse;width:100%;font-size:15.5px}
table.res td,table.res th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
table.res td:last-child,table.res th:last-child{text-align:right}
/* komiks */
.comic{display:grid;grid-template-columns:1fr;gap:14px}
.panel:not(.choice){max-width:560px}.panel.c{justify-self:center}
.panel{background:#FFFDF5;border:3px solid #16213A;border-radius:6px;padding:10px;display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:start;color:#16213A;box-shadow:4px 4px 0 #16213A;min-width:0}
.panel svg{width:76px;height:76px}
.panel .bub{background:#fff;border:2px solid #16213A;border-radius:14px;padding:8px 12px;font-size:15.5px;position:relative;min-width:0}
.panel .nm{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#566381;margin-bottom:2px}
.panel.choice{grid-column:1/-1;background:#EEF4FF}
.panel .opts{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.panel .opt{background:#fff;color:#16213A}
.panel .opt.sel{background:#E6EDFD}
.panel .opt.ok{background:#DDF3EA}.panel .opt.bad{background:#FBE3E0}
.panel .why{color:#16213A}
@media (max-width:560px){.panel{grid-template-columns:44px minmax(0,1fr);gap:6px;padding:8px}.panel svg{width:44px;height:44px}.panel .opts{grid-template-columns:1fr}.panel .opt{padding:8px 10px}}
/* triedenie */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;background:var(--surface2);border:1.5px dashed var(--track);border-radius:14px;padding:10px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14.5px;text-align:left}
.chip:hover:not(:disabled){border-color:var(--acc)}
.chip.sel{border-color:var(--amber);box-shadow:0 0 0 3px var(--amberSoft)}
.chip.ok{border-color:var(--ok);background:var(--okSoft)}.chip.bad{border-color:var(--bad);background:var(--badSoft)}
.chip.used{opacity:.45}
.chip:disabled{cursor:default;color:var(--ink)}
.bins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.bins{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.bins{grid-template-columns:1fr}}
.bin{border:2px solid var(--border);border-radius:16px;padding:10px;min-height:120px;background:var(--surface);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bin .bh{width:100%;text-align:center;font-weight:700;border-radius:10px;padding:6px;cursor:pointer;border:0;font-size:15px}
.bin .bh:disabled{cursor:default}
/* klikateľné scény */
.hz{cursor:pointer}.hz:focus{outline:none}
.hz .hit{fill:transparent;stroke:transparent;stroke-width:3;transition:fill .15s,stroke .15s}
.hz:hover .hit,.hz:focus .hit{stroke:#F2A516;fill:rgba(242,165,22,.15)}
.hz.lab .hit{stroke:#2F5BEA;stroke-dasharray:6 4;stroke-width:2.5}
.hz.ok .hit{stroke:#12805A;fill:rgba(18,128,90,.2);stroke-width:4}
.hz.bad .hit{stroke:#C0392B;fill:rgba(192,57,43,.18);stroke-width:4}
.hz.off{cursor:default}
.scene svg{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--border);background:#fff}
@media (max-width:640px){.scene{overflow-x:auto;-webkit-overflow-scrolling:touch}.scene svg{min-width:640px}.scene::after{content:"↔️ Obrázok posúvaj prstom do strany.";display:block;font-size:13.5px;color:var(--muted);padding:4px 2px}}
.scr{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(240px,1fr);gap:16px;align-items:start}
@media (max-width:860px){.scr{grid-template-columns:1fr}}
.side{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.side h4{margin:0 0 6px;font-size:18px}
.tag{display:inline-block;font-size:12.5px;font-weight:700;color:var(--acc);background:var(--accSoft);border-radius:6px;padding:2px 8px;margin-bottom:8px}
.prompt{font-size:17px;font-weight:600;margin:4px 0 10px}
/* mini Word */
.win{background:#fff;color:#1B1B1F;border:1px solid #BCC6D3;border-radius:10px;overflow:hidden;box-shadow:0 12px 30px -14px rgba(10,20,60,.45);font-family:"Segoe UI",var(--font);font-size:14.5px}
.wt{background:#185ABD;color:#fff;padding:7px 12px;display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.wt .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt .dots{margin-left:auto;letter-spacing:6px;flex:0 0 auto;opacity:.85}
.rib .tabs{display:flex;flex-wrap:wrap;background:#F3F3F3;border-bottom:1px solid #DADADA}
.rib .tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;font-size:13.5px;color:#1B1F2A;font-family:"Segoe UI",var(--font)}
.rib .tabs button:hover:not(:disabled){background:#E6E6E6}
.rib .tabs button.on{background:#fff;border-bottom:3px solid #185ABD;font-weight:700}
.rib .tabs button.file{background:#185ABD;color:#fff}
.rib .tabs button.ctx{color:#7A3FB8;font-weight:700;background:#F1E8FB}
.rib .tabs button.ok{background:#D9F2E3;box-shadow:inset 0 -3px 0 #12805A}.rib .tabs button.bad{background:#FDE2E0;box-shadow:inset 0 -3px 0 #C0392B}
.rib .groups{display:flex;gap:0;overflow-x:auto;padding:6px 0;min-height:92px;background:#fff}
.rib .grp{border-right:1px solid #E1E1E1;padding:0 10px;display:flex;flex-direction:column;justify-content:space-between;min-width:110px}
.rib .grp .cmds{display:flex;flex-wrap:wrap;gap:4px;max-width:260px}
.rib .grp .cmds button{border:1px solid transparent;background:none;border-radius:4px;padding:3px 6px;cursor:pointer;font-size:12.5px;color:#1B1F2A;font-family:"Segoe UI",var(--font)}
.rib .grp .cmds button:hover:not(:disabled){background:#E8F0FB;border-color:#C7DAF3}
.rib .grp .cmds button.on{background:#E8F0FB;border-color:#185ABD}
.rib .grp .cmds button.ok{background:#D9F2E3;border-color:#12805A}.rib .grp .cmds button.bad{background:#FDE2E0;border-color:#C0392B}
.rib .grp small{display:block;text-align:center;color:#666;font-size:11.5px;margin-top:4px}
.ddrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#F7F9FC;border-top:1px solid #E1E1E1;padding:8px 10px;font-size:13px;color:#1B1F2A}
.ddrow button{border:1px solid #C9D0DA;background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;color:#1B1F2A}
.ddrow button:hover:not(:disabled){border-color:#185ABD}
.ddrow button.ok{background:#D9F2E3;border-color:#12805A}.ddrow button.bad{background:#FDE2E0;border-color:#C0392B}
.ddrow .sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #999;vertical-align:-2px;margin-right:4px}
.ribdoc{background:#E9E9E9;padding:16px;display:flex;justify-content:center}
.ribdoc .pg{width:min(100%,380px);min-height:170px;box-shadow:0 1px 5px rgba(0,0,0,.18);transition:padding .35s,background .35s;font-family:Calibri,Carlito,Arial,sans-serif;color:#1B1F2A;font-size:15px;line-height:1.45;position:relative;outline:1px dashed transparent}
.ribdoc .pg .ti{font-size:19px;font-weight:700;margin-bottom:6px}
.ribdoc .pg .ln{height:7px;border-radius:3px;background:#D5D9E0;margin:7px 0}
.ribdoc .pg .pic{display:inline-block;cursor:pointer;border:2px solid transparent;padding:2px;margin-top:6px}
.ribdoc .pg .pic.sel{border-color:#7A3FB8}
.ribdoc .pg .pic svg{display:block;width:120px;height:80px}
/* Uložiť ako */
.bstage{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:250px}
@media (max-width:560px){.bstage{grid-template-columns:1fr}}
.bstage .rail{background:#185ABD;padding:8px 0;display:flex;flex-direction:column}
.bstage .rail button{border:0;background:none;color:#fff;text-align:left;padding:8px 16px;cursor:pointer;font-size:14px;font-family:"Segoe UI",var(--font)}
.bstage .rail button:hover{background:rgba(255,255,255,.15)}
.bstage .rail button.on{background:rgba(255,255,255,.28);font-weight:700}
.bstage .pane{padding:14px 16px;color:#1B1F2A}
.dlgbox{background:#fff;color:#1B1B1F;border:1px solid #9FB0C8;border-radius:10px;box-shadow:0 14px 30px rgba(0,0,0,.18);padding:14px 16px;margin:10px 0}
.dlgbox h5{margin:0 0 8px;font-size:15px}
.dlgbox .locs{display:grid;gap:4px;margin-bottom:10px}
.dlgbox .locs button{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid #E1E6EE;background:#F7F9FC;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:14px;color:#1B1B1F}
.dlgbox .locs button.on{background:#DCE8FA;border-color:#185ABD;font-weight:600}
.dlgbox label{display:block;font-size:13px;font-weight:600;margin:8px 0 3px;color:#3E4A66}
.dlgbox input,.dlgbox select{width:100%;border:1px solid #A9B4C4;border-radius:4px;padding:6px 8px;font-size:14px;color:#1B1B1F;background:#fff}
.dlgbox .ghost{color:#1B1B1F;background:#fff;border-color:#C9D0DA;padding:6px 14px}
.docbody{background:#E9E9E9;padding:14px;display:flex;justify-content:center}
.docbody .pg{background:#fff;width:min(100%,360px);min-height:120px;box-shadow:0 1px 4px rgba(0,0,0,.15);padding:14px 18px;font-family:Calibri,Carlito,Arial,sans-serif;color:#1B1F2A}
/* skúšobný dokument */
.padtb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#F3F3F3;border:1.5px solid var(--border);border-bottom:0;border-radius:10px 10px 0 0;padding:6px 8px;color:#1B1F2A}
.padtb button{min-width:36px;padding:4px 10px;border:1px solid #CCC;border-radius:6px;background:#fff;color:#1B1F2A;font-size:15px;cursor:pointer}
.padtb .sp{margin-left:auto}
.pad{min-height:110px;background:#fff;color:#1B1F2A;border:1.5px solid var(--border);border-radius:0 0 10px 10px;padding:14px 16px;font-family:Calibri,Carlito,Arial,sans-serif;font-size:19px;line-height:1.6;outline:none}
.pad:focus{border-color:var(--acc)}
.pad[contenteditable="false"]{background:#F6F7F9}
.goals{list-style:none;padding:0;margin:6px 0 10px}.goals li{padding:3px 0}
/* párovanie */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.pairs{grid-template-columns:1fr}}
.pcol{display:grid;gap:8px;align-content:start}
.pcol h4{margin:0 0 2px;font-size:15px;color:var(--muted)}
.pi{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface2);border:2px solid var(--border);border-radius:12px;padding:9px 12px;cursor:pointer;width:100%}
.pi:hover:not(:disabled){border-color:var(--acc)}
.pi.sel{border-color:var(--amber);box-shadow:0 0 0 4px var(--amberSoft)}
.pi .k{font-family:var(--mono);font-weight:700}
.pi .tg{margin-left:auto;flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.pi.ok{border-color:var(--ok);background:var(--okSoft)}
.pi.bad{border-color:var(--bad);background:var(--badSoft)}
.pi:disabled{cursor:default;color:var(--ink)}
/* hľadanie */
.sbar{background:#185ABD;padding:8px 12px;display:flex;justify-content:center}
.sbar input{width:min(100%,360px);border:0;border-radius:6px;padding:7px 12px;font-size:14.5px;background:#fff;color:#1B1B1F}
.sres{max-width:380px;margin:0 auto;background:#fff;border:1px solid #C9D1DF;border-top:0;min-height:60px;padding:6px}
.sres small{display:block;color:#667;padding:4px 8px;font-size:12px}
.sres button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:14px;color:#1B1B1F;font-family:"Segoe UI",var(--font)}
.sres button:hover:not(:disabled){background:#E8F0FB}
.sres button.ok{background:#D9F2E3}.sres button.bad{background:#FDE2E0}
.sres .em{color:#667;font-size:13.5px;padding:8px 10px}
.psel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
@media (max-width:560px){.psel{grid-template-columns:1fr}}
.psel label{font-size:13.5px;font-weight:600;color:var(--muted)}
.psel select{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--ink)}
.psel select.ok{border-color:var(--ok);background:var(--okSoft)}.psel select.bad{border-color:var(--bad);background:var(--badSoft)}
.pathline{font-family:var(--mono);font-size:14.5px;margin-top:8px;color:var(--acc);font-weight:700}
.qfig{background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px;margin:0 0 14px}
.qfig svg{width:100%;height:auto;display:block}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  const ital = p => /italic|oblique/.test(getComputedStyle(p).fontStyle);

function checkBar(T, ready, hint, label) {
  const r = S.t[T.id];
  if (r) return `<div class="checkbar"><span class="score ${r.score < r.max ? "part" : ""}">${r.score === r.max ? "Výborne! " : ""}Získal si ${r.score} z ${r.max} ⭐</span></div>`;
  return `<div class="checkbar"><button class="primary" data-check="${T.id}" ${ready ? "" : "disabled"}>${label || "Skontrolovať"}</button><span class="hint">${ready ? "Kontrola je len jedna, potom sa odpovede nedajú zmeniť." : hint}</span></div>`;
}
const optCls = (done, sel, i, a) => { let c = "opt"; if (sel === i) c += " sel"; if (done) { if (i === a) c += " ok"; else if (sel === i) c += " bad"; } return c; };
function mcHTML(T) {
  const done = S.t[T.id], d = S.d[T.id] || {}, Q = T.qs;
  const qs = T.keep ? Q : ord(T.id + ":q", Q.map(q => q.id)).map(id => Q.find(q => q.id === id));
  return (T.pre ? `<div class="qfig">${T.pre}</div>` : "") + qs.map((q, qi) => { const o = ord(T.id + ":" + q.id, q.opts.map((_, i) => i));

}
function sortHTML(T) {
  const done = S.t[T.id], d = S.d[T.id] || {}, io = ord(T.id + ":i", T.items.map(x => x.id)), sel = S.sel[T.id];

  const chip = x => { let c = "chip"; if (sel === x.id && !done) c += " sel"; if (done) c += d[x.id] === x.a ? " ok" : " bad"; return `<button class="${c}" data-sti="${T.id}|${x.id}" ${done ? "disabled" : ""}>${x.t}</button>`; };
  const pool = items.filter(x => !d[x.id]), nOk = done ? T.items.filter(x => d[x.id] === x.a).length : 0;

/* čas vypracovania (DOMACA): pripíše sa k bodom */
function durTxt() { if (!S.started || !S.finished) return ""; let t = Math.max(0, Math.round((S.finished - S.started) / 1000)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;

}
function doneRec() { try { let r = localStorage.getItem(DONE_KEY); if (r) return JSON.parse(r);

  window.scrollTo({ top: scroll ? 0 : y }); }
function scoreOf(id) {
