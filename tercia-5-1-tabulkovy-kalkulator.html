<!DOCTYPE html>

<style>
:root{
  --bg:#F0EEF6;--surface:#FFFFFF;--surface2:#F6F5FA;--ink:#1A1530;--muted:#5E5877;
  --acc:#6A3FD0;--accSoft:#E9E2FB;--amber:#F2A516;--amberSoft:#FDF1D6;--track:#D3CEE2;
  --ok:#12805A;--okSoft:#DDF3EA;--bad:#C0392B;--badSoft:#FBE3E0;--border:#DAD6E6;
  --head:"Rubik","Segoe UI",system-ui,sans-serif;--font:"Rubik","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#13101F;--surface:#1D1830;--surface2:#241E3A;--ink:#ECE8F7;--muted:#A69FC0;--acc:#A98BFF;--accSoft:#2E2550;--amber:#F7B84B;--amberSoft:#3A2F17;--track:#3A3355;--ok:#3CCB8E;--okSoft:#163A30;--bad:#FF7A6B;--badSoft:#46221F;--border:#342D4C}}
:root[data-theme="dark"]{--bg:#13101F;--surface:#1D1830;--surface2:#241E3A;--ink:#ECE8F7;--muted:#A69FC0;--acc:#A98BFF;--accSoft:#2E2550;--amber:#F7B84B;--amberSoft:#3A2F17;--track:#3A3355;--ok:#3CCB8E;--okSoft:#163A30;--bad:#FF7A6B;--badSoft:#46221F;--border:#342D4C}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17.5px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,.brand{font-family:var(--head)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px 4px;max-width:1140px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand .lg{width:18px;height:18px;border-radius:5px;background:var(--acc);position:relative}
.brand .lg::after{content:"";position:absolute;inset:5px 7px;border-radius:2px;background:var(--surface)}
.pts{background:var(--amberSoft);border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap}
.pts b{font-size:19px}
.reset{background:none;border:1.5px solid var(--border);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.reset.arm{border-color:var(--bad);color:var(--bad);background:var(--badSoft)}
.line{display:flex;overflow-x:auto;padding:10px 20px 14px;max-width:1140px;margin:0 auto;scrollbar-width:thin}
.stn{flex:1 0 100px;position:relative;text-align:center;background:none;border:0;padding:0 4px;cursor:pointer}
.stn:disabled{cursor:not-allowed;opacity:.5}
.stn::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:5px;border-radius:3px;background:var(--track);z-index:0}
.stn:first-child::before{display:none}
.stn.reached::before{background:var(--acc)}
.stn .c{position:relative;z-index:1;display:grid;place-items:center;width:31px;height:31px;margin:0 auto;border-radius:50%;background:var(--surface);border:4px solid var(--track);font-size:13px;font-weight:700;color:transparent;transition:transform .15s}
.stn.done .c{background:var(--acc);border-color:var(--acc);color:#fff}
.stn.cur .c{border-color:var(--acc);transform:scale(1.22);box-shadow:0 0 0 5px var(--accSoft)}
.stn .l{display:block;font-size:13.5px;font-weight:600;margin-top:6px;line-height:1.2}
.stn .m{display:block;font-size:12px;color:var(--muted)}
.stn.cur .l{color:var(--acc)}
main{max-width:900px;margin:0 auto;padding:28px 20px 60px}
main.wide{max-width:1060px}
.kicker{color:var(--muted);font-size:15px;margin:0 0 4px}
h1{font-size:clamp(32px,5vw,48px);line-height:1.08;margin:0 0 12px;letter-spacing:-.02em}
h2{font-size:clamp(27px,4vw,36px);line-height:1.12;margin:0 0 12px;letter-spacing:-.015em}
h3{font-size:21px;margin:36px 0 8px}
p{margin:0 0 14px;max-width:70ch}
.lead{font-size:19px}
.task{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin:12px 0 8px}
.ins{color:var(--muted);font-size:15.5px;margin-bottom:12px}
.box{border-left:5px solid var(--amber);background:var(--amberSoft);border-radius:0 12px 12px 0;padding:12px 16px;margin:16px 0}
.box.v{border-color:var(--acc);background:var(--accSoft)}

.box p:last-child,.box ul:last-child{margin-bottom:0}

.bs{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.bc{display:flex;flex-wrap:wrap;gap:8px}

.slot{display:flex;align-items:center;gap:12px}

.q{border:0;padding:0;margin:0 0 20px}
.q legend{font-weight:600;padding:0;margin-bottom:10px;display:flex;gap:10px}
.qn{flex:0 0 27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--accSoft);color:var(--acc);font-size:14px;font-weight:700;margin-top:1px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}

.opt.sel{border-color:var(--acc);background:var(--accSoft)}
.opt.ok{border-color:var(--ok);background:var(--okSoft)}
.opt.bad{border-color:var(--bad);background:var(--badSoft)}
.opt:disabled{cursor:default;color:var(--ink)}
.why{font-size:15px;margin:8px 0 0;padding:8px 12px;border-radius:8px;max-width:none}
.why.good{background:var(--okSoft)}
.why.miss{background:var(--badSoft)}
.iq{margin-bottom:18px}
.iqq{display:flex;gap:10px;font-weight:600;margin-bottom:8px}
.iqa{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-left:37px}
.iqa .in{max-width:220px;font-family:var(--mono)}
.unit{font-weight:600;color:var(--muted)}
.okm{color:var(--ok);font-weight:600}.badm{color:var(--bad);font-weight:600}
.guesses{display:grid;gap:8px;max-width:600px}
.result{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px}
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 16px}
.big .n{font-family:var(--head);font-size:56px;font-weight:700;line-height:1;color:var(--acc)}
.big .of{font-size:20px;color:var(--muted)}
.grade{margin-left:auto;text-align:center;border:2px solid var(--acc);border-radius:12px;padding:6px 14px}
.grade b{display:block;font-size:30px;line-height:1.1}
.grade span{font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15.5px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
.result td:last-child,.result th:last-child{text-align:right;white-space:nowrap}
textarea{width:100%;font-family:var(--mono);font-size:13.5px;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);color:var(--ink);resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:15.5px}
.fb.ok{background:var(--okSoft)}.fb.bad{background:var(--badSoft)}.fb.info{background:var(--accSoft)}
.goals{list-style:none;padding:0;margin:10px 0 0}
.goals li{padding:3px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.memo{margin:26px 0 8px;background:var(--surface);border:2px solid var(--acc);border-radius:14px;padding:14px 18px 10px}
.memo h3{margin:0 0 6px;font-family:var(--head);font-size:18px;color:var(--acc)}
.memo ul{margin:0;padding-left:20px}.memo li{margin:5px 0;font-size:16px;line-height:1.5}
code{font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:0 5px;font-size:.92em}
.theory{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin:14px 0}
.theory p{margin:8px 0}.theory h4{margin:12px 0 4px;font-family:var(--head)}.theory ul{margin:6px 0;padding-left:22px}.theory li{margin:3px 0}
.theory table,.tbl{border-collapse:collapse;margin:8px 0;font-size:14.5px}.theory td,.theory th,.tbl td,.tbl th{border:1px solid var(--border);padding:5px 9px;text-align:left;vertical-align:top}.theory th,.tbl th{background:var(--surface2)}
.zone{cursor:pointer}
.zone .hit{fill:transparent;stroke:transparent;stroke-width:3;transition:fill .15s,stroke .15s}
.zone:hover .hit,.zone:focus .hit{stroke:#F5A524;fill:rgba(245,165,36,.16)}
.zone.on .hit{stroke:#F5A524;fill:rgba(245,165,36,.28);stroke-width:4}
.zone.seen .hit{stroke:rgba(11,122,117,.55);stroke-dasharray:5 4}
.zone.ok .hit{stroke:#12805A;fill:rgba(18,128,90,.22);stroke-width:4}
.zone.bad .hit{stroke:#C0392B;fill:rgba(192,57,43,.2);stroke-width:4}
.zone:focus{outline:none}
.scr{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr);gap:16px;align-items:start}
@media (max-width:860px){.scr{grid-template-columns:1fr}}
.scr svg{width:100%;height:auto;display:block}
.side{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.side h4{font-family:var(--head);margin:0 0 6px;font-size:19px}
.tag{display:inline-block;font-size:12.5px;font-weight:600;color:var(--acc);background:var(--accSoft);border-radius:6px;padding:2px 8px;margin-bottom:8px}
.meter{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin:8px 0 4px}.meter i{display:block;height:100%;background:var(--acc)}
.prompt{font-size:17px;font-weight:600;margin:4px 0 10px}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin:12px 0}
.key{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:15px}
.key kbd{font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);border-bottom-width:3px;border-radius:6px;padding:1px 7px;font-size:13.5px;margin-right:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}
.pc{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px}
.pc .ic{font-size:30px}.pc h4{margin:6px 0 4px;font-family:var(--head);font-size:17px}.pc p{font-size:14.5px;margin:0;color:var(--muted)}
.tool{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;margin:12px 0}
.goals{list-style:none;padding:0;margin:8px 0 0}.goals li{padding:3px 0}
.xl{background:#fff;color:#1B1F2A;border:1px solid #BCC6D3;border-radius:10px;overflow:hidden;font-family:"Segoe UI",var(--font);margin:10px 0}

/* ===== LENKA: spoločné pravidlá vzhľadu ===== */
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#D9EAFB}}
:root[data-theme="light"]{--bg:#D9EAFB}
.theory p{max-width:none}

<body>

<script>
/* ===== LENKA: typografia a pomôcky ===== */
const VEDEL = t => `<div class="vedel"><b>💡 Vedel si?</b> ${t}</div>`;
const ltfigs = (...a) => `<div class="tfigs${a.length === 1 ? " one" : ""}">${a.join("")}</div>`;
function typo(root) { if (!root) return; const W = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement && n.parentElement.closest("code,pre,script,style,textarea,.bits,.asc,svg,.cm,.code,.editor") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const L = []; while (W.nextNode()) L.push(W.currentNode);
  L.forEach(n => { let t = n.nodeValue, o = t;
    t = t.replace(/([A-Za-z])-(?=\d)/g, "$1‑").replace(/(\d) (?=[\p{L}%°€])/gu, "$1 ").replace(/(\d) ([–-]) (?=\d)/g, "$1 $2 ");
    for (let i = 0; i < 2; i++) t = t.replace(/(^|[\s („])([vkszaiouVKSZAIOU]) /g, "$1$2 ");
    if (t !== o) n.nodeValue = t; }); }

/* ===== generic explore + find on clickable SVG screens ===== */
function XS(k) { S.x = S.x || {}; if (!S.x[k]) S.x[k] = { exp: null, seen: [], fi: 0, res: [], last: null }; return S.x[k]; }
function efSVG(k, ctx) {
  const x = XS(k), Z = SCRS[k].zones;
  const st = id => { if (ctx === "explore") return (x.exp === id ? "on " : "") + (x.seen.includes(id) ? "seen" : ""); const L = x.last; if (!L) return ""; if (id === L.correct) return "ok"; if (id === L.clicked && !L.ok) return "bad"; return ""; };
  const z = (id, hit, inner) => `<g class="zone ${st(id)}" data-sz="${k}|${id}|${ctx}" tabindex="0" role="button" aria-label="${ctx === "explore" ? Z[id][0] : "Časť obrazovky"}">${inner}${hit.map(r => `<rect class="hit" x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="5"/>`).join("")}</g>`;
  return SCRS[k].svg(z);
}
function efExplore(k, hint) { const x = XS(k), Z = SCRS[k].zones, keys = Object.keys(Z), e = x.exp ? Z[x.exp] : null;
  return `<div class="scr"><div class="fig" style="margin:0">${efSVG(k, "explore")}</div><div class="side">${e ? `<span class="tag">Preskúmané ${x.seen.length} z ${keys.length}</span><h4>${e[0]}</h4><p style="font-size:15.5px;margin:0">${e[1]}</p>` : `<h4>Klikni na časť obrázka</h4><p class="muted" style="font-size:15px;margin:0">${hint || "Zisti, na čo slúžia jednotlivé časti."}</p>`}<div class="meter"><i style="width:${Math.round(x.seen.length / keys.length * 100)}%"></i></div></div></div>`; }
function efFind(k) { const x = XS(k), Z = SCRS[k].zones, F = SCRS[k].find, done = S.t["f_" + k]; let fs;
  if (done) fs = `<div class="side"><h4>Hotovo</h4><span class="score ${done.score < done.max ? "part" : ""}">Získal si ${done.score} z ${done.max} bodov</span></div>`;
  else { const L = x.last; fs = `<div class="side"><span class="tag">Otázka ${x.fi + 1} z ${F.length}</span><div class="prompt">${F[x.fi][1]}</div>${L ? `<div class="fb ${L.ok ? "ok" : "bad"}">${L.ok ? "✅ Správne!" : "❌ To je: " + Z[L.clicked][0] + ". Správne miesto svieti nazeleno."}</div><div class="row"><button class="primary" data-sn="${k}">${x.fi + 1 < F.length ? "Ďalšia otázka" : "Dokončiť"}</button></div>` : `<p class="muted" style="font-size:14.5px">Klikni na správne miesto. Máš jeden pokus.</p>`}</div>`; }
  return `<div class="scr"><div class="fig" style="margin:0">${efSVG(k, "find")}</div>${fs}</div>`; }
function efClick(e) {
  const z = e.target.closest && e.target.closest("[data-sz]");
  if (z) { const [k, id, ctx] = z.dataset.sz.split("|"), x = XS(k);
    if (ctx === "explore") { x.exp = id; if (!x.seen.includes(id)) x.seen.push(id); }
    else { if (S.t["f_" + k] || x.last) return true; const F = SCRS[k].find, ok = id === F[x.fi][0]; x.res[x.fi] = ok; x.last = { clicked: id, correct: F[x.fi][0], ok }; }
    save(); render(false); return true; }
  const el = e.target.closest("button"); if (el && el.dataset.sn) { const k = el.dataset.sn, x = XS(k), F = SCRS[k].find; x.last = null; x.fi++; if (x.fi >= F.length) { x.fi = F.length - 1; award("f_" + k, x.res.filter(Boolean).length); } save(); render(false); return true; }
  return false;
}
document.addEventListener("keydown", e => { const z = e.target.closest && e.target.closest("[data-sz]"); if (z && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); z.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });
const T_ = (x, y, t, s = 12, c = "#1B1B1F", w = 400, a = "start") => `<text x="${x}" y="${y}" font-family="Segoe UI,Rubik,sans-serif" font-size="${s}" font-weight="${w}" fill="${c}" text-anchor="${a}" pointer-events="none">${t}</text>`;
const IC_ = (x, y, e, bg, sz = 34) => `<rect x="${x}" y="${y}" width="${sz}" height="${sz}" rx="${sz / 4.5}" fill="${bg}"/><text x="${x + sz / 2}" y="${y + sz * 0.7}" text-anchor="middle" font-size="${sz * 0.55}" pointer-events="none">${e}</text>`;

function go(i) { if (!S.started && i > 0) return; S.cur = i; SEL = null; save(); render(true); }
function placeSel(t, b) { if (!SEL || SEL.t !== t || S.t[t]) return; const d = S.d[t] = S.d[t] || {}; if (b) d[SEL.i] = b; else delete d[SEL.i]; SEL = null; save(); render(false); }

let resetArmed = null;
document.addEventListener("click", e => {
  if (typeof CUSTOM_CLICK === "function" && CUSTOM_CLICK(e) === true) return;
  const el = e.target.closest("button,[data-bucket]"); if (!el) return;
  const ds = el.dataset;
  if (ds.go !== undefined) return go(+ds.go);
  if (ds.reset !== undefined) {
    if (!resetArmed) { el.classList.add("arm"); el.textContent = "Naozaj? Klikni znova"; resetArmed = setTimeout(() => { resetArmed = null; renderTop(); }, 3000); return; }
    clearTimeout(resetArmed); resetArmed = null; const keep = { name: S.name, cls: S.cls }; S = fresh(); S.name = keep.name; S.cls = keep.cls; SEL = null; save(); return render(true);
  }
  if (ds.start !== undefined) { if (!S.started) S.started = Date.now(); return go(1); }
  if (ds.guess !== undefined) { S.guess = +ds.guess; save(); return render(false); }
  if (ds.check) return check(ds.check);
  if (ds.mc) { const [t, q, i] = ds.mc.split("|"); if (S.t[t]) return; (S.d[t] = S.d[t] || {})[q] = +i; save(); return render(false); }
  if (ds.place) { const [t, id] = ds.place.split("|"); if (S.t[t]) return; const s = S.d[t] = S.d[t] || []; if (!s.includes(id)) s.push(id); save(); return render(false); }
  if (ds.unplace) { const [t, id] = ds.unplace.split("|"); if (S.t[t]) return; S.d[t] = (S.d[t] || []).filter(x => x !== id); save(); return render(false); }
  if (ds.pick) { const [t, id] = ds.pick.split("|"); if (S.t[t]) return; SEL = SEL && SEL.t === t && SEL.i === id ? null : { t, i: id }; return render(false); }
  if (ds.bucket !== undefined) { const [t, b] = ds.bucket.split("|"); return placeSel(t, b); }
  if (ds.copy !== undefined) {
    const ta = document.getElementById("restxt"), out = document.getElementById("copied");
    const ok = () => { out.textContent = "Skopírované ✓"; };
    const fallback = () => { ta.focus(); ta.select(); try { document.execCommand("copy") ? ok() : (out.textContent = "Označ text a stlač Ctrl+C."); } catch (err) { out.textContent = "Označ text a stlač Ctrl+C."; } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok, fallback); else fallback();
  }
});
document.addEventListener("input", e => {
  if (typeof CUSTOM_INPUT === "function" && CUSTOM_INPUT(e) === true) return;
  const t = e.target;
  if (t.dataset.inp) {
    const [tid, qid] = t.dataset.inp.split("|"); (S.d[tid] = S.d[tid] || {})[qid] = t.value; save();
    const b = document.querySelector(`[data-check="${tid}"]`), h = document.querySelector(`[data-hint="${tid}"]`), r = inputReady(TASKS[tid]);
    if (b) b.disabled = !r; if (h) h.textContent = r ? "" : "Vyplň všetky odpovede."; return;
  }
  const f = t.dataset.field; if (!f) return;
  S[f] = t.value; save();
  if (STEPS[S.cur].id === "start") {
    const btn = document.querySelector("[data-start]"), h = document.getElementById("starthint"), ok = S.name.trim().length >= 3;
    if (btn) btn.disabled = !ok || S.guess === null;
    if (h) h.textContent = ok ? (S.guess === null ? "Vyber svoj tip." : "") : "Napíš svoje meno a vyber tip.";
  }
});
document.addEventListener("dragstart", e => { const p = e.target.closest && e.target.closest("[data-pick]"); if (!p) return; const [t, id] = p.dataset.pick.split("|"); if (S.t[t]) return e.preventDefault(); SEL = { t, i: id }; try { e.dataTransfer.setData("text/plain", id); } catch (err) {} });
document.addEventListener("dragover", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (b && SEL) { e.preventDefault(); b.classList.add("over"); } });
document.addEventListener("dragleave", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (b && !b.contains(e.relatedTarget)) b.classList.remove("over"); });
document.addEventListener("drop", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (!b) return; e.preventDefault(); const [t, bk] = b.dataset.bucket.split("|"); placeSel(t, bk); });
document.addEventListener("dragend", () => document.querySelectorAll(".over").forEach(x => x.classList.remove("over")));
if (!S.started) S.cur = 0;
render(true);

</script>
</body>
</html>
