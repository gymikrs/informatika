<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5.1 Zásady tvorby prezentácie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0EEF6;--surface:#FFFFFF;--surface2:#F6F5FA;--ink:#1A1530;--muted:#5E5877;
  --acc:#6A3FD0;--accSoft:#E9E2FB;--amber:#F2A516;--amberSoft:#FDF1D6;--track:#D3CEE2;
  --ok:#12805A;--okSoft:#DDF3EA;--bad:#C0392B;--badSoft:#FBE3E0;--border:#DAD6E6;
  --head:"Rubik","Segoe UI",system-ui,sans-serif;--font:"Rubik","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#13101F;--surface:#1D1830;--surface2:#241E3A;--ink:#ECE8F7;--muted:#A69FC0;--acc:#A98BFF;--accSoft:#2E2550;--amber:#F7B84B;--amberSoft:#3A2F17;--track:#3A3355;--ok:#3CCB8E;--okSoft:#163A30;--bad:#FF7A6B;--badSoft:#46221F;--border:#342D4C}}
:root[data-theme="dark"]{--bg:#13101F;--surface:#1D1830;--surface2:#241E3A;--ink:#ECE8F7;--muted:#A69FC0;--acc:#A98BFF;--accSoft:#2E2550;--amber:#F7B84B;--amberSoft:#3A2F17;--track:#3A3355;--ok:#3CCB8E;--okSoft:#163A30;--bad:#FF7A6B;--badSoft:#46221F;--border:#342D4C}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17.5px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,.brand{font-family:var(--head)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px 4px;max-width:1140px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand .lg{width:18px;height:18px;border-radius:5px;background:var(--acc);position:relative}
.brand .lg::after{content:"";position:absolute;inset:5px 7px;border-radius:2px;background:var(--surface)}
.pts{background:var(--amberSoft);border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap}
.pts b{font-size:19px}
.reset{background:none;border:1.5px solid var(--border);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.reset.arm{border-color:var(--bad);color:var(--bad);background:var(--badSoft)}
.line{display:flex;overflow-x:auto;padding:10px 20px 14px;max-width:1140px;margin:0 auto;scrollbar-width:thin}
.stn{flex:1 0 100px;position:relative;text-align:center;background:none;border:0;padding:0 4px;cursor:pointer}
.stn:disabled{cursor:not-allowed;opacity:.5}
.stn::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:5px;border-radius:3px;background:var(--track);z-index:0}
.stn:first-child::before{display:none}
.stn.reached::before{background:var(--acc)}
.stn .c{position:relative;z-index:1;display:grid;place-items:center;width:31px;height:31px;margin:0 auto;border-radius:50%;background:var(--surface);border:4px solid var(--track);font-size:13px;font-weight:700;color:transparent;transition:transform .15s}
.stn.done .c{background:var(--acc);border-color:var(--acc);color:#fff}
.stn.cur .c{border-color:var(--acc);transform:scale(1.22);box-shadow:0 0 0 5px var(--accSoft)}
.stn .l{display:block;font-size:13.5px;font-weight:600;margin-top:6px;line-height:1.2}
.stn .m{display:block;font-size:12px;color:var(--muted)}
.stn.cur .l{color:var(--acc)}
main{max-width:900px;margin:0 auto;padding:28px 20px 60px}
main.wide{max-width:1060px}
.kicker{color:var(--muted);font-size:15px;margin:0 0 4px}
h1{font-size:clamp(32px,5vw,48px);line-height:1.08;margin:0 0 12px;letter-spacing:-.02em}
h2{font-size:clamp(27px,4vw,36px);line-height:1.12;margin:0 0 12px;letter-spacing:-.015em}
h3{font-size:21px;margin:36px 0 8px}
p{margin:0 0 14px;max-width:70ch}
.lead{font-size:19px}
.task{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin:12px 0 8px}
.ins{color:var(--muted);font-size:15.5px;margin-bottom:12px}
.box{border-left:5px solid var(--amber);background:var(--amberSoft);border-radius:0 12px 12px 0;padding:12px 16px;margin:16px 0}
.box.v{border-color:var(--acc);background:var(--accSoft)}
.box.g{border-color:var(--ok);background:var(--okSoft)}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.fig{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin:16px 0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption,.cap{font-size:14.5px;color:var(--muted);margin-top:8px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.primary{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:600;cursor:pointer;font-size:17px}
.primary:disabled{background:var(--track);color:var(--muted);cursor:not-allowed}
.ghost{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
.ghost:hover:not(:disabled){border-color:var(--acc)}
.ghost.on{border-color:var(--acc);background:var(--accSoft)}
.ghost:disabled{opacity:.45;cursor:not-allowed}
.checkbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.checkbar .hint{color:var(--muted);font-size:14.5px}
.score{font-weight:600;padding:8px 14px;border-radius:10px;background:var(--okSoft);color:var(--ok)}
.score.part{background:var(--amberSoft);color:var(--ink)}
.next{margin-top:36px;padding-top:22px;border-top:1px dashed var(--border);display:flex;justify-content:flex-end;gap:12px;align-items:center}
label.f{display:block;font-weight:600;margin:12px 0 4px}
.in{font:inherit;width:100%;max-width:420px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--ink)}
.in.good{border-color:var(--ok);background:var(--okSoft)}
.in.badin{border-color:var(--bad);background:var(--badSoft)}
.muted{color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border-radius:12px;background:var(--surface2);min-height:60px}
.pool .empty{color:var(--muted);font-size:14.5px;align-self:center}
.chipb{background:var(--surface);border:1.5px solid var(--border);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500}
.chipb:hover:not(:disabled){border-color:var(--acc)}
.chipb.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.chipb.ok{background:var(--okSoft);border-color:var(--ok);color:var(--ok)}
.chipb.bad{background:var(--badSoft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.chipb:disabled{cursor:default}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.bucket{border:2px dashed var(--acc);border-radius:12px;padding:12px;min-height:120px;cursor:pointer;background:var(--surface)}
.bucket.over{background:var(--accSoft)}
.bh{font-weight:700;margin-bottom:2px}
.bs{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.bc{display:flex;flex-wrap:wrap;gap:8px}
.seq{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:12px}
.slot .n{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accSoft);color:var(--acc)}
.slot.empty span:last-child{color:var(--muted);flex:1;border:1.5px dashed var(--border);border-radius:10px;padding:9px 14px}
.slotbtn{flex:1;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:9px 14px;cursor:pointer}
.slot.ok .slotbtn{border-color:var(--ok);background:var(--okSoft)}
.slot.bad .slotbtn{border-color:var(--bad);background:var(--badSoft)}
.slotbtn:disabled{cursor:default;color:var(--ink)}
.q{border:0;padding:0;margin:0 0 20px}
.q legend{font-weight:600;padding:0;margin-bottom:10px;display:flex;gap:10px}
.qn{flex:0 0 27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--accSoft);color:var(--acc);font-size:14px;font-weight:700;margin-top:1px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.opt{text-align:left;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--accSoft)}
.opt.ok{border-color:var(--ok);background:var(--okSoft)}
.opt.bad{border-color:var(--bad);background:var(--badSoft)}
.opt:disabled{cursor:default;color:var(--ink)}
.why{font-size:15px;margin:8px 0 0;padding:8px 12px;border-radius:8px;max-width:none}
.why.good{background:var(--okSoft)}
.why.miss{background:var(--badSoft)}
.iq{margin-bottom:18px}
.iqq{display:flex;gap:10px;font-weight:600;margin-bottom:8px}
.iqa{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-left:37px}
.iqa .in{max-width:220px;font-family:var(--mono)}
.unit{font-weight:600;color:var(--muted)}
.okm{color:var(--ok);font-weight:600}.badm{color:var(--bad);font-weight:600}
.guesses{display:grid;gap:8px;max-width:600px}
.result{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px}
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 16px}
.big .n{font-family:var(--head);font-size:56px;font-weight:700;line-height:1;color:var(--acc)}
.big .of{font-size:20px;color:var(--muted)}
.grade{margin-left:auto;text-align:center;border:2px solid var(--acc);border-radius:12px;padding:6px 14px}
.grade b{display:block;font-size:30px;line-height:1.1}
.grade span{font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15.5px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
.result td:last-child,.result th:last-child{text-align:right;white-space:nowrap}
textarea{width:100%;font-family:var(--mono);font-size:13.5px;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);color:var(--ink);resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:15.5px}
.fb.ok{background:var(--okSoft)}.fb.bad{background:var(--badSoft)}.fb.info{background:var(--accSoft)}
.goals{list-style:none;padding:0;margin:10px 0 0}
.goals li{padding:3px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.memo{margin:26px 0 8px;background:var(--surface);border:2px solid var(--acc);border-radius:14px;padding:14px 18px 10px}
.memo h3{margin:0 0 6px;font-family:var(--head);font-size:18px;color:var(--acc)}
.memo ul{margin:0;padding-left:20px}.memo li{margin:5px 0;font-size:16px;line-height:1.5}
:root{--bg:#F5EFEA;--acc:#C2560C;--accSoft:#FBE3D2;--track:#E0CFC2;--border:#E3D5CA;--surface2:#FAF6F2;--ink:#231812;--muted:#6B5A4E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17110D;--surface:#221913;--surface2:#2A1F18;--acc:#F28C4B;--accSoft:#3E2616;--track:#3B2D24;--border:#3A2C22;--ink:#F3E9E1;--muted:#BCA898}}
:root[data-theme="dark"]{--bg:#17110D;--surface:#221913;--surface2:#2A1F18;--acc:#F28C4B;--accSoft:#3E2616;--track:#3B2D24;--border:#3A2C22;--ink:#F3E9E1;--muted:#BCA898}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.pc{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px}
.pc h4{margin:8px 0 4px;font-family:var(--head);font-size:17px}.pc p{font-size:14.5px;margin:0;color:var(--muted)}
.pc .ic{font-size:34px}
.wide-svg svg{width:100%;height:auto;display:block}
.lab{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:18px;align-items:start}
@media (max-width:860px){.lab{grid-template-columns:1fr}}
.side{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.side h4{font-family:var(--head);margin:0 0 6px;font-size:19px}
.tag{display:inline-block;font-size:12.5px;font-weight:600;color:var(--acc);background:var(--accSoft);border-radius:6px;padding:2px 8px;margin-bottom:8px}
.meter{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin:8px 0 4px}.meter i{display:block;height:100%;background:var(--acc)}
.zone{cursor:pointer}.zone .hit{fill:transparent;stroke:transparent;stroke-width:3;transition:fill .15s,stroke .15s}
.zone:hover .hit,.zone:focus .hit{stroke:#F5A524;fill:rgba(245,165,36,.16)}
.zone.on .hit{stroke:#F5A524;fill:rgba(245,165,36,.28);stroke-width:4}
.zone.seen .hit{stroke:rgba(194,86,12,.55);stroke-dasharray:5 4}
.zone.ok .hit{stroke:#12805A;fill:rgba(18,128,90,.22);stroke-width:4}
.zone.bad .hit{stroke:#C0392B;fill:rgba(192,57,43,.2);stroke-width:4}
.zone:focus{outline:none}
.tm{background:#fff;color:#1B1B1F;border:1px solid #C9CED6;border-radius:10px;overflow:hidden;box-shadow:0 12px 30px -14px rgba(30,20,10,.45);font-family:"Segoe UI",var(--font);font-size:14px}
.tm .wt{background:#EEF0F3;padding:7px 12px;display:flex;gap:8px;border-bottom:1px solid #D9DDE3;font-size:13.5px}
.tm table{width:100%;border-collapse:collapse}
.tm th,.tm td{padding:7px 10px;border-bottom:1px solid #EEF0F3;text-align:left}
.tm td.n{text-align:right;font-family:var(--mono)}
.tm tr.sel{background:#DCE8FA}
.tm tr.hang td:first-child::after{content:" (Neodpovedá)";color:#C0392B;font-weight:600}
.tm tr{cursor:pointer}
.tm .foot{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#F7F8FA}
.tm .foot button{border:1px solid #A9B1BC;background:#fff;border-radius:6px;padding:5px 12px;cursor:pointer}
.tm .foot button:disabled{opacity:.4;cursor:default}
.bar{display:inline-block;height:8px;border-radius:4px;background:#F2A516;vertical-align:middle;margin-left:6px}
.path{font-family:var(--mono);background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:15px}
.path span{padding:2px 6px;border-radius:6px}
.tree{font-family:var(--mono);font-size:14.5px;line-height:1.9;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;white-space:pre}
code{font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:0 5px;font-size:.92em}
.theory{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin:14px 0}
.theory p{margin:8px 0}.theory h4{margin:12px 0 4px;font-family:var(--head)}.theory ul{margin:6px 0;padding-left:22px}.theory li{margin:3px 0}
.theory table,.tbl{border-collapse:collapse;margin:8px 0;font-size:14.5px}.theory td,.theory th,.tbl td,.tbl th{border:1px solid var(--border);padding:5px 9px;text-align:left;vertical-align:top}.theory th,.tbl th{background:var(--surface2)}

@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#D9EAFB}}
:root[data-theme="light"]{--bg:#D9EAFB}
.theory p{max-width:none}

.rtab{border-collapse:collapse;margin:10px 0;font-size:15.5px;width:100%}
.rtab th,.rtab td{border:1px solid var(--border);padding:5px 10px;text-align:left;vertical-align:top}
.rtab th{background:var(--surface2);font-size:14px}
.rtab.num td:first-child{white-space:nowrap;font-family:var(--mono);font-size:14.5px}
.vedel{background:#FFF8E1;color:#3A2E00;border:1px solid #F2D27A;border-left:5px solid #E0A800;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:15.5px;line-height:1.55}
.goals.g2{columns:2;column-gap:24px}.goals.g2 li{break-inside:avoid}
@media (max-width:640px){.goals.g2{columns:1}}
.tfigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.tfigs.one{grid-template-columns:minmax(0,560px);justify-content:center}
@media (max-width:760px){.tfigs{grid-template-columns:1fr}}
.tfig{margin:0;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 10px 8px;display:flex;flex-direction:column;gap:6px}
.tfig svg{width:100%;height:auto;display:block}
.tfig figcaption{font-size:14px;line-height:1.45;color:#3E3858;text-align:center;padding:0 4px}
.tsplit>div{min-width:0}
.rtab td{overflow-wrap:anywhere}
/* ===== HODINY: obrázky pri otázkach, opravovanie úloh, záverečný test so zámkom ===== */
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:16px;align-items:start}
.qpic{margin:0;background:#fff;border:1px solid var(--border);border-radius:12px;padding:6px}
.qpic svg{width:100%;height:auto;display:block}
@media (max-width:640px){.qrow{grid-template-columns:1fr}.qpic{max-width:260px}}
.tpic{margin:0 0 14px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px;max-width:520px}
.tpic svg{width:100%;height:auto;display:block}
.iq .qrow{padding-left:37px}.iq .qrow .iqa{padding-left:0}
@media (max-width:640px){.iq .qrow{padding-left:0}}
.checkbar .retry{margin-left:auto}
.lockban{background:#FFF8E1;border:1px solid #F2D27A;border-radius:12px;padding:10px 14px;margin:0 0 16px;font-weight:600;font-size:15.5px;color:#3A2E00}
.tstart{background:var(--surface);border:2px solid var(--acc);border-radius:16px;padding:20px 22px;margin:14px 0}
.tstart .warn{background:var(--badSoft);border-left:5px solid var(--bad);border-radius:0 10px 10px 0;padding:10px 14px;margin:12px 0;font-weight:600}
.confirm{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px}
.tq{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin:0 0 16px}
.tq .qh{display:flex;gap:10px;font-weight:600;margin-bottom:10px}
.tq .qh .pt{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.tq .tqfig{margin:0 auto 12px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px;max-width:560px}
.tq .tqfig svg{width:100%;height:auto;display:block}
.tq .fb{font-size:15px;margin:10px 0 0;padding:8px 12px;border-radius:8px}
.tq .fb.miss{background:var(--badSoft)}
.tq .buckets{margin-top:10px}
.hz{fill:rgba(47,91,234,.001);stroke:transparent;stroke-width:3;cursor:pointer;transition:fill .12s}
.hz:hover,.hz:focus{fill:rgba(47,91,234,.16);stroke:#2F5BEA;outline:none}
.hz.hsel{fill:rgba(47,91,234,.30);stroke:#2F5BEA;stroke-width:4}
.hz.hok{fill:rgba(18,128,90,.28);stroke:#12805A;stroke-width:4}
.hz.hbad{fill:rgba(192,57,43,.28);stroke:#C0392B;stroke-width:4}
.hz.hmiss{fill:rgba(18,128,90,.10);stroke:#12805A;stroke-width:3;stroke-dasharray:7 5}
.done .hz{cursor:default}
.mtt{border-collapse:collapse;width:100%;font-size:15.5px}
.mtt td{padding:7px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.mtt td:first-child{font-weight:700;width:34%}
.mtt select{font:inherit;width:100%;max-width:420px;padding:8px 10px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--ink)}
.mtt select.good{border-color:var(--ok);background:var(--okSoft)}.mtt select.badsel{border-color:var(--bad);background:var(--badSoft)}
@media (max-width:560px){.mtt td{display:block;width:100%!important;border:0;padding:3px 0}.mtt tr{display:block;padding:8px 0;border-bottom:1px solid var(--border)}}
.bslots{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface2);border:1.5px solid var(--border);border-radius:14px;padding:8px 14px;min-height:48px;margin-bottom:10px}
.bslots.mono{font-family:var(--mono)}
.bslots .bsl{border:1.5px dashed var(--border);border-radius:8px;padding:5px 10px;color:var(--muted);min-width:70px;text-align:center;font-size:14.5px}
.bslots button.bsl{border-style:solid;color:var(--ink);background:var(--surface);cursor:pointer;font:inherit;font-size:15.5px}
.bslots.mono button.bsl{font-family:var(--mono)}
.bslots .bsl.ok{border-color:var(--ok);background:var(--okSoft)}.bslots .bsl.bad{border-color:var(--bad);background:var(--badSoft)}
.chipb.mono{font-family:var(--mono)}
.ptl{display:flex;flex-direction:column;gap:5px;margin:4px 0 8px}.ptl button{text-align:left;font-size:13px;padding:6px 10px;line-height:1.3}.ptl small{opacity:.7}
.qpic:has(.sld){max-width:340px}.qpic .sld{font-size:12px}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main" tabindex="-1"></main>
<script>
/* ===== LENKA: typografia a pomôcky ===== */
const VEDEL = t => `<div class="vedel"><b>💡 Vedel si?</b> ${t}</div>`;
const ltfigs = (...a) => `<div class="tfigs${a.length === 1 ? " one" : ""}">${a.join("")}</div>`;
function typo(root) { if (!root) return; const W = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement && n.parentElement.closest("code,pre,script,style,textarea,.bits,.asc,svg,.cm,.code,.editor") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const L = []; while (W.nextNode()) L.push(W.currentNode);
  L.forEach(n => { let t = n.nodeValue, o = t;
    t = t.replace(/([A-Za-z])-(?=\d)/g, "$1‑").replace(/(\d) (?=[\p{L}%°€])/gu, "$1 ").replace(/(\d) ([–-]) (?=\d)/g, "$1 $2 ");
    for (let i = 0; i < 2; i++) t = t.replace(/(^|[\s („])([vkszaiouVKSZAIOU]) /g, "$1$2 ");
    if (t !== o) n.nodeValue = t; }); }

/* ===== generic explore + find on clickable SVG screens ===== */
function XS(k) { S.x = S.x || {}; if (!S.x[k]) S.x[k] = { exp: null, seen: [], fi: 0, res: [], last: null }; return S.x[k]; }
function efSVG(k, ctx) {
  const x = XS(k), Z = SCRS[k].zones;
  const st = id => { if (ctx === "explore") return (x.exp === id ? "on " : "") + (x.seen.includes(id) ? "seen" : ""); const L = x.last; if (!L) return ""; if (id === L.correct) return "ok"; if (id === L.clicked && !L.ok) return "bad"; return ""; };
  const z = (id, hit, inner) => `<g class="zone ${st(id)}" data-sz="${k}|${id}|${ctx}" tabindex="0" role="button" aria-label="${ctx === "explore" ? Z[id][0] : "Časť obrazovky"}">${inner}${hit.map(r => `<rect class="hit" x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="5"/>`).join("")}</g>`;
  return SCRS[k].svg(z);
}
function efExplore(k, hint) { const x = XS(k), Z = SCRS[k].zones, keys = Object.keys(Z), e = x.exp ? Z[x.exp] : null;
  return `<div class="scr"><div class="fig" style="margin:0">${efSVG(k, "explore")}</div><div class="side">${e ? `<span class="tag">Preskúmané ${x.seen.length} z ${keys.length}</span><h4>${e[0]}</h4><p style="font-size:15.5px;margin:0">${e[1]}</p>` : `<h4>Klikni na časť obrázka</h4><p class="muted" style="font-size:15px;margin:0">${hint || "Zisti, na čo slúžia jednotlivé časti."}</p>`}<div class="meter"><i style="width:${Math.round(x.seen.length / keys.length * 100)}%"></i></div></div></div>`; }
function efFind(k) { const x = XS(k), Z = SCRS[k].zones, F = SCRS[k].find, done = S.t["f_" + k]; let fs;
  if (done) fs = `<div class="side"><h4>Hotovo</h4><span class="score ${done.score < done.max ? "part" : ""}">${done.skip ? "Úlohu si pred testom nevyriešil: 0 bodov" : `Získal si ${done.score} z ${done.max} bodov`}</span><div class="row">${retryBtn("f_" + k)}</div></div>`;
  else { const L = x.last; fs = `<div class="side"><span class="tag">Otázka ${x.fi + 1} z ${F.length}</span><div class="prompt">${F[x.fi][1]}</div>${L ? `<div class="fb ${L.ok ? "ok" : "bad"}">${L.ok ? "✅ Správne!" : "❌ To je: " + Z[L.clicked][0] + ". Správne miesto svieti nazeleno."}</div><div class="row"><button class="primary" data-sn="${k}">${x.fi + 1 < F.length ? "Ďalšia otázka" : "Dokončiť"}</button></div>` : `<p class="muted" style="font-size:14.5px">Klikni na správne miesto. Máš jeden pokus. Po kliknutí hneď uvidíš správne miesto.</p>`}</div>`; }
  return `<div class="scr"><div class="fig" style="margin:0">${efSVG(k, "find")}</div>${fs}</div>`; }
function efClick(e) {
  const z = e.target.closest && e.target.closest("[data-sz]");
  if (z) { const [k, id, ctx] = z.dataset.sz.split("|"), x = XS(k);
    if (ctx === "explore") { x.exp = id; if (!x.seen.includes(id)) x.seen.push(id); }
    else { if (S.t["f_" + k] || x.last) return true; const F = SCRS[k].find, ok = id === F[x.fi][0]; x.res[x.fi] = ok; x.last = { clicked: id, correct: F[x.fi][0], ok }; }
    save(); render(false); return true; }
  const el = e.target.closest("button"); if (el && el.dataset.sn) { const k = el.dataset.sn, x = XS(k), F = SCRS[k].find; x.last = null; x.fi++; if (x.fi >= F.length) { x.fi = F.length - 1; award("f_" + k, x.res.filter(Boolean).length); } save(); render(false); return true; }
  return false;
}
document.addEventListener("keydown", e => { const z = e.target.closest && e.target.closest("[data-sz]"); if (z && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); z.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });
const T_ = (x, y, t, s = 12, c = "#1B1B1F", w = 400, a = "start") => `<text x="${x}" y="${y}" font-family="Segoe UI,Rubik,sans-serif" font-size="${s}" font-weight="${w}" fill="${c}" text-anchor="${a}" pointer-events="none">${t}</text>`;
const IC_ = (x, y, e, bg, sz = 34) => `<rect x="${x}" y="${y}" width="${sz}" height="${sz}" rx="${sz / 4.5}" fill="${bg}"/><text x="${x + sz / 2}" y="${y + sz * 0.7}" text-anchor="middle" font-size="${sz * 0.55}" pointer-events="none">${e}</text>`;

/* Spoločné pomôcky na ilustrácie k teórii (Prima) */
const tfigs = (...a) => `<div class="tfigs${a.length === 1 ? " one" : ""}">${a.join("")}</div>`;
const PF = (() => {
  const FF = `font-family="Rubik,Segoe UI,Arial,sans-serif"`;
  const C = { ink: "#1A1530", mut: "#5E5877", acc: "#6A3FD0", accS: "#E9E2FB", ok: "#12805A", okS: "#E6F4EE", bad: "#C0392B", badS: "#FDECEA", amb: "#B07400", ambS: "#FFF6E0", blue: "#1E6FD9", blueS: "#E3EEFC", line: "#DAD6E6", bg: "#F6F5FA" };
  const fig = (svg, cap) => `<figure class="tfig">${svg}<figcaption>${cap}</figcaption></figure>`;
  let uid = 0;
  const SV = (w, h, body, label) => { const id = "pf" + (++uid); const d = `<defs>${[C.mut, C.ok, C.acc, C.bad, C.blue, C.amb, "#C2560C", "#B4235A", "#0B7A75"].map(c => `<marker id="${id}${c.slice(1)}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`).join("")}</defs>`; return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}" ${FF}>${d}${body.replace(/url\(#M([0-9A-F]{6})\)/g, `url(#${id}$1)`)}</svg>`; };
  const ar = (x1, y1, x2, y2, c, w, both) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w || 2.5}" marker-end="url(#M${c.slice(1)})"${both ? ` marker-start="url(#M${c.slice(1)})"` : ""}/>`;
  const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.fs || 12}" ${o.a ? `text-anchor="${o.a}"` : ""} fill="${o.c || C.ink}" font-weight="${o.b ? 700 : 400}"${o.mono ? ` font-family="Consolas,monospace"` : ""}${o.i ? ` font-style="italic"` : ""}>${s}</text>`;
  /* zalomenie textu na riadky podľa počtu znakov */
  const TW = (x, y, s, n, o = {}) => { const w = s.split(" "), L = []; let l = ""; w.forEach(x2 => { if ((l + " " + x2).trim().length > n) { L.push(l.trim()); l = x2; } else l += " " + x2; }); L.push(l.trim()); return L.map((t, i) => T(x, y + i * (o.lh || (o.fs || 12) * 1.35), t, o)).join(""); };
  const box = (x, y, w, h, f, s, r) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r == null ? 10 : r}" fill="${f}"${s ? ` stroke="${s}" stroke-width="1.5"` : ""}/>`;
  const pc = (x, y, on = 1, inner = "") => `<rect x="${x}" y="${y}" width="64" height="42" rx="4" fill="${C.ink}"/><rect x="${x + 4}" y="${y + 4}" width="56" height="34" rx="2" fill="${on ? "#E8F0FE" : "#3A3355"}"/>${inner}<rect x="${x + 26}" y="${y + 42}" width="12" height="7" fill="${C.mut}"/><rect x="${x + 16}" y="${y + 49}" width="32" height="5" rx="2" fill="${C.mut}"/>`;
  const phone = (x, y, inner = "") => `<rect x="${x}" y="${y}" width="40" height="70" rx="7" fill="${C.ink}"/><rect x="${x + 3}" y="${y + 7}" width="34" height="54" rx="3" fill="#E8F0FE"/>${inner}`;
  const server = (x, y) => `<rect x="${x}" y="${y}" width="46" height="62" rx="5" fill="${C.ink}"/>${[0, 1, 2].map(i => `<rect x="${x + 6}" y="${y + 7 + i * 18}" width="34" height="12" rx="2" fill="#3A3355"/><circle cx="${x + 34}" cy="${y + 13 + i * 18}" r="2.5" fill="#3CCB8E"/>`).join("")}`;
  const av = (x, y, t, c, r = 15) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><text x="${x}" y="${y + 4.5}" text-anchor="middle" font-size="${r * 0.8}" font-weight="700" fill="#fff">${t}</text>`;
  const num = (x, y, n, c) => `<circle cx="${x}" cy="${y}" r="10" fill="${c || C.acc}"/>${T(x, y + 4, n, { a: "middle", fs: 11, b: 1, c: "#fff" })}`;
  const win = (x, y, w, h, url, lock = 1) => `${box(x, y, w, h, "#fff", "#C9D1DF", 8)}<rect x="${x}" y="${y}" width="${w}" height="28" rx="8" fill="#E9EDF3"/><rect x="${x}" y="${y + 18}" width="${w}" height="10" fill="#E9EDF3"/><rect x="${x + 8}" y="${y + 5}" width="${w - 16}" height="18" rx="9" fill="#fff"/>${lock ? T(x + 15, y + 18, "🔒", { fs: 9 }) : ""}${T(x + (lock ? 29 : 16), y + 18, url, { fs: 10.5 })}`;
  /* myšlienková mapa: vetvy [text, farba, strana (1 vpravo, -1 vľavo), vonkajší koniec x, y, [podvetvy]] */
  const mm = (cx, cy, top, br, o = {}) => { const fs = o.fs || 11, sfs = o.sfs || 9.5, cw = fs * 0.62, scw = sfs * 0.56; let out = "";
    br.forEach(([t, c, side, ex, ey, subs = []]) => { const w = t.length * cw + 6, sx = side > 0 ? ex - w : ex + w;
      out += `<path d="M${cx} ${cy} C${(cx + sx) / 2} ${cy} ${(cx + sx) / 2} ${ey} ${sx} ${ey}" fill="none" stroke="${c}" stroke-width="${o.bw || 6}" stroke-linecap="round"/><line x1="${sx}" y1="${ey}" x2="${ex}" y2="${ey}" stroke="${c}" stroke-width="3" stroke-linecap="round"/>` + T((side > 0 ? sx : ex) + 3, ey - 5, t, { fs, b: 1, c });
      subs.forEach((s2, k) => { const sy = ey + (k - (subs.length - 1) / 2) * (o.sg || 20), ws = s2.length * scw + 6, bx = ex + side * 12, bx2 = bx + side * ws;
        out += `<path d="M${ex} ${ey} C${ex + side * 7} ${ey} ${ex + side * 5} ${sy} ${bx} ${sy}" fill="none" stroke="${c}" stroke-width="1.6"/><line x1="${bx}" y1="${sy}" x2="${bx2}" y2="${sy}" stroke="${c}" stroke-width="1.2"/>` + T(Math.min(bx, bx2) + 3, sy - 3, s2, { fs: sfs }); }); });
    return out + `<ellipse cx="${cx}" cy="${cy}" rx="${o.rx || 42}" ry="${o.ry || 21}" fill="#fff" stroke="${C.ink}" stroke-width="2"/>${T(cx, cy + 5, top, { a: "middle", fs: o.tfs || 12.5, b: 1 })}`; };
  return { C, fig, SV, ar, T, TW, box, pc, phone, server, av, num, win, mm };
})();

/* Ilustrácie – Sekunda 5.1 Zásady tvorby prezentácie */
const TFIG = (() => { const { C, fig, SV, ar, T, box } = PF; const A = "#C2560C", AS = "#FBE3D2";
const sl = (x, y, w, h, inner, c = C.line) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="#fff" stroke="${c}" stroke-width="1.5"/>${inner}`;
return {
  snimka: fig(SV(440, 270, `
    ${sl(30, 14, 300, 170, `<rect x="30" y="14" width="300" height="8" rx="4" fill="#0B5394"/>
      ${T(46, 54, "Sopky", { fs: 24, b: 1, c: "#0B5394" })}
      ${["vznikajú na okrajoch dosiek", "láva, popol, plyny", "aktívne aj vyhasnuté"].map((t, i) => `<circle cx="52" cy="${80 + i * 26}" r="3.5" fill="#0B5394"/>${T(62, 85 + i * 26, t, { fs: 13 })}`).join("")}
      <path d="M232 168 l40 -70 l12 8 l12 -8 l40 70z" fill="#8D6E63"/><path d="M272 98 l12 8 l12 -8 l-4 -6 l-8 4 l-8 -4z" fill="#E64A19"/><path d="M276 92 q-10 -20 6 -30 q6 -14 18 -6" fill="none" stroke="#9E9E9E" stroke-width="5" stroke-linecap="round"/>
      ${T(316, 176, "Lukáš K., Sekunda", { a: "end", fs: 8, c: C.mut })}`)}
    ${ar(338, 44, 360, 44, A, 1.5)}${T(364, 40, "nadpis", { fs: 10.5, b: 1, c: A })}${T(364, 53, "36 b a viac", { fs: 10, c: A })}
    ${ar(338, 104, 360, 104, A, 1.5)}${T(364, 96, "≤ 6 bodov", { fs: 10.5, b: 1, c: A })}${T(364, 109, "≤ 6 slov", { fs: 10, c: A })}${T(364, 122, "text ≥ 24 b", { fs: 10, c: A })}
    ${ar(366, 156, 340, 146, A, 1.5)}${T(364, 170, "obrázok", { fs: 10.5, b: 1, c: A })}${T(364, 183, "k téme", { fs: 10, c: A })}
    ${box(8, 198, 424, 64, AS, null, 8)}
    ${[["🎨", "1 motív"], ["🔤", "max. 2 písma"], ["🌓", "kontrast"], ["💡", "1 myšlienka"]].map(([e, t], i) => `${T(60 + i * 106, 224, e, { a: "middle", fs: 17 })}${T(60 + i * 106, 248, t, { a: "middle", fs: 11, b: 1 })}`).join("")}`, "Dobrá snímka"),
    "Dobrá snímka: veľký <b>nadpis</b>, pár <b>kľúčových slov</b>, obrázok k téme a dobrý <b>kontrast</b>. Zvyšok povieš."),
  struktura: fig(SV(440, 200, `
    ${T(220, 18, "Kostra prezentácie (približne 1 snímka na minútu)", { a: "middle", fs: 11.5, b: 1 })}

const CC = { "zlá": ["#FFF59D", "#FFEB3B"], "stredná": ["#90A4AE", "#ECEFF1"], "dobrá": ["#FFFFFF", "#1B1F2A"], "tmavá": ["#1B2838", "#FFFFFF"] };
function lum(h) { const c = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
function contrast(a, b) { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
function fixGoals() { const F = S.F, lines = F.pts.map(i => LN[i]), [bg, fg] = CC[F.cc]; return { fs: F.fs >= 24, cc: contrast(bg, fg) >= 4.5, six: lines.length > 0 && lines.length <= 6 && lines.every(l => l.trim().split(/\s+/).length <= 6), img: F.img }; }

    <div><div class="sld big2" style="background:${bg};color:${fg}"><h4 style="font-size:${Math.max(16, F.fs * 0.9 + 6)}px">Fotosyntéza</h4><ul style="font-size:${F.fs * 0.6}px;${F.img ? "width:58%" : ""}">${lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>${F.img ? `<div style="position:absolute;right:5%;top:30%;font-size:${F.fs * 2.4}px">🌿☀️</div>` : ""}</div>
    <ul class="goals" style="list-style:none;padding:0">${[["fs", "písmo aspoň 24 b"], ["cc", "dostatočný kontrast (aspoň 4,5 : 1)"], ["six", "najviac 6 bodov, každý najviac 6 slov"], ["img", "ilustračný obrázok"]].map(([k, t]) => `<li>${G[k] ? "✅" : "⬜"} ${t}</li>`).join("")}</ul></div></div>`; }

function LBAL(root) { if (!root) return;

    const L = ts.children[0], R = ts.children[1]; if (!L || !R) return;
    const items = []; let n = ts.nextElementSibling;
    while (n && (n.matches(".tfigs.one") || n.matches(".vedel"))) { items.push(n); n = n.nextElementSibling; }
    items.forEach(it => {
      const hL = L.offsetHeight, hR = R.offsetHeight;
      if (it.matches(".tfigs.one")) { const f = it.firstElementChild; if (!f) return; if (hR + 40 < hL) { f.style.marginTop = "12px"; R.appendChild(f); it.remove(); } }
      else { (hL <= hR ? L : R).appendChild(it); }

}

  if (ds.bucket !== undefined) { const [t, b] = ds.bucket.split("|"); return placeSel(t, b); }
});
document.addEventListener("change", e => {
  const m = e.target.dataset && e.target.dataset.tm; if (!m || S.t.test || !S.testLocked) return;
  const [q, i] = m.split("|"); (TA()[q] = TA()[q] || {})[i] = e.target.value; save(); render(false);
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("hz")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });
document.addEventListener("input", e => {
  if (typeof CUSTOM_INPUT === "function" && !S.testLocked && CUSTOM_INPUT(e) === true) return;
  const t = e.target;
  if (t.dataset.inp) {
    if (S.testLocked) return;
    const [tid, qid] = t.dataset.inp.split("|"); (S.d[tid] = S.d[tid] || {})[qid] = t.value; save();
    const b = document.querySelector(`[data-check="${tid}"]`), h = document.querySelector(`[data-hint="${tid}"]`), r = inputReady(TASKS[tid]);
    if (b) b.disabled = !r; if (h) h.textContent = r ? "" : "Vyplň všetky odpovede."; return;
  }
  const f = t.dataset.field; if (!f) return;
  S[f] = t.value; save();
  if (STEPS[S.cur].id === "start") {
    const btn = document.querySelector("[data-start]"), h = document.getElementById("starthint"), ok = S.name.trim().length >= 3;
    if (btn) btn.disabled = !ok || S.guess === null;
    if (h) h.textContent = ok ? (S.guess === null ? "Vyber svoj tip." : "") : "Napíš svoje meno a vyber tip.";
  }
});
document.addEventListener("dragstart", e => { const p = e.target.closest && e.target.closest("[data-pick]"); if (!p) return; const [t, id] = p.dataset.pick.split("|"); if (S.t[t] || S.testLocked) return e.preventDefault(); SEL = { t, i: id }; try { e.dataTransfer.setData("text/plain", id); } catch (err) {} });
document.addEventListener("dragover", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (b && SEL) { e.preventDefault(); b.classList.add("over"); } });
document.addEventListener("dragleave", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (b && !b.contains(e.relatedTarget)) b.classList.remove("over"); });
document.addEventListener("drop", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (!b) return; e.preventDefault(); const [t, bk] = b.dataset.bucket.split("|"); placeSel(t, bk); });
document.addEventListener("dragend", () => document.querySelectorAll(".over").forEach(x => x.classList.remove("over")));
if (!S.started) S.cur = 0;
if (S.testLocked && !S.t.test) S.cur = STEPS.findIndex(x => x.id === "test");
render(true);

</script>
</body>
</html>
