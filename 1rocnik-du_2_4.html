<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DU_2.4 Aplikácie na spracovanie, triedenie a archiváciu obrázkov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D9EAFB;--surface:#FFFFFF;--surface2:#F5F7FA;--ink:#16213A;--muted:#566381;
  --acc:#2F5BEA;--accSoft:#D5DFFB;--amber:#F2A516;--amberSoft:#FDF1D6;--track:#C9D1DF;
  --ok:#12805A;--okSoft:#DDF3EA;--bad:#C0392B;--badSoft:#FBE3E0;--border:#D6DCE6;
  --font:"Rubik","Segoe UI",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  box-sizing:border-box
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10172A;--surface:#18223A;--surface2:#1E2A46;--ink:#E8EDF7;--muted:#9AA7C4;--acc:#6E91FF;--accSoft:#26386A;--amberSoft:#3A2F17;--track:#34425F;--okSoft:#163A30;--ok:#3CCB8E;--badSoft:#46221F;--bad:#FF7A6B;--border:#2E3B58}}
:root[data-theme="dark"]{--bg:#10172A;--surface:#18223A;--surface2:#1E2A46;--ink:#E8EDF7;--muted:#9AA7C4;--acc:#6E91FF;--accSoft:#26386A;--amberSoft:#3A2F17;--track:#34425F;--okSoft:#163A30;--ok:#3CCB8E;--badSoft:#46221F;--bad:#FF7A6B;--border:#2E3B58}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17.5px;line-height:1.6}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px 4px;max-width:1140px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand .du{background:#F2A516;color:#3A2600;border-radius:7px;padding:1px 8px;font-size:14px;font-weight:800}
.pts{background:var(--amberSoft);border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap}
.pts b{font-size:19px}
.line{display:flex;overflow-x:auto;padding:10px 20px 14px;max-width:1140px;margin:0 auto;scrollbar-width:thin}
.stn{flex:1 0 96px;position:relative;text-align:center;background:none;border:0;padding:0 4px;cursor:pointer}
.stn:disabled{cursor:not-allowed;opacity:.5}
.stn::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:5px;border-radius:3px;background:var(--track);z-index:0}
.stn:first-child::before{display:none}
.stn.reached::before{background:var(--acc)}
.stn .c{position:relative;z-index:1;display:grid;place-items:center;width:35px;height:35px;margin:0 auto;border-radius:50%;background:var(--surface);border:4px solid var(--track);font-size:16px;transition:transform .15s}
.stn.done .c{background:var(--acc);border-color:var(--acc);color:#fff;font-size:14px;font-weight:700}
.stn.cur .c{border-color:var(--acc);transform:scale(1.18);box-shadow:0 0 0 5px var(--accSoft)}
.stn .l{display:block;font-size:13px;font-weight:600;margin-top:6px;line-height:1.2}
.stn .m{display:block;font-size:12px;color:var(--muted)}
.stn.cur .l{color:var(--acc)}
main{max-width:1060px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:clamp(30px,5vw,46px);line-height:1.08;margin:0 0 12px;letter-spacing:-.02em}
h2{font-size:clamp(26px,4vw,34px);line-height:1.12;margin:0 0 6px;letter-spacing:-.015em}
h3{font-size:21px;margin:30px 0 8px}
p{margin:0 0 14px}
.kicker{color:var(--muted);font-size:15px;margin:0 0 4px}
.ban{position:relative;overflow:hidden;border-radius:22px;padding:20px 22px 18px;color:#fff;margin:0 0 18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;box-shadow:0 14px 30px -18px rgba(10,20,60,.6)}
.ban .pill{display:inline-block;background:rgba(255,255,255,.25);border-radius:999px;padding:3px 12px;font-size:13.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.ban h2{color:#fff;margin:8px 0 4px}
.ban p{margin:0;font-size:16px;opacity:.95}
.ban .big{font-size:64px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.ban::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
@media (max-width:560px){.ban .big{font-size:44px}}
.say{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:end;margin:6px 0 18px}
.say svg{width:92px;height:92px}
.bubble{position:relative;background:var(--surface);border:2px solid var(--acc);border-radius:18px 18px 18px 4px;padding:12px 16px;font-size:16.5px}
.task{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px 20px;margin:12px 0 8px}
.ins{color:var(--muted);font-size:15.5px;margin-bottom:12px}
.theory p{max-width:none}
.tsplit{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:22px;align-items:start;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px 20px;margin:0 0 12px}
.tsplit>div{min-width:0}
@media (max-width:860px){.tsplit{grid-template-columns:1fr}}
.tfigs{display:grid;gap:12px}
.tfig{margin:0;background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px 10px 8px;display:flex;flex-direction:column;gap:6px}
.tfig svg{width:100%;height:auto;display:block}
.tfig figcaption{font-size:14px;line-height:1.45;color:#3E4A66;text-align:center;padding:0 4px}
.rtab{border-collapse:collapse;margin:10px 0;font-size:15.5px;width:100%}
.rtab th,.rtab td{border:1px solid var(--border);padding:6px 10px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.rtab th{background:var(--surface2);font-size:14px}
.rtab td.c{text-align:center}
.rtab td:first-child{overflow-wrap:normal;white-space:nowrap}
.vedel{background:#FFF8E1;color:#3A2E00;border:1px solid #F2D27A;border-left:5px solid #E0A800;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:15.5px;line-height:1.55}
.memo{margin:26px 0 8px;background:var(--surface);border:2px solid var(--acc);border-radius:16px;padding:14px 18px 10px}
.memo h3{margin:0 0 6px;font-size:18px;color:var(--acc)}
.memo ul{margin:0;padding-left:20px}.memo li{margin:5px 0;font-size:16px;line-height:1.5}
code,.mono{font-family:var(--mono);font-size:.93em}
code{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:0 5px}
.primary{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:600;cursor:pointer;font-size:17px}
.primary:disabled{background:var(--track);color:var(--muted);cursor:not-allowed}
.ghost{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:9px 16px;font-weight:600;cursor:pointer}
.ghost:hover:not(:disabled){border-color:var(--acc)}
.ghost.on{border-color:var(--acc);background:var(--accSoft)}
.ghost:disabled{opacity:.45;cursor:not-allowed}
.ghost.sm{padding:4px 10px;font-size:14px;border-radius:9px}
.checkbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.checkbar .hint{color:var(--muted);font-size:14.5px}
.score{font-weight:600;padding:8px 14px;border-radius:10px;background:var(--okSoft);color:var(--ok)}
.score.part{background:var(--amberSoft);color:var(--ink)}
.next{margin-top:30px;padding-top:20px;border-top:1px dashed var(--track);display:flex;justify-content:flex-end}
.q{border:0;padding:0;margin:0 0 22px}
.q legend{font-weight:600;padding:0;margin-bottom:10px;display:flex;gap:10px}
.qn{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accSoft);color:var(--acc);font-size:14px;font-weight:700;margin-top:1px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.opts.pics{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opts.pics .opt{padding:8px}
.opt svg{width:100%;height:auto;display:block;background:#fff;border-radius:8px;border:1px solid #E3E8EF}
.opt{text-align:left;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--accSoft)}
.opt.ok{border-color:var(--ok);background:var(--okSoft)}
.opt.bad{border-color:var(--bad);background:var(--badSoft)}
.opt:disabled{cursor:default;color:var(--ink)}
.why{font-size:15px;margin:8px 0 0;padding:8px 12px;border-radius:8px}
.why.good{background:var(--okSoft)}.why.miss{background:var(--badSoft)}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:20px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:22px}
@media (max-width:800px){.hero{grid-template-columns:1fr}}
.hero svg{width:100%;height:auto;display:block}
.mlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0}
.mcard{border-radius:14px;padding:10px 12px;color:#fff;font-weight:600;font-size:15px}
.mcard small{display:block;font-weight:400;opacity:.9}
label.f{display:block;font-weight:600;margin:12px 0 4px}
.in{width:100%;max-width:380px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--ink)}
.result{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px}
.bign{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 16px}
.bign .n{font-size:56px;font-weight:700;line-height:1;color:var(--acc)}
.bign .of{font-size:20px;color:var(--muted)}
.grade{margin-left:auto;text-align:center;border:2px solid var(--acc);border-radius:12px;padding:6px 14px}
.grade b{display:block;font-size:30px;line-height:1.1}.grade span{font-size:12.5px;color:var(--muted)}
table.res{border-collapse:collapse;width:100%;font-size:15.5px}
table.res td,table.res th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
table.res td:last-child,table.res th:last-child{text-align:right}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.muted{color:var(--muted)}
.okm{color:var(--ok);font-weight:600}.badm{color:var(--bad);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .opt{padding:6px 12px;font-size:14.5px;border-radius:999px}
.tnum{display:inline-block;background:var(--accSoft);color:var(--acc);border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;margin-right:6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}
.fc{background:var(--surface2);border:2px solid var(--border);border-radius:16px;padding:12px 14px;position:relative;min-width:0}
.fc.okc{border-color:var(--ok);background:var(--okSoft)}.fc.badc{border-color:var(--bad);background:var(--badSoft)}
.fc .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-weight:600}
.fc .hd .e{font-size:28px;line-height:1}
/* triedenie */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;background:var(--surface2);border:1.5px dashed var(--track);border-radius:14px;padding:10px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--border);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14.5px;text-align:left}
.chip:hover:not(:disabled){border-color:var(--acc)}
.chip.sel{border-color:var(--amber);box-shadow:0 0 0 3px var(--amberSoft)}
.chip.ok{border-color:var(--ok);background:var(--okSoft)}.chip.bad{border-color:var(--bad);background:var(--badSoft)}
.chip:disabled{cursor:default;color:var(--ink)}
.bins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:720px){.bins{grid-template-columns:1fr}}
.bin{border:2px solid var(--border);border-radius:16px;padding:10px;min-height:120px;background:var(--surface);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bin .bh{width:100%;text-align:center;font-weight:700;border-radius:10px;padding:6px;cursor:pointer;border:0;font-size:15px}
.bin .bh:disabled{cursor:default}
/* komiks */
.comic{display:grid;grid-template-columns:1fr;gap:14px}
.panel:not(.choice){max-width:560px}.panel.c{justify-self:center}
.panel{background:#FFFDF5;border:3px solid #16213A;border-radius:6px;padding:10px;display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:start;color:#16213A;box-shadow:4px 4px 0 #16213A;min-width:0}
.panel svg{width:76px;height:76px}
.panel .bub{background:#fff;border:2px solid #16213A;border-radius:14px;padding:8px 12px;font-size:15.5px;position:relative;min-width:0}
.panel .nm{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#566381;margin-bottom:2px}
.panel.choice{grid-column:1/-1;background:#EEF4FF}
.panel .opts{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.panel .opt{background:#fff;color:#16213A}
.panel .opt.sel{background:#E6EDFD}
.panel .opt.ok{background:#DDF3EA}.panel .opt.bad{background:#FBE3E0}
.panel .why{color:#16213A}
@media (max-width:560px){.panel{grid-template-columns:44px minmax(0,1fr);gap:6px;padding:8px}.panel svg{width:44px;height:44px}.panel .opts{grid-template-columns:1fr}.panel .opt{padding:8px 10px}}
/* okná */
.win{background:#fff;color:#1B1B1F;border:1px solid #BCC6D3;border-radius:10px;overflow:hidden;box-shadow:0 12px 30px -14px rgba(10,20,60,.45);font-family:"Segoe UI",var(--font);font-size:14.5px;min-width:0}
.wt{background:#E9EDF3;padding:7px 12px;display:flex;align-items:center;gap:8px;font-size:13.5px;border-bottom:1px solid #D5DCE6;color:#1B1B1F;min-width:0}
.wt .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt .dots{margin-left:auto;color:#666;letter-spacing:6px;flex:0 0 auto}
.fwin{max-width:640px}
.frow{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid #EEF1F5;font-size:14.5px;color:#1B1B1F}
.frow.new{background:#F1FAF5}
.frow .nm{font-family:var(--mono);overflow-wrap:anywhere}
.frow .ds{color:#566381;font-size:13px;text-align:right;white-space:nowrap}
.frow .ghost{color:#1B1B1F;background:#fff;border-color:#C9D0DA}
.dlgbox{background:#fff;color:#1B1B1F;border:1px solid #9FB0C8;border-radius:10px;box-shadow:0 14px 30px rgba(0,0,0,.25);padding:14px 16px;margin:12px 0;max-width:520px}
.dlgbox h5{margin:0 0 8px;font-size:15px}
.dlgbox .opt{color:#1B1B1F;background:#F5F7FA;border-color:#C9D0DA}
.dlgbox .opt.sel{background:#D5DFFB;border-color:#2F5BEA}
.dlgbox .ghost{color:#1B1B1F;background:#fff;border-color:#C9D0DA;padding:6px 14px}
/* lupa */
.zgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.zview{position:relative;width:150px;height:150px;overflow:hidden;border:1px solid #C9D1DF;border-radius:10px;background:#fff;margin:0 auto}
.zview img,.zview svg{display:block}
.zb{justify-content:center;margin-top:8px;gap:6px}
.zb .ghost{padding:4px 10px;font-size:14px}
/* RLE */
.pxrow{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.px{width:34px;height:34px;border:2px solid #9AA6B8;border-radius:6px;cursor:pointer;padding:0;font-weight:700;color:#566381}
.px:disabled{cursor:default}
.px.okc{box-shadow:0 0 0 3px var(--ok)}.px.badc{box-shadow:0 0 0 3px var(--bad)}
.sw{display:inline-block;width:16px;height:16px;border:1.5px solid #9AA6B8;border-radius:3px;vertical-align:-3px;margin:0 4px 0 2px}
.runs{font-family:var(--mono);font-size:16px;background:var(--surface2);border:1.5px dashed var(--track);border-radius:10px;padding:8px 12px;min-height:44px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.lpart{border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;margin:12px 0;background:var(--surface)}
.lh{font-weight:600;margin-bottom:8px}
.ldet{overflow:hidden;height:180px;max-width:480px;border:1px solid var(--border);border-radius:10px;margin:10px 0 6px;position:relative;background:#fff}
.ldet img{position:absolute;width:960px;height:600px;max-width:none;left:-200px;top:-120px;image-rendering:crisp-edges;image-rendering:pixelated}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media (max-width:640px){.imgs{grid-template-columns:1fr}}
.imgs img{width:100%;max-width:320px;border-radius:8px;display:block;border:1px solid var(--border)}
/* plagát a animácia */
.scene svg{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--border)}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.75)}}
.blink{animation:blink 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.fslots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:520px}
@media (max-width:520px){.fslots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fslot{display:flex;flex-direction:column;align-items:center;gap:4px}
.fslot .n{font-weight:700;color:var(--acc);font-size:14px}
.frm{padding:4px;border:2px solid var(--border);border-radius:12px;background:#fff;cursor:pointer;width:100%;max-width:110px;aspect-ratio:1}
.frm svg{width:100%;height:100%;display:block}
.frm.empty{border-style:dashed;cursor:default;display:grid;place-items:center;color:var(--muted);font-size:13px;background:var(--surface2)}
.frm.ok{border-color:var(--ok);box-shadow:0 0 0 3px var(--okSoft)}.frm.bad{border-color:var(--bad);box-shadow:0 0 0 3px var(--badSoft)}
.frm:disabled{cursor:default}
.anim{position:relative;width:140px;height:140px;border:3px solid var(--acc);border-radius:14px;background:#fff;overflow:hidden;flex:0 0 auto}
.anim svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;animation:fr 2s step-end infinite}
@keyframes fr{0%,24.9%{opacity:1}25%,100%{opacity:0}}
/* EXIF */
.exg{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:14px;align-items:start}
@media (max-width:760px){.exg{grid-template-columns:1fr}}
.xr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid #EEF1F5;background:#fff;padding:8px 12px;cursor:pointer;font-size:14.5px;color:#1B1B1F}
.xr .k{color:#566381}
.xr:hover:not(:disabled){background:#FFF6DB}
.xr.on{background:#FDE3A7}.xr.ok{background:#DDF3EA}.xr.bad{background:#FBE3E0}.xr.miss{box-shadow:inset 5px 0 0 #C0392B;background:#FFF0EE}
.xr:disabled{cursor:default}
/* DU 2.4 – doplnky */
.bins.b3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:860px){.bins.b3{grid-template-columns:1fr}}
.fnm{font-family:var(--mono);font-size:12.5px;color:#566381;overflow-wrap:anywhere}
.sbar{background:#fff;border:1.5px solid #C9C9C9;border-radius:999px;padding:6px 16px;margin-bottom:12px;max-width:320px;color:#1B1B1F}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pbtn{position:relative;background:#fff;border:2.5px solid #D6DCE6;border-radius:12px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;color:#1B1B1F;min-width:0}
.pbtn svg{width:100%;height:auto;display:block}
.pbtn:hover:not(:disabled){border-color:var(--acc)}
.pbtn.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--accSoft)}
.pbtn.ok{border-color:var(--ok);background:#DDF3EA}.pbtn.bad{border-color:var(--bad);background:#FBE3E0}
.pbtn:disabled{cursor:default}
.pbtn .tick{position:absolute;top:8px;right:8px;background:var(--acc);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-weight:700;font-size:14px}
.gpool{gap:10px}
.gph{display:flex;gap:8px;align-items:center;background:var(--surface);border:2px solid var(--border);border-radius:12px;padding:5px 8px 5px 5px;cursor:pointer;text-align:left;min-width:0}
.gph svg{width:72px;height:48px;flex:0 0 auto;display:block}
.gph .gi{font-size:12.5px;line-height:1.35;color:var(--ink)}
.gph:hover:not(:disabled){border-color:var(--acc)}
.gph.sel{border-color:var(--amber);box-shadow:0 0 0 3px var(--amberSoft)}
.gph.ok{border-color:var(--ok);background:var(--okSoft)}.gph.bad{border-color:var(--bad);background:var(--badSoft)}
.gph:disabled{cursor:default;color:var(--ink)}
.gin{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.tok{display:inline-block;background:var(--accSoft);color:var(--acc);border-radius:8px;padding:2px 8px;font-weight:600;font-size:14.5px;margin:2px}
.zcols{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(6,auto);grid-auto-flow:column}
.cbub{background:#fff;border:2px solid #16213A;border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:15px;color:#16213A}
.fc svg{max-width:100%}
.fc>svg{width:100%;height:auto;display:block;border-radius:10px}
.slots3{display:grid;gap:6px}
.sl3{border:1.5px dashed var(--track);border-radius:10px;padding:6px 10px;font-size:14.5px;background:var(--surface)}
.sl3.on{border-style:solid;border-color:var(--acc);background:var(--accSoft)}
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;background:#2A3142;border-radius:16px;padding:14px}
@media (max-width:720px){.ed{grid-template-columns:1fr}}
.edv{display:grid;place-items:center;min-height:300px;background:repeating-conic-gradient(#3A4256 0% 25%,#323A4D 0% 50%) 50%/20px 20px;border-radius:10px;padding:10px;overflow:hidden}
.edv svg{display:block;border-radius:2px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.edt{background:#fff;border-radius:12px;padding:12px 14px;color:#1B1B1F;min-width:0}
.etool{border-top:1px solid #E3E8EF;padding:10px 0}

function scoreOf(id) {
  const TK = TASKS[id], d = S.d[id] || {}; let sc = 0;
