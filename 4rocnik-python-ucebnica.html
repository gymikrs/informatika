<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programovanie v jazyku Python – interaktívna učebnica (4. ročník)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0EEF6;--surface:#FFFFFF;--surface2:#F6F5FA;--ink:#1A1530;--muted:#5E5877;
  --acc:#6A3FD0;--accSoft:#E9E2FB;--amber:#F2A516;--amberSoft:#FDF1D6;--track:#D3CEE2;
  --ok:#12805A;--okSoft:#DDF3EA;--bad:#C0392B;--badSoft:#FBE3E0;--border:#DAD6E6;
  --head:"Rubik","Segoe UI",system-ui,sans-serif;--font:"Rubik","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#13101F;--surface:#1D1830;--surface2:#241E3A;--ink:#ECE8F7;--muted:#A69FC0;--acc:#A98BFF;--accSoft:#2E2550;--amber:#F7B84B;--amberSoft:#3A2F17;--track:#3A3355;--ok:#3CCB8E;--okSoft:#163A30;--bad:#FF7A6B;--badSoft:#46221F;--border:#342D4C}}
:root[data-theme="dark"]{--bg:#13101F;--surface:#1D1830;--surface2:#241E3A;--ink:#ECE8F7;--muted:#A69FC0;--acc:#A98BFF;--accSoft:#2E2550;--amber:#F7B84B;--amberSoft:#3A2F17;--track:#3A3355;--ok:#3CCB8E;--okSoft:#163A30;--bad:#FF7A6B;--badSoft:#46221F;--border:#342D4C}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17.5px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,.brand{font-family:var(--head)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px 4px;max-width:1140px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand .lg{width:18px;height:18px;border-radius:5px;background:var(--acc);position:relative}
.brand .lg::after{content:"";position:absolute;inset:5px 7px;border-radius:2px;background:var(--surface)}
.pts{background:var(--amberSoft);border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap}
.pts b{font-size:19px}
.reset{background:none;border:1.5px solid var(--border);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.reset.arm{border-color:var(--bad);color:var(--bad);background:var(--badSoft)}
.line{display:flex;overflow-x:auto;padding:10px 20px 14px;max-width:1140px;margin:0 auto;scrollbar-width:thin}
.stn{flex:1 0 100px;position:relative;text-align:center;background:none;border:0;padding:0 4px;cursor:pointer}
.stn:disabled{cursor:not-allowed;opacity:.5}
.stn::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:5px;border-radius:3px;background:var(--track);z-index:0}
.stn:first-child::before{display:none}
.stn.reached::before{background:var(--acc)}
.stn .c{position:relative;z-index:1;display:grid;place-items:center;width:31px;height:31px;margin:0 auto;border-radius:50%;background:var(--surface);border:4px solid var(--track);font-size:13px;font-weight:700;color:transparent;transition:transform .15s}
.stn.done .c{background:var(--acc);border-color:var(--acc);color:#fff}
.stn.cur .c{border-color:var(--acc);transform:scale(1.22);box-shadow:0 0 0 5px var(--accSoft)}
.stn .l{display:block;font-size:13.5px;font-weight:600;margin-top:6px;line-height:1.2}
.stn .m{display:block;font-size:12px;color:var(--muted)}
.stn.cur .l{color:var(--acc)}
main{max-width:900px;margin:0 auto;padding:28px 20px 60px}
main.wide{max-width:1060px}
.kicker{color:var(--muted);font-size:15px;margin:0 0 4px}
h1{font-size:clamp(32px,5vw,48px);line-height:1.08;margin:0 0 12px;letter-spacing:-.02em}
h2{font-size:clamp(27px,4vw,36px);line-height:1.12;margin:0 0 12px;letter-spacing:-.015em}
h3{font-size:21px;margin:36px 0 8px}
p{margin:0 0 14px;max-width:70ch}
.lead{font-size:19px}
.task{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin:12px 0 8px}
.ins{color:var(--muted);font-size:15.5px;margin-bottom:12px}
.box{border-left:5px solid var(--amber);background:var(--amberSoft);border-radius:0 12px 12px 0;padding:12px 16px;margin:16px 0}
.box.v{border-color:var(--acc);background:var(--accSoft)}
.box.g{border-color:var(--ok);background:var(--okSoft)}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.fig{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin:16px 0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption,.cap{font-size:14.5px;color:var(--muted);margin-top:8px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.primary{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:600;cursor:pointer;font-size:17px}
.primary:disabled{background:var(--track);color:var(--muted);cursor:not-allowed}
.ghost{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
.ghost:hover:not(:disabled){border-color:var(--acc)}
.ghost.on{border-color:var(--acc);background:var(--accSoft)}
.ghost:disabled{opacity:.45;cursor:not-allowed}
.checkbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.checkbar .hint{color:var(--muted);font-size:14.5px}
.score{font-weight:600;padding:8px 14px;border-radius:10px;background:var(--okSoft);color:var(--ok)}
.score.part{background:var(--amberSoft);color:var(--ink)}
.next{margin-top:36px;padding-top:22px;border-top:1px dashed var(--border);display:flex;justify-content:flex-end;gap:12px;align-items:center}
label.f{display:block;font-weight:600;margin:12px 0 4px}
.in{font:inherit;width:100%;max-width:420px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--ink)}
.in.good{border-color:var(--ok);background:var(--okSoft)}
.in.badin{border-color:var(--bad);background:var(--badSoft)}
.muted{color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border-radius:12px;background:var(--surface2);min-height:60px}
.pool .empty{color:var(--muted);font-size:14.5px;align-self:center}
.chipb{background:var(--surface);border:1.5px solid var(--border);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500}
.chipb:hover:not(:disabled){border-color:var(--acc)}
.chipb.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.chipb.ok{background:var(--okSoft);border-color:var(--ok);color:var(--ok)}
.chipb.bad{background:var(--badSoft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.chipb:disabled{cursor:default}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.bucket{border:2px dashed var(--acc);border-radius:12px;padding:12px;min-height:120px;cursor:pointer;background:var(--surface)}
.bucket.over{background:var(--accSoft)}
.bh{font-weight:700;margin-bottom:2px}
.bs{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.bc{display:flex;flex-wrap:wrap;gap:8px}
.seq{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:12px}
.slot .n{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accSoft);color:var(--acc)}
.slot.empty span:last-child{color:var(--muted);flex:1;border:1.5px dashed var(--border);border-radius:10px;padding:9px 14px}
.slotbtn{flex:1;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:9px 14px;cursor:pointer}
.slot.ok .slotbtn{border-color:var(--ok);background:var(--okSoft)}
.slot.bad .slotbtn{border-color:var(--bad);background:var(--badSoft)}
.slotbtn:disabled{cursor:default;color:var(--ink)}
.q{border:0;padding:0;margin:0 0 20px}
.q legend{font-weight:600;padding:0;margin-bottom:10px;display:flex;gap:10px}
.qn{flex:0 0 27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--accSoft);color:var(--acc);font-size:14px;font-weight:700;margin-top:1px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.opt{text-align:left;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--accSoft)}
.opt.ok{border-color:var(--ok);background:var(--okSoft)}
.opt.bad{border-color:var(--bad);background:var(--badSoft)}
.opt:disabled{cursor:default;color:var(--ink)}
.why{font-size:15px;margin:8px 0 0;padding:8px 12px;border-radius:8px;max-width:none}
.why.good{background:var(--okSoft)}
.why.miss{background:var(--badSoft)}
.iq{margin-bottom:18px}
.iqq{display:flex;gap:10px;font-weight:600;margin-bottom:8px}
.iqa{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-left:37px}
.iqa .in{max-width:220px;font-family:var(--mono)}
.unit{font-weight:600;color:var(--muted)}
.okm{color:var(--ok);font-weight:600}.badm{color:var(--bad);font-weight:600}
.guesses{display:grid;gap:8px;max-width:600px}
.result{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px}
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 16px}
.big .n{font-family:var(--head);font-size:56px;font-weight:700;line-height:1;color:var(--acc)}
.big .of{font-size:20px;color:var(--muted)}
.grade{margin-left:auto;text-align:center;border:2px solid var(--acc);border-radius:12px;padding:6px 14px}
.grade b{display:block;font-size:30px;line-height:1.1}
.grade span{font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15.5px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
.result td:last-child,.result th:last-child{text-align:right;white-space:nowrap}
textarea{width:100%;font-family:var(--mono);font-size:13.5px;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);color:var(--ink);resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:15.5px}
.fb.ok{background:var(--okSoft)}.fb.bad{background:var(--badSoft)}.fb.info{background:var(--accSoft)}
.goals{list-style:none;padding:0;margin:10px 0 0}
.goals li{padding:3px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.memo{margin:26px 0 8px;background:var(--surface);border:2px solid var(--acc);border-radius:14px;padding:14px 18px 10px}
.memo h3{margin:0 0 6px;font-family:var(--head);font-size:18px;color:var(--acc)}
.memo ul{margin:0;padding-left:20px}.memo li{margin:5px 0;font-size:16px;line-height:1.5}
:root{--bg:#EAF2F4;--acc:#0E7490;--accSoft:#D3EEF4;--track:#C3D6DC;--border:#CFDEE3;--surface2:#F3F8F9;--ink:#0F2229;--muted:#4D646C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0C1619;--surface:#132126;--surface2:#18292F;--acc:#38BDF8;--accSoft:#123543;--track:#2A3E45;--border:#27393F;--ink:#E5F1F4;--muted:#93AEB6}}
:root[data-theme="dark"]{--bg:#0C1619;--surface:#132126;--surface2:#18292F;--acc:#38BDF8;--accSoft:#123543;--track:#2A3E45;--border:#27393F;--ink:#E5F1F4;--muted:#93AEB6}
code{font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:0 5px;font-size:.92em}
.theory{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin:14px 0}
.theory h3{margin:18px 0 6px;font-size:19px}.theory h3:first-child{margin-top:0}
.theory p{margin:8px 0}.theory ul{margin:6px 0;padding-left:22px}.theory li{margin:3px 0}
.ex{margin:10px 0;border-radius:12px;overflow:hidden;border:1px solid #1E3A4A}
.ex pre{margin:0;background:#0F1A24;color:#DDE8F2;font-family:var(--mono);font-size:14.5px;line-height:1.5;padding:10px 14px;overflow-x:auto;white-space:pre}
.ex .bar{display:flex;gap:6px;background:#162634;padding:5px 8px}
.ex .bar button{border:1px solid #2E4A5E;background:#1E3446;color:#DDE8F2;border-radius:6px;padding:3px 10px;cursor:pointer;font-size:13px}
.ex .bar button:hover{background:#27425A}
.ex .res{background:#fff;color:#000;font-family:"Courier New",var(--mono);font-size:14px;padding:8px 12px;white-space:pre-wrap;border-top:1px solid #2E4A5E;max-height:260px;overflow:auto}
.res .e,.pout .e{color:#D10000}
.hl-k{color:#FF9E64}.hl-s{color:#9ECE6A}.hl-c{color:#6B7B99;font-style:italic}.hl-n{color:#E0AF68}.hl-b{color:#7DCFFF}
.zap{background:var(--accSoft);border-left:4px solid var(--acc);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:15.5px}
.zap b:first-child{color:var(--acc)}
.tbl{border-collapse:collapse;margin:8px 0;font-size:14.5px}.tbl td,.tbl th{border:1px solid var(--border);padding:4px 10px;text-align:left}.tbl th{background:var(--surface2)}
.tbl code{background:none;border:0;padding:0}
.task2{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;margin:14px 0}
.task2 h4{margin:0 0 6px;font-family:var(--head);font-size:17px}
.task2 .sample{font-family:var(--mono);font-size:13.5px;background:var(--surface2);border-radius:8px;padding:6px 10px;white-space:pre;overflow-x:auto;margin:6px 0}
.pide{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:10px;margin-top:10px}
@media (max-width:860px){.pide{grid-template-columns:1fr}}
.pide textarea{width:100%;min-height:210px;font-family:"Courier New",var(--mono);font-size:15px;line-height:1.45;border:1px solid #BCC6D3;border-radius:10px;padding:10px 12px;background:#fff;color:#000;resize:vertical;tab-size:4}
.pout{background:#fff;color:#000;border:1px solid #BCC6D3;border-radius:10px;font-family:"Courier New",var(--mono);font-size:14px;padding:8px 10px;white-space:pre-wrap;min-height:210px;max-height:340px;overflow:auto}
.pout .h{color:#666}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pbtns .run{background:#2E7D4F;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.pbtns .chk{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.pbtns .ghost{padding:8px 12px}
.verdict{margin-top:8px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:10px 0}
.files div{background:#fff;color:#000;border:1px solid #BCC6D3;border-radius:10px;overflow:hidden}
.files b{display:block;background:#EEF2F6;padding:4px 10px;font-family:var(--mono);font-size:13px}
.files pre{margin:0;padding:6px 10px;font-size:12.5px;max-height:140px;overflow:auto;font-family:"Courier New",var(--mono)}
.shell4{background:#fff;color:#000;border:1px solid #BCC6D3;border-radius:10px;font-family:"Courier New",var(--mono);font-size:14.5px;padding:8px 10px;min-height:140px;max-height:300px;overflow:auto;white-space:pre-wrap}
.shell4 .p{color:#7A2E00}.shell4 .o{color:#0033CC}.shell4 .e{color:#D10000}
.shell4 input{border:0;outline:none;font:inherit;width:80%;background:transparent;color:#000}
.toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;margin:12px 0}
.toc div{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-weight:600}
.toc span{color:var(--acc);font-family:var(--mono);margin-right:6px}

</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main" tabindex="-1"></main>
<script>
const THEORY = {"k1": ["Python je interpretovaný, dynamický jazyk (Guido van Rossum, 1989). Režimy: interaktívny (Shell) a programový (.py, F5).", "Typy <b>int</b>, <b>float</b>, <b>str</b>; <code>/</code> dáva float, <code>//</code> celočíselné delenie, <code>%</code> zvyšok, <code>**</code> mocnina.", "<code>input()</code> vracia reťazec, prevod: int(), float(), str(). f-string: f'{x}'. Výmena: a, b = b, a."], "k2": ["<code>for premenná in range(...):</code> a odsadený blok (4 medzery). range(start, stop, krok), stop sa nepočíta.", "Pripočítavacia šablóna: inicializácia pred cyklom, pripočítavanie v cykle.", "<code>print(..., end=' ')</code> nevypíše nový riadok. Vnorený cyklus je odsadený o ďalšie 4 medzery."], "k3": ["<code>if / elif / else</code>, porovnania == != &lt; &lt;= &gt; &gt;=, logické and, or, not.", "0 a '' sú nepravdivé. <code>break</code> ukončí cyklus.", "<code>while podmienka:</code> opakuje, kým podmienka platí. Pozor na nekonečný cyklus."], "k4": ["<code>import math</code>: math.sqrt, math.sin (radiány!), math.radians, math.pi.", "<code>import random</code>: randint(od, do), randrange(od, do), choice(postupnosť).", "<code>from modul import f</code> sprístupní funkciu bez mena modulu."], "k5": ["Zoznam: [prvok, ...], indexy od 0, záporné od konca. Je meniteľný: zoznam[i] = h.", "len, sum, min, max, list(); + zreťazenie, * opakovanie, in hľadá prvok.", "Rez zoznam[od:do:krok] vytvorí kópiu časti, [::-1] otočí zoznam."], "k6": ["Immutable: count, index. Mutable: append, insert, pop, remove, sort.", "Mutable metódy vracajú None: nepíš abc = abc.sort()."], "k7": ["<code>def meno(parametre):</code> definícia, <code>meno(hodnoty)</code> volanie. Definícia musí byť pred volaním.", "Formálne parametre (v hlavičke) a skutočné (pri volaní). Lokálne premenné po skončení funkcie zanikajú.", "<code>return hodnota</code> vráti výsledok. Bez return funkcia vracia None."], "k8": ["Slovník {kľúč: hodnota}; slovnik[k] = h pridá alebo zmení, del slovnik[k] zruší.", "in a for prechádzajú kľúče. keys(), values(), items(), sorted(slovnik).", "get(k, náhrada) nespadne na KeyError. Frekvenčná tabuľka: p[x] = p.get(x, 0) + 1."], "k9": ["open(meno, 'r' / 'w' / 'a'), close(). 'w' súbor vyprázdni, 'a' pridáva na koniec.", "write(reťazec) alebo print(..., file=s); readline(), for riadok in s, read(). Na konci súboru readline() vráti ''.", "<code>with open(...) as s:</code> súbor zatvorí sám. strip() odstráni medzery a '\\n'."]};
/* ===================== mini Python interpreter (subset) ===================== */
const PY = (() => {
class PyErr { constructor(type, msg, line) { this.type = type; this.msg = msg; this.line = line; } }
class Brk {} class Cnt {} class Ret { constructor(v) { this.v = v; } }
const NONE = { t: "None" };
const KW = new Set("False None True and as assert break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));
/* ---------- lexer ---------- */
function lex(src) {
  const toks = [], lines = src.replace(/\r/g, "").replace(/\t/g, "    ").split("\n"); const ind = [0]; let depth = 0, i = 0, cont = null;
  const push = (t, v, ln) => toks.push({ t, v, ln });
  for (let li = 0; li < lines.length; li++) {
    let line = lines[li], ln = li + 1, p = 0;
    if (cont === null && depth === 0) {
      const m = line.match(/^ */)[0].length, rest = line.slice(m);

function K1() { return `<div class="theory"><h3>Python</h3><p>Python je moderný programovací jazyk. Jeho autorom je <b>Guido van Rossum</b> (1989). Používajú ho Google, YouTube, Dropbox aj Raspberry Pi. Je <b>zadarmo</b> a je to <b>open source</b> projekt. Má jednoduchú a dobre čitateľnú syntax, je <b>dynamický</b> (premenné netreba vopred deklarovať) a je univerzálny: analýza dát, spracovanie médií, aplikácie s grafickým rozhraním.</p>
  <p>Python je <b>interpretovaný</b> jazyk: interpreter nevytvára spustiteľný súbor (.exe), program sa vykonáva priamo. Na počítači preto musí byť Python nainštalovaný (python.org, pri inštalácii zaškrtni <i>Add Python to PATH</i>). Spolu s ním sa nainštaluje prostredie <b>IDLE</b>.</p>
  <h3>Dva režimy</h3><ul><li><b>interaktívny režim</b> (Shell): za znaky <code>&gt;&gt;&gt;</code> píšeme príkazy, po Enter sa hneď vyhodnotia,</li><li><b>programový (skriptový) režim</b>: celý program napíšeme do súboru <code>.py</code> (File → New File) a spustíme klávesom <b>F5</b>.</li></ul>
  <p>Vyskúšaj Shell. Každý výraz sa hneď vyhodnotí:</p>
  <div class="shell4" id="repl">${(S.repl || []).map(l => `<span class="p">&gt;&gt;&gt; </span>${esc(l.c)}\n${l.o ? `<span class="${l.e ? "e" : "o"}">${esc(l.o)}</span>` : ""}`).join("")}<span class="p">&gt;&gt;&gt; </span><input id="replin" autocomplete="off" spellcheck="false" aria-label="Príkaz pre Shell"></div>
  <p class="muted" style="font-size:14px">Skús: <code>123 + 456</code>, <code>1 * 2 * 3 * 4 * 5 * 6</code>, <code>22 / 7</code>, <code>type(22 / 7)</code>, <code>2 ** 100</code>, <code>'ahoj' + 'Python'</code>, <code>3 * 'x'</code>.</p>
  <h3>Základné typy údajov</h3><ul><li><b>int</b>: celé čísla (0, 11, -123456789). Ich veľkosť je obmedzená iba pamäťou.</li><li><b>float</b>: desatinné čísla s desatinnou <b>bodkou</b> (3.14, 3e8 = 3 · 10⁸).</li><li><b>str</b>: znakové reťazce v apostrofoch alebo úvodzovkách ('abc', "I'm happy").</li></ul><p>Typ zistíme funkciou <code>type()</code>.</p>
  <table class="tbl"><tr><th>Operátor</th><th>Význam</th><th>Príklad</th></tr><tr><td><code>+ - *</code></td><td>sčítanie, odčítanie, násobenie</td><td><code>3 * 37 → 111</code></td></tr><tr><td><code>/</code></td><td>delenie, výsledok je vždy float</td><td><code>21 / 3 → 7.0</code></td></tr><tr><td><code>//</code></td><td>celočíselné delenie</td><td><code>22 // 7 → 3</code></td></tr><tr><td><code>%</code></td><td>zvyšok po delení</td><td><code>22 % 7 → 1</code></td></tr><tr><td><code>**</code></td><td>umocňovanie</td><td><code>2 ** 8 → 256</code></td></tr></table>
  ${Z("Delenie / dáva vždy desatinné číslo, aj keď vyjde „celé“. Deliť nulou nemôžeme: ZeroDivisionError.")}
  <p>Reťazce môžeme <b>spájať</b> (<code>+</code>) a <b>opakovať</b> (<code>*</code>): <code>'a' + 'b' → 'ab'</code>, <code>3 * 'x' → 'xxx'</code>. Prázdny reťazec je <code>''</code>. Reťazec bez apostrofov Python považuje za meno premennej.</p>
  <h3>Premenné a priradenie</h3><p>Meno premennej sa skladá z písmen, číslic a znaku <code>_</code>, nesmie začínať číslicou a nesmie byť kľúčovým slovom (for, if, def…). Python rozlišuje veľké a malé písmená. Priradenie <code>premenná = hodnota</code> najprv vypočíta pravú stranu a výsledok uloží do premennej.</p>
  ${EX(R`a = 17
b = 'abcd'
x = a
ab = 13
ab = ab + 7          # najprv sa vypočíta pravá strana zo starej hodnoty
print(a, b, x, ab)
print('vysledok je', 3 + x * 2)`)}
  ${Z("V Shelli stačí napísať meno premennej a vypíše sa jej hodnota. V programe musíme použiť print().")}
  <h3>Vstup input() a pretypovanie</h3><p><code>input(text)</code> vypíše text, počká na vstup a vráti ho ako <b>reťazec</b>. Ak chceme počítať, prevedieme ho: <code>int()</code>, <code>float()</code>, <code>str()</code>.</p>
  ${EX(R`# prevod euro na české koruny
suma = float(input('zadaj euro: '))
koruny = suma * 26
print(suma, 'euro je', koruny, 'korun')`)}
  <h3>Skrátené priradenia, paralelné priradenie</h3><p><code>x += 4</code> je to isté ako <code>x = x + 4</code>. Podobne <code>-= *= /= //= %= **=</code>. Paralelným priradením naraz priradíme viac premenných: <code>x, y = 120, 255</code>. Výmena obsahu: <code>a, b = b, a</code>.</p>
  ${EX(R`x = 40
x -= 5
x += 4
print(x)
a, b = 1, 2
a, b = b, a
print(a, b)`)}
  <h3>Viacriadkové reťazce a f-string</h3><p>Reťazec v troch apostrofoch <code>'''…'''</code> môže mať viac riadkov. <b>f-string</b> (<code>f'…'</code>) vloží do textu hodnoty výrazov v zložených zátvorkách.</p>
  ${EX(R`meno, x, y = 'A', 100, 225
r = f'bod {meno} na suradniciach ({x},{y})'
print(r)
print(abs(-3.14), round(3.14159, 2), round(2101, -2))`)}
  </div>${sandbox("k1")}<h3>Úlohy</h3>${exBlock("k1")}<h3>Test</h3><div class="task">${taskHTML("t_k1")}</div>`; }

function K2() { return `<div class="theory"><h3>for-cyklus</h3><p>Ak potrebujeme príkaz alebo skupinu príkazov vykonať viackrát, použijeme <b>for-cyklus</b>. Riadok s <code>for</code> končí <b>dvojbodkou</b>, za ním nasleduje <b>blok príkazov</b> odsadený o <b>4 medzery</b>. Blok končí prvým riadkom, ktorý už nie je odsadený.</p>
  ${EX(R`for prem in range(3):
    print('studujem a')
    print('programujem v Pythone')
print('===========')`)}
  <h3>Pripočítavacia šablóna</h3><p>Pred cyklom premennú <b>inicializujeme</b> (napr. <code>sucet = 0</code>) a v cykle k nej postupne pripočítavame.</p>
  ${EX(R`n = int(input('zadaj n: '))
sucet = 0
for i in range(n):
    sucet = sucet + i**2      # alebo sucet += i**2
print('sucet =', sucet)`)}
  <h3>Vymenované hodnoty a reťazce</h3><p>Namiesto <code>range()</code> môžeme hodnoty vymenovať: <code>for x in 5, 7, 11:</code> (aspoň dve). For-cyklus vie prechádzať aj znaky reťazca.</p>
  ${EX(R`sucin = 1
for cislo in 1, 2, 3, 4, 5, 6:
    sucin = sucin * cislo
print('6 faktorial =', sucin)
vstup = 'python'
otoceny = ''
for znak in vstup:
    otoceny = znak + otoceny
print(otoceny)`)}
  <h3>range(start, stop, krok)</h3><table class="tbl"><tr><td><code>range(10)</code></td><td>0, 1, …, 9</td></tr><tr><td><code>range(3, 10)</code></td><td>3, 4, …, 9</td></tr><tr><td><code>range(3, 10, 2)</code></td><td>3, 5, 7, 9</td></tr><tr><td><code>range(15, 5, -1)</code></td><td>15, 14, …, 6</td></tr><tr><td><code>range(10, 1)</code></td><td>prázdna postupnosť</td></tr></table>
  ${Z("Hodnota stop už v postupnosti nie je. Klesajúcu postupnosť dostaneme záporným krokom alebo funkciou reversed(): for i in reversed(range(6, 16)).")}
  <p>Parameter <code>end</code> funkcie <code>print()</code> nahradí prechod na nový riadok iným reťazcom, napríklad medzerou.</p>
  <h3>Vnorené cykly</h3><p>Cyklus vo vnútri iného cyklu je <b>vnorený</b>. Vnútorný cyklus musí byť odsadený o ďalšie 4 medzery.</p>
  ${EX(R`for i in range(10):
    for j in range(0, 100, 10):
        print(i + j, end=' ')
    print()`)}
  </div>${sandbox("k2")}<h3>Úlohy</h3>${exBlock("k2")}<h3>Test</h3><div class="task">${taskHTML("t_k2")}</div>`; }

function K3() { return `<div class="theory"><h3>Podmienený príkaz if</h3><p>Program sa na základe <b>podmienky</b> rozhodne medzi možnosťami. Ak podmienka platí, vykoná sa prvý blok, inak blok za <code>else</code>. Bloky odsadzujeme o 4 medzery.</p>
  ${EX(R`body = int(input('Zadaj ziskany pocet bodov: '))
if body >= 50:
    print(body, 'bodov je dostacujuci pocet na znamku')
else:
    print(body, 'bodov je malo na ziskanie znamky')`)}
  <h3>elif a vnorené if</h3><p>If vo vnútri inej vetvy je <b>vnorený</b>. Prehľadnejšie je použiť <code>elif</code> (skratka <i>else if</i>): kontroluje sa, len ak predchádzajúce podmienky neplatili. Vetva <code>else</code> môže chýbať. Prázdny príkaz <code>pass</code> nerobí nič.</p>
  ${EX(R`body = 83
if body >= 90:
    print('znamka A')
elif body >= 80:
    print('znamka B')
elif body >= 70:
    print('znamka C')
else:
    print('horsia znamka')`)}
  <h3>Porovnania a logické operácie</h3><table class="tbl"><tr><td><code>&lt; &lt;= &gt; &gt;=</code></td><td>menšie, menšie alebo rovné…</td></tr><tr><td><code>==</code> / <code>!=</code></td><td>rovná sa / nerovná sa</td></tr><tr><td><code>40 &lt; body &lt;= 50</code></td><td>zreťazené porovnanie (interval)</td></tr><tr><td><code>and, or, not</code></td><td>a súčasne, alebo, neplatí</td></tr></table>
  ${Z("Ako podmienka sa dá použiť aj číslo alebo reťazec: 0 a prázdny reťazec '' sú nepravdivé, ostatné hodnoty pravdivé.")}
  <h3>break</h3><p>Príkaz <code>break</code> okamžite ukončí cyklus a pokračuje sa za ním. Používa sa vo vnútri nejakého <code>if</code>.</p>
  <h3>Podmienený cyklus while</h3><p><code>while podmienka:</code> opakuje blok, <b>kým podmienka platí</b>. Pred každým prechodom sa podmienka znova otestuje. Hodí sa tam, kde dopredu nevieme počet opakovaní.</p>
  ${EX(R`i = 1
while i <= 5:
    print(i, i * i)
    i += 1`)}
  ${Z("Ak podmienka stále platí, cyklus je nekonečný (napr. while 1: pass). V IDLE ho zastavíš Ctrl + C. Tu ho stránka po chvíli preruší sama.")}
  </div>${sandbox("k3")}<h3>Úlohy</h3>${exBlock("k3")}<h3>Test</h3><div class="task">${taskHTML("t_k3")}</div>`; }

    <div class="pts" aria-live="polite">⭐ <b>${total()}</b> z ${MAX}</div>
    <button class="reset" data-reset>↺ Začať odznova</button></div>
  <nav class="line" aria-label="Zastávky hodiny">${STEPS.map((s, i) => `<button class="stn ${i === S.cur ? "cur" : ""} ${stepDone(i) ? "done" : ""} ${i <= S.cur || stepDone(i) ? "reached" : ""}" data-go="${i}" ${!S.started && i > 0 ? "disabled" : ""} ${i === S.cur ? 'aria-current="step"' : ""}><span class="c">${stepDone(i) ? "✓" : ""}</span><span class="l">${s.title}</span><span class="m">${s.min ? s.min + " min" : "cieľ"}</span></button>`).join("")}</nav>`;
}
function checkBar(T, ready, hint) {
  const r = S.t[T.id];
  if (r) return `<div class="checkbar"><span class="score ${r.score < r.max ? "part" : ""}">${r.score === r.max ? "Výborne! " : ""}Získal si ${r.score} z ${r.max} ${r.max === 1 ? "bodu" : "bodov"}</span></div>`;
  return `<div class="checkbar"><button class="primary" data-check="${T.id}" ${ready ? "" : "disabled"}>Skontrolovať</button><span class="hint" data-hint="${T.id}">${ready ? "" : hint}</span></div>`;
}
function mcHTML(T) {
  const done = S.t[T.id], d = S.d[T.id] || {};
  return T.qs.map((q, qi) => {
    const o = ord(T.id + ":" + q.id, q.opts.map((_, i) => i), T.keep);
    return `<fieldset class="q"><legend><span class="qn">${qi + 1}</span><span>${q.q}</span></legend><div class="opts">` + o.map(i => {
      let c = "opt"; if (d[q.id] === i) c += " sel"; if (done) { if (i === q.a) c += " ok"; else if (d[q.id] === i) c += " bad"; }
      return `<button class="${c}" data-mc="${T.id}|${q.id}|${i}" aria-pressed="${d[q.id] === i}" ${done ? "disabled" : ""}>${q.opts[i]}</button>`;
    }).join("") + `</div>${done && q.why ? `<p class="why ${d[q.id] === q.a ? "good" : "miss"}">${q.why}</p>` : ""}</fieldset>`;
  }).join("") + checkBar(T, T.qs.every(q => d[q.id] !== undefined), "Odpovedz na všetky otázky.");
}
function sortHTML(T) {
  const done = S.t[T.id], d = S.d[T.id] || {};
  const ids = ord(T.id, T.items.map(x => x.id));
  const by = Object.fromEntries(T.items.map(x => [x.id, x]));
  const chip = id => { let c = "chipb"; if (SEL && SEL.t === T.id && SEL.i === id) c += " sel"; if (done) c += d[id] === by[id].b ? " ok" : " bad";
    return `<button class="${c}" data-pick="${T.id}|${id}" draggable="${done ? "false" : "true"}" ${done ? "disabled" : ""}>${by[id].t}</button>`; };
  const pool = ids.filter(id => !d[id]);
  return (done ? "" : `<div class="pool" data-bucket="${T.id}|">${pool.length ? pool.map(chip).join("") : '<span class="empty">Všetko je roztriedené. Kartičku presunieš kliknutím na ňu a potom na iný kôš.</span>'}</div>`) +
    `<div class="buckets">${T.buckets.map(b => `<div class="bucket" data-bucket="${T.id}|${b.id}"><div class="bh">${b.label}</div><div class="bs">${b.sub || ""}</div><div class="bc">${ids.filter(id => d[id] === b.id).map(chip).join("")}</div></div>`).join("")}</div>` +
    (done && T.after ? `<p class="why good" style="margin-top:12px">${T.after}</p>` : "") + checkBar(T, ids.every(id => d[id]), "Roztrieď všetky kartičky.");
}
function orderHTML(T) {
  const done = S.t[T.id], seq = S.d[T.id] || [];
  const ids = ord(T.id, T.items.map(x => x.id));
  const by = Object.fromEntries(T.items.map(x => [x.id, x]));
  const pool = ids.filter(id => !seq.includes(id));
  let h = `<ol class="seq">` + T.items.map((_, i) => {
    const id = seq[i];
    if (!id) return `<li class="slot empty"><span class="n">${i + 1}</span><span>${i === seq.length ? "Klikni na kartičku nižšie" : "…"}</span></li>`;
    let c = "slot"; if (done) c += id === T.items[i].id ? " ok" : " bad";
    return `<li class="${c}"><span class="n">${i + 1}</span><button class="slotbtn" data-unplace="${T.id}|${id}" ${done ? "disabled" : ""}>${by[id].t}</button></li>`;
  }).join("") + `</ol>`;
  if (!done) h += `<div class="pool">${pool.length ? pool.map(id => `<button class="chipb" data-place="${T.id}|${id}">${by[id].t}</button>`).join("") : '<span class="empty">Všetko je poukladané. Kliknutím na kartičku hore ju vrátiš späť.</span>'}</div>`;
  if (done && S.t[T.id].score < T.items.length) h += `<div class="box v"><p><b>Správne poradie:</b></p><ol>${T.items.map(x => `<li>${x.t}</li>`).join("")}</ol></div>`;
  return h + checkBar(T, seq.length === T.items.length, "Poukladaj všetky kartičky.");
}
function inputHTML(T) {
  const done = S.t[T.id], d = S.d[T.id] || {};
  return T.qs.map((q, qi) => {
    const v = d[q.id] || "", ok = done ? q.ok(v) : null;
    return `<div class="iq"><div class="iqq"><span class="qn">${qi + 1}</span><span>${q.q}</span></div><div class="iqa">${q.pre ? `<span class="unit">${q.pre}</span>` : ""}<input type="text" class="in ${done ? (ok ? "good" : "badin") : ""}" data-inp="${T.id}|${q.id}" value="${esc(v)}" ${done ? "disabled" : ""} placeholder="${q.ph || ""}" autocomplete="off" aria-label="Odpoveď ${qi + 1}">${q.unit ? `<span class="unit">${q.unit}</span>` : ""}${done ? `<span class="${ok ? "okm" : "badm"}">${ok ? "✓ správne" : "✗ správne je " + q.show}</span>` : ""}</div>${done && q.why ? `<p class="why ${ok ? "good" : "miss"}" style="margin-left:37px">${q.why}</p>` : ""}</div>`;
  }).join("") + checkBar(T, T.qs.every(q => String(d[q.id] || "").trim()), "Vyplň všetky odpovede.");
}
function inputReady(T) { const d = S.d[T.id] || {}; return T.qs.every(q => String(d[q.id] || "").trim()); }
function taskHTML(id) { const T = TASKS[id]; return T.type === "mc" ? mcHTML(T) : T.type === "sort" ? sortHTML(T) : T.type === "order" ? orderHTML(T) : inputHTML(T); }
function check(id) {
  const T = TASKS[id], d = S.d[id] || (T.type === "order" ? [] : {});
  let s = 0;
  if (T.type === "mc") s = T.qs.filter(q => d[q.id] === q.a).length;
  if (T.type === "sort") s = T.items.filter(x => d[x.id] === x.b).length;
  if (T.type === "order") s = T.items.filter((x, i) => d[i] === x.id).length;
  if (T.type === "input") s = T.qs.filter(q => q.ok(d[q.id] || "")).length;
  award(id, s);
  if (id === "test") S.finished = Date.now();
  save(); render(false);
}
function guessBox() {
  if (S.guess === null) return "";
  const ok = S.guess === START.ok;
  return `<div class="box ${ok ? "g" : ""}"><p>Na začiatku si tipoval: <b>„${START.guesses[S.guess]}“</b>. ${ok ? START.yes : START.no}</p></div>`;
}
if (!VIEWS.start) VIEWS.start = function () {
  return `<p class="kicker">${START.kicker}</p><h1>${LESSON}</h1>${START.hero || ""}<p class="lead">${START.lead}</p>
  <div class="task"><label class="f" for="nm">Meno a priezvisko</label><input class="in" type="text" id="nm" data-field="name" value="${esc(S.name)}" autocomplete="name" placeholder="napr. Jana Nováková">
  <label class="f" for="cl">Trieda</label><input class="in" type="text" id="cl" data-field="cls" value="${esc(S.cls)}"></div>
  <h3>Než začneš: tvoj tip</h3><p>${START.guessQ} ${START.guessNote}</p>
  <div class="guesses">${START.guesses.map((g, i) => `<button class="opt ${S.guess === i ? "sel" : ""}" data-guess="${i}" aria-pressed="${S.guess === i}">${g}</button>`).join("")}</div>
  <div class="next"><span class="muted" id="starthint" style="margin-right:auto">${S.name.trim().length < 3 ? "Napíš svoje meno a vyber tip." : S.guess === null ? "Vyber svoj tip." : ""}</span>
  <button class="primary" data-start ${S.name.trim().length < 3 || S.guess === null ? "disabled" : ""}>${S.started ? "Pokračovať" : "Začať hodinu"}</button></div>`;
};
if (!VIEWS.vysledok) VIEWS.vysledok = function () {
  if (!S.t.test) return `<h2>Výsledok</h2><p>Výsledok sa zobrazí, keď dokončíš záverečný test.</p><button class="primary" data-go="${STEPS.length - 2}">Prejsť na záverečný test</button>`;
  const pct = Math.round(total() / MAX * 100);
  const grade = pct >= 90 ? 1 : pct >= 75 ? 2 : pct >= 50 ? 3 : pct >= 30 ? 4 : 5;
  const when = new Date(S.finished || Date.now()).toLocaleString("sk-SK", { day: "numeric", month: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" });
  const rows = STEPS.filter(s => STEP_TASKS[s.id] && STEP_TASKS[s.id].length).map(s => { const ts = STEP_TASKS[s.id]; return { title: s.title, sc: ts.reduce((a, t) => a + (S.t[t] ? S.t[t].score : 0), 0), mx: ts.reduce((a, t) => a + maxOf(TASKS[t]), 0), done: ts.every(t => S.t[t]) }; });
  const detail = rows.map(r => `${r.title} ${r.done ? r.sc + "/" + r.mx : "nedokončené"}`).join("; ");
  const txt = `${LESSON} | ${S.name.trim()} | ${S.cls.trim()} | ${total()}/${MAX} bodov (${pct} %) | ${when} | ${detail}`;
  let formBtn = "";
  if (RESULTS_FORM.url) { const E = RESULTS_FORM.entries, q = new URLSearchParams({ usp: "pp_url" }); if (E.meno) q.set(E.meno, S.name.trim()); if (E.trieda) q.set(E.trieda, S.cls.trim()); if (E.body) q.set(E.body, `${total()}/${MAX}`); if (E.detail) q.set(E.detail, detail);
    formBtn = `<a class="primary" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(RESULTS_FORM.url + "?" + q.toString())}">Odoslať výsledok učiteľovi</a>`; }
  return `<p class="kicker">Cieľ</p><h2>Tvoj výsledok</h2>
  <div class="result"><p style="margin:0"><b>${esc(S.name.trim())}</b>, ${esc(S.cls.trim())} <span class="muted">· ${when}</span></p>
    <div class="big"><span class="n">${total()}</span><span class="of">z ${MAX} bodov (${pct} %)</span><div class="grade"><b>${grade}</b><span>orientačná známka</span></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Zastávka</th><th>Body</th></tr></thead><tbody>${rows.map(r => `<tr><td>${r.title}</td><td>${r.done ? `${r.sc} / ${r.mx}` : '<span class="muted">nedokončené</span>'}</td></tr>`).join("")}</tbody></table></div></div>
  <h3>Pošli výsledok učiteľovi</h3><p>Skopíruj výsledok a vlož ho tam, kam ti povie učiteľ. Môžeš urobiť aj snímku obrazovky tejto stránky.</p>
  <textarea id="restxt" rows="4" readonly>${esc(txt)}</textarea>
  <div class="row"><button class="primary" data-copy>Kopírovať výsledok</button>${formBtn}<span id="copied" class="muted" aria-live="polite"></span></div>`;
};

const main = document.getElementById("main");
function render(toTop) {
  const y = window.scrollY;
  renderTop();
  const id = STEPS[S.cur].id;
  main.className = (typeof WIDE !== "undefined" && WIDE[id]) ? "wide" : "";
  main.innerHTML = VIEWS[id]();
  if (typeof AFTER_RENDER === "function") AFTER_RENDER(id);
  if (toTop) { window.scrollTo(0, 0); const c = document.querySelector(".stn.cur"); if (c) c.scrollIntoView({ block: "nearest", inline: "center" }); }
  else window.scrollTo(0, y);
}
function go(i) { if (!S.started && i > 0) return; S.cur = i; SEL = null; save(); render(true); }
function placeSel(t, b) { if (!SEL || SEL.t !== t || S.t[t]) return; const d = S.d[t] = S.d[t] || {}; if (b) d[SEL.i] = b; else delete d[SEL.i]; SEL = null; save(); render(false); }

let resetArmed = null;
document.addEventListener("click", e => {
  if (typeof CUSTOM_CLICK === "function" && CUSTOM_CLICK(e) === true) return;
  const el = e.target.closest("button,[data-bucket]"); if (!el) return;
  const ds = el.dataset;
  if (ds.go !== undefined) return go(+ds.go);
  if (ds.reset !== undefined) {
    if (!resetArmed) { el.classList.add("arm"); el.textContent = "Naozaj? Klikni znova"; resetArmed = setTimeout(() => { resetArmed = null; renderTop(); }, 3000); return; }
    clearTimeout(resetArmed); resetArmed = null; const keep = { name: S.name, cls: S.cls }; S = fresh(); S.name = keep.name; S.cls = keep.cls; SEL = null; save(); return render(true);
  }
  if (ds.start !== undefined) { if (!S.started) S.started = Date.now(); return go(1); }
  if (ds.guess !== undefined) { S.guess = +ds.guess; save(); return render(false); }
  if (ds.check) return check(ds.check);
  if (ds.mc) { const [t, q, i] = ds.mc.split("|"); if (S.t[t]) return; (S.d[t] = S.d[t] || {})[q] = +i; save(); return render(false); }
  if (ds.place) { const [t, id] = ds.place.split("|"); if (S.t[t]) return; const s = S.d[t] = S.d[t] || []; if (!s.includes(id)) s.push(id); save(); return render(false); }
  if (ds.unplace) { const [t, id] = ds.unplace.split("|"); if (S.t[t]) return; S.d[t] = (S.d[t] || []).filter(x => x !== id); save(); return render(false); }
  if (ds.pick) { const [t, id] = ds.pick.split("|"); if (S.t[t]) return; SEL = SEL && SEL.t === t && SEL.i === id ? null : { t, i: id }; return render(false); }
  if (ds.bucket !== undefined) { const [t, b] = ds.bucket.split("|"); return placeSel(t, b); }
  if (ds.copy !== undefined) {
    const ta = document.getElementById("restxt"), out = document.getElementById("copied");
    const ok = () => { out.textContent = "Skopírované ✓"; };
    const fallback = () => { ta.focus(); ta.select(); try { document.execCommand("copy") ? ok() : (out.textContent = "Označ text a stlač Ctrl+C."); } catch (err) { out.textContent = "Označ text a stlač Ctrl+C."; } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok, fallback); else fallback();
  }
});
document.addEventListener("input", e => {
  if (typeof CUSTOM_INPUT === "function" && CUSTOM_INPUT(e) === true) return;
  const t = e.target;
  if (t.dataset.inp) {
    const [tid, qid] = t.dataset.inp.split("|"); (S.d[tid] = S.d[tid] || {})[qid] = t.value; save();
    const b = document.querySelector(`[data-check="${tid}"]`), h = document.querySelector(`[data-hint="${tid}"]`), r = inputReady(TASKS[tid]);
    if (b) b.disabled = !r; if (h) h.textContent = r ? "" : "Vyplň všetky odpovede."; return;
  }
  const f = t.dataset.field; if (!f) return;
  S[f] = t.value; save();
  if (STEPS[S.cur].id === "start") {
    const btn = document.querySelector("[data-start]"), h = document.getElementById("starthint"), ok = S.name.trim().length >= 3;
    if (btn) btn.disabled = !ok || S.guess === null;
    if (h) h.textContent = ok ? (S.guess === null ? "Vyber svoj tip." : "") : "Napíš svoje meno a vyber tip.";
  }
});
document.addEventListener("dragstart", e => { const p = e.target.closest && e.target.closest("[data-pick]"); if (!p) return; const [t, id] = p.dataset.pick.split("|"); if (S.t[t]) return e.preventDefault(); SEL = { t, i: id }; try { e.dataTransfer.setData("text/plain", id); } catch (err) {} });
document.addEventListener("dragover", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (b && SEL) { e.preventDefault(); b.classList.add("over"); } });
document.addEventListener("dragleave", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (b && !b.contains(e.relatedTarget)) b.classList.remove("over"); });
document.addEventListener("drop", e => { const b = e.target.closest && e.target.closest("[data-bucket]"); if (!b) return; e.preventDefault(); const [t, bk] = b.dataset.bucket.split("|"); placeSel(t, bk); });
document.addEventListener("dragend", () => document.querySelectorAll(".over").forEach(x => x.classList.remove("over")));
if (!S.started) S.cur = 0;
render(true);

</script>
</body>
</html>
