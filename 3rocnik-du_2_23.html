<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DU_2.23 N-tice (tuples), slovníky (dictionary)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D9EAFB;--surface:#FFFFFF;--surface2:#F5F7FA;--ink:#16213A;--muted:#566381;
  --acc:#2F5BEA;--accSoft:#D5DFFB;--amber:#F2A516;--amberSoft:#FDF1D6;--track:#C9D1DF;
  --ok:#12805A;--okSoft:#DDF3EA;--bad:#C0392B;--badSoft:#FBE3E0;--border:#D6DCE6;
  --font:"Rubik","Segoe UI",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  box-sizing:border-box
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10172A;--surface:#18223A;--surface2:#1E2A46;--ink:#E8EDF7;--muted:#9AA7C4;--acc:#6E91FF;--accSoft:#26386A;--amberSoft:#3A2F17;--track:#34425F;--okSoft:#163A30;--ok:#3CCB8E;--badSoft:#46221F;--bad:#FF7A6B;--border:#2E3B58}}
:root[data-theme="dark"]{--bg:#10172A;--surface:#18223A;--surface2:#1E2A46;--ink:#E8EDF7;--muted:#9AA7C4;--acc:#6E91FF;--accSoft:#26386A;--amberSoft:#3A2F17;--track:#34425F;--okSoft:#163A30;--ok:#3CCB8E;--badSoft:#46221F;--bad:#FF7A6B;--border:#2E3B58}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17.5px;line-height:1.6}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px 4px;max-width:1140px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand .du{background:#F2A516;color:#3A2600;border-radius:7px;padding:1px 8px;font-size:14px;font-weight:800}
.pts{background:var(--amberSoft);border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap}
.pts b{font-size:19px}
.reset{background:none;border:1.5px solid var(--border);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.reset.arm{border-color:var(--bad);color:var(--bad);background:var(--badSoft)}
.line{display:flex;overflow-x:auto;padding:10px 20px 14px;max-width:1140px;margin:0 auto;scrollbar-width:thin}
.stn{flex:1 0 96px;position:relative;text-align:center;background:none;border:0;padding:0 4px;cursor:pointer}
.stn:disabled{cursor:not-allowed;opacity:.5}
.stn::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:5px;border-radius:3px;background:var(--track);z-index:0}
.stn:first-child::before{display:none}
.stn.reached::before{background:var(--acc)}
.stn .c{position:relative;z-index:1;display:grid;place-items:center;width:35px;height:35px;margin:0 auto;border-radius:50%;background:var(--surface);border:4px solid var(--track);font-size:16px;transition:transform .15s}
.stn.done .c{background:var(--acc);border-color:var(--acc);color:#fff;font-size:14px;font-weight:700}
.stn.cur .c{border-color:var(--acc);transform:scale(1.18);box-shadow:0 0 0 5px var(--accSoft)}
.stn .l{display:block;font-size:13px;font-weight:600;margin-top:6px;line-height:1.2}
.stn .m{display:block;font-size:12px;color:var(--muted)}
.stn.cur .l{color:var(--acc)}
main{max-width:1060px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:clamp(30px,5vw,46px);line-height:1.08;margin:0 0 12px;letter-spacing:-.02em}
h2{font-size:clamp(26px,4vw,34px);line-height:1.12;margin:0 0 6px;letter-spacing:-.015em}
h3{font-size:21px;margin:30px 0 8px}
p{margin:0 0 14px}
.kicker{color:var(--muted);font-size:15px;margin:0 0 4px}
/* misia – banner */
.ban{position:relative;overflow:hidden;border-radius:22px;padding:20px 22px 18px;color:#fff;margin:0 0 18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;box-shadow:0 14px 30px -18px rgba(10,20,60,.6)}
.ban .pill{display:inline-block;background:rgba(255,255,255,.25);border-radius:999px;padding:3px 12px;font-size:13.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.ban h2{color:#fff;margin:8px 0 4px}
.ban p{margin:0;font-size:16px;opacity:.95}
.ban .big{font-size:64px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.ban::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
@media (max-width:560px){.ban .big{font-size:44px}}
/* holub Pípo */
.say{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:end;margin:6px 0 18px}
.say svg{width:92px;height:92px}
.bubble{position:relative;background:var(--surface);border:2px solid var(--acc);border-radius:18px 18px 18px 4px;padding:12px 16px;font-size:16.5px}
.bubble b.n{color:var(--acc)}
.task{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px 20px;margin:12px 0 8px}
.ins{color:var(--muted);font-size:15.5px;margin-bottom:12px}
.theory p{max-width:none}
.tsplit{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:22px;align-items:start;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px 20px;margin:0 0 12px}
@media (max-width:860px){.tsplit{grid-template-columns:1fr}}
.tfigs{display:grid;gap:12px}
.tfig{margin:0;background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px 10px 8px;display:flex;flex-direction:column;gap:6px}
.tfig svg{width:100%;height:auto;display:block}
.tfig figcaption{font-size:14px;line-height:1.45;color:#3E4A66;text-align:center;padding:0 4px}
.rtab{border-collapse:collapse;margin:10px 0;font-size:15.5px;width:100%}
.rtab th,.rtab td{border:1px solid var(--border);padding:6px 10px;text-align:left;vertical-align:top}
.rtab th{background:var(--surface2);font-size:14px}
.vedel{background:#FFF8E1;color:#3A2E00;border:1px solid #F2D27A;border-left:5px solid #E0A800;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:15.5px;line-height:1.55}
.memo{margin:26px 0 8px;background:var(--surface);border:2px solid var(--acc);border-radius:16px;padding:14px 18px 10px}
.memo h3{margin:0 0 6px;font-size:18px;color:var(--acc)}
.memo ul{margin:0;padding-left:20px}.memo li{margin:5px 0;font-size:16px;line-height:1.5}
code,.mono{font-family:var(--mono);font-size:.93em}
code{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:0 5px}
kbd{font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);border-bottom-width:3px;border-radius:6px;padding:0 6px;font-size:.88em}
/* tlačidlá a otázky */
.primary{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:600;cursor:pointer;font-size:17px}
.primary:disabled{background:var(--track);color:var(--muted);cursor:not-allowed}
.ghost{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:9px 16px;font-weight:600;cursor:pointer}
.ghost:hover:not(:disabled){border-color:var(--acc)}
.ghost.on{border-color:var(--acc);background:var(--accSoft)}
.ghost:disabled{opacity:.45;cursor:not-allowed}
.checkbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.checkbar .hint{color:var(--muted);font-size:14.5px}
.score{font-weight:600;padding:8px 14px;border-radius:10px;background:var(--okSoft);color:var(--ok)}
.score.part{background:var(--amberSoft);color:var(--ink)}
.next{margin-top:30px;padding-top:20px;border-top:1px dashed var(--track);display:flex;justify-content:flex-end}
.q{border:0;padding:0;margin:0 0 22px}
.q legend{font-weight:600;padding:0;margin-bottom:10px;display:flex;gap:10px}
.qn{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accSoft);color:var(--acc);font-size:14px;font-weight:700;margin-top:1px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.opt{text-align:left;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--accSoft)}
.opt.ok{border-color:var(--ok);background:var(--okSoft)}
.opt.bad{border-color:var(--bad);background:var(--badSoft)}
.opt:disabled{cursor:default;color:var(--ink)}
.why{font-size:15px;margin:8px 0 0;padding:8px 12px;border-radius:8px}
.why.good{background:var(--okSoft)}.why.miss{background:var(--badSoft)}
.lock{display:flex;gap:10px;align-items:center;background:var(--surface2);border:1.5px dashed var(--track);border-radius:12px;padding:12px 16px;color:var(--muted)}
/* párovanie */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.pairs{grid-template-columns:1fr}}
.pcol{display:grid;gap:8px;align-content:start}
.pcol h4{margin:0 0 2px;font-size:15px;color:var(--muted)}
.pi{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface2);border:2px solid var(--border);border-radius:12px;padding:9px 12px;cursor:pointer;width:100%}
.pi:hover:not(:disabled){border-color:var(--acc)}
.pi.sel{border-color:var(--amber);box-shadow:0 0 0 4px var(--amberSoft)}
.pi .e{font-size:24px;flex:0 0 30px;text-align:center}
.pi .tag{margin-left:auto;flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.pi.ok{border-color:var(--ok);background:var(--okSoft)}
.pi.bad{border-color:var(--bad);background:var(--badSoft)}
.pi:disabled{cursor:default;color:var(--ink)}
/* štart a výsledok */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:20px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:22px}
@media (max-width:800px){.hero{grid-template-columns:1fr}}
.hero svg{width:100%;height:auto;display:block}
.mlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0}
.mcard{border-radius:14px;padding:10px 12px;color:#fff;font-weight:600;font-size:15px}
.mcard small{display:block;font-weight:400;opacity:.9}
label.f{display:block;font-weight:600;margin:12px 0 4px}
.in{width:100%;max-width:380px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--ink)}
.result{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px}
.bign{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 16px}
.bign .n{font-size:56px;font-weight:700;line-height:1;color:var(--acc)}
.bign .of{font-size:20px;color:var(--muted)}
.grade{margin-left:auto;text-align:center;border:2px solid var(--acc);border-radius:12px;padding:6px 14px}
.grade b{display:block;font-size:30px;line-height:1.1}.grade span{font-size:12.5px;color:var(--muted)}
table.res{border-collapse:collapse;width:100%;font-size:15.5px}
table.res td,table.res th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
table.res td:last-child,table.res th:last-child{text-align:right}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
@media (prefers-reduced-motion: no-preference){.fly{animation:fly 1.4s ease-in-out}@keyframes fly{from{opacity:.2;transform:translateX(-30px)}to{opacity:1;transform:none}}}
.muted{color:var(--muted)}
.say svg{width:92px;height:92px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .opt{padding:6px 12px;font-size:14.5px;border-radius:999px}
.tnum{display:inline-block;background:var(--accSoft);color:var(--acc);border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;margin-right:6px}
.msg{margin:10px 0 0;padding:10px 14px;border-radius:12px;background:var(--accSoft);font-size:15.5px;min-height:44px}
/* izba (misia 1) */
.room svg{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--border)}
.room [data-hot]{cursor:pointer}
.room [data-hot]:hover{filter:brightness(1.12) drop-shadow(0 0 4px #F2A516)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}
.fc{background:var(--surface2);border:2px solid var(--border);border-radius:16px;padding:12px 14px;position:relative}
.fc.okc{border-color:var(--ok);background:var(--okSoft)}.fc.badc{border-color:var(--bad);background:var(--badSoft)}
.fc .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-weight:600}
.fc .hd .e{font-size:28px;line-height:1}
.dig{margin-left:auto;background:#16213A;color:#F2C94C;font-family:var(--mono);font-weight:700;border-radius:8px;padding:2px 10px;font-size:18px}
.fc .why{margin-top:8px}
.safe{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px;align-items:center;margin-top:16px;background:linear-gradient(135deg,#2B3550,#16213A);color:#E8EDF7;border-radius:18px;padding:16px 18px}
@media (max-width:720px){.safe{grid-template-columns:1fr}}
.safe svg{width:100%;max-width:220px;height:auto;display:block;margin:0 auto}
.safe .rule{background:#FFF8E1;color:#3A2E00;border-radius:10px;padding:10px 12px;font-size:15px;margin-bottom:10px}
.codes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.codes .opt{font-family:var(--mono);font-size:22px;font-weight:700;text-align:center;letter-spacing:.2em;background:#0E1424;color:#F2C94C;border-color:#3E4A66}
.codes .opt.sel{border-color:#F2A516;background:#2A2410}
.codes .opt.ok{border-color:#3CCB8E;background:#123A2C;color:#9FF0C8}
.codes .opt.bad{border-color:#FF7A6B;background:#46221F;color:#FFB4AA}
/* pátranie doma (misia 2) */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.hc{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface2);border:2px solid var(--border);border-radius:14px;padding:10px 6px;cursor:pointer;text-align:center;font-size:14.5px;font-weight:600;line-height:1.25}
.hc .e{font-size:30px;line-height:1}
.hc:hover:not(:disabled){border-color:var(--acc)}
.hc.on{border-color:var(--amber);background:var(--amberSoft);box-shadow:0 0 0 3px var(--amberSoft)}
.hc:disabled{cursor:default;opacity:.45}
.hc.on:disabled{opacity:1}
/* dielňa (misia 3) */
.inv{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.ic{background:var(--surface);border:2px solid var(--border);border-radius:18px;padding:14px 16px}
.ic.okc{border-color:var(--ok)}.ic.badc{border-color:var(--bad)}
.ic .hd{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.ic .hd .e{font-size:40px;line-height:1}
.ic .hd b{font-size:17px}
.ic .st{font-size:15px;color:var(--muted);margin:0 0 8px}
.ic .lab{font-size:13.5px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.bprev{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;background:var(--surface2);border:1.5px dashed var(--track);border-radius:14px;padding:10px;margin-top:10px;font-size:15px}
.bprev .slot{min-width:92px;text-align:center;border-radius:12px;padding:6px 8px;background:var(--surface);border:2px solid var(--border)}
.bprev .slot .e{display:block;font-size:28px;line-height:1.1}
.bprev .core{background:#16213A;color:#fff;border-color:#16213A}
/* komiks (misia 4) */
.comic{display:grid;grid-template-columns:1fr;gap:14px}
.panel:not(.choice){max-width:560px}.panel.c{justify-self:center}
.panel{background:#FFFDF5;border:3px solid #16213A;border-radius:6px;padding:10px;display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:start;color:#16213A;box-shadow:4px 4px 0 #16213A}
.panel svg{width:76px;height:76px}
.panel .bub{background:#fff;border:2px solid #16213A;border-radius:14px;padding:8px 12px;font-size:15.5px;position:relative}
.panel .nm{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#566381;margin-bottom:2px}
.panel.choice{grid-column:1/-1;background:#EEF4FF}
.panel .opts{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.panel .opt{background:#fff;color:#16213A}
.panel .opt.sel{background:#E6EDFD}
.panel .opt.ok{background:#DDF3EA}.panel .opt.bad{background:#FBE3E0}
.panel .why{color:#16213A}
/* triedenie */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;background:var(--surface2);border:1.5px dashed var(--track);border-radius:14px;padding:10px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--border);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14.5px}
.chip:hover:not(:disabled){border-color:var(--acc)}
.chip.sel{border-color:var(--amber);box-shadow:0 0 0 3px var(--amberSoft)}
.chip.ok{border-color:var(--ok);background:var(--okSoft)}.chip.bad{border-color:var(--bad);background:var(--badSoft)}
.chip:disabled{cursor:default;color:var(--ink)}
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:720px){.bins{grid-template-columns:1fr}}
.bin{border:2px solid var(--border);border-radius:16px;padding:10px;min-height:120px;background:var(--surface);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bin .bh{width:100%;text-align:center;font-weight:700;border-radius:10px;padding:6px;cursor:pointer;border:0;font-size:15px}
.bin .bh:disabled{cursor:default}
/* príbeh (misia 5) */
.story{background:#FFFDF5;color:#2A2410;border:1px solid #E6D6A8;border-radius:16px;padding:16px 18px;font-size:17px;line-height:1.9}
.story p{margin:0 0 10px}
.ph{display:inline;font:inherit;color:inherit;background:none;border:0;border-bottom:2px dotted #B08D4F;padding:0 2px;cursor:pointer;border-radius:4px;line-height:inherit}
.ph:hover:not(:disabled){background:#FDF1D6}
.ph.on{background:#FDE3A7;border-bottom:2px solid #E0A800}
.ph.ok{background:#DDF3EA;border-bottom:2px solid #12805A}
.ph.bad{background:#FBE3E0;border-bottom:2px solid #C0392B}
.ph.miss{background:none;border-bottom:3px solid #C0392B}
.ph:disabled{cursor:default}
/* rozpočet (misia 6) */
.shop{display:grid;gap:14px}
.cat h4{margin:0 0 6px;font-size:16px}
.prods{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.prod{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface2);border:2px solid var(--border);border-radius:14px;padding:10px 12px;cursor:pointer;font-size:14.5px;line-height:1.35}
.prod b{font-size:15px}
.prod .pr{font-weight:700;color:var(--acc);font-size:16px;margin-top:4px}
.prod:hover:not(:disabled){border-color:var(--acc)}
.prod.on{border-color:var(--acc);background:var(--accSoft)}
.prod:disabled{cursor:default}
.cart{position:sticky;bottom:10px;z-index:5;background:var(--surface);border:2px solid var(--acc);border-radius:16px;padding:10px 14px;margin-top:14px;box-shadow:0 10px 24px -14px rgba(10,20,60,.5)}
.cart .bar{height:12px;border-radius:6px;background:var(--track);overflow:hidden;margin-top:6px}
.cart .bar span{display:block;height:100%;background:var(--ok)}
.cart.over{border-color:var(--bad)}.cart.over .bar span{background:var(--bad)}
.crit{list-style:none;padding:0;margin:12px 0 0}
.crit li{padding:6px 10px;border-radius:10px;margin:4px 0;font-size:15.5px}
.crit li.y{background:var(--okSoft)}.crit li.n{background:var(--badSoft)}
@media (max-width:560px){.panel{grid-template-columns:44px minmax(0,1fr);gap:6px;padding:8px}.panel svg{width:44px;height:44px}.panel .opts{grid-template-columns:1fr}.panel .opt{padding:8px 10px}}
.panel{min-width:0}.panel .bub{min-width:0}

<script>
/* ===== LENKA: typografia ===== */
const VEDEL = t => `<div class="vedel"><b>💡 Vedel si?</b> ${t}</div>`;
function typo(root) { if (!root) return; const W = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement && n.parentElement.closest("code,script,style,svg,.mono,kbd,textarea,pre,.edsh,.addr,.typed") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });

    t = t.replace(/([A-Za-z])-(?=\d)/g, "$1‑").replace(/(\d) (?=[\p{L}%°€⭐″×])/gu, "$1 ").replace(/(\d) ([–-]) (?=\d)/g, "$1 $2 ").replace(/(\d) (?=\d{3}\b)/g, "$1 ").replace(/ × /g, " × ").replace(/(Ctrl|Alt|Shift|Win) \+ /g, "$1 + ");
    for (let i = 0; i < 2; i++) t = t.replace(/(^|[\s („])([vkszaiouVKSZAIOU]) /g, "$1$2 ");

/* ===== OBRÁZKY: pomôcky ===== */
const FF = `font-family="Rubik,Segoe UI,Arial,sans-serif"`;
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.fs || 13}" ${o.a ? `text-anchor="${o.a}"` : ""} fill="${o.c || "#16213A"}" font-weight="${o.b ? 700 : 400}"${o.mono ? ` font-family="Consolas,Courier New,monospace" xml:space="preserve"` : ""}>${s}</text>`;
const SV = (w, h, body, label) => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}" ${FF}>${body}</svg>`;
const fig = (svg, cap) => `<figure class="tfig">${svg}<figcaption>${cap}</figcaption></figure>`;
const box = (x, y, w, h, f, s, r = 10) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}"${s ? ` stroke="${s}" stroke-width="1.6"` : ""}/>`;
const EM = (x, y, e, fs = 24) => `<text x="${x}" y="${y}" text-anchor="middle" font-size="${fs}">${e}</text>`;

const C = { ink: "#16213A", mut: "#566381", acc: "#2F5BEA", accS: "#D5DFFB", ok: "#12805A", okS: "#DDF3EA", bad: "#C0392B", badS: "#FBE3E0", amb: "#8A5A00", ambS: "#FDF1D6", bg: "#F5F7FA", line: "#D6DCE6", pur: "#6A3FD0", purS: "#ECE5FC", org: "#C2560C", orgS: "#FBE3D2", tea: "#0B6F8A", teaS: "#E3F4F8" };

/* riadky textu v obrázku: zoznam [text, {možnosti}] pod sebou */
const LINES = (x, y, arr, dy = 18, o = {}) => arr.map((s, i) => T(x, y + i * dy, s, o)).join("");
/* karta s ikonou, nadpisom a dvoma riadkami */

/* ===== MASKOT: univerzálne zvieratko ===== */
function animal(o, x, y, s, mood) {

    pointy: `<path d="M24 34 L28 6 L44 24 Z" fill="${c}" stroke="${d}" stroke-width="2.2" stroke-linejoin="round"/><path d="M80 34 L76 6 L60 24 Z" fill="${c}" stroke="${d}" stroke-width="2.2" stroke-linejoin="round"/><path d="M29 28 L30 14 L38 24 Z" fill="${o.inner || "#F4B6C2"}"/><path d="M75 28 L74 14 L66 24 Z" fill="${o.inner || "#F4B6C2"}"/>`,

    flop: `<path d="M26 26 Q8 30 14 58 Q24 52 32 36 Z" fill="${o.ear || c}" stroke="${d}" stroke-width="2.2"/><path d="M78 26 Q96 30 90 58 Q80 52 72 36 Z" fill="${o.ear || c}" stroke="${d}" stroke-width="2.2"/>`,
    horns: `<path d="M34 20 Q28 4 36 2 Q38 12 42 20Z" fill="#F2E6D0" stroke="${d}" stroke-width="2"/><path d="M70 20 Q76 4 68 2 Q66 12 62 20Z" fill="#F2E6D0" stroke="${d}" stroke-width="2"/><ellipse cx="24" cy="30" rx="10" ry="5" fill="${c}" stroke="${d}" stroke-width="2"/><ellipse cx="80" cy="30" rx="10" ry="5" fill="${c}" stroke="${d}" stroke-width="2"/>`,
    none: "" }[o.ears || "round"];
  const eyes = mood === "wow"
    ? `<circle cx="42" cy="44" r="8" fill="#fff" stroke="${d}" stroke-width="1.5"/><circle cx="43" cy="45" r="4.4" fill="${d}"/><circle cx="62" cy="44" r="8" fill="#fff" stroke="${d}" stroke-width="1.5"/><circle cx="63" cy="45" r="4.4" fill="${d}"/><ellipse cx="52" cy="62" rx="4" ry="4.5" fill="#7A1F3A"/>`
    : `<circle cx="42" cy="44" r="4.6" fill="${d}"/><circle cx="43.5" cy="42.5" r="1.5" fill="#fff"/><circle cx="62" cy="44" r="4.6" fill="${d}"/><circle cx="63.5" cy="42.5" r="1.5" fill="#fff"/><path d="M45 60 Q52 66 59 60" fill="none" stroke="${d}" stroke-width="2.4" stroke-linecap="round"/>`;
  const mask = o.mask ? `<path d="M30 40 Q52 30 74 40 Q74 52 62 50 Q52 46 42 50 Q30 52 30 40Z" fill="${o.mask}" opacity=".9"/>` : "";
  const extra = { glasses: `<circle cx="42" cy="44" r="10" fill="none" stroke="${d}" stroke-width="2.2"/><circle cx="62" cy="44" r="10" fill="none" stroke="${d}" stroke-width="2.2"/><line x1="52" y1="44" x2="52" y2="44" stroke="${d}" stroke-width="2"/><path d="M51 43 h2" stroke="${d}" stroke-width="2"/>`,

    bow: `<path d="M40 76 L52 82 L40 88Z M64 76 L52 82 L64 88Z" fill="${o.bowc || "#C0392B"}" stroke="${d}" stroke-width="1.6"/><circle cx="52" cy="82" r="3" fill="${o.bowc || "#C0392B"}"/>`,
    scarf: `<path d="M30 74 Q52 84 74 74 L74 80 Q52 90 30 80Z" fill="${o.scarfc || "#E0A800"}" stroke="${d}" stroke-width="1.6"/><path d="M66 80 L72 96 L62 94Z" fill="${o.scarfc || "#E0A800"}" stroke="${d}" stroke-width="1.6"/>`,
    book: `<rect x="62" y="74" width="30" height="20" rx="2" fill="#2F5BEA" stroke="${d}" stroke-width="1.6"/><line x1="77" y1="74" x2="77" y2="94" stroke="#fff" stroke-width="1.4"/>`,
    lupa: `<circle cx="84" cy="74" r="9" fill="#DDEBFF" stroke="${d}" stroke-width="2.4"/><line x1="90" y1="81" x2="98" y2="90" stroke="${d}" stroke-width="3.5" stroke-linecap="round"/>`,
    star: `<path d="M86 66 l3 7 7 .6 -5.4 4.6 1.7 7 -6.3 -3.8 -6.3 3.8 1.7 -7 -5.4 -4.6 7 -.6z" fill="#F2C94C" stroke="${d}" stroke-width="1.4"/>`,

  return `<g transform="translate(${x},${y}) scale(${s})">
    <ellipse cx="52" cy="95" rx="34" ry="3.6" fill="#000" opacity=".12"/>

    ${mask}<ellipse cx="52" cy="56" rx="14" ry="10" fill="${o.muzzle || b}"/><ellipse cx="52" cy="52" rx="4.6" ry="3.4" fill="${o.nose || d}"/>

    ${(o.extra || []).map(k => extra[k] || "").join("")}</g>`;

/* dieťa do komiksu */
const KID = (hair, shirt, name) => mood => SV(80, 80, `<path d="M14 80 Q40 58 66 80" fill="${shirt}"/>
  <circle cx="40" cy="44" r="23" fill="#F6C9A0" stroke="#16213A" stroke-width="2.5"/>
  <path d="M17 38 Q20 16 40 16 Q60 16 63 38 Q56 28 46 30 Q40 24 32 30 Q24 28 17 38z" fill="${hair}"/>

  ${mood === "sad" ? `<path d="M33 58 Q40 53 47 58" fill="none" stroke="#C0392B" stroke-width="2.5"/>` : `<path d="M33 56 Q40 62 47 56" fill="none" stroke="#C0392B" stroke-width="2.5"/>`}`, name);
const KIDG = (hair, shirt, name) => mood => SV(80, 80, `<path d="M14 80 Q40 58 66 80" fill="${shirt}"/>
  <path d="M14 46 Q10 14 40 12 Q70 14 66 46 L66 66 Q60 58 58 44 Q40 40 22 44 Q20 58 14 66z" fill="${hair}"/>
  <circle cx="40" cy="44" r="23" fill="#F6C9A0" stroke="#16213A" stroke-width="2.5"/>
  <path d="M17 40 Q22 18 40 18 Q58 18 63 40 Q50 28 40 30 Q28 28 17 40z" fill="${hair}"/>
  <circle cx="32" cy="46" r="3.3" fill="#16213A"/><circle cx="48" cy="46" r="3.3" fill="#16213A"/>
  ${mood === "sad" ? `<path d="M33 58 Q40 53 47 58" fill="none" stroke="#C0392B" stroke-width="2.5"/>` : `<path d="M33 56 Q40 62 47 56" fill="none" stroke="#C0392B" stroke-width="2.5"/>`}`, name);

/* ===== DU 2.23 – 3. ročník: N-tice (tuples), slovníky (dictionary) ===== */
/* ===== mini korytnačka pre obrázky: príkazy ["fd",100], ["lt",90], ["rt",90], ["bk",50], ["dot",10], ["pu"], ["pd"] ===== */
function TSIM(cmds) { let x = 0, y = 0, h = 0, pen = 1; const segs = [];
  let col = null;
  cmds.forEach(([o, a, b]) => { a = a || 0;
    if (o === "fd" || o === "bk") { const d = o === "fd" ? a : -a, nx = x + d * Math.cos(h * Math.PI / 180), ny = y + d * Math.sin(h * Math.PI / 180); if (pen) segs.push([x, y, nx, ny, 0, col]); x = nx; y = ny; }
    else if (o === "goto") { if (pen) segs.push([x, y, a, b || 0, 0, col]); x = a; y = b || 0; }
    else if (o === "seth") h = a;
    else if (o === "pc") col = a;
    else if (o === "circle") { const n = 36, st = 2 * Math.PI * Math.abs(a) / n, tr = a >= 0 ? 10 : -10; for (let k = 0; k < n; k++) { const nx = x + st * Math.cos(h * Math.PI / 180), ny = y + st * Math.sin(h * Math.PI / 180); if (pen) segs.push([x, y, nx, ny, 0, col]); x = nx; y = ny; h += tr; } }
    else if (o === "dot" && b) segs.push([x, y, x, y, a, b]);
    else if (o === "lt") h += a; else if (o === "rt") h -= a; else if (o === "dot") segs.push([x, y, x, y, a, col]); else if (o === "pu") pen = 0; else if (o === "pd") pen = 1; });
  return { segs, x, y, h }; }
const REP = (n, body) => Array.from({ length: n }, (_, i) => typeof body === "function" ? body(i) : body).flat();
/* kresba do obdĺžnika x,y,w,h; o.c farba, o.tur ukáž korytnačku */
function TDRAW(cmds, x, y, w, h, o = {}) { const W = TSIM(cmds), xs = [0, W.x], ys = [0, W.y];
  W.segs.forEach(s => { const r = s[4] ? s[4] / 2 : 0; xs.push(s[0] - r, s[2] + r, s[0] + r); ys.push(s[1] - r, s[3] + r, s[1] + r); });
  const pad = o.pad || 12, x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad, sz = Math.max(x1 - x0, y1 - y0, o.min || 60), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, lw = sz / 70;
  const vb = `${(cx - sz / 2).toFixed(1)} ${(-cy - sz / 2).toFixed(1)} ${sz.toFixed(1)} ${sz.toFixed(1)}`;
  return `<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="${vb}">${W.segs.map(s => s[4] ? `<circle cx="${s[0]}" cy="${-s[1]}" r="${s[4] / 2}" fill="${s[5] || o.c || C.acc}"/>` : `<line x1="${s[0]}" y1="${-s[1]}" x2="${s[2]}" y2="${-s[3]}" stroke="${s[5] || o.c || C.acc}" stroke-width="${lw * 2.2}" stroke-linecap="round"/>`).join("")}${o.nost || (cmds[0] && cmds[0][0] === "pu") ? "" : `<circle cx="0" cy="0" r="${lw * 2.4}" fill="${C.ok}"/>`}${o.tur === 0 ? "" : `<g transform="translate(${W.x} ${-W.y}) rotate(${-W.h}) scale(${lw / 1.4})"><path d="M11 0 L-7 -7 L-3 0 L-7 7 Z" fill="${C.ink}"/></g>`}</svg>`; }
const TPIC = (cmds, o = {}) => SV(o.w || 150, o.h || 120, TDRAW(cmds, 4, 4, (o.w || 150) - 8, (o.h || 120) - 8, o), o.lab || "kresba korytnačky");
const PYL = (x, y, s, fs = 12.5, c) => `<text x="${x}" y="${y}" font-size="${fs}" font-family="Consolas,Courier New,monospace" xml:space="preserve" fill="${c || C.ink}">${s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\b(for|in|if|else|from|import|while)\b/g, `<tspan fill="#FF7700" font-weight="700">$1</tspan>`).replace(/\b(range|print)\b/g, `<tspan fill="#900090">$1</tspan>`)}</text>`;
const CODEWIN = (x, y, w, lines, title = "program.py", fs = 12.5) => BWIN(x, y, w, 34 + lines.length * (fs + 6)) + T(x + 12, y + 16, title, { fs: 10.5, b: 1, c: C.mut }) + lines.map((l, i) => PYL(x + 14, y + 42 + i * (fs + 6), l, fs)).join("");
const CODE = s => `<code class="pyc">${s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\n/g, "<br>").replace(/ {4}/g, "&nbsp;&nbsp;&nbsp;&nbsp;")}</code>`;
const CODEB = s => `<code class="pyc pyb">${s.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</code>`;

/* ===== pomocné šablóny obrázkov (fh.js) ===== */
const FBOX = (e, lines, c, bg, title) => SV(440, 46 + lines.length * 26, `${box(20, 14, 400, 18 + lines.length * 26, bg || C.accS, c || C.acc, 12)}${EM(66, 32 + lines.length * 13 + 12, e, 40)}${LINES(112, 40, lines, 26, { fs: 12.5 })}`, title || "Obrázok");
const FCARDS = (items, c, bg, title) => { const n = items.length, w = Math.floor((420 - (n - 1) * 10) / n);
  return SV(440, 150, items.map(([e, t, u], i) => { const x = 10 + i * (w + 10); return box(x, 14, w, 122, bg || C.accS, c || C.acc, 12) + EM(x + w / 2, 60, e, 28) + T(x + w / 2, 98, t, { a: "middle", fs: 12, b: 1, c: c || C.acc }) + (u ? T(x + w / 2, 116, u, { a: "middle", fs: 11 }) : ""); }).join(""), title || "Karty"); };
const FTWO = (L, R, title) => SV(440, 60 + Math.max(L.lines.length, R.lines.length) * 24, [L, R].map((s, i) => { const x = 16 + i * 212, h = 44 + Math.max(L.lines.length, R.lines.length) * 24; return box(x, 10, 196, h, s.bg, s.c, 12) + T(x + 98, 36, s.t, { a: "middle", fs: 13, b: 1, c: s.c }) + LINES(x + 98, 62, s.lines, 24, { a: "middle", fs: 12 }); }).join(""), title || "Porovnanie");
const FCHAIN = (items, c, title) => { const n = items.length, step = 420 / n;

/* ===== simulátor IDLE pre konzolové programy: dieliky, F5, výstup v Shelli ===== */
/* P = { file, lines: [[text | {s:"id"}]], slots: {id: {o:[…], a:i}}, run: (v, L) => ({ out: [riadky], err: null | {line, kind, msg} }) } */
const pyEsc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const pyLines = (P, vals) => P.lines.map(l => l.map(p => typeof p === "string" ? p : (vals[p.s] === undefined ? "▢" : P.slots[p.s].o[vals[p.s]])).join(""));
const pyGood = P => { const v = {}; Object.keys(P.slots).forEach(k => v[k] = P.slots[k].a); return v; };
const PYN = "①②③④⑤⑥⑦⑧";
function pyExec(P, v) { try { const r = P.run(v, pyLines(P, v)); return { out: r.out || [], err: r.err || null }; } catch (e) { return { out: [], err: { line: 1, kind: "Error", msg: String(e) } }; } }
function pyMatch(G, R) { const a = G.out, b = R.out; let hit = 0; for (let i = 0; i < Math.min(a.length, b.length); i++) if (a[i] === b[i]) hit++; let p = Math.round(100 * hit / Math.max(a.length, b.length, 1)); if ((R.err || G.err) && p === 100 && !!R.err !== !!G.err) p = 99; return p; }
const pyCodeHTML = (P, vals) => `<div class="tkide"><div class="tkbar">📄 ${P.file || "program.py"} – IDLE</div><div class="tkmenu">File  Edit  Format  <b>Run</b>  Options  Window  Help</div><pre class="tkcode">${P.lines.map((l, i) => `<span class="ln">${i + 1}</span>` + l.map(p => typeof p === "string" ? pyEsc(p) : `<span class="slot ${vals[p.s] === undefined ? "" : "set"}">${vals[p.s] === undefined ? PYN[Object.keys(P.slots).indexOf(p.s)] : pyEsc(P.slots[p.s].o[vals[p.s]])}</span>`).join("")).join("\n")}</pre></div>`;
const pyShell = (P, R) => `<div class="tkshell"><div class="tkbar">IDLE Shell</div><pre>&gt;&gt;&gt; = RESTART: ${P.file || "program.py"}\n${R.out.map(pyEsc).join("\n")}${R.err ? `${R.out.length ? "\n" : ""}<span style="color:#C00000">Traceback (most recent call last):\n  File "${P.file || "program.py"}", line ${R.err.line}\n${R.err.kind}: ${pyEsc(R.err.msg)}</span>` : ""}\n&gt;&gt;&gt; </pre></div>`;
function pyTask(id, max, P, ins) {
  return { id, type: "custom", max, init: () => ({ v: {}, run: null }),
    act: (a, v, st) => { if (a === "run") { st.run = Object.assign({}, st.v); return; } st.v[a] = +v; },
    html: T => { const st = X(id), done = S.t[id], keys = Object.keys(P.slots), goal = pyExec(P, pyGood(P)), out = st.run ? pyExec(P, st.run) : null, pct = out ? pyMatch(goal, out) : 0, stale = st.run && keys.some(k => st.run[k] !== st.v[k]);
      return `<p class="ins">${ins} Za úplnú zhodu výstupu získaš ${max} ⭐, pri čiastočnej zhode menej.</p>
        <div class="tkwrap"><div class="tkgoal"><b>🎯 Cieľový výstup</b><pre class="tkcode" style="margin-top:6px">${goal.out.map(pyEsc).join("\n")}</pre>${P.goalNote || ""}</div>
        ${pyCodeHTML(P, st.v)}</div>
        ${done ? "" : keys.map((k, n) => `<div class="axo"><span class="lab">${PYN[n]}</span>${P.slots[k].o.map((o, i) => `<button class="opt mono${st.v[k] === i ? " sel" : ""}" data-cx="${id}|${k}|${i}">${pyEsc(o)}</button>`).join("")}</div>`).join("")}
        ${done ? "" : `<div class="axo"><button class="primary" data-cx="${id}|run|0" ${keys.every(k => st.v[k] !== undefined) ? "" : "disabled"}>▶ Run › Run Module (F5)</button>${stale ? `<span class="lab" style="color:${C.bad}">Program si zmenil, spusti ho znova (F5).</span>` : ""}</div>`}
        ${out ? `${pyShell(P, out)}<div class="axo"><span class="lab">zhoda s cieľom:</span><span class="readout">${pct} %</span></div>` : ""}
        ${done && pct < 100 ? `<p class="why miss">Vzorové riešenie:</p><pre class="tkcode">${pyLines(P, pyGood(P)).map(pyEsc).join("\n")}</pre>` : done ? `<p class="why good">Výstup sa zhoduje s cieľom. ✔</p>` : ""}` +
        checkBar(T, !!st.run && keys.every(k => st.v[k] !== undefined) && !stale, "Doplň všetky dieliky a spusti program (F5)."); },
    solve: () => { const st = X(id); st.v = pyGood(P); st.run = Object.assign({}, st.v); },
    score: () => { const st = X(id); if (!st.run) return 0; const pct = pyMatch(pyExec(P, pyGood(P)), pyExec(P, st.run)); return pct >= 100 ? max : Math.floor(max * pct / 100); } }; }

const edNorm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().split("\n").map(l => l.replace(/\s+/g, " ").trim()).join("\n").replace(/\n+$/, "").replace(/^\n+/, "");

    html: T => { const st = edSt(id), done = S.t[id], code = st.code != null ? st.code : (E.start || ""), inp = st.inp != null ? st.inp : defInp();

document.addEventListener("click", e => {

});

<script>
/* LENKA: stĺpec s textom a stĺpec s obrázkami v teórii končia v rovnakej výške (pravidlo z 27. 10.) */
(function () {
  const moved = [], grids = [];
  const H = el => el.getBoundingClientRect().height;
  const put = m => { m.el.style.cssText = m.css; if (m.par.isConnected && (!m.next || m.next.parentNode === m.par)) m.par.insertBefore(m.el, m.next); };
  function undo() { while (moved.length) put(moved.pop()); while (grids.length) { const g = grids.pop(); if (g.css !== undefined) g.el.style.cssText = g.css; else g.el.style.gridTemplateColumns = g.v; } }
  function mv(el, to, css) { moved.push({ el, par: el.parentNode, next: el.nextSibling, css: el.style.cssText }); to.appendChild(el); if (css) el.style.cssText += css; }
  function back(n) { while (moved.length > n) put(moved.pop()); }
  function one(ts) {
    const c = [...ts.children]; if (c.length < 2) return; const L = c[0], R = c[1];
    const rl = L.getBoundingClientRect(), rr = R.getBoundingClientRect();
    if (Math.abs(rl.top - rr.top) > 4 || rr.left < rl.right) return; /* na mobile sú stĺpce pod sebou */
    const d0 = H(L) - H(R); if (Math.abs(d0) < 40) return;
    const gap = parseFloat(getComputedStyle(ts).columnGap) || 22, tot = rl.width + rr.width, w0 = rr.width;
    const wMin = Math.max(w0 * .96, tot * .38), wMax = Math.min(560, tot * .56);
    grids.push({ el: ts, v: ts.style.gridTemplateColumns });
    const setW = w => { ts.style.gridTemplateColumns = `minmax(0,1fr) ${Math.round(w)}px`; };
    const tune = () => { /* šírka stĺpca s obrázkami tak, aby rozdiel výšok bol čo najmenší */
      let lo = wMin, hi = wMax, best = null;
      const ev = w => { setW(w); const d = H(L) - H(R); if (!best || Math.abs(d) < Math.abs(best.d)) best = { w, d }; return d; };
      ev(w0); if (ev(lo) < 0) return best; if (ev(hi) > 0) return best;
      for (let i = 0; i < 9; i++) { const m = (lo + hi) / 2; if (ev(m) > 0) lo = m; else hi = m; }
      return best; };
    const lastFig = () => R.children.length > 1 ? R.lastElementChild : null;
    const vedL = () => [...L.children].reverse().find(x => x.classList.contains("vedel"));
    const vedO = () => { const n = ts.nextElementSibling; return n && n.classList.contains("vedel") && /Vedel si/.test(n.textContent) ? n : null; };
    const plans = [];
    const vedR = () => [...R.children].find(x => x.classList.contains("vedel")), hasW = !!vedR();
    const figL = () => [...L.children].reverse().find(x => x.classList.contains("tfig")), hasF = R.children.length > 1, hasG = !!figL(), hasO = !!vedO(), hasV = !!vedL();
    for (const f of hasF ? [0, 1] : [0]) for (const v of hasV ? [0, 1] : [0]) for (const o of hasO ? [0, "L", "R"] : [0]) for (const g of hasG ? [0, 1] : [0]) for (const w of hasW ? [0, 1] : [0]) if (!(v && o) && !(v && w)) plans.push({ f, v, o, g, w });
    const apply = p => {
      if (p.o) { const el = vedO(); if (!el) return false; mv(el, p.o === "L" ? L : R, p.o === "L" ? ";margin-top:14px" : ";margin:0"); }
      if (p.f) { const el = lastFig(); if (!el) return false; mv(el, L, el.classList.contains("tfig") ? `;margin:14px auto 0;max-width:${Math.round(w0 * p.f)}px` : ";margin-top:14px"); }
      if (p.w) { const el = vedR(); if (!el) return false; mv(el, L, ";margin-top:14px"); }
      if (p.g) { const el = figL(); if (!el) return false; mv(el, R, ";margin:0"); }
      if (p.v) { const el = vedL(); if (!el || L.children.length < 2) return false; mv(el, R, ";margin:0"); }
      return true; };
    let pick = null;
    plans.forEach((p, pi) => {
      const k = moved.length; setW(w0);
      if (apply(p)) { const b = tune(); const sc = Math.abs(b.d) + (!!p.f + p.v + !!p.o + p.g + p.w) * 30 + (p.f && p.f < 1 ? 15 : 0) + Math.abs(b.w - w0) / 4; if (!pick || sc < pick.sc) pick = { p, w: b.w, sc }; }
      back(k);
    });
    setW(w0);
    if (!pick) return;
    apply(pick.p);
    setW(pick.w);
  }
  function bal() { undo(); document.querySelectorAll(".tsplit").forEach(one); }
  let raf = 0; const go = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(bal); };
  const main = document.getElementById("main"); if (main) new MutationObserver(go).observe(main, { childList: true });
  window.addEventListener("resize", go); if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); go();
})();
</script>
</body></html>
